g premise, not a docomo rule or account fact."},"facts":[]},"id":"missing-document-next-action-06"},{"id":"missing-document-next-action-07","cat":"contract","jp":"{今|いま}はお{手続|てつづ}きを{完了|かんりょう}できません。{必要|ひつよう}なものがそろいましたら、{改|あらた}めてご{相談|そうだん}ください。","en":"We cannot complete the procedure now. Please speak with us again once you have the required items.","th":"ตอนนี้ยังดำเนินการให้เสร็จไม่ได้ค่ะ เมื่อเตรียมสิ่งที่ต้องใช้ครบแล้ว รบกวนติดต่อมาใหม่นะคะ","note":"After identifying the missing items and confirming this is the appropriate next action. This does not promise approval or completion on the next visit.","noteTh":"ใช้หลังระบุสิ่งที่ขาดและตรวจแล้วว่าควรทำต่อแบบนี้ ไม่ได้รับปากว่ามาครั้งหน้าจะอนุมัติหรือเสร็จแน่นอน","essential":false,"learning":{"mode":"active","audience":"customer","function":"Cannot finish now; explain the return point"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact."},"facts":[]},"introduced":"1.1","role":"staff","sharedId":"p109"},{"role":"customer","jp":"これを{用意|ようい}すればいいんですね。","en":"So I should prepare this document, right?","th":"ต้องเตรียมเอกสารนี้ใช่ไหม","learning":{"mode":"recognize","audience":"learner","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact."},"facts":[]},"id":"missing-document-next-action-08"},{"role":"staff","jp":"はい。こちらのリストをご{確認|かくにん}ください。","en":"Yes. Please check this list.","th":"ค่ะ รบกวนตรวจรายการนี้ด้วยนะคะ","learning":{"mode":"active","audience":"customer","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact."},"facts":[]},"id":"missing-document-next-action-09"},{"role":"customer","jp":"{分|わ}かりました。{用意|ようい}します。","en":"Understood. I will prepare it.","th":"เข้าใจแล้ว จะเตรียมมา","learning":{"mode":"recognize","audience":"learner","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact."},"facts":[]},"id":"missing-document-next-action-10"}],"boundary":"The next action is understood; the transaction remains incomplete. Having a document later does not itself guarantee approval.","boundaryTh":"ลูกค้าเข้าใจสิ่งที่ต้องเตรียม แต่งานยังไม่เสร็จ การมีเอกสารภายหลังไม่ได้รับประกันว่าจะอนุมัติ","takeaway":"A check needs a return: state the result, explain the limit or requirement, and agree what happens next.","takeawayTh":"ตรวจแล้วต้องกลับมาแจ้งผล อธิบายข้อจำกัดหรือสิ่งที่ต้องใช้ และตกลงว่าจะทำอะไรต่อ","learning":{"mode":"active","audience":"customer","function":"Complete a result / exception / handoff chain"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact."},"facts":[]},"introduced":"1.1"},{"id":"billing-team-handoff","title":"Billing uncertainty: brief the team and hand over","titleTh":"ไม่แน่ใจเรื่องบิล: สรุปให้ทีมและส่งต่อ","context":"A fictional disputed charge. Staff have checked the bill but not the application record. The team takes over further investigation; no refund or billing error is assumed.","contextTh":"ลูกค้าโต้แย้งยอดในสถานการณ์สมมติ ตรวจบิลแล้วแต่ยังไม่ได้ตรวจประวัติการสมัคร ทีมรับช่วงตรวจต่อ ยังไม่สรุปว่าบิลผิดหรือคืนเงินได้","goal":"Give a checked answer or a clear next action; distinguish facts, unknowns and who takes over.","goalTh":"แจ้งผลที่ตรวจแล้วหรือขั้นตอนต่อไปให้ชัด แยกสิ่งที่รู้ สิ่งที่ยังไม่รู้ และใครรับช่วง","turns":[{"id":"billing-team-handoff-01","cat":"billing","jp":"{説明|せつめい}された{金額|きんがく}と{違|ちが}うんですけど。","en":"This is different from the amount I was told.","th":"ยอดนี้ไม่ตรงกับที่เคยอธิบายไว้นะคะ","essential":false,"learning":{"mode":"recognize","audience":"learner","function":"Dispute a quoted amount"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["job-listing"],"scope":"The document supplies work context only. This sentence, its frequency/priority judgment and any scenario are authored teaching material."},"facts":[]},"role":"customer","sharedId":"p042"},{"id":"billing-team-handoff-02","cat":"rescue","jp":"{正確|せいかく}にご{案内|あんない}するため、{確認|かくにん}してまいります。{少々|しょうしょう}お{待|ま}ちいただけますか。","en":"I'll check so I can give you accurate information. Could you wait a moment?","th":"ขอตรวจสอบเพื่อให้ข้อมูลที่ถูกต้องค่ะ รอสักครู่ได้ไหมคะ","note":"Use when you will go and check with a colleague or another source, then return. Do not invent an answer.","noteTh":"ใช้เมื่อจะไปตรวจสอบกับเพื่อนร่วมงานหรือแหล่งข้อมูล แล้วกลับมาแจ้งลูกค้าค่ะ","essential":true,"learning":{"mode":"active","audience":"customer","function":"Explain a check and wait"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[]},"role":"staff","sharedId":"r06"},{"id":"billing-team-handoff-03","cat":"coworkers","jp":"{料金|りょうきん}についてのご{相談|そうだん}です。{説明|せつめい}された{金額|きんがく}と{違|ちが}うとのことです。","en":"This is a billing question. The customer says the amount differs from what was explained.","th":"ลูกค้ามาปรึกษาเรื่องค่าบริการค่ะ บอกว่ายอดไม่ตรงกับที่อธิบายไว้","note":"To a colleague: report the customer’s claim, not a confirmed billing error. とのことです marks reported information.","noteTh":"บอกเพื่อนร่วมงานว่านี่คือสิ่งที่ลูกค้าแจ้ง ยังไม่ได้ยืนยันว่าบิลผิด とのことです ใช้รายงานคำพูดอีกฝ่าย","essential":false,"learning":{"mode":"active","audience":"coworker","function":"Brief the customer situation"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact."},"facts":[]},"introduced":"1.1","role":"staff","sharedId":"p096"},{"id":"billing-team-handoff-04","cat":"coworkers","jp":"{請求内容|せいきゅうないよう}は{確認|かくにん}しました。{申込記録|もうしこみきろく}はまだです。","en":"I checked the billing details. I have not checked the application record yet.","th":"ตรวจรายละเอียดบิลแล้วค่ะ แต่ยังไม่ได้ตรวจประวัติการสมัคร","note":"Internal shorthand: はまだです refers to the checking just mentioned. Use only for work actually done.","noteTh":"รูปย่อที่ใช้ในทีม はまだです หมายถึงยังไม่ได้ตรวจตามประโยคก่อนหน้า แจ้งเฉพาะงานที่ทำแล้วจริง","essential":false,"learning":{"mode":"active","audience":"coworker","function":"Say what is checked and pending"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact."},"facts":[]},"introduced":"1.1","role":"staff","sharedId":"p097"},{"id":"billing-team-handoff-05","cat":"coworkers","jp":"この{料金|りょうきん}がかかる{理由|りゆう}が{分|わ}かりません。{一緒|いっしょ}に{確認|かくにん}してもらえますか。","en":"I do not understand why this charge applies. Could you check it with me?","th":"ยังไม่เข้าใจว่าทำไมถึงมีค่าบริการนี้ค่ะ ช่วยตรวจด้วยกันได้ไหมคะ","note":"To a coworker; state the specific unknown. もらえますか is ordinary polite team language.","noteTh":"พูดกับเพื่อนร่วมงานและระบุจุดที่ไม่แน่ใจ もらえますか เป็นคำขอสุภาพทั่วไปในทีม","essential":false,"learning":{"mode":"active","audience":"coworker","function":"Name uncertainty and ask for help"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact."},"facts":[]},"introduced":"1.1","role":"staff","sharedId":"p098"},{"id":"billing-team-handoff-06","cat":"coworkers","jp":"{先|さき}に{申込記録|もうしこみきろく}を{確認|かくにん}してください。","en":"Check the application record first.","th":"ตรวจประวัติการสมัครก่อนนะ","note":"Coworker instruction in this constructed billing case. 先に tells you the priority; access and system steps still come from training.","noteTh":"คำสั่งจากเพื่อนร่วมงานในกรณีบิลสมมตินี้ 先に บอกว่าต้องทำก่อน ส่วนสิทธิ์เข้าถึงและวิธีใช้ระบบให้ยึดที่ฝึกงาน","essential":false,"learning":{"mode":"recognize","audience":"learner","function":"Hear a next-step instruction"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact."},"facts":[]},"introduced":"1.1","role":"coworker","sharedId":"p102"},{"role":"staff","jp":"ありがとうございます。{確認|かくにん}します。","en":"Thank you. I will check.","th":"ขอบคุณค่ะ จะตรวจสอบค่ะ","learning":{"mode":"active","audience":"coworker","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact."},"facts":[]},"id":"billing-team-handoff-07"},{"id":"billing-team-handoff-08","cat":"coworkers","jp":"まだ{確定|かくてい}していません。お{客様|きゃくさま}には、{確認中|かくにんちゅう}と{伝|つた}えてください。","en":"It is not confirmed yet. Tell the customer it is still being checked.","th":"ยังไม่ได้ข้อสรุป แจ้งลูกค้าว่ากำลังตรวจสอบอยู่นะ","note":"Coworker to you. Do not turn an unfinished check into a yes/no answer to the customer.","noteTh":"เพื่อนร่วมงานพูดกับคุณ อย่านำเรื่องที่ยังตรวจไม่เสร็จไปตอบลูกค้าว่าได้หรือไม่ได้","essential":false,"learning":{"mode":"recognize","audience":"learner","function":"Hear that a result is not final"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact."},"facts":[]},"introduced":"1.1","role":"coworker","sharedId":"p103"},{"id":"billing-team-handoff-09","cat":"rescue","jp":"もう{一点|いってん}、{確認|かくにん}が{必要|ひつよう}です。{少々|しょうしょう}お{待|ま}ちください。","en":"There is one more point I need to check. Please wait a moment.","th":"มีอีกจุดที่ต้องตรวจสอบค่ะ รอสักครู่นะคะ","note":"A specific extra check remains. If you do not know the waiting time, do not invent a duration.","noteTh":"ใช้เมื่อยังมีจุดที่ต้องตรวจเพิ่ม หากไม่รู้เวลารอ ไม่กำหนดเวลาเอง","essential":false,"learning":{"mode":"active","audience":"customer","function":"One more check is needed"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact."},"facts":[]},"introduced":"1.1","role":"staff","sharedId":"p106"},{"role":"customer","jp":"{詳|くわ}しい{人|ひと}に{代|か}わってもらえますか。","en":"Could someone familiar with this take over?","th":"ให้คนที่ทราบเรื่องนี้รับช่วงแทนได้ไหม","learning":{"mode":"recognize","audience":"learner","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact."},"facts":[]},"id":"billing-team-handoff-10"},{"id":"billing-team-handoff-11","cat":"rescue","jp":"{担当|たんとう}の{者|もの}に{引|ひ}き{継|つ}いでもよろしいでしょうか。お{話|はなし}の{内容|ないよう}はこちらから{伝|つた}えます。","en":"May I hand this over to the colleague who handles it? I’ll pass on what you’ve told me.","th":"ขอส่งต่อให้ผู้รับผิดชอบดูแลได้ไหมคะ ดิฉันจะเล่าเรื่องที่คุณแจ้งมาให้เขาทราบค่ะ","note":"担当の者 is the colleague handling the matter, not necessarily a manager. Tell the customer about the handoff, then pass on the request and what is still unchecked.","noteTh":"担当の者 คือพนักงานที่ดูแลเรื่องนั้น ไม่จำเป็นต้องเป็นผู้จัดการ แจ้งลูกค้าก่อนส่งต่อ แล้วบอกผู้รับช่วงว่าลูกค้าต้องการอะไรและยังไม่ได้ตรวจอะไร","essential":true,"learning":{"mode":"active","audience":"customer","function":"Arrange a handoff"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[]},"role":"staff","sharedId":"r10"},{"role":"customer","jp":"お{願|ねが}いします。","en":"Please do.","th":"รบกวนด้วย","learning":{"mode":"recognize","audience":"learner","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact."},"facts":[]},"id":"billing-team-handoff-12"},{"id":"billing-team-handoff-13","cat":"coworkers","jp":"ここから{対応|たいおう}を{代|か}わってもらえますか。","en":"Could you take over from here?","th":"ช่วยรับช่วงดูแลต่อจากตรงนี้ได้ไหมคะ","note":"After briefing the situation, completed checks and open questions. This asks for a takeover; it does not assume the colleague has accepted.","noteTh":"ใช้หลังสรุปเรื่อง งานที่ตรวจแล้ว และข้อสงสัยที่ค้าง เป็นการขอให้รับช่วง ยังไม่ถือว่าอีกฝ่ายตกลงแล้ว","essential":false,"learning":{"mode":"active","audience":"coworker","function":"Ask a colleague to take over"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact."},"facts":[]},"introduced":"1.1","role":"staff","sharedId":"p100"},{"id":"billing-team-handoff-14","cat":"coworkers","jp":"{分|わ}かりました。{今|いま}、そちらに{行|い}って{代|か}わります。","en":"Understood. I will come over now and take over.","th":"เข้าใจแล้ว เดี๋ยวไปตรงนั้นรับช่วงต่อให้นะ","note":"Coworker speaking to you. This accepts the handoff, not the customer’s underlying request.","noteTh":"เพื่อนร่วมงานพูดกับคุณ เป็นการตกลงรับช่วง ไม่ใช่อนุมัติคำขอของลูกค้า","essential":false,"learning":{"mode":"recognize","audience":"learner","function":"Hear acceptance of a handoff"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact."},"facts":[]},"introduced":"1.1","role":"coworker","sharedId":"p101"},{"id":"billing-team-handoff-15","cat":"rescue","jp":"{担当|たんとう}の{者|もの}がまいりますので、{少々|しょうしょう}お{待|ま}ちください。","en":"The colleague handling this is coming. Please wait a moment.","th":"พนักงานที่ดูแลเรื่องนี้กำลังมาค่ะ รอสักครู่นะคะ","note":"Use after the colleague has accepted and confirmed they are coming. It is not a promise to use while still looking for help.","noteTh":"ใช้เมื่อเพื่อนร่วมงานรับเรื่องและยืนยันว่าจะมาแล้ว ไม่ใช้ขณะที่ยังหาคนช่วยไม่ได้","essential":false,"learning":{"mode":"active","audience":"customer","function":"Wait for the colleague who accepted"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact."},"facts":[]},"introduced":"1.1","role":"staff","sharedId":"p108"}],"boundary":"The colleague has accepted the case and is coming. The charge is still being investigated; the handoff is the outcome, not a resolved bill.","boundaryTh":"เพื่อนร่วมงานตกลงรับช่วงและกำลังมา ยังตรวจค่าบริการอยู่ ผลลัพธ์ของบทนี้คือส่งต่อได้ ไม่ใช่แก้บิลเสร็จ","takeaway":"A check needs a return: state the result, explain the limit or requirement, and agree what happens next.","takeawayTh":"ตรวจแล้วต้องกลับมาแจ้งผล อธิบายข้อจำกัดหรือสิ่งที่ต้องใช้ และตกลงว่าจะทำอะไรต่อ","learning":{"mode":"active","audience":"customer","function":"Complete a result / exception / handoff chain"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact."},"facts":[]},"introduced":"1.1"}],"keigo":[{"id":"keigo-ukagau","title":"Ask the customer: 伺う","titleTh":"ถามลูกค้าอย่างนอบน้อม: 伺う","plain":"お{名前|なまえ}を{聞|き}いてもいいですか。","polite":"お{名前|なまえ}を{伺|うかが}ってもよろしいでしょうか。","en":"May I have your name?","th":"ขอทราบชื่อได้ไหมคะ","why":"伺う humbles your own act of asking (also listening or visiting in other contexts). Here you are asking; the customer is not the subject of 伺う. お名前 honors the customer’s name.","whyTh":"伺う เป็นคำถ่อมตนสำหรับการถามของเราเอง (ในบริบทอื่นอาจหมายถึงฟังหรือไปพบ) ประโยคนี้เราเป็นผู้ถาม ไม่ใช้ 伺う เพื่อยกย่องการกระทำของลูกค้า ส่วน お名前 ใช้กล่าวถึงชื่อลูกค้าอย่างสุภาพ","learning":{"mode":"recognize","audience":"customer","function":"Compare register","guidance":"Understand the formal form; learn one usable version, not both as separate scripts."},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General Japanese register analysis. The supplied language tables are not authority for these particular sentence pairs."},"facts":[]}},{"id":"keigo-ossharu","title":"Invite the customer to speak: おっしゃる","titleTh":"เชิญให้ลูกค้าบอก: おっしゃる","plain":"{分|わ}からないことがあったら、{言|い}ってください。","polite":"ご{不明|ふめい}な{点|てん}がございましたら、おっしゃってください。","en":"Please tell me if anything is unclear.","th":"หากมีส่วนไหนไม่เข้าใจ แจ้งได้เลยค่ะ","why":"おっしゃる honors the customer’s act of speaking. Use 言う or 申す for your own speech, depending on context. おっしゃられる adds an unnecessary second honorific layer.","whyTh":"おっしゃる ยกย่องการพูดของลูกค้า ถ้าพูดถึงการพูดของตัวเอง ใช้ 言う หรือ 申す ตามบริบท ไม่จำเป็นต้องซ้อนคำยกย่องเป็น おっしゃられる","learning":{"mode":"recognize","audience":"customer","function":"Compare register","guidance":"Understand the formal form; learn one usable version, not both as separate scripts."},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General Japanese register analysis. The supplied language tables are not authority for these particular sentence pairs."},"facts":[]}},{"id":"keigo-haiken","title":"Look at a document: 拝見する","titleTh":"ขอดูเอกสาร: 拝見する","plain":"こちらの{書類|しょるい}を{見|み}てもいいですか。","polite":"こちらの{書類|しょるい}を{拝見|はいけん}してもよろしいでしょうか。","en":"May I look at this document?","th":"ขอดูเอกสารนี้ได้ไหมคะ","why":"拝見する humbles your act of looking at the customer’s document or device. To ask the customer to look, use ご覧ください instead. 拝見させていただいても… is usually more elaborate than needed here.","whyTh":"拝見する ถ่อมตนเมื่อเราดูเอกสารหรืออุปกรณ์ของลูกค้า หากเชิญให้ลูกค้าดู ใช้ ご覧ください แทน บริบทนี้ไม่จำเป็นต้องใช้รูปยาวอย่าง 拝見させていただいても…","learning":{"mode":"recognize","audience":"customer","function":"Compare register","guidance":"Understand the formal form; learn one usable version, not both as separate scripts."},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General Japanese register analysis. The supplied language tables are not authority for these particular sentence pairs."},"facts":[]}},{"id":"keigo-goran","title":"Show the customer: ご覧になる","titleTh":"เชิญลูกค้าดู: ご覧になる","plain":"こちらの{画面|がめん}を{見|み}てください。","polite":"こちらの{画面|がめん}をご{覧|らん}ください。","en":"Please look at this screen.","th":"กรุณาดูหน้าจอนี้ค่ะ","why":"ご覧になる honors the customer’s act of looking; ご覧ください is the request form. Pair it with 拝見する: customer looks → ご覧になる; you look at the customer’s item → 拝見する.","whyTh":"ご覧になる ยกย่องการดูของลูกค้า และ ご覧ください เป็นรูปขอให้ดู จำคู่กับ 拝見する: ลูกค้าเป็นผู้ดูใช้ ご覧になる ส่วนเราดูสิ่งของของลูกค้าใช้ 拝見する","learning":{"mode":"active","audience":"customer","function":"Compare register","guidance":"Understand the formal form; learn one usable version, not both as separate scripts."},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General Japanese register analysis. The supplied language tables are not authority for these particular sentence pairs."},"facts":[]}},{"id":"keigo-mousu","title":"Introduce yourself: 申す","titleTh":"แนะนำตัว: 申す","plain":"{担当|たんとう}の［{名前|なまえ}］です。","polite":"{担当|たんとう}の［{名前|なまえ}］と{申|もう}します。","en":"My name is [name], and I’ll be assisting you.","th":"ดิฉันชื่อ [ชื่อ] เป็นผู้ดูแลให้บริการค่ะ","why":"申す is a humble/polite way to speak of your own saying or name. Replace the bracket with your name. Do not introduce the customer with と申します. The です version is already polite and may be sufficient.","whyTh":"申す ใช้กล่าวถึงการพูดหรือชื่อของตนอย่างนอบน้อม ใส่ชื่อตัวเองแทนวงเล็บ ไม่ใช้ と申します แนะนำชื่อลูกค้า รูป です ก็สุภาพอยู่แล้วและใช้ได้ตามสถานการณ์","learning":{"mode":"active","audience":"customer","function":"Compare register","guidance":"Understand the formal form; learn one usable version, not both as separate scripts."},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General Japanese register analysis. The supplied language tables are not authority for these particular sentence pairs."},"facts":[]}},{"id":"keigo-itasu","title":"Explain or check: いたす","titleTh":"อธิบายหรือตรวจสอบ: いたす","plain":"{料金|りょうきん}の{内訳|うちわけ}を{説明|せつめい}します。","polite":"{料金|りょうきん}の{内訳|うちわけ}をご{説明|せつめい}いたします。","en":"I’ll explain the breakdown of the charges.","th":"จะอธิบายรายละเอียดค่าใช้จ่ายค่ะ","why":"ご説明いたします is a standard humble combination for your own explanation. 説明します is already polite. Learn established combinations; do not add ご to every action noun or use いたす for the customer’s action.","whyTh":"ご説明いたします เป็นรูปถ่อมตนที่ใช้ทั่วไปเมื่อเราอธิบาย ส่วน 説明します ก็สุภาพแล้ว จำเป็นชุดคำที่ใช้จริง ไม่เติม ご ให้คำนามการกระทำทุกคำ และไม่ใช้ いたす กับการกระทำของลูกค้า","learning":{"mode":"recognize","audience":"customer","function":"Compare register","guidance":"Understand the formal form; learn one usable version, not both as separate scripts."},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General Japanese register analysis. The supplied language tables are not authority for these particular sentence pairs."},"facts":[]}},{"id":"keigo-moushiwake","title":"Apologize and name the issue","titleTh":"ขอโทษพร้อมบอกประเด็นให้ชัด","plain":"{説明|せつめい}が{分|わ}かりにくくて、すみません。","polite":"{説明|せつめい}が{分|わ}かりにくく、{申|もう}し{訳|わけ}ございません。","en":"I’m sorry my explanation was unclear.","th":"ขออภัยที่อธิบายไม่ชัดเจนค่ะ","why":"申し訳ございません is a formal apology. Tie it to what you actually know happened, then offer a next step, such as explaining one point at a time. For an unverified bill, do not apologize for a billing error you have not confirmed.","whyTh":"申し訳ございません เป็นคำขอโทษแบบเป็นทางการ ระบุเรื่องที่ทราบว่าเกิดขึ้นจริง แล้วเสนอขั้นตอนต่อไป เช่น อธิบายทีละประเด็น หากยังไม่ได้ตรวจสอบบิล อย่าเพิ่งขอโทษโดยสรุปว่าออกบิลผิด","learning":{"mode":"recognize","audience":"customer","function":"Compare register","guidance":"Understand the formal form; learn one usable version, not both as separate scripts."},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General Japanese register analysis. The supplied language tables are not authority for these particular sentence pairs."},"facts":[]}},{"id":"keigo-shochi","title":"Acknowledge the customer: 承知する","titleTh":"รับทราบความต้องการลูกค้า: 承知する","plain":"{分|わ}かりました。{条件|じょうけん}を{確認|かくにん}します。","polite":"{承知|しょうち}いたしました。{条件|じょうけん}を{確認|かくにん}いたします。","en":"Understood. I’ll check the conditions.","th":"รับทราบค่ะ จะตรวจสอบเงื่อนไขค่ะ","why":"承知いたしました acknowledges what the customer said and suits formal service. It does not mean the request has been approved. If the answer is unknown, attach a concrete check instead of implying a promise.","whyTh":"承知いたしました ใช้รับทราบสิ่งที่ลูกค้าพูดอย่างสุภาพ เหมาะกับงานบริการ แต่ไม่ได้หมายความว่าอนุมัติคำขอแล้ว หากยังไม่ทราบคำตอบ ให้บอกว่าจะตรวจสอบอะไรแทนการพูดเหมือนรับปาก","learning":{"mode":"active","audience":"customer","function":"Compare register","guidance":"Understand the formal form; learn one usable version, not both as separate scripts."},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General Japanese register analysis. The supplied language tables are not authority for these particular sentence pairs."},"facts":[]}},{"id":"keigo-itadaku","title":"Ask for time: いただく","titleTh":"ขอเวลา: いただく","plain":"{確認|かくにん}しますので、{少|すこ}し{待|ま}ってもらえますか。","polite":"{確認|かくにん}いたしますので、{少々|しょうしょう}お{待|ま}ちいただけますか。","en":"I’ll check that. Could you wait a moment, please?","th":"ขอตรวจสอบก่อนค่ะ รบกวนรอสักครู่ได้ไหมคะ","why":"お待ちいただけますか frames the customer’s waiting as something you receive. It is a request, not an order. 少々 is not a fixed duration; if the wait grows, check an estimate and update the customer.","whyTh":"お待ちいただけますか แสดงการขอให้ลูกค้ารอโดยเราเป็นฝ่ายได้รับความกรุณา เป็นคำขอ ไม่ใช่คำสั่ง 少々 ไม่ได้กำหนดจำนวนนาที หากต้องรอนานขึ้น ให้ตรวจสอบเวลาประมาณและแจ้งลูกค้า","learning":{"mode":"active","audience":"customer","function":"Compare register","guidance":"Understand the formal form; learn one usable version, not both as separate scripts."},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General Japanese register analysis. The supplied language tables are not authority for these particular sentence pairs."},"facts":[]}},{"id":"keigo-company-handoff","title":"Refer to your own colleague to a customer","titleTh":"กล่าวถึงเพื่อนร่วมงานของเราต่อลูกค้า","plain":"{担当者|たんとうしゃ}に{確認|かくにん}してきます。","polite":"{担当|たんとう}の{者|もの}に{確認|かくにん}してまいります。","en":"I’ll go and check with the colleague responsible.","th":"จะไปตรวจสอบกับผู้ดูแลเรื่องนี้ค่ะ","why":"担当の者 refers to someone on your own team when speaking to a customer; it does not necessarily mean a manager. In this sentence, 確認してまいります means going to check and coming back. With the colleague directly, a name plus さん can be appropriate.","whyTh":"เมื่อพูดกับลูกค้า 担当の者 หมายถึงคนในทีมเราที่ดูแลเรื่องนั้น ไม่จำเป็นต้องเป็นผู้จัดการ ในประโยคนี้ 確認してまいります คือไปตรวจแล้วกลับมา หากพูดกับเพื่อนร่วมงานโดยตรง อาจเรียกชื่อด้วย さん ได้","learning":{"mode":"recognize","audience":"customer","function":"Compare register","guidance":"Understand the formal form; learn one usable version, not both as separate scripts."},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General Japanese register analysis. The supplied language tables are not authority for these particular sentence pairs."},"facts":[]}}],"company":{"intro":"The listing names Area Marketing Office as the employer. The PDF describes general shop work; the revised role document describes specialist duties and initial back-office learning. These are document facts. Your current counter training sets the learning priority in this app.","introTh":"ประกาศระบุบริษัท Area Marketing Office เป็นนายจ้าง PDF อธิบายงานสาขาทั่วไป ส่วนเอกสารหน้าที่งานฉบับแก้ไขอธิบายงานเฉพาะทางและการเรียนรู้งานหลังบ้านช่วงแรก ข้อมูลนี้เป็นสิ่งที่เอกสารระบุ ส่วนบทฝึกในแอปให้ความสำคัญกับงานเคาน์เตอร์ที่คุณกำลังเรียนอยู่","facts":[{"label":"Who employs you","labelTh":"นายจ้างของคุณ","jp":"{求人票|きゅうじんひょう}の{企業名|きぎょうめい}は「{株式会社|かぶしきがいしゃ}エリアマーケティングオフィス」です。ドコモショップを{運営|うんえい}しています。","en":"The employer named in the listing is 株式会社エリアマーケティングオフィス (Area Marketing Office), whose businesses include operating docomo shops.","th":"นายจ้างที่ระบุในประกาศคือบริษัท 株式会社エリアマーケティングオフィス (Area Marketing Office) ซึ่งดำเนินธุรกิจบริหารร้าน docomo shop ด้วยค่ะ","source":"PDF p.1–2","id":"company-1","learning":{"mode":"reference","audience":"learner","function":"Understand employer documents"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[{"category":"A","sourceIds":["job-listing"],"scope":"PDF p.1–2; document fact paraphrased, not confirmation of current assignment."}]}},{"label":"The store in the listing","labelTh":"สาขาที่ระบุในประกาศ","jp":"2026{年|ねん}3{月|がつ}{1日|ついたち}の{求人票|きゅうじんひょう}には、ドコモショップ{吹田店|すいたてん}（{大阪府|おおさかふ}{吹田市|すいたし}{朝日町|あさひまち}2-101）と{記載|きさい}されています。","en":"The listing dated 1 March 2026 names docomo Shop Suita at 2-101 Asahimachi, Suita, Osaka. This is the listed workplace, not confirmation of your final assignment.","th":"ประกาศลงวันที่ 1 มีนาคม 2026 ระบุร้าน docomo Shop Suita ที่ 2-101 Asahimachi เมือง Suita จังหวัด Osaka นี่คือสถานที่ทำงานในประกาศ ยังไม่ใช่การยืนยันสาขาที่คุณจะได้รับมอบหมายจริงค่ะ","source":"PDF p.1","id":"company-2","learning":{"mode":"reference","audience":"learner","function":"Understand employer documents"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[{"category":"A","sourceIds":["job-listing"],"scope":"PDF p.1; document fact paraphrased, not confirmation of current assignment."}]}},{"label":"Your revised specialist role","labelTh":"ตำแหน่งเฉพาะทางตามฉบับแก้ไข","jp":"{修正版|しゅうせいばん}では、{主|おも}な{業務|ぎょうむ}は、{外国人|がいこくじん}のお{客様|きゃくさま}に{関|かん}する{分析|ぶんせき}・{企画|きかく}・{改善|かいぜん}とされています。","en":"The revised document places the main role in analysis, planning and improvement for foreign customers. This describes that document’s scope; it does not establish today’s counter assignment.","th":"เอกสารฉบับแก้ไขระบุงานหลักด้านวิเคราะห์ วางแผน และปรับปรุงงานสำหรับลูกค้าชาวต่างชาติ นี่คือขอบเขตที่เอกสารระบุ ไม่ได้ยืนยันงานที่ได้รับมอบหมายหน้าเคาน์เตอร์ในวันนี้","source":"DOCX 採用理由・業務内容","id":"company-3","learning":{"mode":"reference","audience":"learner","function":"Understand employer documents"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[{"category":"A","sourceIds":["revised-role"],"scope":"DOCX 採用理由・業務内容; document fact paraphrased, not confirmation of current assignment."}]}},{"label":"How the first stage is described","labelTh":"งานในช่วงเริ่มต้น","jp":"{入社|にゅうしゃ}{初期|しょき}は、{契約|けいやく}の{事務処理|じむしょり}や{顧客情報|こきゃくじょうほう}の{管理|かんり}などを{通|とお}して、{料金体系|りょうきんたいけい}や{業務|ぎょうむ}の{流|なが}れを{学|まな}びます。","en":"The initial stage centers on back-office work such as contract administration, customer information management and applications, to learn telecom services, pricing structures and workflows.","th":"ช่วงเริ่มต้นเน้นงานหลังบ้าน เช่น งานเอกสารสัญญา การจัดการข้อมูลลูกค้า และงานยื่นคำขอต่าง ๆ เพื่อเรียนรู้บริการสื่อสาร โครงสร้างค่าบริการ และขั้นตอนการทำงานค่ะ","source":"DOCX 業務内容・キャリアプラン","id":"company-4","learning":{"mode":"reference","audience":"learner","function":"Understand employer documents"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[{"category":"A","sourceIds":["revised-role"],"scope":"DOCX 業務内容・キャリアプラン; document fact paraphrased, not confirmation of current assignment."}]}},{"label":"Your Japanese and Thai have a purpose","labelTh":"ใช้ภาษาญี่ปุ่นและภาษาไทยกับงานอย่างไร","jp":"{日本語|にほんご}と{母国語|ぼこくご}を{使|つか}って、{契約|けいやく}の{補助資料|ほじょしりょう}や{案内文書|あんないぶんしょ}、{FAQ|エフエーキュー}の{翻訳|ほんやく}・ローカライズを{行|おこな}います。","en":"The role includes translating and localizing contract support materials, notices and FAQs using Japanese and your native language, and creating or improving multilingual materials and internal manuals.","th":"งานนี้ใช้ภาษาญี่ปุ่นและภาษาแม่ในการแปลและปรับเนื้อหาให้เหมาะกับผู้อ่าน เช่น เอกสารเสริมการอธิบายสัญญา เอกสารแนะนำ และ FAQ รวมถึงจัดทำหรือปรับปรุงสื่อหลายภาษาและคู่มือภายในค่ะ","source":"DOCX 業務内容","id":"company-5","learning":{"mode":"reference","audience":"learner","function":"Understand employer documents"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[{"category":"A","sourceIds":["revised-role"],"scope":"DOCX 業務内容; document fact paraphrased, not confirmation of current assignment."}]}},{"label":"Turn customer questions into improvements","labelTh":"นำคำถามของลูกค้ามาปรับปรุงงาน","jp":"{問|と}い{合|あ}わせの{内容|ないよう}や{利用動向|りようどうこう}を{分析|ぶんせき}し、{店舗|てんぽ}や{本部|ほんぶ}と{連携|れんけい}して、{改善|かいぜん}の{提案|ていあん}を{行|おこな}います。","en":"The document calls for analyzing usage and inquiries, identifying needs by language and nationality, and working with stores and headquarters on improvements, promotional planning and implementation support.","th":"เอกสารระบุให้วิเคราะห์แนวโน้มการใช้บริการและคำถามของลูกค้า รวบรวมความต้องการแยกตามภาษาและสัญชาติ แล้วร่วมงานกับสาขาและสำนักงานใหญ่เพื่อเสนอการปรับปรุง วางแผนส่งเสริมการขาย และสนับสนุนการดำเนินงานค่ะ","source":"DOCX 業務内容","id":"company-6","learning":{"mode":"reference","audience":"learner","function":"Understand employer documents"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[{"category":"A","sourceIds":["revised-role"],"scope":"DOCX 業務内容; document fact paraphrased, not confirmation of current assignment."}]}},{"label":"The wider shop work you will hear about","labelTh":"งานทั่วไปของสาขาที่คุณจะได้ยิน","jp":"{一般|いっぱん}の{店舗|てんぽ}スタッフの{求人票|きゅうじんひょう}には、{受付|うけつけ}、{契約|けいやく}やプランの{変更|へんこう}、{修理|しゅうり}の{受付|うけつけ}、{操作|そうさ}のサポートなどが{記載|きさい}されています。","en":"The general shop-staff listing covers reception, new contracts, device and plan changes, billing-plan explanations, repair intake, operation/setup support, displays, inventory and data entry. These give the practice its workplace context; they do not replace the revised specialist description.","th":"ประกาศรับพนักงานสาขาทั่วไประบุงานต้อนรับ ทำสัญญาใหม่ เปลี่ยนเครื่องหรือแพ็กเกจ อธิบายค่าบริการ รับเรื่องซ่อม ช่วยใช้งานและตั้งค่า จัดสื่อในร้าน ดูแลสต็อก และป้อนข้อมูล บทฝึกใช้บริบทเหล่านี้ โดยยังยึดหน้าที่เฉพาะทางตามเอกสารฉบับแก้ไขค่ะ","source":"PDF p.1 / DOCX 採用理由","id":"company-7","learning":{"mode":"reference","audience":"learner","function":"Understand employer documents"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[{"category":"A","sourceIds":["job-listing","revised-role"],"scope":"PDF p.1 / DOCX 採用理由; document fact paraphrased, not confirmation of current assignment."}]}},{"label":"How the company describes its values","labelTh":"ค่านิยมที่บริษัทอธิบายไว้","jp":"{企業情報|きぎょうじょうほう}シートでは、お{客様|きゃくさま}の{視点|してん}を{重視|じゅうし}し、{社会貢献|しゃかいこうけん}・{社員|しゃいん}の{幸|しあわ}せ・{企業|きぎょう}の{利益|りえき}のバランスを{大切|たいせつ}にすると{説明|せつめい}しています。","en":"The company sheet presents a customer-focused philosophy balancing social contribution, employee happiness and business profit. It also describes helping others grow as part of one's own growth. These are statements in the employer's PR material.","th":"เอกสารบริษัทอธิบายปรัชญาที่ให้ความสำคัญกับมุมมองลูกค้า และความสมดุลระหว่างการช่วยเหลือสังคม ความสุขของพนักงาน และกำไรของบริษัท อีกทั้งกล่าวว่าการช่วยให้ผู้อื่นเติบโตทำให้ตนเองเติบโตด้วย ข้อมูลนี้เป็นคำอธิบายในเอกสารประชาสัมพันธ์ของนายจ้างค่ะ","source":"PDF p.2","id":"company-8","learning":{"mode":"reference","audience":"learner","function":"Understand employer documents"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[{"category":"A","sourceIds":["job-listing"],"scope":"PDF p.2; document fact paraphrased, not confirmation of current assignment."}]}}],"boundaries":[{"en":"This is speaking practice based on your documents. Sample conversations are newly written practice, not official store scripts. Confirm the current procedure with your trainer before using a promise, price, eligibility rule, document requirement or repair estimate.","th":"นี่คือบทฝึกพูดที่อิงเอกสารของคุณ บทสนทนาตัวอย่างแต่งขึ้นเพื่อฝึก ไม่ใช่บทพูดทางการของร้าน ก่อนแจ้งคำรับรอง ราคา เงื่อนไขสิทธิ์ เอกสารที่ต้องใช้ หรือประมาณการซ่อม ให้ตรวจสอบขั้นตอนปัจจุบันกับผู้สอนงานค่ะ"},{"en":"The two sources have different scopes: the PDF is a general shop-staff listing dated 1 March 2026; the revised DOCX describes the specialist duties and career plan. Your final assignment and day-to-day responsibilities should be checked with the employer.","th":"แหล่งข้อมูลทั้งสองมีขอบเขตต่างกัน: PDF เป็นประกาศพนักงานสาขาทั่วไป ลงวันที่ 1 มีนาคม 2026 ส่วน DOCX ฉบับแก้ไขอธิบายหน้าที่เฉพาะทางและแผนอาชีพ ให้ตรวจสอบสาขาที่ได้รับมอบหมายและหน้าที่ประจำวันกับนายจ้างค่ะ"}],"sources":[{"name":"株式会社エリアマーケティングオフィス様 (求人票）xlsx.pdf","label":"PDF · Job listing and company sheet · 1 March 2026","scope":"Page 1: employer, listed Suita workplace and general shop duties. Page 2: company description and stated values."},{"name":"エリアマーケティングオフィス留学生採用関係(業務内容等修正）.docx","label":"DOCX · Revised duties, career plan and hiring rationale","scope":"Specialist role, initial back-office learning, analysis, multilingual materials, translation/localization, improvement and coordination. No issue date is visible in the supplied text."}]},"workflows":[{"id":"payment","title":"料金収納","reading":"りょうきんしゅうのう","en":"Take a bill payment","th":"รับชำระค่าบริการ","intro":"Your no-bill cash-payment example. Learn the words in small pieces: ask → check → receive → return.","introTh":"ตัวอย่างชำระเงินสดโดยไม่มีใบแจ้งค่าบริการของคุณ ฝึกเป็นช่วงสั้น ๆ: ถาม → ตรวจ → รับเงิน → คืนเงิน","scope":"Based on your account of shop training, with the Japanese polished for speaking. The amounts and August billing month are practice examples. This does not establish account access, identity checks, payment eligibility, or till and receipt procedures; follow your trainer's instructions for those steps.","scopeTh":"อิงจากขั้นตอนที่คุณเล่าว่าได้เรียนที่ร้าน และปรับภาษาญี่ปุ่นให้ใช้พูดได้เป็นธรรมชาติ จำนวนเงินและรอบบิลเดือนสิงหาคมเป็นตัวอย่างฝึก บทนี้ไม่ได้กำหนดสิทธิ์เข้าดูข้อมูล การยืนยันตัวตน เงื่อนไขการรับชำระ หรือวิธีใช้เครื่องรับเงินและออกใบเสร็จ ขั้นตอนเหล่านั้นให้ทำตามที่ผู้สอนงานแนะนำ","steps":[{"title":"Confirm the visit","enAction":"Confirm that the customer wants to pay a bill.","thAction":"ยืนยันว่าลูกค้ามาชำระค่าบริการ","jp":"{料金|りょうきん}のお{支払|しはら}いですね。","en":"You are here to pay your bill, right?","th":"มาชำระค่าบริการใช่ไหมคะ","hear":{"jp":"はい、そうです。","en":"Yes, that's right.","th":"ใช่ครับ/ค่ะ","id":"payment-01-hear","learning":{"mode":"recognize","audience":"learner","function":"Hear the reaction: Confirm the visit","trigger":"Confirm that the customer wants to pay a bill.","triggerTh":"ยืนยันว่าลูกค้ามาชำระค่าบริการ"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[]}},"id":"payment-01","learning":{"mode":"active","audience":"customer","function":"Confirm need"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["reported-payment"],"scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below."},"facts":[]}},{"title":"Ask about the bill","enAction":"Ask whether they brought their bill. This example continues with “no.”","thAction":"ถามว่านำใบแจ้งค่าบริการมาหรือไม่ ตัวอย่างนี้จะฝึกกรณีลูกค้าตอบว่าไม่ได้เอามา","jp":"{請求書|せいきゅうしょ}はお{持|も}ちですか。","en":"Do you have your bill with you?","th":"นำใบแจ้งค่าบริการมาด้วยไหมคะ","hear":{"jp":"いいえ、{持|も}ってきていません。","en":"No, I haven't brought it.","th":"ไม่ได้เอามาครับ/ค่ะ","id":"payment-02-hear","learning":{"mode":"recognize","audience":"learner","function":"Hear the reaction: Ask about the bill","trigger":"Ask whether they brought their bill. This example continues with “no.”","triggerTh":"ถามว่านำใบแจ้งค่าบริการมาหรือไม่ ตัวอย่างนี้จะฝึกกรณีลูกค้าตอบว่าไม่ได้เอามา"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[]}},"gate":"If they have the bill, use the bill-present procedure your trainer has shown you; do not assume the no-bill steps are identical.","gateTh":"ถ้าลูกค้านำใบแจ้งค่าบริการมา ให้ทำตามขั้นตอนกรณีมีใบแจ้งค่าบริการที่ผู้สอนงานสอนไว้ ไม่ควรถือว่าขั้นตอนเหมือนกรณีไม่มีใบแจ้งค่าบริการทุกอย่าง","id":"payment-02","learning":{"mode":"active","audience":"customer","function":"Request document"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["reported-payment"],"scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below."},"facts":[]}},{"title":"Ask for the written details","enAction":"Use the form and information request you were taught.","thAction":"ใช้แบบฟอร์มและขอข้อมูลตามวิธีที่เรียนมา","jp":"こちらに{電話番号|でんわばんごう}とお{名前|なまえ}をご{記入|きにゅう}ください。","en":"Please write the phone number and your name here.","th":"กรุณากรอกเบอร์โทรและชื่อตรงนี้ค่ะ","gate":"A written phone number and name do not by themselves establish permission to access an account. Complete the identity and access checks required by your shop before looking up or disclosing account information.","gateTh":"การเขียนหมายเลขโทรศัพท์และชื่อเพียงอย่างเดียวไม่ได้หมายความว่ามีสิทธิ์เข้าดูข้อมูลบัญชี ก่อนค้นหาหรือแจ้งข้อมูลบัญชี ให้ตรวจสอบตัวตนและสิทธิ์ตามขั้นตอนของร้านให้ครบ","id":"payment-03","learning":{"mode":"active","audience":"customer","function":"Request written details"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["reported-payment"],"scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below."},"facts":[]}},{"title":"Buy time while checking","enAction":"After receiving the completed form, use the lookup process you were shown and explain the wait.","thAction":"เมื่อรับแบบฟอร์มที่กรอกเสร็จแล้ว ให้ค้นหาตามขั้นตอนที่เรียนมาและแจ้งให้รอระหว่างตรวจสอบ","jp":"{確認|かくにん}しますので、{少々|しょうしょう}お{待|ま}ちください。","en":"Please wait a moment while I check.","th":"ขอตรวจสอบสักครู่ กรุณารอนะคะ","gate":"If you cannot identify the correct account, bill, or screen, stop and ask your trainer before continuing.","gateTh":"ถ้ายังไม่แน่ใจว่าเป็นบัญชี ใบแจ้งค่าบริการ หรือหน้าจอที่ถูกต้อง ให้หยุดถามผู้สอนงานก่อนทำต่อ","id":"payment-04","learning":{"mode":"active","audience":"customer","function":"Check / wait"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["reported-payment"],"scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below."},"facts":[]}},{"title":"Confirm the billing month","enAction":"Read the verified billing month and confirm which bill they intend to pay.","thAction":"อ่านเดือนของรอบบิลที่ตรวจสอบแล้ว และยืนยันว่าลูกค้าต้องการชำระบิลนั้น","jp":"お{待|ま}たせしました。{8月|はちがつ}ご{請求分|せいきゅうぶん}でよろしいですか。","en":"Thank you for waiting. Is it the August bill?","th":"ขอบคุณที่รอค่ะ เป็นรอบบิลเดือนสิงหาคมใช่ไหมคะ","hear":{"jp":"はい、それです。","en":"Yes, that one.","th":"ใช่ บิลนั้นครับ/ค่ะ","id":"payment-05-hear","learning":{"mode":"recognize","audience":"learner","function":"Hear the reaction: Confirm the billing month","trigger":"Read the verified billing month and confirm which bill they intend to pay.","triggerTh":"อ่านเดือนของรอบบิลที่ตรวจสอบแล้ว และยืนยันว่าลูกค้าต้องการชำระบิลนั้น"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[]}},"gate":"Replace August with the billing month you actually verified. A billing month is not necessarily the month of usage. If the customer is unsure, check the bill with your trainer instead of guessing.","gateTh":"เปลี่ยนเดือนสิงหาคมเป็นเดือนของรอบบิลที่ตรวจสอบจริง เดือนของรอบบิลไม่จำเป็นต้องตรงกับเดือนที่ใช้งาน ถ้าลูกค้าไม่แน่ใจ ให้ตรวจสอบบิลกับผู้สอนงานแทนการเดา","id":"payment-05","learning":{"mode":"active","audience":"customer","function":"Confirm bill"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["reported-payment"],"scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below."},"facts":[]}},{"title":"Show the amount","enAction":"Point out the verified amount due.","thAction":"ชี้และแจ้งยอดชำระที่ตรวจสอบแล้ว","jp":"お{支払|しはら}いは{13,600円|いちまんさんぜんろっぴゃくえん}です。","en":"The amount due is ¥13,600.","th":"ยอดชำระ 13,600 เยนค่ะ","id":"payment-06","learning":{"mode":"active","audience":"customer","function":"State amount"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["reported-payment"],"scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below."},"facts":[]}},{"title":"Ask how to pay","enAction":"Ask the payment method from the options approved for this bill.","thAction":"ถามวิธีชำระจากตัวเลือกที่ใช้ได้กับบิลนี้","jp":"{現金|げんきん}とクレジットカード、どちらにされますか。","en":"Would you like cash or credit card?","th":"ต้องการชำระด้วยเงินสดหรือบัตรเครดิตคะ","hear":{"jp":"{現金|げんきん}でお{願|ねが}いします。","en":"Cash, please.","th":"จ่ายเงินสดครับ/ค่ะ","id":"payment-07-hear","learning":{"mode":"recognize","audience":"learner","function":"Hear rate the phone cost, recurring charges and other charges; explain any conditions that affect the estimate.","thAction":"ใช้ใบประมาณราคาที่ตรวจสอบแล้ว แยกราคาเครื่อง ค่าบริการรายเดือน และค่าใช้จ่ายอื่น พร้อมอธิบายเงื่อนไขที่มีผลต่อยอดค่ะ","jp":"{機種代金|きしゅだいきん}と{毎月|まいつき}の{料金|りょうきん}を{分|わ}けてご{説明|せつめい}します。","en":"I will explain the phone price and monthly charges separately.","th":"จะแยกอธิบายราคาเครื่องกับค่าบริการรายเดือนค่ะ","gate":"Use actual verified amounts. Have a trainer check instalment terms, optional services, any existing balance or return programme, and when each charge applies before explaining them.","gateTh":"ใช้ยอดจริงที่ตรวจสอบแล้ว ให้พี่เลี้ยงตรวจเงื่อนไขผ่อน บริการเสริม ยอดคงเหลือหรือโครงการคืนเครื่องที่เกี่ยวข้อง และช่วงเวลาที่เรียกเก็บแต่ละรายการก่อนอธิบายค่ะ","hear":{"jp":"これが{毎月|まいつき}の{合計|ごうけい}ですか。ほかにもかかりますか。","en":"Is this the monthly total? Will there be other charges?","th":"นี่คือยอดรวมต่อเดือนใช่ไหม มีค่าใช้จ่ายอื่นอีกไหม","id":"upgrade-04-hear","learning":{"mode":"recognize","audience":"learner","function":"Hear the reaction: Explain the verified costs","trigger":"Use the approved estimate. Separate the phone cost, recurring charges and other charges; explain any conditions that affect the estimate.","triggerTh":"ใช้ใบประมาณราคาที่ตรวจสอบแล้ว แยกราคาเครื่อง ค่าบริการรายเดือน และค่าใช้จ่ายอื่น พร้อมอธิบายเงื่อนไขที่มีผลต่อยอดค่ะ"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[]}},"reply":{"jp":"{別|べつ}にかかる{費用|ひよう}も{含|ふく}めて、もう{一度|いちど}ご{説明|せつめい}します。","en":"I will explain it again, including any separate charges.","th":"จะอธิบายอีกครั้งโดยรวมค่าใช้จ่ายที่ต้องจ่ายแยกด้วยค่ะ","id":"upgrade-04-reply","learning":{"mode":"active","audience":"customer","function":"Answer the reaction: Explain the verified costs","trigger":"Use the approved estimate. Separate the phone cost, recurring charges and other charges; explain any conditi {内容|ないよう}を{確認|かくにん}しています。{少々|しょうしょう}お{待|ま}ちください。","en":"I am checking the details. Please wait a moment.","th":"กำลังตรวจสอบรายละเอียดค่ะ กรุณารอสักครู่ค่ะ","gate":"Trainer demonstration needed: system entry, any application/instalment checks, payment and SIM/activation steps. Do not say the application is complete until the actual status is confirmed.","gateTh":"ต้องให้พี่เลี้ยงสาธิต: การกรอกระบบ การตรวจคำขอหรือการผ่อน ชำระเงิน และงาน SIM/เปิดใช้งาน อย่าบอกว่าเสร็จแล้วจนกว่าจะยืนยันสถานะจริงค่ะ","id":"upgrade-06","learning":{"mode":"active","audience":"customer","function":"Wait"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["public-upgrade-1"],"scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below."},"facts":[]}},{"title":"Agree the setup and data scope","enAction":"Find out what data matters before attempting setup or transfer. Explain the available support and confirmed cost first.","thAction":"ถามก่อนว่าข้อมูลใดสำคัญกับลูกค้า ก่อนเริ่มตั้งค่าหรือย้ายข้อมูล ให้อธิบายขอบเขตบริการที่ทำได้และค่าบริการที่ตรวจสอบแล้วค่ะ","jp":"{新|あたら}しい{機種|きしゅ}に{移|うつ}したいデータはありますか。","en":"Is there data you want to transfer to the new phone?","th":"มีข้อมูลที่ต้องการย้ายไปเครื่องใหม่ไหมคะ","gate":"Check backups and app-specific transfer requirements. Do not promise that everything will transfer or erase the old phone before the required checks and customer agreement.","gateTh":"ตรวจการสำรองข้อมูลและเงื่อนไขย้ายข้อมูลของแต่ละแอป อย่ารับปากว่าย้ายได้ทั้งหมด และอย่าลบข้อมูลเครื่องเก่าก่อนตรวจสอบครบและได้รับความยินยอมค่ะ","hear":{"jp":"{写真|しゃしん}と{LINE|ライン}は、そのまま{使|つか}えますか。","en":"Will I still be able to use my photos and LINE as before?","th":"รูปกับ LINE จะใช้ต่อได้เหมือนเดิมไหม","id":"upgrade-07-hear","learning":{"mode":"recognize","audience":"learner","function":"Hear the reaction: Agree the setup and data scope","trigger":"Find out what data arning":{"mode":"active","audience":"customer","function":"Review / hand over"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["public-upgrade-1"],"scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below."},"facts":[]}}],"sources":[{"label":"Docomo: changing phones at a shop","url":"https://www.docomo.ne.jp/support/switch_shop/","checked":"2026-09-10"}],"sourceIds":["public-upgrade-1"],"outcome":"Reach a checked handover of the chosen phone.","outcomeTh":"ฝึกจนถึงตรวจและส่งมอบเครื่องที่เลือก","doneWhen":"The customer has checked the final details and agreed setup. Any unfinished data or app work has a clear next action. Detailed price explanations still need trainer practice.","doneWhenTh":"ลูกค้าตรวจรายละเอียดและงานตั้งค่าที่ตกลงไว้แล้ว หากข้อมูลหรือแอปยังไม่เสร็จ ต้องบอกขั้นตอนต่อไปให้ชัด ยังต้องฝึกอธิบายราคาจริงกับพี่เลี้ยง","provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["public-upgrade-1"],"scope":"Original communicative stage order based on the cited context. Neither completeness nor exact internal order is established."},"facts":[]},"followupIds":["p089","p093","p094","p095"]},{"id":"replacement","title":"機種交換","reading":"きしゅこうかん","en":"Replacement after a phone problem","th":"เปลี่ยนเครื่องกรณีเครื่องมีปัญหา","intro":"First check what your store means by this term. Here it means a possible replacement through device coverage after a fault or damage, not automatically buying a newer model.","introTh":"ก่อนอื่นให้ถามว่าร้านใช้คำนี้ในความหมายใด ในบทนี้หมายถึงการพิจารณาเปลี่ยนเครื่องผ่านบริการคุ้มครองเมื่อเครื่องเสียหรือเสียหาย ไม่ได้หมายถึงการซื้อรุ่นใหม่เสมอไปค่ะ","scope":"The company materials include fault/repair reception. Docomo's public guides distinguish repair, coverage replacement and purchasing a new phone; the correct route depends on the case and subscribed service. This is an original speaking sequence, not a complete internal SOP. Eligibility, fees, delivery, setup and return requirements must be checked for the actual case.","scopeTh":"เอกสารบริษัทระบุงานรับแจ้งเครื่องเสียและรับซ่อม คู่มือสาธารณะของ docomo แยกการซ่อม การเปลี่ยนเครื่องผ่านบริการคุ้มครอง และการซื้อเครื่องใหม่ เส้นทางที่ใช้ขึ้นอยู่กับกรณีและบริการที่สมัครไว้ นี่คือลำดับฝึกพูดที่เขียนขึ้น ไม่ใช่คู่มือภายในฉบับสมบูรณ์ ต้องตรวจสิทธิ์ ค่าใช้จ่าย การรับเครื่อง การตั้งค่า และข้อกำหนดคืนเครื่องของกรณีจริงค่ะ","steps":[{"title":"Ask your trainer what the task means","audience":"coworker","enAction":"Coworker line: establish the intended workflow before practising this branch.","thAction":"ประโยคคุยกับพี่เลี้ยง: ยืนยันก่อนว่างานนี้หมายถึงขั้นตอนใด แล้วจึงฝึกตามบทนี้ค่ะ","jp":"この{機種交換|きしゅこうかん}は、{補償|ほしょう}での{交換|こうかん}ですか。","en":"Does this device replacement mean a replacement through coverage?","th":"การเปลี่ยนเครื่องกรณีนี้หมายถึงเปลี่ยนผ่านบริการคุ้มครองใช่ไหมคะ","gate":"If your store means an initial-defect exchange, SIM exchange, purchase or another task, have your trainer show that separate procedure.","gateTh":"ถ้าร้านหมายถึงเปลี่ยนเพราะเครื่องใหม่มีปัญหา เปลี่ยน SIM ซื้อเครื่องใหม่ หรืองานอื่น ให้พี่เลี้ยงสอนขั้นตอนนั้นแยกต่างหากค่ะ","id":"replacement-01","learning":{"mode":"active","audience":"coworker","function":"Clarify task with team"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["public-replacement-1","public-replacement-2","public-replacement-3"],"scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below."},"facts":[]}},{"title":"Hear what happened","enAction":"Ask the symptom and when it started. Avoid deciding on repair or replacement from the opening sentence alone.","thAction":"ถามอาการและเวลาที่เริ่มมีปัญหา อย่าเพิ่งตัดสินว่าจะซ่อมหรือเปลี่ยนจากประโยคแรกที่ได้ยินค่ะ","jp":"どのような{症状|しょうじょう}ですか。いつからですか。","en":"What is the problem? When did it start?","th":"เครื่องมีอาการอย่างไรคะ เริ่มตั้งแต่เมื่อไรคะ","hear":{"jp":"{昨日|きのう}{落|お}としてから、{画面|がめん}がつかないんです。","en":"The screen hasn't come on since I dropped it yesterday.","th":"เมื่อวานทำตก หลังจากนั้นหน้าจอก็ไม่ติดเลย","id":"replacement-02-hear","learning":{"mode":"recognize","audience":"learner","function":"Hear the reaction: Hear what happened","trigger":"Ask the symptom and when it started. Avoid deciding on repair or replacement from the opening sentence alone.","triggerTh":"ถามอาการและเวลาที่เริ่มมีปัญหา อย่าเพิ่งตัดสินว่าจะซ่อมหรือเปลี่ยนจากประโยคแรกที่ได้ยินค่ะ"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[]}},"id":"replacement-02","learning":{"mode":"active","audience":"customer","function":"Ask symptoms"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["public-replacement-1","public-replacement-2","public-replacement-3"],"scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below."},"facts":[]}},{"title":"Check the customer and coverage","enAction":"Use the approved identity check, then have the actual device and subscribed coverage checked.","thAction":"ยืนยันตัวตนตามขั้นตอน แล้วตรวจเครื่องที่เกี่ยวข้องและบริการคุ้มครองที่สมัครไว้จริงค่ะ","jp":"{本人確認|ほんにんかくにん}のあと、{補償|ほしょう}の{加入状況|かにゅうじょうきょう}を{確認|かくにん}します。","en":"After the identity check, I will check your coverage enrollment.","th":"หลังยืนยันตัวตน จะตรวจสอบว่ามีบริการคุ้มครองที่สมัครไว้อย่างไรค่ะ","gate":"Trainer check: service name, covered device and claim eligibility. If the phone is lost or stolen, ask about the separate suspension/reporting procedure immediately.","gateTh":"ให้พี่เลี้ยงตรวจ: ชื่อบริการ เครื่องที่อยู่ในความคุ้มครอง และสิทธิ์ใช้บริการ หากเครื่องหายหรือถูกขโมย ให้ถามขั้นตอนระงับการใช้งานและแจ้งเหตุทันทีค่ะ","id":"replacement-03","learning":{"mode":"active","audience":"customer","function":"Check coverage"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["public-replacement-1","public-replacement-2","public-replacement-3"],"scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below."},"facts":[]}},{"title":"Check the available route","enAction":"Ask the trained staff member which options fit this case before recommending a route.","thAction":"ให้พนักงานที่ผ่านการฝึกตรวจว่ากรณีนี้ใช้ทางเลือกใดได้บ้าง ก่อนแนะนำขั้นตอนให้ลูกค้าค่ะ","jp":"{修理|しゅうり}か{交換|こうかん}か、{対応|たいおう}できる{方法|ほうほう}を{確認|かくにん}します。","en":"I will check the available options, such as repair or replacement.","th":"ขอตรวจสอบวิธีที่ดำเนินการได้ เช่น ซ่อมหรือเปลี่ยนเครื่องค่ะ","hear":{"jp":"{仕事|しごと}で{使|つか}うので、できるだけ{早|はや}く{使|つか}いたいです。","en":"I use it for work, so I need a working phone as soon as possible.","th":"ต้องใช้ทำงาน อยากกลับมาใช้ได้ให้เร็วที่สุด","id":"replacement-04-hear","learning":{"mode":"recognize","audience":"learner","function":"Hear the reaction: Check the available route","trigger":"Ask the trained staff member which options fit this case before recommending a route.","triggerTh":"ให้พนักงานที่ผ่านการฝึกตรวจว่ากรณีนี้ใช้ทางเลือกใดได้บ้าง ก่อนแนะนำขั้นตอนให้ลูกค้าค่ะ"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[]}},"reply":{"jp":"お{急|いそ}ぎですね。いつ{使|つか}えるようになるか、{確認|かくにん}します。","en":"You need it urgently, right? I’ll check when you could have a working phone.","th":"ต้องการใช้ด่วนใช่ไหมคะ ขอตรวจว่าจะกลับมาใช้งานได้เมื่อไรค่ะ","id":"replacement-04-reply","learning":{"mode":"active","audience":"customer","function":"Answer the reaction: Check the available route","trigger":"Ask the trained staff member which options fit this case before recommending a route.","triggerTh":"ให้พนักงานที่ผ่านการฝึกตรวจว่ากรณีนี้ใช้ทางเลือกใดได้บ้าง ก่อนแนะนำขั้นตอนให้ลูกค้าค่ะ"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[]}},"id":"replacement-04","learning":{"mode":"active","audience":"customer","function":"Check options"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["public-replacement-1","public-replacement-2","public-replacement-3"],"scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below."},"facts":[]}},{"title":"Explain terms before agreement","enAction":"Once replacement is confirmed as an option, explain its verified cost, available device, receipt arrangements and relevant conditions.","thAction":"เมื่อยืนยันแล้วว่าสามารถเลือกเปลี่ยนเครื่องได้ ให้อธิบายค่าใช้จ่าย เครื่องที่เลือกได้ วิธีรับเครื่อง และเงื่อนไขที่ตรวจสอบแล้วค่ะ","jp":"{費用|ひよう}とお{受|う}け{取|と}りの{方法|ほうほう}をご{説明|せつめい}します。","en":"I will explain the cost and how to receive the phone.","th":"จะอธิบายค่าใช้จ่ายและวิธีรับเครื่องค่ะ","gate":"Do not promise a brand-new phone, a particular model, a free exchange or same-day receipt. Use the actual service terms and confirmed availability.","gateTh":"อย่ารับปากว่าจะได้เครื่องใหม่แกะกล่อง รุ่นที่ต้องการ เปลี่ยนฟรี หรือรับได้วันนี้ ให้ยึดเงื่อนไขบริการและสินค้าที่ตรวจสอบแล้วค่ะ","id":"replacement-05","learning":{"mode":"active","audience":"customer","function":"Explain terms"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["public-replacement-1","public-replacement-2","public-replacement-3"],"scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below."},"facts":[]}},{"title":"Confirm and process the application","enAction":"Check understanding and obtain the required agreement. Use the authorised application route with your trainer.","thAction":"ตรวจว่าลูกค้าเข้าใจและขอความยินยอมตามที่กำหนด ใช้ช่องทางรับคำขอที่พี่เลี้ยงสอนค่ะ","jp":"この{内容|ないよう}で{交換|こうかん}を{申|もう}し{込|こ}んでよろしいですか。","en":"May I submit the replacement request with these details?","th":"ขอส่งคำขอเปลี่ยนเครื่องตามรายละเอียดนี้ได้ไหมคะ","gate":"Trainer demonstration needed: approved application channel, required explanations, application status and what the customer must do next. Application reception and receiving a replacement are separate stages.","gateTh":"ต้องให้พี่เลี้ยงสาธิต: ช่องทางรับคำขอ การอธิบายที่จำเป็น สถานะคำขอ และสิ่งที่ลูกค้าต้องทำต่อ การรับคำขอกับการได้รับเครื่องทดแทนเป็นคนละช่วงค่ะ","id":"replacement-06","learning":{"mode":"active","audience":"customer","function":"Ask permission"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["public-replacement-1","public-replacement-2","public-replacement-3"],"scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below."},"facts":[]}},{"title":"Discuss data and setup","enAction":"Check what data or backups are available and agree the support scope before attempting transfer or setup.","thAction":"ตรวจว่ามีข้อมูลหรือข้อมูลสำรองใดอยู่บ้าง และตกลงขอบเขตบริการก่อนย้ายข้อมูลหรือตั้งค่าค่ะ","jp":"データのバックアップはお{済|す}みですか。","en":"Have you backed up your data?","th":"สำรองข้อมูลไว้แล้วหรือยังคะ","gate":"Do not promise recovery from a damaged phone. Check setup support, any charges and customer agreement separately.","gateTh":"อย่ารับปากว่ากู้ข้อมูลจากเครื่องที่เสียได้ ต้องตรวจบริการตั้งค่า ค่าใช้จ่าย และขอความยินยอมแยกต่างหากค่ะ","hear":{"jp":"バックアップしていません。{写真|しゃしん}は{戻|もど}りますか。","en":"I haven't backed it up. Can I get my photos back?","th":"ไม่ได้สำรองไว้ จะเอารูปกลับมาได้ไหม","id":"replacement-07-hear","learning":{"mode":"recognize","audience":"learner","function":"Hear the reaction: Discuss data and setup","trigger":"Check what data or backups are available and agree the support scope before attempting transfer or setup.","triggerTh":"ตรวจว่ามีข้อมูลหรือข้อมูลสำรองใดอยู่บ้าง และตกลงขอบเขตบริการก่อนย้ายข้อมูลหรือตั้งค่าค่ะ"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[]}},"reply":{"jp":"データを{移|うつ}せるか、{担当|たんとう}の{者|もの}に{確認|かくにん}します。","en":"I will check with the staff member responsible whether the data can be transferred.","th":"ขอเช็กกับผู้ดูแลก่อนนะคะว่าย้ายข้อมูลได้หรือไม่","id":"replacement-07-reply","learning":{"mode":"active","audience":"customer","function":"Answer the reaction: Discuss data and setup","trigger":"Check what data or backups are available and agree the support scope before attempting transfer or setup.","triggerTh":"ตรวจว่ามีข้อมูลหรือข้อมูลสำรองใดอยู่บ้าง และตกลงขอบเขตบริการก่อนย้ายข้อมูลหรือตั้งค่าค่ะ"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[]}},"id":"replacement-07","learning":{"mode":"active","audience":"customer","function":"Check data"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["public-replacement-1","public-replacement-2","public-replacement-3"],"scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below."},"facts":[]}},{"title":"Make the next actions clear","enAction":"Summarise the confirmed receipt/setup arrangements and any required old-phone return. Show the actual instructions and deadlines for this case.","thAction":"สรุปวิธีรับและตั้งค่าเครื่องที่ยืนยันแล้ว รวมถึงการคืนเครื่องเก่าหากจำเป็น ชี้ให้ดูคำแนะนำและกำหนดเวลาของกรณีนี้จริง ๆ ค่ะ","jp":"このあとの{流|なが}れをご{説明|せつめい}します。","en":"I will explain what happens next.","th":"จะอธิบายขั้นตอนต่อจากนี้ค่ะ","gate":"If return is required, confirm the method, deadline and data-preparation steps. Do not take or erase the old phone based on this practice script alone.","gateTh":"หากต้องคืนเครื่อง ให้ตรวจวิธีคืน กำหนดเวลา และขั้นตอนเตรียมข้อมูล อย่ารับเครื่องเก่าหรือลบข้อมูลโดยอาศัยบทฝึกนี้เพียงอย่างเดียวค่ะ","id":"replacement-08","learning":{"mode":"active","audience":"customer","function":"Explain next action"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["public-replacement-1","public-replacement-2","public-replacement-3"],"scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below."},"facts":[]}}],"sources":[{"label":"Docomo: trouble options under ケータイ補償サービス","url":"https://www.docomo.ne.jp/service/compensation_service/trouble_guidance.html","checked":"2026-09-10"},{"label":"Docomo: replacement phones under smartあんしん補償","url":"https://www.docomo.ne.jp/service/smart_anshin_hoshou/replacement_phone.html","checked":"2026-09-10"},{"label":"Docomo: trouble options under smartあんしん補償","url":"https://www.docomo.ne.jp/service/smart_anshin_hoshou/trouble_guidance.html","checked":"2026-09-10"}],"sourceIds":["public-replacement-1","public-replacement-2","public-replacement-3"],"outcome":"Clarify the replacement request and the next action.","outcomeTh":"ยืนยันเรื่องเปลี่ยนเครื่องและสิ่งที่ต้องทำต่อ","doneWhen":"The route, cost and receipt/return arrangements are confirmed or handed over to the responsible colleague. Accepting an application does not mean a replacement has been received.","doneWhenTh":"ยืนยันหรือส่งต่อให้ผู้ดูแลเรื่องวิธีดำเนินการ ค่าใช้จ่าย การรับและคืนเครื่องให้ชัด รับคำขอแล้วไม่ได้แปลว่าลูกค้าได้รับเครื่องแล้ว","provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["public-replacement-1","public-replacement-2","public-replacement-3"],"scope":"Original communicative stage order based on the cited context. Neither completeness nor exact internal order is established."},"facts":[]},"followupIds":["p105","p099","p100","p108"]},{"id":"mnp","title":"乗り換え","reading":"のりかえ","en":"Switch to docomo and keep the number","th":"ย้ายค่ายมา docomo โดยใช้เบอร์เดิม","intro":"The first questions are: switching from which company to which company, keeping the number, and buying a phone or keeping the current one. This practice route is incoming MNP to docomo.","introTh":"ถามก่อนว่า ย้ายจากค่ายไหนไปค่ายไหน ใช้เบอร์เดิมหรือไม่ และซื้อเครื่องใหม่หรือใช้เครื่องเดิม บทนี้ฝึกกรณีย้ายค่ายมา docomo โดยใช้เบอร์เดิมค่ะ","scope":"Docomo's public MNP guide supports number retention, application preparation and identity checks. It distinguishes web one-stop from the reservation-number route; do not assume a web-only condition applies at the counter. The conversation order below is a training aid, not a complete store SOP. Outgoing transfers and changes involving ahamo need their own route check.","scopeTh":"คู่มือ MNP สาธารณะของ docomo อธิบายการใช้เบอร์เดิม การเตรียมสมัคร และการยืนยันตัวตน โดยแยกวิธี one-stop บนเว็บกับวิธีใช้หมายเลขจอง MNP อย่านำเงื่อนไขเฉพาะเว็บมาใช้ที่เคาน์เตอร์โดยอัตโนมัติ ลำดับบทสนทนานี้เป็นตัวช่วยฝึก ไม่ใช่คู่มือร้านฉบับสมบูรณ์ กรณีย้ายออกหรือเกี่ยวข้องกับ ahamo ต้องตรวจเส้นทางแยกค่ะ","steps":[{"title":"Confirm the direction and number","enAction":"After hearing that the customer wants to come to docomo, confirm number retention. If the direction or current provider is unclear, ask before selecting this route.","thAction":"หลังทราบว่าลูกค้าต้องการย้ายมา docomo ให้ยืนยันว่าจะใช้เบอร์เดิม ถ้ายังไม่ชัดว่าย้ายไปไหนหรือใช้ค่ายใดอยู่ ต้องถามก่อนเลือกขั้นตอนนี้","jp":"{電話番号|でんわばんごう}はそのままで、ドコモへお{乗|の}り{換|か}えですね。","en":"You would like to switch to docomo and keep your number, right?","th":"ต้องการย้ายมา docomo โดยใช้เบอร์เดิมใช่ไหมคะ","hear":{"jp":"{今|いま}はauです。{番号|ばんごう}は{変|か}えたくないです。","en":"I'm with au now. I don't want to change my number.","th":"ตอนนี้ใช้ au อยู่ ไม่อยากเปลี่ยนเบอร์","id":"mnp-01-hear","learning":{"mode":"recognize","audience":"learner","function":"Hear the reaction: Confirm the direction and number","trigger":"After hearing that the customer wants to come to docomo, confirm number retention. If the direction or current provider is unclear, ask before selecting this route.","triggerTh":"หลังทราบว่าลูกค้าต้องการย้ายมา docomo ให้ยืนยันว่าจะใช้เบอร์เดิม ถ้ายังไม่ชัดว่าย้ายไปไหนหรือใช้ค่ายใดอยู่ ต้องถามก่อนเลือกขั้นตอนนี้"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[]}},"id":"mnp-01","learning":{"mode":"active","audience":"customer","function":"Confirm direction"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["public-mnp-1"],"scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below."},"facts":[{"category":"A","sourceIds":["public-mnp-1"],"scope":"Incoming MNP retains the telephone number; the model confirmation is authored."}]}},{"title":"New phone or current phone?","enAction":"Identify a phone purchase versus a line-only application. For a current phone, have compatibility and SIM/eSIM suitability checked.","thAction":"แยกว่าเป็นการซื้อเครื่องพร้อมสมัคร หรือสมัครเฉพาะบริการ หากใช้เครื่องเดิม ให้ตรวจความเข้ากันได้และ SIM/eSIM ที่เหมาะสมค่ะ","jp":"{携帯電話|けいたいでんわ}も{新|あたら}しくしますか。{今|いま}の{機種|きしゅ}を{使|つか}いますか。","en":"Will you get a new phone, or use your current one?","th":"จะซื้อเครื่องใหม่หรือใช้เครื่องเดิมคะ","gate":"Do not promise that a non-docomo phone will work. Ask the trainer to confirm the particular device and available service before proceeding.","gateTh":"อย่ารับปากว่าเครื่องจากค่ายอื่นใช้ได้ ให้พี่เลี้ยงตรวจรุ่นเครื่องและบริการที่ใช้ได้ก่อนดำเนินการค่ะ","id":"mnp-02","learning":{"mode":"active","audience":"customer","function":"Ask device preference"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["public-mnp-1"],"scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below."},"facts":[]}},{"title":"Check the applicant and documents","enAction":"Check the contract holder, identity documents and payment-registration requirements using the current store procedure.","thAction":"ตรวจเจ้าของสัญญา เอกสารยืนยันตัวตน และสิ่งที่ต้องใช้ลงทะเบียนวิธีชำระเงินตามขั้นตอนปัจจุบันของร้านค่ะ","jp":"ご{契約者|けいやくしゃ}ご{本人|ほんにん}ですか。{必要|ひつよう}な{書類|しょるい}を{確認|かくにん}します。","en":"Are you the contract holder? I will check the required documents.","th":"เป็นเจ้าของสัญญาเองใช่ไหมคะ ขอตรวจเอกสารที่ต้องใช้ค่ะ","gate":"Trainer check: name matching, family/representative or minor cases, accepted identification and payment details. Do not infer that every visitor can apply on someone else's behalf.","gateTh":"ให้พี่เลี้ยงตรวจ: ชื่อตรงกันหรือไม่ กรณีครอบครัว/ตัวแทน/ผู้เยาว์ เอกสารที่รับได้ และข้อมูลชำระเงิน อย่าคิดว่าผู้มาติดต่อทุกคนสมัครแทนคนอื่นได้ค่ะ","id":"mnp-03","learning":{"mode":"active","audience":"customer","function":"Check applicant"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["public-mnp-1"],"scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below."},"facts":[]}},{"title":"Check the MNP preparation","enAction":"Check whether a reservation number has been obtained and confirm the correct in-store route with your trainer.","thAction":"ถามว่ามีหมายเลขจอง MNP แล้วหรือไม่ และให้พี่เลี้ยงยืนยันวิธีดำเนินการที่หน้าร้านค่ะ","jp":"{MNP|エムエヌピー}{予約番号|よやくばんごう}はお{持|も}ちですか。","en":"Do you have an MNP reservation number?","th":"มีหมายเลขจอง MNP แล้วไหมคะ","gate":"Check validity and the current shop procedure. Do not apply online-only remaining-validity rules or assume web one-stop is available for this counter application. Do not tell the customer to cancel the old line separately.","gateTh":"ตรวจวันหมดอายุและขั้นตอนหน้าร้านปัจจุบัน อย่านำเกณฑ์อายุคงเหลือเฉพาะออนไลน์มาใช้ หรือสรุปว่าใช้ one-stop บนเว็บกับคำขอที่เคาน์เตอร์นี้ได้ อย่าสั่งให้ลูกค้ายกเลิกเบอร์เดิมแยกเองค่ะ","hear":{"jp":"{予約番号|よやくばんごう}って{何|なん}ですか。まだ{何|なに}もしていません。","en":"What's a reservation number? I haven't done anything yet.","th":"หมายเลขจองคืออะไร ยังไม่ได้ทำอะไรเลย","id":"mnp-04-hear","learning":{"mode":"recognize","audience":"learner","function":"Hear the reaction: Check the MNP preparation","trigger":"Check whether a reservation number has been obtained and confirm the correct in-store route with your trainer.","triggerTh":"ถามว่ามีหมายเลขจอง MNP แล้วหรือไม่ และให้พี่เลี้ยงยืนยันวิธีดำเนินการที่หน้าร้านค่ะ"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[]}},"reply":{"jp":"{番号|ばんごう}を{変|か}えずに{乗|の}り{換|か}えるための{番号|ばんごう}です。{取得方法|しゅとくほうほう}をご{案内|あんない}します。","en":"It is a number used to switch while keeping your current number. I will explain how to obtain it.","th":"เป็นหมายเลขสำหรับย้ายค่ายโดยใช้เบอร์เดิมค่ะ จะอธิบายวิธีขอหมายเลขให้นะคะ","id":"mnp-04-reply","learning":{"mode":"active","audience":"customer","function":"Answer the reaction: Check the MNP preparation","trigger":"Check whether a reservation number has been obtained and confirm the correct in-store route with your trainer.","triggerTh":"ถามว่ามีหมายเลขจอง MNP แล้วหรือไม่ และให้พี่เลี้ยงยืนยันวิธีดำเนินการที่หน้าร้านค่ะ"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[]}},"id":"mnp-04","learning":{"mode":"active","audience":"customer","function":"Check preparation"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["public-mnp-1"],"scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below."},"facts":[{"category":"A","sourceIds":["public-mnp-1"],"scope":"Public guide distinguishes web one-stop from reservation-number preparation. Shop route and validity checks must use current material."}]}},{"title":"Ask about usage","enAction":"Ask about data and calling before selecting a plan. Use the plan-change map’s comparison and estimate stages for the explanation language.","thAction":"ถามการใช้เน็ตและโทรก่อนเลือกแพ็กเกจ ถ้าต้องอธิบายการเปรียบเทียบและราคา ให้ดูช่วงเปรียบเทียบกับใบประมาณราคาในบทเปลี่ยนแพ็กเกจ","jp":"データや{通話|つうわ}は、{毎月|まいつき}どのくらい{使|つか}いますか。","en":"How much data and calling do you use each month?","th":"ใช้เน็ตและโทรประมาณเท่าไรต่อเดือนคะ","gate":"Confirm the actual charges, eligibility and any existing-provider obligations. Never promise that switching has no extra cost or that a discount applies before checking.","gateTh":"ตรวจค่าใช้จ่าย สิทธิ์ส่วนลด และภาระที่อาจเหลือกับค่ายเดิม อย่ารับปากว่าย้ายแล้วไม่มีค่าใช้จ่ายเพิ่มหรือได้รับส่วนลดแน่นอนก่อนตรวจค่ะ","relatedFlow":"plan","id":"mnp-05","learning":{"mode":"active","audience":"customer","function":"Ask usage"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["public-mnp-1"],"scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below."},"facts":[]}},{"title":"Confirm the application","enAction":"Review the selected service and important conditions, answer questions and obtain the required agreement.","thAction":"ทวนบริการที่เลือกและเงื่อนไขสำคัญ ตอบคำถาม และขอความยินยอมตามที่กำหนดค่ะ","jp":"{電話番号|でんわばんごう}と{内容|ないよう}をご{確認|かくにん}ください。こちらでよろしいですか。","en":"Please check the phone number and details. Are these correct?","th":"กรุณาตรวจเบอร์โทรกับรายละเอียด ตามนี้ถูกต้องไหมคะ","gate":"This line does not replace required contract explanations or consent records. Have your trainer check the application before submission.","gateTh":"ประโยคนี้ไม่แทนการอธิบายสัญญาหรือบันทึกความยินยอมที่จำเป็น ให้พี่เลี้ยงตรวจคำขอก่อนส่งค่ะ","id":"mnp-06","learning":{"mode":"active","audience":"customer","function":"Confirm / agree"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["public-mnp-1"],"scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below."},"facts":[]}},{"title":"Process and explain the switch","enAction":"Follow the authorised registration and line-switching steps with the trained staff member; explain the next operation before doing it.","thAction":"ทำขั้นตอนลงทะเบียนและเปลี่ยนเครือข่ายตามที่ได้รับอนุญาตร่วมกับพนักงานที่ผ่านการฝึก และอธิบายสิ่งที่จะทำก่อนเริ่มค่ะ","jp":"このあと{回線|かいせん}を{切|き}り{替|か}えます。{先|さき}に{注意点|ちゅういてん}をご{説明|せつめい}します。","en":"Next we will switch the line. First I will explain what to be aware of.","th":"ต่อไปจะเปลี่ยนเครือข่าย ก่อนอื่นขออธิบายข้อควรทราบค่ะ","gate":"Use this line only when the application status permits switching. Ask the trainer to explain any service interruption, SIM/eSIM operation and completion checks; do not guess timings.","gateTh":"ใช้ประโยคนี้เมื่อสถานะคำขอพร้อมให้เปลี่ยนเครือข่ายแล้ว ให้พี่เลี้ยงสอนเรื่องช่วงที่อาจใช้งานไม่ได้ งาน SIM/eSIM และวิธีตรวจว่าเสร็จแล้ว อย่าเดาเวลาเองค่ะ","hear":{"jp":"{今|いま}の{電話|でんわ}は、いつまで{使|つか}えますか。","en":"Until when can I use my current phone service?","th":"เครือข่ายเดิมจะใช้ได้ถึงเมื่อไร","id":"mnp-07-hear","learning":{"mode":"recognize","audience":"learner","function":"Hear the reaction: Process and explain the switch","trigger":"Follow the authorised registration and line-switching steps with the trained staff member; explain the next operation before doing it.","triggerTh":"ทำขั้นตอน
