function rescueHTML(){return `<section class="rescue-page"><div class="page-heading"><div class="eyebrow">Keep these close on day one</div><h1>When you’re<br>stuck for words.</h1><p class="sub">You can be polite and honest while you find the answer.<br><span lang="th" class="th">ฟังไม่ทันหรือตอบไม่ได้ ก็ขอเวลาและขอความช่วยเหลืออย่างสุภาพได้</span></p></div><div class="rescue-intro">${[['01 · Pause','ตั้งหลัก'],['02 · Clarify','ถามให้ชัด'],['03 · Check','ตรวจสอบ'],['04 · Return','กลับมาแจ้ง']].map(([a,b])=>`<div class="rescue-step"><b>${a}</b><span lang="th" class="th">${b}</span></div>`).join('')}</div><p class="intro-note">Tap a sentence for readings and meaning. These cards share the same marks and recall queue as Practice.</p><div class="cards">${PHRASES.filter(p=>p.cat==='rescue').map(phraseHTML).join('')}</div></section>`;}
function guideHTML(){return `<section class="guide-width"><div class="page-heading"><div class="eyebrow">Your role · your language · your progress</div><h1>A little context<br>goes a long way.</h1><p class="sub">Grounded in your materials, shaped for your first weeks.<br><span class="th" lang="th">เข้าใจงานและฝึกภาษาสำหรับช่วงเริ่มต้น</span></p></div><div class="guide-nav segmented" aria-label="Guide pages">${[['role','Company & role'],['keigo','Keigo in use'],['progress','Progress']].map(([id,t])=>`<button data-guide="${id}" class="${guideTab===id?'active':''}" aria-pressed="${guideTab===id}">${t}</button>`).join('')}</div>${guideTab==='role'?roleGuideHTML():guideTab==='keigo'?keigoHTML():progressHTML()}</section>`;}
function roleGuideHTML(){const co=DATA.company;return `<div><details class="sourcebox"><summary>How to use this learning map · ใช้บทฝึกอย่างไร</summary><p>Work map: follow an action and try its line. Practice: mark phrases you can say or recognize. Recall: say Japanese from English/Thai, with the audience shown. Dialogues: practise reactions; each states where the encounter stops.</p>${thai('Work map ดูขั้นตอนแล้วฝึกประโยค Practice ทำเครื่องหมายคำที่พูดหรือฟังเข้าใจ Recall นึกภาษาญี่ปุ่นจากความหมายโดยดูว่าพูดกับใคร Dialogues ฝึกตอบโต้และดูว่าบทจบถึงตรงไหน')}<p>Plan names and employer facts are reference. A source word does not make an example an official script. The app records source facts (A), teaching inferences (B), and original language material (C) separately.</p>${thai('ชื่อแพ็กเกจและข้อมูลบริษัทใช้อ้างอิง การมีคำในเอกสารไม่ได้ทำให้ประโยคตัวอย่างเป็นบทพูดทางการ แอปแยกข้อมูลตรงจากแหล่งอ้างอิง การอนุมานเพื่อสอน และภาษาฝึกที่เขียนขึ้นเองไว้ภายใน')}</details><p style="font-size:14px">${esc(co.intro)}</p><div class="sub th" lang="th">${esc(co.introTh)}</div><div style="margin-top:26px">${co.facts.map((f,i)=>`<article class="fact"><h3>${esc(f.label)} <span class="small muted th" lang="th">${esc(f.labelTh)}</span></h3><p class="en">${esc(f.en)}</p>${thai(f.th)}<button class="fact-jp" data-fact="${i}" aria-expanded="false" aria-label="Reveal Japanese reading: ${esc(f.label)}">${jpHTML(f.jp)}<span class="tapcue">Tap for furigana · แตะเพื่อดูคำอ่าน</span></button><p class="source">Source: ${esc(f.source)}</p></article>`).join('')}</div>${co.boundaries.map(b=>`<div class="boundary">${esc(b.en)}${thai(b.th)}</div>`).join('')}<details class="sourcebox"><summary>The two source documents · เอกสารอ้างอิง</summary>${co.sources.map(s=>`<div class="source-item"><strong>${esc(s.name)}</strong><span>${esc(s.label)} · ${esc(s.scope)}</span></div>`).join('')}<p>All study content is embedded in this HTML. The original documents are not needed to use it offline. Practice dialogue and language explanations are authored learning material, not quotations or an official training manual.</p></details></div>`;}
function keigoHTML(){return `<p class="intro-note">Learn one useful version, not every formal alternative. Both columns use polite endings; some basic requests sound more direct. Match the audience and purpose. Tap the service example for both readings and the explanation.<br><span lang="th" class="th">จำรูปที่ใช้ได้จริงหนึ่งรูป ไม่ต้องจำทุกระดับความสุภาพ ทั้งสองคอลัมน์มีคำลงท้ายสุภาพ แต่บางคำขอในรูปพื้นฐานฟังตรงกว่า เลือกตามผู้ฟังและจุดประสงค์</span></p><div>${DATA.keigo.map((k,i)=>`<article class="keigo-card" id="keigo-${i}"><h3>${esc(k.title)} <span class="small muted th" lang="th">${esc(k.titleTh)}</span></h3><p class="intro-note">${k.learning.mode==='active'?'Useful to say · ฝึกพูดได้เลย':'Recognize the formal option · เข้าใจรูปทางการไว้ก่อน'}</p><div class="compare-label">Basic wording · polite endings</div>${jpHTML(k.plain,'plain')}<div class="compare-label" style="color:var(--red)">Service wording · one option</div><button class="phrase-reveal" data-keigo="${i}" aria-expanded="false" aria-controls="keigo-meaning-${i}">${jpHTML(k.polite)}<span class="tapcue">${svg('eye')}Tap for reading, meaning & use</span></button><div class="translation" id="keigo-meaning-${i}" hidden><div class="en">${esc(k.en)}</div>${thai(k.th)}<div class="usage">${esc(k.why)}${thai(k.whyTh)}</div></div></article>`).join('')}</div>`;}
function progressHTML(){const totals=counts();return `<div><h2>Your confidence map</h2><div id="guideStats" style="margin-top:20px">${statsHTML()}</div><p class="intro-note">Marks reflect confidence on the ${PHRASES.length} phrase cards, not completed workplace procedures. Listening and speaking both count; Recall uses speaking cards. Work maps, vocabulary and cushions are unscored practice/reference views.</p>${CATS.map(c=>{const ps=PHRASES.filter(p=>p.cat===c[0]),n=counts(ps);return `<div class="topic-progress"><div class="row"><span>${esc(c[1])}</span><span class="muted">${n.known}/${ps.length} known</span></div><div class="progressbar" role="img" aria-label="${esc(c[1])}: ${n.known} known, ${n.shaky} shaky, ${n.new} unmarked"><span class="known" style="width:${100*n.known/ps.length}%"></span><span class="shaky" style="width:${100*n.shaky/ps.length}%"></span></div><p class="small muted">${n.shaky} shaky · ${n.new} unmarked</p></div>`;}).join('')}<div class="section-rule"><h2>A useful five minutes</h2></div><ol class="study-steps"><li>Start with the 25 Day-one essentials, in batches of five. Read the Japanese without help. Tap, check the readings, then say the whole sentence.<div class="th" lang="th">เริ่มจาก 25 ประโยคจำเป็น ฝึกครั้งละ 5 ประโยค อ่านก่อนดูคำแปล ตรวจคำอ่าน แล้วพูดทั้งประโยค</div></li><li>Use Recall to produce Japanese from the English and Thai. Mark the sentence shaky if you needed the model.<div class="th" lang="th">ฝึกนึกประโยคญี่ปุ่นจากความหมาย ถ้ายังต้องดูคำตอบให้เลือก Shaky</div></li><li>Choose one dialogue and play your role. Practise the reply after the customer pushes back.<div class="th" lang="th">ฝึกหนึ่งบทสนทนา โดยลองตอบเมื่อลูกค้าไม่เห็นด้วยหรือถามซ้ำ</div></li></ol><p class="intro-note">Thai translations use ค่ะ / คะ where appropriate for a female speaker. Use ครับ to suit your voice. The Japanese sentences are usable regardless of gender. Standard polite Japanese is used for Osaka customer service.</p><div class="backup"><h2>Keep your progress</h2><p class="sub">The lessons run offline. Browser auto-save is a convenience, not a guarantee. For a local file, including iPhone Safari, a successful write today cannot prove the marks will survive closing, moving the file, or browser cleanup.</p>${thai('บทเรียนใช้แบบออฟไลน์ได้ แต่ข้อมูลที่เบราว์เซอร์บันทึกอาจสูญหาย แม้ตอนนี้จะบันทึกสำเร็จ โดยเฉพาะเมื่อเปิดไฟล์โดยตรง ควรเก็บไฟล์พร้อมความคืบหน้าไว้ด้วย')}${portablePrompt()}<p class="intro-note">An HTML copy contains the entire app and your marks at the moment you click save. It does not rewrite the file you opened. Finish saving the download; if file download is unavailable, copy a JSON backup below. Resetting marks in an open copy does not change older saved copies.</p><div class="backup-actions"><button class="btn" data-action="export">${svg('download')}Download backup</button><button class="btn" data-action="backup-text">Backup as text</button></div><details><summary>Restore a backup · นำข้อมูลกลับมาใช้</summary><p class="small muted">Restore merges saved marks. The more recent mark wins for each card.</p><input type="file" id="importFile" accept=".json,application/json" aria-label="Choose a Counter Notes progress backup"><label class="field" style="margin-top:15px" for="restoreText">Or paste backup text</label><textarea id="restoreText" placeholder="Paste a Counter Notes backup here"></textarea><button class="btn" data-action="restore-text">Restore pasted backup</button></details><div id="backupTextArea" hidden><label class="field" for="backupText" style="margin-top:15px">Select and copy this backup to a safe place</label><textarea id="backupText" readonly></textarea></div><p class="intro-note">On iPhone, a Files preview is not proof that the app can run: some viewers do not execute JavaScript, and Safari may not open an arbitrary local HTML file as an interactive page. Use a local HTML viewer that executes scripts. Verify by tapping a card and reopening a saved progress copy. This build has not been tested on a physical iPhone; a successful desktop/mobile-width test does not verify iOS Safari.</p><div class="resetbox"><button class="btn text" data-action="ask-reset">Reset all marks</button><div class="confirm" id="resetConfirm" hidden><p>Clear all ${totals.known+totals.shaky} marked cards in this browser?<br><span lang="th" class="th">ล้างความคืบหน้าทั้งหมดในเบราว์เซอร์นี้หรือไม่</span></p><button class="btn" data-action="cancel-reset">Keep my marks</button> <button class="btn" data-action="reset">Yes, clear all marks</button></div></div></div><p class="footer-note">Counter Notes · personal study companion<br>Japanese · English · Thai · no network requests · no audio</p></div>`;}
function exportObject(){return {...progressEnvelope(),exportedAt:new Date().toISOString()};}
function restore(raw){try{if(raw.length>2000000)throw Error('This backup is too large.');const imported=validateBackup(JSON.parse(raw));let n=0;for(const [id,m]of Object.entries(imported)){if(!marks[id]||m.at>=marks[id].at){marks[id]=m;n++;}}loadProblem=false;if(n)changed();save();render();notify(`Restored ${n} marks · นำข้อมูลกลับมาแล้ว`);}catch(e){notify('Could not restore: '+e.message);}}
document.querySelector('.skip').addEventListener('click',e=>{if(view==='work'){e.preventDefault();activeSurface().focus();}});
document.getElementById('storageHelp').addEventListener('click',()=>{guideTab='progress';go('guide');document.querySelector('.backup')?.scrollIntoView({block:'start'});});
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-nav]');if(b)go(b.dataset.nav);});
document.getElementById('main').addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;document.querySelector('[data-action="clear-search"]').hidden=!query;renderList();}});
document.getElementById('main').addEventListener('change',async e=>{
 const t=e.target;
 if(t.id==='category'){category=t.value;renderList();}
 if(t.id==='speaker'){speaker=t.value;renderList();}
 if(t.id==='essentials'){essentials=t.checked;renderList();}
 if(t.id==='recallScope'||t.id==='recallCategory'){if(t.id==='recallScope')recallScope=t.value;else recallCategory=t.value;render();document.getElementById(t.id)?.focus({preventScroll:true});}
 if(t.id==='scenarioSelect'){scenarioId=t.value;openTurns.clear();showAll=false;render();document.getElementById('scenarioSelect')?.focus({preventScroll:true});}
 if(t.id==='importFile'&&t.files[0]){if(t.files[0].size>2000000){notify('That file is too large for a progress backup.');return;}try{restore(await t.files[0].text());}catch(err){notify('This file could not be read. Try pasting backup text.');}}
});
document.getElementById('main').addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.reveal){const id=b.dataset.reveal;openCards.has(id)?openCards.delete(id):openCards.add(id);const opened=openCards.has(id);document.getElementById('card-'+id).classList.toggle('readings',opened);document.getElementById('translation-'+id).hidden=!opened;b.setAttribute('aria-expanded',opened);b.querySelector('.tapcue').innerHTML=svg('eye')+(opened?'Hide reading & meaning':'Tap for reading & meaning · แตะเพื่อดู');return;}
 if(b.dataset.grade){const id=b.dataset.id,value=b.dataset.grade;if(b.dataset.recall){if(!session||!session.revealed||session.ids[session.index]!==id)return;setMark(id,value,true);session.results.push({id,status:value});session.index++;session.revealed=false;render();window.scrollTo({top:0,behavior:'instant'});document.getElementById('main').focus({preventScroll:true});}else{const before=view==='practice'?filteredPhrases():[];const oldIndex=before.findIndex(p=>p.id===id);setMark(id,value);const card=document.getElementById('card-'+id),st=status(id),p=byId.get(id);card.querySelector('.status-word').className='status-word '+st;card.querySelector('.status-word').textContent=st==='new'?(p.essential?'DAY ONE':'UNMARKED'):st.toUpperCase();card.querySelectorAll('[data-grade]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.grade===st));if(view==='practice'){document.getElementById('practiceStats').innerHTML=statsHTML();if(filter!=='all'){renderList();const after=filteredPhrases();const target=after[Math.min(oldIndex,after.length-1)];if(target)document.querySelector(`[data-reveal="${target.id}"]`)?.focus({preventScroll:true});else document.getElementById('resultCount').focus({preventScroll:true});}}}return;}
 if(b.dataset.filter){filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>{x.classList.toggle('active',x.dataset.filter===filter);x.setAttribute('aria-pressed',x.dataset.filter===filter);});renderList();return;}
 if(b.dataset.guide){guideTab=b.dataset.guide;render();document.querySelector(`[data-guide="${guideTab}"]`).focus({preventScroll:true});return;}
 if(b.dataset.dialogueMode){roleplay=b.dataset.dialogueMode==='role';showAll=false;openTurns.clear();render();document.querySelector(`[data-dialogue-mode="${b.dataset.dialogueMode}"]`).focus({preventScroll:true});return;}
 if(b.dataset.turn!==undefined){const i=Number(b.dataset.turn);if(showAll){showAll=false;const sc=DATA.scenarios.find(s=>s.id===scenarioId);openTurns=new Set(sc.turns.map((_,x)=>x));}openTurns.has(i)?openTurns.delete(i):openTurns.add(i);const t=DATA.scenarios.find(s=>s.id===scenarioId).turns[i],el=b.closest('.turn');el.outerHTML=turnHTML(t,i);document.querySelector(`[data-turn="${i}"]`)?.focus({preventScroll:true});const allButton=document.querySelector('[data-action="all-translations"]');if(allButton)allButton.textContent=roleplay?'Reveal models & meanings':'Reveal all meanings';return;}
 if(b.dataset.keigo!==undefined){const i=b.dataset.keigo,box=document.getElementById('keigo-'+i),meaning=document.getElementById('keigo-meaning-'+i);meaning.hidden=!meaning.hidden;box.classList.toggle('readings',!meaning.hidden);b.setAttribute('aria-expanded',!meaning.hidden);return;}
 if(b.dataset.fact!==undefined){const on=!b.classList.contains('readings');b.classList.toggle('readings',on);b.setAttribute('aria-expanded',on);b.querySelector('.tapcue').textContent=on?'Hide furigana · ซ่อนคำอ่าน':'Tap for furigana · แตะเพื่อดูคำอ่าน';return;}
 const action=b.dataset.action;
 if(action==='quick-recall')startSession(true);
 if(action==='start-recall')startSession();
 if(action==='setup-recall'){session=null;render();window.scrollTo({top:0,behavior:'instant'});}
 if(action==='reveal-recall'){session.revealed=true;render();document.querySelector('[data-recall]')?.focus({preventScroll:true});}
 if(action==='retry-shaky'){const ids=session.results.filter(r=>r.status==='shaky').map(r=>r.id);session={ids,index:0,revealed:false,results:[]};render();window.scrollTo({top:0,behavior:'instant'});}
 if(action==='clear-search'){query='';document.getElementById('search').value='';b.hidden=true;renderList();document.getElementById('search').focus();}
 if(action==='clear-filters'){query='';category='all';speaker='all';filter='all';essentials=false;render();}
 if(action==='all-translations'){showAll=!showAll;openTurns.clear();render();document.querySelector('[data-action="all-translations"]')?.focus({preventScroll:true});}
 if(action==='save-portable')savePortableCopy();
 if(action==='export'){const blob=new Blob([JSON.stringify(exportObject(),null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='counter-notes-progress-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);notify('Backup prepared. If needed, use Backup as text.');}
 if(action==='backup-text'){document.getElementById('backupTextArea').hidden=false;const t=document.getElementById('backupText');t.value=JSON.stringify(exportObject());t.focus();t.select();}
 if(action==='restore-text')restore(document.getElementById('restoreText').value);
 if(action==='ask-reset')document.getElementById('resetConfirm').hidden=false;
 if(action==='cancel-reset')document.getElementById('resetConfirm').hidden=true;
 if(action==='reset'){marks={};loadProblem=false;changed();save();session=null;render();notify('All marks cleared · ล้างความคืบหน้าแล้ว');}
});
render();
</script>
</body>
