็ตมือถือได้ไหมนะคะ","gate":"A completed number transfer does not prove that every app, account or data transfer is finished. Check the agreed setup scope and do not label incomplete tasks as complete.","gateTh":"การย้ายเบอร์สำเร็จไม่ได้แปลว่าแอป บัญชี และข้อมูลทั้งหมดพร้อมแล้ว ตรวจขอบเขตการตั้งค่าที่ตกลงกัน และอย่าบอกว่างานที่ยังเหลือเสร็จแล้วค่ะ","id":"mnp-08","learning":{"mode":"active","audience":"customer","function":"Check result"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["public-mnp-1"],"scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below."},"facts":[]}}],"sources":[{"label":"Docomo: incoming MNP procedures","url":"https://www.docomo.ne.jp/support/mnp_subscribe/","checked":"2026-09-10"}],"sourceIds":["public-mnp-1"],"outcome":"Confirm a number transfer and what remains to do.","outcomeTh":"ยืนยันการย้ายเบอร์และงานที่ยังเหลือ","doneWhen":"Verify the switch and agreed call/data checks. Explain remaining setup. The price comparison is practised in the plan map; this route alone does not teach a full sales explanation.","doneWhenTh":"ตรวจผลการย้ายและการโทร/เน็ตที่ตกลงไว้ แล้วแจ้งงานตั้งค่าที่ยังเหลือ ฝึกเปรียบเทียบราคาในบทแพ็กเกจ บทนี้ยังไม่ครอบคลุมการอธิบายขายทั้งหมด","provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["public-mnp-1"],"scope":"Original communicative stage order based on the cited context. Neither completeness nor exact internal order is established."},"facts":[]},"followupIds":["p089","p090","p093","p106"]},{"id":"plan","title":"料金プラン変更","reading":"りょうきんぷらんへんこう","en":"Change a plan","th":"เปลี่ยนแพ็กเกจ","intro":"Same line, a different plan. Follow the action you can see, then say one short sentence.","introTh":"ใช้เบอร์เดิม เปลี่ยนแพ็กเกจ ดูว่ากำลังทำขั้นตอนไหน แล้วพูดประโยคสั้น ๆ ของขั้นตอนนั้นค่ะ","scope":"An original speaking map for reviewing an existing docomo line. Public guidance helps identify change options; it does not show your employee system. Your trainer must confirm the actual checks, available plans, conditions and effective date.","scopeTh":"แผนผังฝึกพูดสำหรับทบทวนแพ็กเกจของเบอร์ docomo เดิม คู่มือสาธารณะช่วยดูทางเลือกในการเปลี่ยน แต่ไม่ได้แสดงระบบพนักงาน ให้พี่เลี้ยงยืนยันรายการตรวจสอบ แพ็กเกจที่เปลี่ยนได้ เงื่อนไข และวันที่มีผลจริงค่ะ","steps":[{"title":"Confirm the request","enAction":"Confirm that the customer wants to change the plan on their existing line.","thAction":"ยืนยันว่าลูกค้าต้องการเปลี่ยนแพ็กเกจของเบอร์ที่ใช้อยู่ค่ะ","jp":"{料金|りょうきん}プランの{変更|へんこう}ですね。","en":"You'd like to change your plan, right?","th":"ต้องการเปลี่ยนแพ็กเกจใช่ไหมคะ","id":"plan-01","learning":{"mode":"active","audience":"customer","function":"Confirm need"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["public-plan-1","public-plan-2"],"scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below."},"facts":[]}},{"title":"Check the account holder","enAction":"Establish who holds the contract, then follow your shop's identity and authority checks before accessing the account.","thAction":"ถามว่าใครเป็นเจ้าของสัญญา แล้วตรวจสอบตัวตนและสิทธิ์ในการดำเนินการตามขั้นตอนร้าน ก่อนเปิดข้อมูลบัญชีค่ะ","jp":"ご{契約者|けいやくしゃ}ご{本人|ほんにん}ですか。{本人確認書類|ほんにんかくにんしょるい}をお{願|ねが}いします。","en":"Are you the contract holder? Your identification document, please.","th":"เป็นเจ้าของสัญญาเองใช่ไหมคะ ขอเอกสารยืนยันตัวตนด้วยค่ะ","gate":"Ask your trainer which checks and documents this procedure requires, especially for a family member or representative.","gateTh":"ถามพี่เลี้ยงว่างานนี้ต้องตรวจอะไรและใช้เอกสารใด โดยเฉพาะกรณีครอบครัวหรือตัวแทนมาดำเนินการค่ะ","id":"plan-02","learning":{"mode":"active","audience":"customer","function":"Check applicant"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["public-plan-1","public-plan-2"],"scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below."},"facts":[]}},{"title":"Ask about usage","enAction":"Ask about videos, calls and the customer's main reason for changing. After the approved account checks, review actual usage together.","thAction":"ถามเรื่องดูวิดีโอ โทร และเหตุผลหลักที่อยากเปลี่ยน หลังตรวจสอบบัญชีตามขั้นตอนแล้ว ให้ดูยอดใช้งานจริงด้วยกันค่ะ","jp":"{普段|ふだん}、{動画|どうが}はよく{見|み}ますか。{電話|でんわ}はよくかけますか。","en":"Do you often watch videos? Do you make many calls?","th":"ปกติดูวิดีโอบ่อยไหมคะ โทรออกบ่อยไหมคะ","hear":{"jp":"どのくらい{使|つか}っているか、よく{分|わ}からないです。","en":"I'm not really sure how much I use.","th":"ไม่ค่อยรู้ว่าใช้ไปเท่าไร","id":"plan-03-hear","learning":{"mode":"recognize","audience":"learner","function":"Hear the reaction: Ask about usage","trigger":"Ask about videos, calls and the customer's main reason for changing. After the approved account checks, review actual usage together.","triggerTh":"ถามเรื่องดูวิดีโอ โทร และเหตุผลหลักที่อยากเปลี่ยน หลังตรวจสอบบัญชีตามขั้นตอนแล้ว ให้ดูยอดใช้งานจริงด้วยกันค่ะ"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[]}},"reply":{"jp":"{実際|じっさい}の{利用状況|りようじょうきょう}を、{一緒|いっしょ}に{確認|かくにん}しましょう。","en":"Let's check your actual usage together.","th":"มาดูยอดใช้งานจริงด้วยกันนะคะ","id":"plan-03-reply","learning":{"mode":"active","audience":"customer","function":"Answer the reaction: Ask about usage","trigger":"Ask about videos, calls and the customer's main reason for changing. After the approved account checks, review actual usage together.","triggerTh":"ถามเรื่องดูวิดีโอ โทร และเหตุผลหลักที่อยากเปลี่ยน หลังตรวจสอบบัญชีตามขั้นตอนแล้ว ให้ดูยอดใช้งานจริงด้วยกันค่ะ"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[]}},"id":"plan-03","learning":{"mode":"active","audience":"customer","function":"Ask usage"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["public-plan-1","public-plan-2"],"scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below."},"facts":[]}},{"title":"Compare suitable plans","enAction":"Show suitable options that are actually available for this line. Use the verified comparison on the screen or estimate.","thAction":"แสดงทางเลือกที่เหมาะและสมัครได้จริงสำหรับเบอร์นี้ ใช้ข้อมูลเปรียบเทียบบนหน้าจอหรือใบประมาณราคาที่ตรวจแล้วค่ะ","jp":"こちらのプランと、{今|いま}のプランを{比|くら}べてみましょう。","en":"Let's compare this plan with your current one.","th":"มาเปรียบเทียบแพ็กเกจนี้กับแพ็กเกจที่ใช้อยู่กันนะคะ","hear":{"jp":"とにかく{安|やす}くしたいです。","en":"I just want it to be cheaper.","th":"อยากให้ถูกลงอย่างเดียวเลย","id":"plan-04-hear","learning":{"mode":"recognize","audience":"learner","function":"Hear the reaction: Compare suitable plans","trigger":"Show suitable options that are actually available for this line. Use the verified comparison on the screen or estimate.","triggerTh":"แสดงทางเลือกที่เหมาะและสมัครได้จริงสำหรับเบอร์นี้ ใช้ข้อมูลเปรียบเทียบบนหน้าจอหรือใบประมาณราคาที่ตรวจแล้วค่ะ"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[]}},"reply":{"jp":"{料金|りょうきん}を{抑|おさ}えたいんですね。{使|つか}えるデータ{量|りょう}も{確認|かくにん}しましょう。","en":"You'd like to keep the cost down. Let's also check the data allowance.","th":"อยากลดค่าใช้จ่ายใช่ไหมคะ มาดูปริมาณเน็ตที่ใช้ได้ด้วยนะคะ","id":"plan-04-reply","learning":{"mode":"active","audience":"customer","function":"Answer the reaction: Compare suitable plans","trigger":"Show suitable options that are actually available for this line. Use the verified comparison on the screen or estimate.","triggerTh":"แสดงทางเลือกที่เหมาะและสมัครได้จริงสำหรับเบอร์นี้ ใช้ข้อมูลเปรียบเทียบบนหน้าจอหรือใบประมาณราคาที่ตรวจแล้วค่ะ"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[]}},"id":"plan-04","learning":{"mode":"active","audience":"customer","function":"Compare"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["public-plan-1","public-plan-2"],"scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below."},"facts":[]}},{"title":"Show costs and conditions","enAction":"Point to the checked estimate. Explain monthly charges, discount conditions, optional services and any additional charges separately.","thAction":"ชี้ใบประมาณราคาที่ตรวจแล้ว แยกอธิบายค่าบริการรายเดือน เงื่อนไขส่วนลด บริการเสริม และค่าใช้จ่ายเพิ่มเติมค่ะ","jp":"{毎月|まいつき}の{料金|りょうきん}はこちらです。{割引|わりびき}の{条件|じょうけん}もご{説明|せつめい}します。","en":"Here are the monthly charges. I'll explain the discount conditions too.","th":"ค่าบริการรายเดือนตามนี้ค่ะ จะอธิบายเงื่อนไขส่วนลดด้วยนะคะ","hear":{"jp":"ずっとこの{金額|きんがく}ですか。","en":"Will it always be this amount?","th":"จะเป็นยอดนี้ตลอดเลยไหม","id":"plan-05-hear","learning":{"mode":"recognize","audience":"learner","function":"Hear the reaction: Show costs and conditions","trigger":"Point to the checked estimate. Explain monthly charges, discount conditions, optional services and any additional charges separately.","triggerTh":"ชี้ใบประมาณราคาที่ตรวจแล้ว แยกอธิบายค่าบริการรายเดือน เงื่อนไขส่วนลด บริการเสริม และค่าใช้จ่ายเพิ่มเติมค่ะ"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[]}},"reply":{"jp":"{金額|きんがく}が{変|か}わる{条件|じょうけん}がないか、{確認|かくにん}します。","en":"I'll check whether any conditions could change the amount.","th":"จะตรวจว่ามีเงื่อนไขอะไรทำให้ยอดเปลี่ยนไหมนะคะ","id":"plan-05-reply","learning":{"mode":"active","audience":"customer","function":"Answer the reaction: Show costs and conditions","trigger":"Point to the checked estimate. Explain monthly charges, discount conditions, optional services and any additional charges separately.","triggerTh":"ชี้ใบประมาณราคาที่ตรวจแล้ว แยกอธิบายค่าบริการรายเดือน เงื่อนไขส่วนลด บริการเสริม และค่าใช้จ่ายเพิ่มเติมค่ะ"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[]}},"id":"plan-05","learning":{"mode":"active","audience":"customer","function":"Explain costs"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["public-plan-1","public-plan-2"],"scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below."},"facts":[]}},{"title":"Check when it changes","enAction":"Check the real effective date, this month's charges and any services or discounts affected by changing. Show the confirmed details.","thAction":"ตรวจวันที่มีผลจริง ค่าบริการเดือนนี้ และบริการหรือส่วนลดที่ได้รับผลจากการเปลี่ยน แล้วแสดงรายละเอียดที่ยืนยันแล้วค่ะ","jp":"{変更|へんこう}になる{日|ひ}と、{今月|こんげつ}の{料金|りょうきん}を{確認|かくにん}しましょう。","en":"Let's check the date the change takes effect and this month's charges.","th":"มาดูวันที่เริ่มเปลี่ยนแพ็กเกจและค่าบริการเดือนนี้กันนะคะ","gate":"The effective date and related changes depend on the actual plan transition. Have your trainer verify them; do not automatically promise today or next month.","gateTh":"วันที่มีผลและรายการที่เปลี่ยนตามขึ้นอยู่กับแพ็กเกจเดิมและใหม่ ให้พี่เลี้ยงตรวจ อย่ารับปากเองว่าจะเปลี่ยนวันนี้หรือเดือนหน้าค่ะ","id":"plan-06","learning":{"mode":"active","audience":"customer","function":"Check start date"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["public-plan-1","public-plan-2"],"scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below."},"facts":[]}},{"title":"Get agreement","enAction":"Complete the required explanations and resolve questions, then confirm the exact plan and choices before submitting the change.","thAction":"อธิบายรายการที่จำเป็นให้ครบและตอบข้อสงสัย แล้วถามยืนยันแพ็กเกจกับตัวเลือกที่ตกลงก่อนส่งคำขอเปลี่ยนค่ะ","jp":"この{内容|ないよう}で{変更|へんこう}してもよろしいですか。","en":"May I make the change with these details?","th":"ดำเนินการเปลี่ยนตามรายละเอียดนี้ได้ไหมคะ","gate":"Use your store's actual explanation and consent process. This short line is a speaking cue, not a replacement for it.","gateTh":"ใช้ขั้นตอนอธิบายและขอความยินยอมของร้านจริง ประโยคนี้เป็นตัวช่วยพูด ไม่ได้แทนขั้นตอนเหล่านั้นค่ะ","id":"plan-07","learning":{"mode":"active","audience":"customer","function":"Ask permission"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["public-plan-1","public-plan-2"],"scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below."},"facts":[]}},{"title":"Explain the wait","enAction":"While carrying out the approved system steps, tell the customer that the change is being processed.","thAction":"ระหว่างดำเนินการในระบบตามขั้นตอนที่ได้รับการสอน แจ้งลูกค้าว่ากำลังทำเรื่องค่ะ","jp":"ただいま{手続|てつづ}き{中|ちゅう}です。{少々|しょうしょう}お{待|ま}ちください。","en":"I'm processing it now. Please wait a moment.","th":"กำลังดำเนินการค่ะ รอสักครู่นะคะ","id":"plan-08","learning":{"mode":"active","audience":"customer","function":"Wait"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["public-plan-1","public-plan-2"],"scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below."},"facts":[]}},{"title":"Review the result","enAction":"Check the actual result and final document with the customer. Point out the chosen plan, effective date and any remaining action; distinguish a future change reservation from a change already in effect.","thAction":"ตรวจผลจริงและเอกสารสรุปกับลูกค้า ชี้แพ็กเกจที่เลือก วันที่มีผล และสิ่งที่ต้องทำต่อ แยกให้ชัดว่าเป็นการตั้งเปลี่ยนล่วงหน้าหรือเปลี่ยนแล้วค่ะ","jp":"{最後|さいご}に、{変更内容|へんこうないよう}と{開始日|かいしび}をご{確認|かくにん}ください。","en":"Finally, please check the change details and start date.","th":"สุดท้าย รบกวนตรวจรายละเอียดการเปลี่ยนและวันที่เริ่มใช้ด้วยค่ะ","id":"plan-09","learning":{"mode":"active","audience":"customer","function":"Review result"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["public-plan-1","public-plan-2"],"scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below."},"facts":[]}}],"sources":[{"label":"Docomo: plan-change procedure guide","url":"https://www.docomo.ne.jp/mydocomo/procedures/support/assist/changeplan/","checked":"2026-09-10"},{"label":"Docomo: plan review and procedure options","url":"https://www.docomo.ne.jp/mydocomo/procedures/support/assist/","checked":"2026-09-10"}],"sourceIds":["public-plan-1","public-plan-2"],"outcome":"Reach an agreed plan change with a clear start date.","outcomeTh":"ฝึกจนถึงตกลงเปลี่ยนแพ็กเกจและทราบวันที่มีผล","doneWhen":"The customer can identify the chosen plan, checked costs and start date. Distinguish a scheduled change from an active one. Asking permission alone is not a completed change.","doneWhenTh":"ลูกค้ารู้ว่าเลือกแพ็กเกจใด ยอดที่ตรวจแล้วเท่าไร และเริ่มวันไหน แยกการตั้งเปลี่ยนล่วงหน้าจากเปลี่ยนแล้ว การขออนุญาตอย่างเดียวยังไม่ถือว่าดำเนินการเสร็จ","provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["public-plan-1","public-plan-2"],"scope":"Original communicative stage order based on the cited context. Neither completeness nor exact internal order is established."},"facts":[]},"followupIds":["p089","p090","p091","p093","p094","p095"]},{"id":"signup","title":"新規契約","reading":"しんきけいやく","en":"Start a new line","th":"เปิดเบอร์ใหม่","intro":"First ask whether the customer wants a new number. Keeping a number from another carrier belongs to the MNP branch.","introTh":"ถามก่อนว่าลูกค้าต้องการเบอร์ใหม่หรือไม่ ถ้าจะใช้เบอร์เดิมจากเครือข่ายอื่น ให้ไปขั้นตอนย้ายค่าย MNP ค่ะ","scope":"An original speaking map based on docomo's public new-contract guidance. Device purchase and SIM-only cases differ. Your trainer must demonstrate the actual identity, application, consent, payment and activation steps for the case.","scopeTh":"แผนผังฝึกพูดที่อ้างอิงคู่มือสมัครใหม่ของ docomo กรณีซื้อเครื่องกับสมัครเฉพาะซิมต่างกัน ให้พี่เลี้ยงสาธิตขั้นตอนยืนยันตัวตน สมัคร ขอความยินยอม ชำระเงิน และเปิดใช้งานตามกรณีจริงค่ะ","steps":[{"title":"Ask new number or MNP","enAction":"Ask about the number before choosing the procedure. Continue here for a new number; use MNP for a number transferred from another carrier.","thAction":"ถามเรื่องเบอร์ก่อนเลือกงาน ถ้าต้องการเบอร์ใหม่ให้ต่อบทนี้ ถ้าโอนเบอร์เดิมจากเครือข่ายอื่นให้ใช้ขั้นตอน MNP ค่ะ","jp":"{新|あたら}しい{電話番号|でんわばんごう}でのご{契約|けいやく}ですか。","en":"Would you like to sign up with a new phone number?","th":"ต้องการเปิดสัญญาด้วยเบอร์ใหม่ใช่ไหมคะ","hear":{"jp":"{今|いま}の{番号|ばんごう}をそのまま{使|つか}いたいです。","en":"I want to keep my current number.","th":"อยากใช้เบอร์เดิมต่อ","id":"signup-01-hear","learning":{"mode":"recognize","audience":"learner","function":"Hear the reaction: Ask new number or MNP","trigger":"Ask about the number before choosing the procedure. Continue here for a new number; use MNP for a number transferred from another carrier.","triggerTh":"ถามเรื่องเบอร์ก่อนเลือกงาน ถ้าต้องการเบอร์ใหม่ให้ต่อบทนี้ ถ้าโอนเบอร์เดิมจากเครือข่ายอื่นให้ใช้ขั้นตอน MNP ค่ะ"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[]}},"reply":{"jp":"{今|いま}はどちらの{携帯会社|けいたいがいしゃ}をお{使|つか}いですか。","en":"Which mobile provider are you using now?","th":"ตอนนี้ใช้เครือข่ายไหนอยู่คะ","id":"signup-01-reply","learning":{"mode":"active","audience":"customer","function":"Answer the reaction: Ask new number or MNP","trigger":"Ask about the number before choosing the procedure. Continue here for a new number; use MNP for a number transferred from another carrier.","triggerTh":"ถามเรื่องเบอร์ก่อนเลือกงาน ถ้าต้องการเบอร์ใหม่ให้ต่อบทนี้ ถ้าโอนเบอร์เดิมจากเครือข่ายอื่นให้ใช้ขั้นตอน MNP ค่ะ"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[]}},"id":"signup-01","learning":{"mode":"active","audience":"customer","function":"Clarify number request"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["public-signup-1","public-signup-2"],"scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below."},"facts":[]}},{"title":"Identify holder and user","enAction":"Check who will hold the contract and who will use the line. A child's or family member's line may require a different set of checks.","thAction":"ถามว่าใครจะเป็นเจ้าของสัญญาและใครจะใช้เบอร์ กรณีให้เด็กหรือคนในครอบครัวใช้อาจต้องตรวจต่างกันค่ะ","jp":"ご{契約者|けいやくしゃ}と、{実際|じっさい}に{使|つか}う{方|かた}は{同|おな}じですか。","en":"Will the contract holder and the person using the phone be the same person?","th":"เจ้าของสัญญากับคนที่ใช้จริงเป็นคนเดียวกันไหมคะ","gate":"Have your trainer check the correct route and required documents for age, user, representative and residence-status cases. Do not treat one adult's documents as sufficient for every application.","gateTh":"ให้พี่เลี้ยงตรวจขั้นตอนและเอกสารตาม ":"Answer the reaction: Explain the estimate","trigger":"Use the checked estimate. Separate any phone price, monthly charges and one-time charges; show discount and optional-service conditions.","triggerTh":"ใช้ใบประมาณราคาที่ตรวจแล้ว แยกราคาเครื่องถ้ามี ค่าบริการรายเดือน และค่าใช้จ่ายครั้งเดียว พร้อมอธิบายเงื่อนไขส่วนลดกับบริการเสริมค่ะ"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[]}},"id":"signup-06","learning":{"mode":"active","audience":"customer","function":"Explain costs"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["public-signup-1","public-signup-2"],"scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below."},"facts":[]}},{"title":"Explain and get agreement","enAction":"Finish the required explanation and confirm the actual chosen details. Invite questions before obtaining the required consent and submitting the application.","thAction":"อธิบายรายการจำเป็นให้ครบและยืนยันรายละเอียดที่เลือก เปิดโอกาสให้ถามก่อนขอความยินยอมตามขั้นตอนและส่งคำขอค่ะ","jp":"{内容|ないよう}をご{確認|かくにん}ください。こちらで{進|すす}めてもよろしいですか。","en":"Please check the details. May we proceed with these?","th":"กรุณาตรวจสอบรายละเอียด ขอเริ่มดำเนินการตามนี้ได้ไหมคะ","gate":"Your trainer must check required explanations, consent, any instalment application, and the actual system procedure. Agreement does not mean the application has been approved.","gateTh":"ให้พี่เลี้ยงตรวจการอธิบายที่จำเป็น ความยินยอม การสมัครผ่อนถ้ามี และขั้นตอนระบบจริง การตกลงของลูกค้าไม่ได้แปลว่าคำขอผ่านแล้วค่ะ","id":"signup-07","learning":{"mode":"active","audience":"customer","function":"Ask permission"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["public-signup-1","public-signup-2"],"scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below."},"facts":[]}},{"title":"Process and explain the wait","enAction":"Follow the demonstrated application steps. When the application is ready, carry out the appropriate SIM and activation steps with your trainer.","thAction":"ทำตามขั้นตอนสมัครที่พี่เลี้ยงสาธิต เมื่อคำขอพร้อมแล้ว ให้ทำขั้นตอนซิมและเปิดใช้งานที่ตรงกับกรณีร่วมกับพี่เลี้ยงค่ะ","jp":"ただいま{手続|てつづ}き{中|ちゅう}です。{少々|しょうしょう}お{待|ま}ちください。","en":"I'm processing it now. Please wait a moment.","th":"กำลังดำเนินการค่ะ รอสักครู่นะคะ","id":"signup-08","learning":{"mode":"active","audience":"customer","function":"Wait"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["public-signup-1","public-signup-2"],"scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below."},"facts":[]}},{"title":"Check use and hand over","enAction":"Once service is ready, follow the approved call and data checks together. Review the final documents and explain any remaining setup or action before handing over.","thAction":"เมื่อบริการพร้อมแล้ว ให้ตรวจโทรและเน็ตด้วยกันตามขั้นตอน ตรวจเอกสารสรุปและอธิบายการตั้งค่าหรืองานที่ยังเหลือก่อนส่งมอบค่ะ","jp":"{電話|でんわ}とネットが{使|つか}えるか、{一緒|いっしょ}に{確認|かくにん}しましょう。","en":"Let's check together that calls and internet work.","th":"มาลองด้วยกันว่าโทรและใช้เน็ตได้ไหมนะคะ","gate":"Confirm the real completion status and agreed setup scope. A working line does not mean every app or data-transfer task is finished.","gateTh":"ตรวจสถานะเสร็จจริงและขอบเขตการตั้งค่าที่ตกลงไว้ เบอร์ใช้งานได้ไม่ได้แปลว่าแอปและการย้ายข้อมูลเสร็จทั้งหมดค่ะ","id":"signup-09","learning":{"mode":"active","audience":"customer","function":"Check result"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["public-signup-1","public-signup-2"],"scope":"Communicative step eded, pause recycling and arrange transfer support.","triggerTh":"ถามว่ามีข้อมูลใดอยากเก็บไว้ก่อนคุยเรื่องลบข้อมูล หากยังต้องการข้อมูล ให้พักงานรีไซเคิลแล้วจัดการเรื่องย้ายข้อมูลก่อนค่ะ"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[]}},"id":"recycle-04","learning":{"mode":"active","audience":"customer","function":"Check data to retain"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["public-recycle-1","public-recycle-2"],"scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below."},"facts":[]}},{"title":"Confirm erasure is finished","enAction":"Ask whether the customer has erased the device data. Resolve anything still needed before erasure, including relevant wallet services.","thAction":"ถามว่าลูกค้าลบข้อมูลในเครื่องแล้วหรือยัง ก่อนลบต้องจัดการข้อมูลที่ยังต้องใช้ รวมถึงบริการกระเป๋าเงินในมือถือที่เกี่ยวข้องค่ะ","jp":"{携帯電話|けいたいでんわ}のデータは、もう{消|け}してありますか。","en":"Have you already erased the phone's data?","th":"ลบข้อมูลในโทรศัพท์แล้วหรือยังคะ","gate":"Docomo asks customers to erase their own data. If it is not erased, the phone will not start, or the customer is unsure, stop here and ask your trainer how to handle the case. This question is not permission to erase it yourself.","gateTh":"docomo ขอให้ลูกค้าลบข้อมูลด้วยตนเอง หากยังไม่ลบ เปิดเครื่องไม่ได้ หรือไม่แน่ใจ ให้หยุดตรงนี้แล้วถามพี่เลี้ยงว่าควรทำอย่างไร คำถามนี้ไม่ใช่การขออนุญาตให้คุณลบข้อมูลเองค่ะ","id":"recycle-05","learning":{"mode":"active","audience":"customer","function":"Check erasure"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["public-recycle-1","public-recycle-2"],"scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below."},"facts":[{"category":"A","sourceIds":["public-recycle-2"],"scope":"FAQ asks the customer to erase data before collection."}]}},{"title":"Check for cards left inside","enAction":"Check that removable SIM and memory cards are not left in the phone. Ask your trainer about the actual model.","thAction":"ตรวจว่าไม่มี SIM หรือการ์ดความจำแบบถอดได้ค้างในเครื่อง หากไม่แน่ใจรุ่นนี้ให้ถามพี่เลี้ยงค่ะ","jp":"{SIM|シム}カードや{SD|エスディー}カードが{残|のこ}っていないか、{確認|かくにん}をお{願|ねが}いします。","en":"Please check that no SIM card or SD card is left inside.","th":"รบกวนตรวจว่าไม่มี SIM หรือ SD card ค้างอยู่ในเครื่องนะคะ","id":"recycle-06","learning":{"mode":"active","audience":"customer","function":"Request a card check"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["public-recycle-1","public-recycle-2"],"scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below."},"facts":[{"category":"A","sourceIds":["public-recycle-1"],"scope":"Collection conditions require checking/removing SIM and memory cards."}]}},{"title":"Check the correct collection method","enAction":"Ask your trainer which handling method applies to this model and explain that method before proceeding.","thAction":"ถามพี่เลี้ยงว่ารุ่นนี้ต้องใช้วิธีใด และอธิบายวิธีนั้นก่อนดำเนินการค่ะ","jp":"この{機種|きしゅ}の{回収方法|かいしゅうほうほう}を{確認|かくにん}します。{少々|しょうしょう}お{待|ま}ちください。","en":"I'll check the collection method for this model. Please wait a moment.","th":"ขอตรวจสอบวิธีรับเครื่องรุ่นนี้ก่อนค่ะ กรุณารอสักครู่นะคะ","coach":{"jp":"この{機種|きしゅ}は{穴|あな}あけの{対象|たいしょう}ですか。{手順|てじゅん}を{教|おし}えてください。","en":"Is this model eligible for hole-punching? Please show me the procedure.","th":"รุ่นนี้อยู่ในกลุ่มที่เจาะทำลายได้ไหมคะ ช่วยสอนขั้นตอนให้หน่อยค่ะ","id":"recycle-07-coach","learning":{"mode":"active","audience":"coworker","function":"Ask a trainer","trigger":"Ask your trainer which handling method applies to this model and explain that method before proceeding.","triggerTh":"ถามพี่เลี้ยงว่ารุ่นนี้ต้องใช้วิธีใด และอธิบายวิธีนั้นก่อนดำเนินการค่ะ"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[]}},"gate":"Docomo does not punch devices with non-removable batteries. Only trained staff should use approved tools on eligible devices after the explanation and explicit agreement. Follow the shop's handling procedure.","gateTh":"docomo ไม่เจาะเครื่องที่ถอดแบตเตอรี่ไม่ได้ ให้ผู้ที่ผ่านการสอนใช้เครื่องมือที่กำหนดกับรุ่นที่ทำได้ หลังอธิบายและได้รับความยินยอมชัดเจนแล้ว ทำตามขั้นตอนของร้านค่ะ","id":"recycle-07","learning":{"mode":"active","audience":"customer","function":"Ask team / explain wait"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["public-recycle-1","public-recycle-2"],"scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below."},"facts":[{"category":"A","sourceIds":["public-recycle-1"],"scope":"Devices with built-in batteries are not punched. No equipment operation is taught."}]}},{"title":"Get explicit final agreement","enAction":"After all checks and explanations, clearly explain that collection cannot be undone and wait for a clear yes.","thAction":"หลังตรวจและอธิบายครบแล้ว แจ้งให้ชัดว่ารับเครื่องไปแล้วคืนไม่ได้ และรอคำตอบยินยอมที่ชัดเจนค่ะ","jp":"{回収後|かいしゅうご}は、{携帯電話|けいたいでんわ}もデータもお{返|かえ}しできません。{回収|かいしゅう}してもよろしいですか。","en":"After collection, we cannot return the phone or its data. May we collect it?","th":"หลังรับไปแล้ว เราไม่สามารถคืนเครื่องหรือข้อมูลได้นะคะ ยินยอมให้รับเครื่องไปรีไซเคิลไหมคะ","gate":"If the customer hesitates or still needs something from the device, pause here. Do not accept or destroy it until the outstanding issue and required consent are resolved.","gateTh":"หากลูกค้าลังเลหรือยังต้องการอะไรจากเครื่อง ให้พักไว้ก่อน อย่ารับหรือทำลายเครื่องจนกว่าจะจัดการเรื่องที่ค้างและได้รับความยินยอมครบค่ะ","id":"recycle-08","learning":{"mode":"active","audience":"customer","function":"Explain limit / ask permission"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["public-recycle-1","public-recycle-2"],"scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below."},"facts":[{"category":"A","sourceIds":["public-recycle-1"],"scope":"Collection conditions: the device and its data cannot be returned after collection."}]}},{"title":"Finish the collection","enAction":"Use this after the approved collection procedure is complete. Keep the wording about recycling, without claiming that mobile service was cancelled.","thAction":"ใช้เมื่อขั้นตอนรับเครื่องของร้านเสร็จแล้ว พูดให้ชัดว่าเสร็จเฉพาะการรับเครื่อง ไม่บอกว่ายกเลิกบริการมือถือแล้วค่ะ","jp":"こちらの{携帯電話|けいたいでんわ}は、リサイクルとしてお{引|ひ}き{取|と}りしました。ありがとうございます。","en":"We’ve accepted this phone for recycling. Thank you.","th":"รับโทรศัพท์เครื่องนี้ไปรีไซเคิลเรียบร้อยแล้วค่ะ ขอบคุณค่ะ","id":"recycle-09","learning":{"mode":"active","audience":"customer","function":"Close collection"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["public-recycle-1","public-recycle-2"],"scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below."},"facts":[]}}],"sources":[{"label":"Docomo: phone recycling and collection conditions","url":"https://www.docomo.ne.jp/corporate/csr/ecology/resources/recycle/","checked":"2026-09-10"},{"label":"Docomo: recycling FAQ and coverage/return checks","url":"https://www.docomo.ne.jp/corporate/csr/ecology/resources/collect_inquiry/","checked":"2026-09-10"}],"sourceIds":["public-recycle-1","public-recycle-2"],"outcome":"Confirm informed collection "mode":"active","audience":"customer","function":"Confirm need"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["public-setup-1","public-setup-2"],"scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below."},"facts":[]}},{"title":"Look at the old and new phones","enAction":"Check the devices involved so the trainer can choose a supported method.","thAction":"ตรวจเครื่องที่เกี่ยวข้อง เพื่อให้พี่เลี้ยงเลือกวิธีที่รองรับค่ะ","jp":"{今|いま}お{使|つか}いのスマホと、{新|あたら}しいスマホを{見|み}せていただけますか。","en":"Could you show me your current phone and your new phone?","th":"ขอดูมือถือที่ใช้อยู่กับเครื่องใหม่หน่อยได้ไหมคะ","id":"setup-02","learning":{"mode":"active","audience":"customer","function":"Ask to see devices"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["public-setup-1","public-setup-2"],"scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below."},"facts":[]}},{"title":"List the data they want to keep","enAction":"Ask about photos, contacts and important apps, and whether a backup exists. Check app transfers separately.","thAction":"ถามเรื่องรูป รายชื่อ และแอปสำคัญ รวมถึงสำรองข้อมูลไว้หรือไม่ ตรวจการย้ายข้อมูลของแต่ละแอปแยกกันค่ะ","jp":"{移|うつ}したいデータは{何|なん}ですか。バックアップはありますか。","en":"What data would you like to transfer? Do you have a backup?","th":"ต้องการย้ายข้อมูลอะไรบ้างคะ มีข้อมูลสำรองไว้ไหมคะ","hear":{"jp":"{写真|しゃしん}と{LINE|ライン}を{移|うつ}したいです。","en":"I'd like to transfer my photos and LINE.","th":"อยากย้ายรูปกับ LINE","id":"setup-03-hear","learning":{"mode":"recognize","audience":"learner","function":"Hear the reaction: List the data they want to keep","trigger":"Ask about photos, contacts and important apps, and whether a backup exists. Check app transfers separately.","triggerTh":"ถามเรื่องรูป รายชื่อ และแอปสำคัญ รวมถึงสำรองข้อมูลไว้หรือไม่ ตรวจการย้ายข้อมูลของแต่ละแอปแยกกันค่ะ"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[]}},"reply":{"jp":"{LINE|ライン}は、{引|ひ}き{継|つ}ぎ{方法|ほうほう}を{確認|かくにん}しますね。","en":"I'll check how to transfer LINE.","th":"ส่วน LINE ขอตรวจสอบวิธีย้ายบัญชีก่อนนะคะ","id":"setup-03-reply","learning":{"mode":"active","audience":"customer","function":"Answer the reaction: List the data they want to keep","trigger":"Ask about photos, contacts and important apps, and whether a backup exists. Check app transfers separately.","triggerTh":"ถามเรื่องรูป รายชื่อ และแอปสำคัญ รวมถึงสำรองข้อมูลไว้หรือไม่ ตรวจการย้ายข้อมูลของแต่ละแอปแยกกันค่ะ"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[]}},"gate":"Use the supported method for the actual devices and apps. Do not promise that every photo, chat, account or payment service will transfer.","gateTh":"ใช้วิธีที่รองรับเครื่องและแอปจริง อย่ารับปากว่ารูป แชต บัญชี หรือบริการชำระเงินทุกอย่างจะย้ายได้ค่ะ","id":"setup-03","learning":{"mode":"active","audience":"customer","function":"Ask about data"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["public-setup-1","public-setup-2"],"scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below."},"facts":[]}},{"title":"Explain scope and the checked price","enAction":"Confirm the available support and current fee, then show the customer exactly what is included.","thAction":"ตรวจขอบเขตบริการและค่าบริการปัจจุบัน แล้วอธิบายให้ชัดว่ารวมอะไรบ้างค่ะ","jp":"できることと{料金|りょうきん}を、{先|さき}にご{説明|せつめい}します。","en":"I'll explain what we can do and the cost first.","th":"ขออธิบายก่อนนะคะว่าช่วยทำอะไรได้บ้างและค่าบริกา dentials","enAction":"Guide the sign-in screen. Have the customer enter passwords or verification codes themselves.","thAction":"แนะนำหน้าจอเข้าสู่ระบบ ให้ลูกค้ากรอกรหัสผ่านหรือรหัสยืนยันเองค่ะ","jp":"パスワードは、ご{自身|じしん}で{入力|にゅうりょく}をお{願|ねが}いします。","en":"Please enter the password yourself.","th":"รบกวนกรอกรหัสผ่านด้วยตัวเองนะคะ","hear":{"jp":"パスワードを{忘|わす}れてしまいました。","en":"I've forgotten my password.","th":"ลืมรหัสผ่านไปแล้ว","id":"setup-06-hear","learning":{"mode":"recognize","audience":"learner","function":"Hear the reaction: Let the customer enter credentials","trigger":"Guide the sign-in screen. Have the customer enter passwords or verification codes themselves.","triggerTh":"แนะนำหน้าจอเข้าสู่ระบบ ให้ลูกค้ากรอกรหัสผ่านหรือรหัสยืนยันเองค่ะ"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[]}},"reply":{"jp":"{再設定|さいせってい}の{方法|ほうほう}を{確認|かくにん}します。","en":"I'll check how to reset it.","th":"ขอตรวจสอบวิธีตั้งรหัสใหม่ก่อนค่ะ","id":"setup-06-reply","learning":{"mode":"active","audience":"customer","function":"Answer the reaction: Let the customer enter credentials","trigger":"Guide the sign-in screen. Have the customer enter passwords or verification codes themselves.","triggerTh":"แนะนำหน้าจอเข้าสู่ระบบ ให้ลูกค้ากรอกรหัสผ่านหรือรหัสยืนยันเองค่ะ"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[]}},"id":"setup-06","learning":{"mode":"active","audience":"customer","function":"Request an action"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["public-setup-1","public-setup-2"],"scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below."},"facts":[]}},{"title":"Give a short update while it runs","enA  on the new phone with the customer. Say the names of the items you actually transferred.","thAction":"ตรวจรายการที่ตกลงกันไว้ในเครื่องใหม่กับลูกค้า โดยพูดชื่อข้อมูลที่ย้ายจริงค่ะ","jp":"{移|うつ}した{写真|しゃしん}と{連絡先|れんらくさき}を、{一緒|いっしょ}に{確認|かくにん}しましょう。","en":"Let's check the transferred photos and contacts together.","th":"มาตรวจรูปกับรายชื่อที่ย้ายมาด้วยกันนะคะ","gate":"Photos and contacts are the example here. Check each requested app separately. A progress bar reaching the end does not prove that all requested data is usable.","gateTh":"ตัวอย่างนี้คือรูปกับรายชื่อ ต้องตรวจแต่ละแอปที่ลูกค้าขอแยกกัน แถบย้ายข้อมูลเต็มไม่ได้ยืนยันว่าข้อมูลที่ต้องการทั้งหมดใช้ได้แล้วค่ะ","id":"setup-08","learning":{"mode":"active","audience":"customer","function":"Check result together"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["public-setup-1","public-setup-2"],"scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below."},"facts":[]}},{"title":"Explain remaining tasks and hand back","enAction":"Point out anything still to do and return both devices. Finish only the work that has actually been checked.","thAction":"บอกสิ่งที่ยังต้องทำและคืนทั้งสองเครื่อง สรุปเฉพาะงานที่ตรวจว่าเสร็จจริงแล้วค่ะ","jp":"{設定|せってい}できた{内容|ないよう}と、このあと{必要|ひつよう}なことをご{案内|あんない}します。","en":"I'll explain what has been set up and what you still need to do.","th":"ขออธิบายว่าตั้งค่าอะไรเสร็จแล้ว และยังต้องทำอะไรต่อบ้างนะคะ","gate":"The old phone is not automatically a recycling or return request. Use the appropriate separate flow if the customer asks for that.","gateTh":"อย่าถือว่าลูกค้าต้องการรีไซเคิลหรือคืนเครื่องเก่าโดยอัตโนมัติ หากลูกค้าขอ ให้ใช้ขั้นตอนนั้นแยกต่างหากค่ะ","id":"setup-09","learning":{"mode":"active","audience":"customer","function":"Explain next action"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["public-setup-1","public-s xample":{"jp":"{後|のち}ほど、もう{一度|いちど}ご{説明|せつめい}します。","en":"I will explain it again later.","th":"จะอธิบายอีกครั้งภายหลังนะคะ","learning":{"mode":"active","audience":"customer","function":"For a later action; give a confirmed time separately if the customer needs one."},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[]},"id":"w23-example"},"learning":{"mode":"active","audience":"customer","function":"Useful actions","guidance":"Learn the word inside the example, not as an isolated label."},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[{"category":"A","sourceIds":["photo-expressions"],"scope":"This word occurs in the expression table. Its workplace example and guidance are original, not a quoted source script."}]}},{"id":"w24","first":false,"jp":"{記入|きにゅう}","en":"Filling in a form","th":"กรอกข้อมูล","cat":"Useful actions","when":"Point to the exact field to write in. 記入 is filling in information; 署名 is signing your name.","whenTh":"ชี้ช่องที่ต้องเขียนให้ชัด 記入 คือกรอกข้อมูล ส่วน 署名 คือเซ็นชื่อ","example":{"jp":"こちらにご{記入|きにゅう}ください。","en":"Please fill this in here.","th":"กรุณากรอกตรงนี้ค่ะ","learning":{"mode":"active","audience":"customer","function":"Point to the exact field to write in. 記入 is filling in information; 署名 is signing your name."},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[]},"id":"w24-example"},"learning":{"mode":"active","audience":"customer","function":"Useful actions","guidance":"Learn the word inside the example, not as an isolated label."},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[{"category":"A","sourceIds":["photo-expressions"],"scope":"This word occurs in the expression table. Its workplace example and guidance are original, not a quoted source script."}]}}],"cushions":[{"id":"request","tag":"A polite request","when":"Before asking for information or a document.","whenTh":"ก่อนขอข้อมูลหรือเอกสาร","jp":"{恐|おそ}れ{入|い}りますが、お{名前|なまえ}をお{願|ねが}いします。","en":"Excuse me, may I have your name?","th":"รบกวนขอทราบชื่อด้วยค่ะ","note":"恐れ入りますが is a gentle opening. One opening is enough; say the request next.","noteTh":"恐れ入りますが เป็นคำเกริ่นสุภาพ ใช้คำเกริ่นเดียวแล้วพูดสิ่งที่ต้องการได้เลย","learning":{"mode":"active","audience":"customer","function":"Request information"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[]}},{"id":"effort","tag":"Asking for effort","when":"When the customer needs to write, bring something or take an extra step.","whenTh":"เมื่อต้องให้ลูกค้าเขียน นำของมา หรือทำขั้นตอนเพิ่ม","jp":"お{手数|てすう}ですが、こちらにご{記入|きにゅう}ください。","en":"Sorry for the trouble; please fill this in here.","th":"รบกวนกรอกตรงนี้ด้วยค่ะ","note":"お手数ですが acknowledges the work you are asking the customer to do.","noteTh":"お手数ですが แสดงว่าเราเข้าใจว่ากำลังขอให้ลูกค้าเสียเวลาหรือออกแรงทำบางอย่าง","learning":{"mode":"active","audience":"customer","function":"Request customer effort"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[]}},{"id":"wait","tag":"Apologise + ask for more time","when":"When a wait has become longer or you need to apologise.","whenTh":"เมื่อให้รอนานขึ้นหรือมีเรื่องที่ต้องขอโทษ","jp":"{申|もう}し{訳|わけ}ありません。もう{少々|しょうしょう}お{待|ま}ちください。","en":"I’m sorry. Please wait a little longer.","th":"ขออภัยค่ะ กรุณารออีกสักครู่นะคะ","note":"Use it for an actual inconvenience. A routine short wait can simply be 少々お待ちください.","noteTh":"ใช้เมื่อมีความไม่สะดวกเกิดขึ้นจริง ถ้าขอให้รอสั้น ๆ ตามปกติ ใช้ 少々お待ちください ได้เลย","learning":{"mode":"active","audience":"customer","function":"Apologise and ask for more time"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[]}},{"id":"optional","tag":"An optional offer","when":"When the customer is free to accept or decline.","whenTh":"เมื่อลูกค้าเลือกตอบรับหรือปฏิเสธได้","jp":"よろしければ、こちらもご{覧|らん}ください。","en":"If you’d like, please have a look at this too.","th":"ถ้าสนใจ ลองดูอันนี้ด้วยได้นะคะ","note":"よろしければ means “if you would like.” Use it for an optional suggestion, not a required identity check.","noteTh":"よろしければ หมายถึงถ้าสะดวกหรือสนใจ ใช้กับข้อเสนอที่เลือกได้ ไม่ใช้กับการตรวจตัวตนที่จำเป็น","learning":{"mode":"active","audience":"customer","function":"Make an optional offer"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[]}},{"id":"doublecheck","tag":"Explain a recheck","when":"When confirming a detail again to avoid a mistake.","whenTh":"เมื่อยืนยันข้อมูลซ้ำเพื่อป้องกันความผิดพลาด","jp":"{念|ねん}のため、{電話番号|でんわばんごう}を{確認|かくにん}します。","en":"Just to make sure, I will confirm the phone number.","th":"เพื่อความแน่ใจ ขอเช็กเบอร์โทรอีกครั้งค่ะ","note":"念のため explains why you are checking again; it is not an apology.","noteTh":"念のため บอกเหตุผลที่ตรวจซ้ำ ไม่ใช่คำขอโทษ","learning":{"mode":"active","audience":"customer","function":"Explain a precautionary check"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[]}},{"id":"repeat","tag":"A slightly awkward question","when":"When you need the customer to tell you their name again.","whenTh":"เมื่อต้องขอให้ลูกค้าบอกชื่ออีกครั้ง","jp":"{失礼|しつれい}ですが、お{名前|なまえ}をもう{一度|いちど}お{願|ねが}いします。","en":"Excuse me, could you tell me your name once more?","th":"ขออภัยค่ะ รบกวนบอกชื่ออีกครั้งได้ไหมคะ","note":"Recognize 失礼ですが as a courteous opening to a potentially intrusive question. For a missed name, reuse 恐れ入りますが or simply もう一度お願いします; you need not memorize a second opening yet.","noteTh":"จำว่า 失礼ですが ใช้เกริ่นอย่างสุภาพเมื่อคำถามอาจรบกวนอีกฝ่าย ถ้าฟังชื่อไม่ทัน ใช้ 恐れ入りますが ที่เรียนแล้ว หรือ もう一度お願いします ได้ ยังไม่ต้องจำคำเกริ่นเพิ่ม","learning":{"mode":"recognize","audience":"customer","function":"Ask for a name again"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[]}}],"helpers":[{"when":"You are checking","jp":"{確認|かくにん}しますので、{少々|しょうしょう}お{待|ま}ちください。","en":"Please wait a moment while I check.","th":"ขอตรวจสอบสักครู่ กรุณารอนะคะ","whenTh":"ระหว่างตรวจสอบ","id":"helper-1","learning":{"mode":"active","audience":"customer","function":"You are checking"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[]}},{"when":"You did not catch it","jp":"すみません。もう{一度|いちど}お{願|ねが}いします。","en":"Sorry, could you say that again?","th":"ขอโทษค่ะ รบกวนพูดอีกครั้งได้ไหมคะ","whenTh":"เมื่อฟังไม่ทัน","id":"helper-2","learning":{"mode":"active","audience":"customer","function":"You did not catch it"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[]}},{"when":"You need a coworker’s answer","jp":"{担当|たんとう}の{者|もの}に{確認|かくにん}します。","en":"I will check with the staff member responsible.","th":"ขอตรวจสอบกับผู้ดูแลเรื่องนี้ค่ะ","whenTh":"เมื่อต้องไปถามผู้ดูแลเรื่องนี้","id":"helper-3","learning":{"mode":"active","audience":"customer","function":"You need a coworker’s answer"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[]}},{"when":"Before submitting · to your coworker","whenTh":"ก่อนส่งคำขอ · พูดกับเพื่อนร่วมงาน","sharedId":"p066","jp":"{入力内容|にゅうりょくないよう}を{確認|かくにん}していただけますか。","en":"Could you check the information I've entered?","th":"ช่วยตรวจสอบข้อมูลที่กรอกให้หน่อยได้ไหมคะ","id":"helper-4","learning":{"mode":"active","audience":"coworker","function":"Before submitting · to your coworker"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[]}},{"when":"You need the next step · to your coworker","jp":"{次|つぎ}は{何|なに}をすればいいですか。","en":"What should I do next?","th":"ต่อไปต้องทำอะไรคะ","whenTh":"เมื่อต้องถามขั้นตอนถัดไป · พูดกับเพื่อนร่วมงาน","id":"helper-5","learning":{"mode":"active","audience":"coworker","function":"You need the next step · to your coworker"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[]}}],"products":[{"name":"ドコモ MAX","en":"On your leaflet: a data-usage-based plan with entertainment benefits. Learn how to ask about usage and explain conditions.","th":"ในเอกสาร: แพ็กเกจตามปริมาณการใช้ข้อมูลพร้อมสิทธิ์ความบันเทิง ฝึกถามการใช้งานและอธิบายเงื่อนไข","learning":{"mode":"reference","audience":"learner","function":"Recognize a historical plan name"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[{"category":"A","sourceIds":["photo-plan"],"scope":"The plan name and broad feature distinction come from the October 2025 comparison; study advice and summaries are authored."}]}},{"name":"ドコモ ポイ活 MAX","en":"On your leaflet: a plan with point-related benefits. Separate the billed charge, discounts and points when explaining.","th":"ในเอกสาร: แพ็กเกจที่มีสิทธิ์เกี่ยวกับแต้ม เวลาอธิบายให้แยกยอดบิล ส่วนลด และแต้ม","learning":{"mode":"reference","audience":"learner","function":"Recognize a historical plan name"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[{"category":"A","sourceIds":["photo-plan"],"scope":"The plan name and broad feature distinction come from the October 2025 comparison; study advice and summaries are authored."}]}},{"name":"ドコモ ポイ活 20","en":"On your leaflet: two data-usage tiers with point-related benefits. Check which tier and conditions apply.","th":"ในเอกสาร: แพ็กเกจสองช่วงการใช้ข้อมูลพร้อมสิทธิ์เกี่ยวกับแต้ม ต้องตรวจว่าลูกค้าอยู่ช่วงใดและใช้เงื่อนไขอะไร","learning":{"mode":"reference","audience":"learner","function":"Recognize a historical plan name"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[{"category":"A","sourceIds":["photo-plan"],"scope":"The plan name and broad feature distinction come from the October 2025 comparison; study advice and summaries are authored."}]}},{"name":"ドコモ mini","en":"On your leaflet: two choices of data allowance. Start by asking how much mobile data the customer uses.","th":"ในเอกสาร: เลือกปริมาณอินเทอร์เน็ตได้สองแบบ เริ่มจากถามว่าลูกค้าใช้อินเทอร์เน็ตมือถือเท่าไร","learning":{"mode":"reference","audience":"learner","function":"Recognize a historical plan name"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[{"category":"A","sourceIds":["photo-plan"],"scope":"The plan name and broad feature distinction come from the October 2025 comparison; study advice and summaries are authored."}]}}],"productNote":"The comparison photo is dated October 2025. Its plan names and distinctions are reference material, not prices to quote today. The two language tables are register references, not approved counter scripts; their formal and literary vocabulary is not a memorization list.","productNoteTh":"ภาพเปรียบเทียบแพ็กเกจระบุเดือนตุลาคม 2025 ใช้ทบทวนชื่อและความแตกต่าง ไม่ใช่ราคาสำหรับแจ้งวันนี้ ตารางภาษาอีกสองภาพใช้อ้างอิงระดับภาษา ไม่ใช่บทพูดที่ร้านอนุมัติ และไม่ต้องจำคำทางการหรือภาษาเขียนทั้งหมด","sources":[{"label":"Your three photos in PDF source: S__36249605.jpg, S__36249606.jpg, S__36249607.jpg","url":"","checked":"2026-09-12"},{"label":"Docomo: current plan overview","url":"https://www.docomo.ne.jp/charge/","checked":"2026-09-12"},{"label":"Docomo: ポイ活 20 conditions and point notices","url":"https://www.docomo.ne.jp/charge/docomo_poikatsu_20/","checked":"2026-09-12"}],"followups":[{"id":"p089","cat":"contract","speaker":"staff","jp":"お{待|ま}たせしました。この{方法|ほうほう}でお{手続|てつづ}きできます。","en":"Thank you for waiting. We can proceed using this method.","th":"ขอบคุณที่รอค่ะ ดำเนินการด้วยวิธีนี้ได้ค่ะ","note":"After the actual method has been checked and confirmed available. Point out which method; this does not mean the application is approved.","noteTh":"ใช้หลังตรวจแล้วว่าวิธีนี้ใช้ได้จริง ระบุให้ชัดว่าวิธีไหน ไม่ได้แปลว่าคำขออนุมัติแล้ว","essential":false,"learning":{"mode":"active","audience":"customer","function":"Possible after checking"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact."},"facts":[]},"introduced":"1.1"},{"id":"p090","cat":"contract","speaker":"staff","jp":"{確認|かくにん}したところ、この{方法|ほうほう}ではお{手続|てつづ}きできません。","en":"After checking, we cannot proceed using this method.","th":"ตรวจสอบแล้ว ไม่สามารถดำเนินการด้วยวิธีนี้ได้ค่ะ","note":"A confirmed negative result, not an unknown answer. Follow with the verified reason or an available alternative.","noteTh":"ใช้เมื่อยืนยันแล้วว่าทำด้วยวิธีนี้ไม่ได้ ไม่ใช่เมื่อยังไม่รู้คำตอบ บอกเหตุผลที่ตรวจแล้วหรือทางเลือกต่อ","essential":false,"learning":{"mode":"active","audience":"customer","function":"Method not available"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact."},"facts":[]},"introduced":"1.1"},{"id":"p091","cat":"contract","speaker":"staff","jp":"このお{手続|てつづ}きには、こちらの{書類|しょるい}が{必要|ひつよう}です。","en":"This procedure requires the document shown here.","th":"ขั้นตอนนี้ต้องใช้เอกสารที่แสดงตรงนี้ค่ะ","note":"Point to the specific document on the checked list. No document type or docomo requirement is supplied by this example.","noteTh":"ชี้เอกสารที่ต้องใช้จากรายการที่ตรวจแล้ว ตัวอย่างนี้ไม่ได้กำหนดว่าต้องเป็นเอกสารชนิดใดหรือเป็นกฎของ docomo","essential":false,"learning":{"mode":"active","audience":"customer","function":"Explain a checked requirement"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact."},"facts":[]},"introduced":"1.1"},{"id":"p093","cat":"contract","speaker":"staff","jp":"こちらの{方法|ほうほう}なら{対応|たいおう}できます。こちらで{進|すす}めますか。","en":"We can help using this alternative. Would you like to proceed this way?","th":"ถ้าเป็นวิธีนี้ ดำเนินการได้ค่ะ ต้องการใช้วิธีนี้ไหมคะ","note":"Only after checking the alternative and explaining any differences, costs or conditions. なら limits the statement to this method.","noteTh":"ตรวจทางเลือกก่อน และอธิบายความต่าง ค่าใช้จ่ายหรือเงื่อนไขที่เกี่ยวข้อง なら จำกัดความหมายว่าเป็นวิธีนี้","essential":false,"learning":{"mode":"active","audience":"customer","function":"Offer an available alternative"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact."},"facts":[]},"introduced":"1.1"},{"id":"p094","cat":"contract","speaker":"staff","jp":"{次|つぎ}に、こちらの{内容|ないよう}をご{確認|かくにん}ください。","en":"Next, please check these details.","th":"ต่อไป รบกวนตรวจรายละเอียดตรงนี้ค่ะ","note":"Point to the actual details. 次に is a simple transition, not a cushion that needs another apology.","noteTh":"ชี้รายละเอียดที่ต้องตรวจจริง 次に ใช้เปลี่ยนไปขั้นตอนถัดไป ไม่ต้องเติมคำขอโทษ","essential":false,"learning":{"mode":"active","audience":"customer","function":"Give the next customer action"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact."},"facts":[]},"introduced":"1.1"},{"id":"p095","cat":"contract","speaker":"staff","jp":"{確認|かくにん}できました。こちらのお{手続|てつづ}きは{完了|かんりょう}しています。","en":"I have confirmed it. This procedure is complete.","th":"ตรวจสอบแล้วค่ะ ขั้นตอนนี้เสร็จเรียบร้อยแล้วค่ะ","note":"Only after confirming the actual completion status. Name or point to the completed task; do not include pending work or a future activation.","noteTh":"ใช้หลังตรวจสถานะว่าเสร็จจริง ระบุงานที่เสร็จ ไม่รวมงานค้างหรือการเปิดใช้งานในอนาคต","essential":false,"learning":{"mode":"active","audience":"customer","function":"Report verified completion"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact."},"facts":[]},"introduced":"1.1"},{"id":"p096","cat":"coworkers","speaker":"staff","jp":"{料金|りょうきん}についてのご{相談|そうだん}です。{説明|せつめい}された{金額|きんがく}と{違|ちが}うとのことです。","en":"This is a billing question. The customer says the amount differs from what was explained.","th":"ลูกค้ามาปรึกษาเรื่องค่าบริการค่ะ บอกว่ายอดไม่ตรงกับที่อธิบายไว้","note":"To a colleague: report the customer’s claim, not a confirmed billing error. とのことです marks reported information.","noteTh":"บอกเพื่อนร่วมงานว่านี่คือสิ่งที่ลูกค้าแจ้ง ยังไม่ได้ยืนยันว่าบิลผิด とのことです ใช้รายงานคำพูดอีกฝ่าย","essential":false,"learning":{"mode":"active","audience":"coworker","function":"Brief the customer situation"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact."},"facts":[]},"introduced":"1.1"},{"id":"p097","cat":"coworkers","speaker":"staff","jp":"{請求内容|せいきゅうないよう}は{確認|かくにん}しました。{申込記録|もうしこみきろく}はまだです。","en":"I checked the billing details. I have not checked the application record yet.","th":"ตรวจรายละเอียดบิลแล้วค่ะ แต่ยังไม่ได้ตรวจประวัติการสมัคร","note":"Internal shorthand: はまだです refers to the checking just mentioned. Use only for work actually done.","noteTh":"รูปย่อที่ใช้ในทีม はまだです หมายถึงยังไม่ได้ตรวจตามประโยคก่อนหน้า แจ้งเฉพาะงานที่ทำแล้วจริง","essential":false,"learning":{"mode":"active","audience":"coworker","function":"Say what is checked and pending"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact."},"facts":[]},"introduced":"1.1"},{"id":"p098","cat":"coworkers","speaker":"staff","jp":"この{料金|りょうきん}がかかる{理由|りゆう}が{分|わ}かりません。{一緒|いっしょ}に{確認|かくにん}してもらえますか。","en":"I do not understand why this charge applies. Could you check it with me?","th":"ยังไม่เข้าใจว่าทำไมถึงมีค่าบริการนี้ค่ะ ช่วยตรวจด้วยกันได้ไหมคะ","note":"To a coworker; state the specific unknown. もらえますか is ordinary polite team language.","noteTh":"พูดกับเพื่อนร่วมงานและระบุจุดที่ไม่แน่ใจ もらえますか เป็นคำขอสุภาพทั่วไปในทีม","essential":false,"learning":{"mode":"active","audience":"coworker","function":"Name uncertainty and ask for help"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact."},"facts":[]},"introduced":"1.1"},{"id":"p099","cat":"coworkers","speaker":"staff","jp":"この{案内|あんない}で{合|あ}っているか、{確認|かくにん}をお{願|ねが}いします。","en":"Please check whether this explanation is correct.","th":"รบกวนตรวจความถูกต้องของคำอธิบายนี้ให้หน่อยค่ะ","note":"Show or repeat the proposed explanation to the colleague or supervisor. この案内 needs a concrete referent.","noteTh":"แสดงหรือพูดคำอธิบายที่เตรียมไว้ให้เพื่อนร่วมงานหรือหัวหน้าฟัง ต้องบอกให้รู้ว่า この案内 หมายถึงคำอธิบายใด","essential":false,"learning":{"mode":"active","audience":"coworker","function":"Ask a supervisor to check your explanation"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact."},"facts":[]},"introduced":"1.1"},{"id":"p100","cat":"coworkers","speaker":"staff","jp":"ここから{対応|たいおう}を{代|か}わってもらえますか。","en":"Could you take over from here?","th":"ช่วยรับช่วงดูแลต่อจากตรงนี้ได้ไหมคะ","note":"After briefing the situation, completed checks and open questions. This asks for a takeover; it does not assume the colleague has accepted.","noteTh":"ใช้หลังสรุปเรื่อง งานที่ตรวจแล้ว และข้อสงสัยที่ค้าง เป็นการขอให้รับช่วง ยังไม่ถือว่าอีกฝ่ายตกลงแล้ว","essential":false,"learning":{"mode":"active","audience":"coworker","function":"Ask a colleague to take over"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"Original general counter-language pattern. A checked   if(!m||!['known','shaky'].includes(m.status)||!Number.isFinite(m.at)||m.at<0)throw Error('The backup contains invalid progress.');
  clean[id]={status:m.status,at:Math.min(m.at,Date.now()),reviews:Number.isInteger(m.reviews)?Math.max(0,Math.min(m.reviews,1000000)):0};
 }
 return clean;
}
function progressEnvelope(){return {app:'counter-notes-amo',version:1,updatedAt:progressUpdatedAt,marks};}
function readEnvelope(raw){
 const obj=JSON.parse(raw),clean=validateBackup(obj);
 const newestMark=Math.max(0,...Object.values(clean).map(m=>m.at));
 const updatedAt=Number.isFinite(obj.updatedAt)?Math.max(0,obj.updatedAt):newestMark;
 return {marks:clean,updatedAt};
}
function updateStorageNotice(){
 const el=document.getElementById('storageNotice'),message=document.getElementById('storageMessage');
 el.hidden=saveOK&&!IS_LOCAL_FILE&&!loadProblem;
 const en=loadProblem?'Some saved progress could not be read. Restore a backup before clearing anything.':!saveOK?'Automatic saving could not be verified. Save a progress copy before closing.':'Local file: automatic saving is not guaranteed. Keep a progress copy.';
 const th=loadProblem?'อ่านข้อมูลเดิมบางส่วนไม่ได้ โปรดลองนำข้อมูลสำรองกลับมาใช้ก่อนล้างข้อมูล':!saveOK?'ตรวจสอบการบันทึกอัตโนมัติไม่สำเร็จ ควรบันทึกไฟล์พร้อมความคืบหน้าก่อนปิด':'เมื่อเปิดไฟล์โดยตรง การบันทึกอัตโนมัติอาจสูญหาย ควรเก็บไฟล์พร้อมความคืบหน้า';
 message.innerHTML=esc(en)+thai(th);
}
function save(){
 const raw=JSON.stringify(progressEnvelope());
 try{
  if(loadProblem)throw Error('Keep unreadable data until explicit recovery.');
  localStorage.setItem(STORE_KEY,raw);
  if(localStorage.getItem(STORE_KEY)!==raw)throw Error('Storage readback did not match.');
  saveOK=true;
 }catch(e){saveOK=false;}
 updateStorageNotice();
}
function changed(){progressUpdatedAt=Math.max(Date.now(),progressUpdatedAt+1);}
function initProgress(){
 let embedded=null,cached=null;
 try{const raw=document.getElementById('portableProgress').textContent;if(raw.trim()!=='null')embedded=readEnvelope(raw);}catch(e){loadProblem=true;}
 try{const raw=localStorage.getItem(STORE_KEY);if(raw)cached=readEnvelope(raw);}catch(e){saveOK=false;try{if(localStorage.getItem(STORE_KEY))loadProblem=true;}catch(ignored){}}
 // Compare complete states: a newer reset or unmark must not resurrect an old embedded mark.
 const selected=cached&&(!embedded||cached.updatedAt>=embedded.updatedAt)?cached:embedded;
 if(selected){marks=selected.marks;progressUpdatedAt=selected.updatedAt;}
 save();
}
initProgress();

function downloadBlob(blob,name){
 const url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),60000);
}
