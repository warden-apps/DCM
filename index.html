 `;
 function mount(host,flows,extra){
  if(!host||!Array.isArray(flows)||!flows.length)throw Error('Missing workflows');
  extra=extra||{};
  const root=host.shadowRoot||host.attachShadow({mode:'open'});
  root.innerHTML=`<style>${style}</style><div class="wf" id="wf-root"></div>`;
  const body=root.getElementById('wf-root');
  function line(p,key,memory=false){const show=open.has(key);return `<div class="utterance ${show?'is-open':''}">${memory?`<div class="prompt">${esc(p.en)}${th(p.th)}</div><button class="button ${show?'':'red'}" data-wf-reveal="${key}" aria-expanded="${show}" aria-controls="wf-answer-${key}">${show?'Hide Japanese':'Say it → show Japanese'}</button><div class="meaning" id="wf-answer-${key}" ${show?'':'hidden'}>${jp(p.jp)}</div>`:`<button class="speech" data-wf-reveal="${key}" aria-expanded="${show}" aria-controls="wf-answer-${key}">${jp(p.jp)}<span class="cue">${show?'Hide reading & meaning':'Tap for furigana · English · ไทย'}</span></button><div class="meaning" id="wf-answer-${key}" ${show?'':'hidden'}>${esc(p.en)}${th(p.th)}</div>`}</div>`;}
  function focus(selector){const el=body.querySelector(selector||'h1');if(el){el.focus({preventScroll:true});if(selector)el.scrollIntoView({behavior:'instant',block:'start'});else window.scrollTo({top:window.scrollY+body.getBoundingClientRect().top,behavior:'instant'});}}
  function topTabs(){return `<div class="top-tabs" role="group" aria-label="Work map sections">${[['map','Work map'],['words','Vocabulary'],['cushions','Cushion phrases']].map(([id,name])=>`<button data-wf-tab="${id}" class="${tab===id?'active':''}" aria-pressed="${tab===id}">${name}</button>`).join('')}</div>`;}
  function sources(items){return (items||[]).map(s=>{let url='';try{const u=new URL(s.url);if(u.protocol==='https:'&&(u.hostname==='docomo.ne.jp'||u.hostname.endsWith('.docomo.ne.jp')))url=u.href;}catch(e){}return `<p>${url?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(s.label)}</a>`:esc(s.label)}${s.checked?`<br><span class="small">Checked / recorded ${esc(s.checked)}</span>`:''}</p>`;}).join('');}
  function helpers(){return `<details><summary>While you work · ระหว่างดำเนินการ</summary>${(extra.helpers||[]).map((p,i)=>`<div class="mini"><span class="label">${esc(p.when)}</span>${th(p.whenTh)}<span class="label">${p.learning?.audience==='coworker'?'To your team · พูดกับทีม':'To customer · พูดกับลูกค้า'}</span>${line(p,'helper'+i)}</div>`).join('')}</details>`;}
  function menu(){return `<header class="intro"><div class="eyebrow">See the action. Find the sentence.</div><h1 tabindex="-1">Your counter map.</h1><p class="sub">Choose the job. Follow its branch. Say one short line at a time.</p>${th('เลือกงาน → ดูแต่ละขั้น → พูดประโยคสั้น ๆ ทีละประโยค')}</header><div class="tree-root"><strong>A customer visits</strong>${th('ลูกค้ามาที่ร้าน')}</div><div class="tree">${groups.map((g,i)=>`<details class="branch"><summary><span><strong>${esc(g.en)}</strong>${th(g.th)}</span></summary><div class="branch-list">${g.ids.map(id=>flows.find(f=>f.id===id)).filter(Boolean).map(f=>`<button class="flow-option" data-wf-open="${esc(f.id)}"><span class="ja" lang="ja">${esc(f.title)}</span><span class="en">${esc(f.en)}</span>${th(f.th)}<span class="menu-foot"><span>${f.steps.length} actions · ${esc(f.reading)}</span><span class="arrow">→</span></span></button>`).join('')}</div></details>`).join('')}</div><div class="start-note">Today: choose one task and rehearse only its first three sentences.${th('วันนี้เลือกงานเดียว แล้วฝึกแค่สามประโยคแรกก่อน')}</div><section class="support">${helpers()}</section>`;}
  function step(s,i,total){return `<article class="step ${full?'':'focused'}" data-wf-step="${i}"><div class="step-number"><span class="pin">${i+1}</span> Action ${i+1} / ${total}</div><h3 tabindex="-1"><button data-wf-focus="${i}" title="Focus on this action">${esc(s.title)}</button></h3>${!full?`<div class="action">${esc(s.enAction)}${th(s.thAction)}${s.relatedFlow?`<button class="button" data-wf-open="${esc(s.relatedFlow)}">Practise the plan explanation →<br><span lang="th">ไปฝึกอธิบายแพ็กเกจ</span></button>`:''}</div>`:''}<span class="label">${s.learning?.audience==='coworker'?'To your coworker · พูดกับเพื่อนร่วมงาน':'You say · คุณพูด'}</span>${line(s,'s'+i,recall)}${full?`<details class="action-details"><summary>What you do · สิ่งที่ทำ</summary><div class="action">${esc(s.enAction)}${th(s.thAction)}${s.relatedFlow?`<button class="button" data-wf-open="${esc(s.relatedFlow)}">Practise the plan explanation →<br><span lang="th">ไปฝึกอธิบายแพ็กเกจ</span></button>`:''}</div></details>`:''}${s.hear?`<details class="side-branch"><summary>${s.reply?'If the customer asks…':'What you might hear'} · คำตอบลูกค้า</summary><div class="listen"><span class="label">${s.hear.role==='coworker'?'Coworker':'Customer'}</span>${line(s.hear,'h'+i)}</div>${s.reply?`<div class="reply"><span class="label">You can answer · ตอบได้ว่า</span>${line(s.reply,'reply'+i,recall)}</div>`:''}</details>`:''}${s.gate?`<details class="gate" ${!full?'open':''}><summary>Check before this step · เช็กก่อนทำ</summary><p>${esc(s.gate)}</p>${th(s.gateTh)}</details>`:''}${s.coach?`<div class="reply"><span class="label">Ask your coworker</span>${line(s.coach,'coach'+i)}</div>`:''}</article>`;}
  function followups(f){const items=(f.followupIds||[]).map(id=>(extra.followups||[]).find(p=>p.id===id)).filter(Boolean);return items.length?`<details class="followups"><summary>After checking / if stuck · แจ้งผลหรือขอความช่วยเหลือ</summary><p class="small">Choose the line that matches the actual result. These are alternatives, not consecutive procedure steps. The same phrases can be marked and reviewed in Practice.</p>${th('เลือกประโยคให้ตรงผลที่ตรวจจริง ไม่ต้องพูดทุกประโยคตามลำดับ ฝึกและทำเครื่องหมายประโยคเดียวกันได้ใน Practice')}${items.map(p=>`<div class="mini"><span class="label">${esc(p.learning.function)} · ${p.learning.audience==='coworker'?'To your team · พูดกับทีม':'To customer · พูดกับลูกค้า'}</span>${line(p,'followup-'+p.id,recall)}<p class="small">${esc(p.note)}</p>${th(p.noteTh)}</div>`).join('')}</details>`:'';}
  function lesson(f){index=Math.max(0,Math.min(index,f.steps.length-1));return `<div class="toolbar"><button class="button text" data-wf-back>← All tasks</button><span class="tag">Short, polite Japanese</span></div><header class="flow-title"><div class="eyebrow">${esc(f.en)}</div><h1 tabindex="-1" lang="ja">${esc(f.title)}</h1><p class="reading" lang="ja">${esc(f.reading)}</p>${th(f.th)}</header><div class="mini-tip"><strong>${esc(f.outcome)}</strong>${th(f.outcomeTh)}</div><details class="scope"><summary>Scenario & store checks · ขอบเขตบทฝึก</summary><p>${esc(f.intro)}</p>${th(f.introTh)}<p style="margin-top:12px">${esc(f.scope)}</p>${th(f.scopeTh)}</details><div class="switches"><button data-wf-full="true" aria-pressed="${full}">Connected map</button><button data-wf-full="false" aria-pressed="${!full}">One action</button><button data-wf-recall aria-pressed="${recall}">${recall?'Recall on':'Hide Japanese & try'}</button></div>${!full?`<div class="map"><label for="wf-step-select">Choose an action · เลือกขั้นตอน</label><select id="wf-step-select">${f.steps.map((s,i)=>`<option value="${i}" ${index===i?'selected':''}>${i+1}. ${esc(s.title)}</option>`).join('')}</select></div>`:`<div class="path-caption"><span>Follow the line ↓</span><span>Tap an action title to focus</span></div>`}<div class="steps ${full?'tree-steps':''}" id="wf-steps">${full?f.steps.map((s,i)=>step(s,i,f.steps.length)).join(''):step(f.steps[index],index,f.steps.length)}</div>${!full?`<div class="next"><button class="button" data-wf-prev ${index===0?'disabled':''}>← Previous</button><button class="button red" data-wf-next ${index===f.steps.length-1?'disabled':''}>Next action →</button></div>`:''}${full||index===f.steps.length-1?`<div class="finish"><h3>What needs to be clear at the end</h3><p>${esc(f.doneWhen)}</p>${th(f.doneWhenTh)}<p class="small">If a check is still open, use the coworker help below. Saying “I’ll check” starts that work; it does not finish it.</p>${th('ถ้ายังตรวจไม่เสร็จ ใช้ประโยคถามเพื่อนร่วมงานด้านล่าง การบอกว่าจะตรวจเป็นจุดเริ่ม ไม่ใช่จบงาน')}<h3>Practise just three actions.</h3><p>Look at the action, cover the Japanese, and say it. Add the next action when those three feel familiar.</p>${th('ดูชื่อขั้นตอน ปิดภาษาญี่ปุ่น แล้วลองพูด เมื่อสามขั้นแรกคล่องแล้ว ค่อยเพิ่มขั้นต่อไป')}<button class="button" data-wf-restart style="margin-top:12px">Start with action 1</button></div>`:''}<section class="support">${followups(f)}${helpers()}<details><summary>Sources & scope · ที่มาของบทฝึก</summary><div class="sources">${sources(f.sources)}<p>Original practice sentences based on your training and public docomo guidance. Your store supplies its internal screen order and checks. Lessons work offline; source links need internet.</p>${th('ประโยคฝึกอิงจากที่คุณเล่าว่าเรียนมาและข้อมูลสาธารณะของ docomo ลำดับหน้าจอและจุดตรวจสอบภายในให้เรียนจากร้าน บทเรียนใช้ออฟไลน์ได้ ลิงก์อ้างอิงต้องใช้อินเทอร์เน็ต')}</div></details></section>`;}
  function wordCard(w,i){const key='v'+i,show=open.has(key);return `<article class="word" data-wf-word="${esc(w.id)}"><span class="tag">${esc(w.cat)}</span><p class="small">${studyLabel(w)}</p><div class="utterance ${show?'is-open':''}"><button class="speech" data-wf-reveal="${key}" aria-expanded="${show}" aria-controls="wf-answer-${key}">${jp(w.jp)}<span class="cue">${show?'Hide reading & meaning':'Tap for reading & meaning'}</span></button><div class="meaning" id="wf-answer-${key}" ${show?'':'hidden'}><strong>${esc(w.en)}</strong>${th(w.th)}<div class="when">${esc(w.when)}${th(w.whenTh)}</div><div class="example"><span class="label">You say to a customer · พูดกับลูกค้า</span>${jp(w.example.jp)}<p>${esc(w.example.en)}</p>${th(w.example.th)}</div></div></div></article>`;}
  function wordList(){const q=query.normalize('NFKC').toLowerCase().trim();const matches=(extra.vocab||[]).map((w,i)=>({w,i})).filter(({w})=>(allWords||w.first||q)&&(!q||[w.jp,plain(w.jp),w.en,w.th,w.cat].join(' ').normalize('NFKC').toLowerCase().includes(q)));return matches.length?matches.map(({w,i})=>wordCard(w,i)).join(''):'<p class="empty">No matching word. Try English, Thai, kanji or kana.</p>';}
  function words(){return `<header class="intro"><div class="eyebrow">Small words you can use today</div><h1 tabindex="-1">Counter vocabulary.</h1><p class="sub">Start with 12 words. Recognize a term or practise saying it; learn the customer example as a whole.</p>${th('เริ่มจาก 12 คำ ดูว่าควรฝึกพูดหรือฟังให้เข้าใจ แล้วฝึกประโยคตัวอย่างทั้งประโยค')}</header><div class="word-controls"><label class="small" for="wf-word-search">Search all words · ค้นหาคำศัพท์ทั้งหมด</label><input id="wf-word-search" type="search" placeholder="Japanese, English, ไทย" value="${esc(query)}"><div class="word-filters"><button class="button ${allWords?'':'active'}" data-wf-words="first" aria-pressed="${!allWords}">First 12</button><button class="button ${allWords?'active':''}" data-wf-words="all" aria-pressed="${allWords}">All ${(extra.vocab||[]).length}</button></div></div><div class="word-grid" id="wf-word-list">${wordList()}</div><section class="support"><details><summary>Plan names in your leaflet · ชื่อแพ็กเกจในเอกสาร</summary><div class="sources"><p>${esc(extra.productNote)}</p>${th(extra.productNoteTh)}${(extra.products||[]).map(p=>`<div class="product"><strong lang="ja">${esc(p.name)}</strong><p>${esc(p.en)}</p>${th(p.th)}</div>`).join('')}${sources(extra.sources)}</div></details></section>`;}
  function cushions(){return `<header class="intro"><div class="eyebrow">A gentle opening, then the request</div><h1 tabindex="-1">Cushion phrases.</h1><p class="sub">Choose by purpose: request, effort, apology, offer or recheck. These six include openings and complete responses. Ordinary statements can be direct.</p>${th('เลือกตามสิ่งที่ต้องทำ เช่น ขอข้อมูล ขอให้ช่วยทำ ขอโทษ เสนอ หรือเช็กซ้ำ ทั้งหกอันมีทั้งคำเกริ่นและประโยคตอบ ไม่ต้องเกริ่นทุกประโยค')}</header><div class="mini-tip">Start with the first three. Practise the full example, so the opening and request come out together.${th('เริ่มจากสามอันแรก ฝึกทั้งประโยคเพื่อให้คำเกริ่นกับคำขอต่อกันได้')}</div><div class="cushions">${(extra.cushions||[]).map((c,i)=>`<article class="cushion" data-wf-cushion="${esc(c.id)}"><span class="tag">${c.learning.mode==='recognize'?'Recognize first':i<3?'Start here':'When you need it'} · ${esc(c.tag)}</span><div class="when">${esc(c.when)}${th(c.whenTh)}</div>${line(c,'c'+i)}<div class="use-note">${esc(c.note)}${th(c.noteTh)}</div></article>`).join('')}</div>`;}
  function render(){body.innerHTML=topTabs()+(tab==='words'?words():tab==='cushions'?cushions():chosen?lesson(flows.find(f=>f.id===chosen)):menu());}
  function fail(){body.innerHTML='<div class="alert"><h2>This view could not open.</h2><p>Choose another app tab to keep studying. Your saved phrase marks are unchanged.</p><button class="button" data-wf-back>Back to the map</button></div>';}
  body.onclick=e=>{try{const b=e.target.closest('button');if(!b||b.disabled)return;
   if(b.hasAttribute('data-wf-tab')){tab=b.dataset.wfTab;render();focus();return;}
   if(b.hasAttribute('data-wf-open')){chosen=b.dataset.wfOpen;index=0;full=true;recall=false;open.clear();render();focus();return;}
   if(b.hasAttribute('data-wf-back')){chosen=null;tab='map';open.clear();render();focus();return;}
   if(b.hasAttribute('data-wf-full')){full=b.dataset.wfFull==='true';render();body.querySelector(`[data-wf-full="${full}"]`).focus({preventScroll:true});return;}
   if(b.hasAttribute('data-wf-focus')){index=Number(b.dataset.wfFocus);full=false;render();focus('.step h3');return;}
   if(b.hasAttribute('data-wf-prev')||b.hasAttribute('data-wf-next')){index+=b.hasAttribute('data-wf-next')?1:-1;render();focus('.step h3');return;}
   if(b.hasAttribute('data-wf-recall')){recall=!recall;open.clear();render();body.querySelector('[data-wf-recall]').focus({preventScroll:true});return;}
   if(b.hasAttribute('data-wf-restart')){index=0;full=false;open.clear();render();focus('.step h3');return;}
   if(b.hasAttribute('data-wf-words')){allWords=b.dataset.wfWords==='all';render();body.querySelector(`[data-wf-words="${allWords?'all':'first'}"]`).focus({preventScroll:true});return;}
   if(b.hasAttribute('data-wf-reveal')){const key=b.dataset.wfReveal;open.has(key)?open.delete(key):open.add(key);const show=open.has(key);b.closest('.utterance').classList.toggle('is-open',show);root.getElementById(b.getAttribute('aria-controls')).hidden=!show;b.setAttribute('aria-expanded',show);const cue=b.querySelector('.cue');if(cue)cue.textContent=show?'Hide reading & meaning':'Tap for furigana · English · ไทย';else{b.textContent=show?'Hide Japanese':'Say it → show Japanese';b.classList.toggle('red',!show);}return;}
  }catch(e){fail();}};
  body.onchange=e=>{try{if(e.target.id==='wf-step-select'){index=Number(e.target.value);render();body.querySelector('#wf-step-select').focus({preventScroll:true});}}catch(e){fail();}};
  body.oninput=e=>{try{if(e.target.id==='wf-word-search'){query=e.target.value;body.querySelector('#wf-word-list').innerHTML=wordList();}}catch(e){fail();}};
  render();
 }
 window.CounterNotesWorkflows={mount};
})();

const DATA = {"phrases":[{"id":"p001","cat":"welcome","speaker":"staff","jp":"いらっしゃいませ。{本日|ほんじつ}はどのようなご{用件|ようけん}でしょうか。","en":"Welcome. What can we help you with today?","th":"ยินดีต้อนรับค่ะ วันนี้มาติดต่อเรื่องอะไรคะ","essential":true,"learning":{"mode":"active","audience":"customer","function":"Open the visit"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["job-listing"],"scope":"The document supplies work context only. This sentence, its frequency/priority judgment and any scenario are authored teaching material."},"facts":[]}},{"id":"p002","cat":"welcome","speaker":"staff","jp":"ご{予約|よやく}はございますか。","en":"Do you have an appointment?","th":"ได้นัดหมายไว้ไหมคะ","note":"Ask whether they have a booking; this does not imply bookings are required.","noteTh":"ใช้ถามว่านัดหมายไว้หรือไม่ ไม่ได้หมายความว่าร้านบังคับให้จองก่อนค่ะ","essential":true,"learning":{"mode":"active","audience":"customer","function":"Check an appointment"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["job-listing"],"scope":"The document supplies work context only. This sentence, its frequency/priority judgment and any scenario are authored teaching material."},"facts":[]}},{"id":"p003","cat":"welcome","speaker":"staff","jp":"お{名前|なまえ}を{伺|うかが}ってもよろしいでしょうか。","en":"May I have your name?","th":"ขอทราบชื่อได้ไหมคะ","note":"伺う is the humble form of 聞く here.","noteTh":"ในประโยคนี้ 伺う เป็นรูปถ่อมตัวของ 聞く ซึ่งหมายถึงถามค่ะ","essential":true,"learning":{"mode":"active","audience":"customer","function":"Ask a name"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["job-listing"],"scope":"The document supplies work context only. This sentence, its frequency/priority judgment and any scenario are authored teaching material."},"facts":[]}},{"id":"p004","cat":"welcome","speaker":"staff","jp":"こちらのお{席|せき}へどうぞ。","en":"Please take a seat here.","th":"เชิญนั่งทางนี้ค่ะ","essential":true,"learning":{"mode"
