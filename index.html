"รบกวนขอทราบชื่อด้วยค่ะ","when":"Before asking for information or a document.","whenTh":"ก่อนขอข้อมูลหรือเอกสาร"},{"en":"Sorry for the trouble; please fill this in here.","id":"effort","jp":"お{手数|てすう}ですが、こちらにご{記入|きにゅう}ください。","learning":{"audience":"customer","function":"Request customer effort","mode":"active"},"note":"お手数ですが acknowledges the work you are asking the customer to do.","noteTh":"お手数ですが แสดงว่าเราเข้าใจว่ากำลังขอให้ลูกค้าเสียเวลาหรือออกแรงทำบางอย่าง","provenance":{"basis":{"category":"C","scope":"General workplace-Japanese teaching; no employer-specific claim.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"tag":"Asking for effort","th":"รบกวนกรอกตรงนี้ด้วยค่ะ","when":"When the customer needs to write, bring something or take an extra step.","whenTh":"เมื่อต้องให้ลูกค้าเขียน นำของมา หรือทำขั้นตอนเพิ่ม"},{"en":"I’m sorry. Please wait a little longer.","id":"wait","jp":"{申|もう}し{訳|わけ}ありません。もう{少々|しょうしょう}お{待|ま}ちください。","learning":{"audience":"customer","function":"Apologise and ask for more time","mode":"active"},"note":"Use it for an actual inconvenience. A routine short wait can simply be 少々お待ちください.","noteTh":"ใช้เมื่อมีความไม่สะดวกเกิดขึ้นจริง ถ้าขอให้รอสั้น ๆ ตามปกติ ใช้ 少々お待ちください ได้เลย","provenance":{"basis":{"category":"C","scope":"General workplace-Japanese teaching; no employer-specific claim.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"tag":"Apologise + ask for more time","th":"ขออภัยค่ะ กรุณารออีกสักครู่นะคะ","when":"When a wait has become longer or you need to apologise.","whenTh":"เมื่อให้รอนานขึ้นหรือมีเรื่องที่ต้องขอโทษ"},{"en":"If you’d like, please have a look at this too.","id":"optional","jp":"よろしければ、こちらもご{覧|らん}ください。","learning":{"audience":"customer","function":"Make an optional offer","mode":"active"},"note":"よろしければ means “if you would like.” Use it for an optional suggestion, not a required identity check.","noteTh":"よろしければ หมายถึงถ้าสะดวกหรือสนใจ ใช้กับข้อเสนอที่เลือกได้ ไม่ใช้กับการตรวจตัวตนที่จำเป็น","provenance":{"basis":{"category":"C","scope":"General workplace-Japanese teaching; no employer-specific claim.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"tag":"An optional offer","th":"ถ้าสนใจ ลองดูอันนี้ด้วยได้นะคะ","when":"When the customer is free to accept or decline.","whenTh":"เมื่อลูกค้าเลือกตอบรับหรือปฏิเสธได้"},{"en":"Just to make sure, I will confirm the phone number.","id":"doublecheck","jp":"{念|ねん}のため、{電話番号|でんわばんごう}を{確認|かくにん}します。","learning":{"audience":"customer","function":"Explain a precautionary check","mode":"active"},"note":"念のため explains why you are checking again; it is not an apology.","noteTh":"念のため บอกเหตุผลที่ตรวจซ้ำ ไม่ใช่คำขอโทษ","provenance":{"basis":{"category":"C","scope":"General workplace-Japanese teaching; no employer-specific claim.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"tag":"Explain a recheck","th":"เพื่อความแน่ใจ ขอเช็กเบอร์โทรอีกครั้งค่ะ","when":"When confirming a detail again to avoid a mistake.","whenTh":"เมื่อยืนยันข้อมูลซ้ำเพื่อป้องกันความผิดพลาด"},{"en":"Excuse me, could you tell me your name once more?","id":"repeat","jp":"{失礼|しつれい}ですが、お{名前|なまえ}をもう{一度|いちど}お{願|ねが}いします。","learning":{"audience":"customer","function":"Ask for a name again","mode":"recognize"},"note":"Recognize 失礼ですが as a courteous opening to a potentially intrusive question. For a missed name, reuse 恐れ入りますが or simply もう一度お願いします; you need not memorize a second opening yet.","noteTh":"จำว่า 失礼ですが ใช้เกริ่นอย่างสุภาพเมื่อคำถามอาจรบกวนอีกฝ่าย ถ้าฟังชื่อไม่ทัน ใช้ 恐れ入りますが ที่เรียนแล้ว หรือ もう一度お願いします ได้ ยังไม่ต้องจำคำเกริ่นเพิ่ม","provenance":{"basis":{"category":"C","scope":"General workplace-Japanese teaching; no employer-specific claim.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"tag":"A slightly awkward question","th":"ขออภัยค่ะ รบกวนบอกชื่ออีกครั้งได้ไหมคะ","when":"When you need the customer to tell you their name again.","whenTh":"เมื่อต้องขอให้ลูกค้าบอกชื่ออีกครั้ง"}],"followups":[{"cat":"contract","en":"Thank you for waiting. We can proceed using this method.","essential":false,"id":"p089","introduced":"1.1","jp":"お{待|ま}たせしました。この{方法|ほうほう}でお{手続|てつづ}きできます。","learning":{"audience":"customer","function":"Possible after checking","mode":"active"},"note":"After the actual method has been checked and confirmed available. Point out which method; this does not mean the application is approved.","noteTh":"ใช้หลังตรวจแล้วว่าวิธีนี้ใช้ได้จริง ระบุให้ชัดว่าวิธีไหน ไม่ได้แปลว่าคำขออนุมัติแล้ว","provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"speaker":"staff","th":"ขอบคุณที่รอค่ะ ดำเนินการด้วยวิธีนี้ได้ค่ะ"},{"cat":"contract","en":"After checking, we cannot proceed using this method.","essential":false,"id":"p090","introduced":"1.1","jp":"{確認|かくにん}したところ、この{方法|ほうほう}ではお{手続|てつづ}きできません。","learning":{"audience":"customer","function":"Method not available","mode":"active"},"note":"A confirmed negative result, not an unknown answer. Follow with the verified reason or an available alternative.","noteTh":"ใช้เมื่อยืนยันแล้วว่าทำด้วยวิธีนี้ไม่ได้ ไม่ใช่เมื่อยังไม่รู้คำตอบ บอกเหตุผลที่ตรวจแล้วหรือทางเลือกต่อ","provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"speaker":"staff","th":"ตรวจสอบแล้ว ไม่สามารถดำเนินการด้วยวิธีนี้ได้ค่ะ"},{"cat":"contract","en":"This procedure requires the document shown here.","essential":false,"id":"p091","introduced":"1.1","jp":"このお{手続|てつづ}きには、こちらの{書類|しょるい}が{必要|ひつよう}です。","learning":{"audience":"customer","function":"Explain a checked requirement","mode":"active"},"note":"Point to the specific document on the checked list. No document type or docomo requirement is supplied by this example.","noteTh":"ชี้เอกสารที่ต้องใช้จากรายการที่ตรวจแล้ว ตัวอย่างนี้ไม่ได้กำหนดว่าต้องเป็นเอกสารชนิดใดหรือเป็นกฎของ docomo","provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"speaker":"staff","th":"ขั้นตอนนี้ต้องใช้เอกสารที่แสดงตรงนี้ค่ะ"},{"cat":"contract","en":"We can help using this alternative. Would you like to proceed this way?","essential":false,"id":"p093","introduced":"1.1","jp":"こちらの{方法|ほうほう}なら{対応|たいおう}できます。こちらで{進|すす}めますか。","learning":{"audience":"customer","function":"Offer an available alternative","mode":"active"},"note":"Only after checking the alternative and explaining any differences, costs or conditions. なら limits the statement to this method.","noteTh":"ตรวจทางเลือกก่อน และอธิบายความต่าง ค่าใช้จ่ายหรือเงื่อนไขที่เกี่ยวข้อง なら จำกัดความหมายว่าเป็นวิธีนี้","provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"speaker":"staff","th":"ถ้าเป็นวิธีนี้ ดำเนินการได้ค่ะ ต้องการใช้วิธีนี้ไหมคะ"},{"cat":"contract","en":"Next, please check these details.","essential":false,"id":"p094","introduced":"1.1","jp":"{次|つぎ}に、こちらの{内容|ないよう}をご{確認|かくにん}ください。","learning":{"audience":"customer","function":"Give the next customer action","mode":"active"},"note":"Point to the actual details. 次に is a simple transition, not a cushion that needs another apology.","noteTh":"ชี้รายละเอียดที่ต้องตรวจจริง 次に ใช้เปลี่ยนไปขั้นตอนถัดไป ไม่ต้องเติมคำขอโทษ","provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"speaker":"staff","th":"ต่อไป รบกวนตรวจรายละเอียดตรงนี้ค่ะ"},{"cat":"contract","en":"I have confirmed it. This procedure is complete.","essential":false,"id":"p095","introduced":"1.1","jp":"{確認|かくにん}できました。こちらのお{手続|てつづ}きは{完了|かんりょう}しています。","learning":{"audience":"customer","function":"Report verified completion","mode":"active"},"note":"Only after confirming the actual completion status. Name or point to the completed task; do not include pending work or a future activation.","noteTh":"ใช้หลังตรวจสถานะว่าเสร็จจริง ระบุงานที่เสร็จ ไม่รวมงานค้างหรือการเปิดใช้งานในอนาคต","provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"speaker":"staff","th":"ตรวจสอบแล้วค่ะ ขั้นตอนนี้เสร็จเรียบร้อยแล้วค่ะ"},{"cat":"coworkers","en":"This is a billing question. The customer says the amount differs from what was explained.","essential":false,"id":"p096","introduced":"1.1","jp":"{料金|りょうきん}についてのご{相談|そうだん}です。{説明|せつめい}された{金額|きんがく}と{違|ちが}うとのことです。","learning":{"audience":"coworker","function":"Brief the customer situation","mode":"active"},"note":"To a colleague: report the customer’s claim, not a confirmed billing error. とのことです marks reported information.","noteTh":"บอกเพื่อนร่วมงานว่านี่คือสิ่งที่ลูกค้าแจ้ง ยังไม่ได้ยืนยันว่าบิลผิด とのことです ใช้รายงานคำพูดอีกฝ่าย","provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"speaker":"staff","th":"ลูกค้ามาปรึกษาเรื่องค่าบริการค่ะ บอกว่ายอดไม่ตรงกับที่อธิบายไว้"},{"cat":"coworkers","en":"I checked the billing details. I have not checked the application record yet.","essential":false,"id":"p097","introduced":"1.1","jp":"{請求内容|せいきゅうないよう}は{確認|かくにん}しました。{申込記録|もうしこみきろく}はまだです。","learning":{"audience":"coworker","function":"Say what is checked and pending","mode":"active"},"note":"Internal shorthand: はまだです refers to the checking just mentioned. Use only for work actually done.","noteTh":"รูปย่อที่ใช้ในทีม はまだです หมายถึงยังไม่ได้ตรวจตามประโยคก่อนหน้า แจ้งเฉพาะงานที่ทำแล้วจริง","provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"speaker":"staff","th":"ตรวจรายละเอียดบิลแล้วค่ะ แต่ยังไม่ได้ตรวจประวัติการสมัคร"},{"cat":"coworkers","en":"I do not understand why this charge applies. Could you check it with me?","essential":false,"id":"p098","introduced":"1.1","jp":"この{料金|りょうきん}がかかる{理由|りゆう}が{分|わ}かりません。{一緒|いっしょ}に{確認|かくにん}してもらえますか。","learning":{"audience":"coworker","function":"Name uncertainty and ask for help","mode":"active"},"note":"To a coworker; state the specific unknown. もらえますか is ordinary polite team language.","noteTh":"พูดกับเพื่อนร่วมงานและระบุจุดที่ไม่แน่ใจ もらえますか เป็นคำขอสุภาพทั่วไปในทีม","provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"speaker":"staff","th":"ยังไม่เข้าใจว่าทำไมถึงมีค่าบริการนี้ค่ะ ช่วยตรวจด้วยกันได้ไหมคะ"},{"cat":"coworkers","en":"Please check whether this explanation is correct.","essential":false,"id":"p099","introduced":"1.1","jp":"この{案内|あんない}で{合|あ}っているか、{確認|かくにん}をお{願|ねが}いします。","learning":{"audience":"coworker","function":"Ask a supervisor to check your explanation","mode":"active"},"note":"Show or repeat the proposed explanation to the colleague or supervisor. この案内 needs a concrete referent.","noteTh":"แสดงหรือพูดคำอธิบายที่เตรียมไว้ให้เพื่อนร่วมงานหรือหัวหน้าฟัง ต้องบอกให้รู้ว่า この案内 หมายถึงคำอธิบายใด","provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"speaker":"staff","th":"รบกวนตรวจความถูกต้องของคำอธิบายนี้ให้หน่อยค่ะ"},{"cat":"coworkers","en":"Could you take over from here?","essential":false,"id":"p100","introduced":"1.1","jp":"ここから{対応|たいおう}を{代|か}わってもらえますか。","learning":{"audience":"coworker","function":"Ask a colleague to take over","mode":"active"},"note":"After briefing the situation, completed checks and open questions. This asks for a takeover; it does not assume the colleague has accepted.","noteTh":"ใช้หลังสรุปเรื่อง งานที่ตรวจแล้ว และข้อสงสัยที่ค้าง เป็นการขอให้รับช่วง ยังไม่ถือว่าอีกฝ่ายตกลงแล้ว","provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"speaker":"staff","th":"ช่วยรับช่วงดูแลต่อจากตรงนี้ได้ไหมคะ"},{"cat":"contract","en":"A required document is missing, so we cannot proceed yet.","essential":false,"id":"p104","introduced":"1.1","jp":"{必要|ひつよう}な{書類|しょるい}が{足|た}りないので、{今|いま}はお{手続|てつづ}きを{進|すす}められません。","learning":{"audience":"customer","function":"Missing required document","mode":"active"},"note":"Only after checking the actual requirements. Show exactly what is missing and the permitted next action.","noteTh":"ใช้หลังตรวจข้อกำหนดจริงแล้ว ระบุเอกสารที่ขาดและสิ่งที่ลูกค้าทำต่อได้","provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"speaker":"staff","th":"เอกสารที่ต้องใช้ยังไม่ครบ จึงยังดำเนินการต่อไม่ได้ค่ะ"},{"cat":"rescue","en":"I cannot confirm it here. I will check with the colleague who handles it.","essential":false,"id":"p105","introduced":"1.1","jp":"こちらでは{確認|かくにん}できません。{担当|たんとう}の{者|もの}に{確認|かくにん}します。","learning":{"audience":"customer","function":"Unable to confirm here","mode":"active"},"note":"Unable to verify with your current information or tools; not the same as saying the request is impossible.","noteTh":"ใช้เมื่อข้อมูลหรือเครื่องมือที่มีไม่พอจะยืนยัน ไม่ได้หมายความว่าคำขอลูกค้าทำไม่ได้","provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"speaker":"staff","th":"ตรงนี้ยังยืนยันไม่ได้ ขอเช็กกับผู้ดูแลเรื่องนี้ค่ะ"},{"cat":"rescue","en":"There is one more point I need to check. Please wait a moment.","essential":false,"id":"p106","introduced":"1.1","jp":"もう{一点|いってん}、{確認|かくにん}が{必要|ひつよう}です。{少々|しょうしょう}お{待|ま}ちください。","learning":{"audience":"customer","function":"One more check is needed","mode":"active"},"note":"A specific extra check remains. If you do not know the waiting time, do not invent a duration.","noteTh":"ใช้เมื่อยังมีจุดที่ต้องตรวจเพิ่ม หากไม่รู้เวลารอ ไม่กำหนดเวลาเอง","provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"speaker":"staff","th":"มีอีกจุดที่ต้องตรวจสอบค่ะ รอสักครู่นะคะ"},{"cat":"support","en":"Please fill this in first. Let me know when you have finished.","essential":false,"id":"p107","introduced":"1.1","jp":"{先|さき}に、こちらの{入力|にゅうりょく}をお{願|ねが}いします。{終|お}わりましたらお{知|し}らせください。","learning":{"audience":"customer","function":"Customer action must come first","mode":"active"},"note":"Show the required field after explaining it. For a password/code, let the customer enter it privately; this is not permission to ask them to read it aloud.","noteTh":"อธิบายแล้วชี้ช่องที่ต้องกรอก หากเป็นรหัสผ่านหรือรหัสยืนยัน ให้ลูกค้ากรอกเองเป็นส่วนตัว ไม่ใช่ขอให้อ่านรหัสออกมา","provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"speaker":"staff","th":"รบกวนกรอกตรงนี้ก่อนค่ะ เสร็จแล้วแจ้งด้วยนะคะ"},{"cat":"rescue","en":"The colleague handling this is coming. Please wait a moment.","essential":false,"id":"p108","introduced":"1.1","jp":"{担当|たんとう}の{者|もの}がまいりますので、{少々|しょうしょう}お{待|ま}ちください。","learning":{"audience":"customer","function":"Wait for the colleague who accepted","mode":"active"},"note":"Use after the colleague has accepted and confirmed they are coming. It is not a promise to use while still looking for help.","noteTh":"ใช้เมื่อเพื่อนร่วมงานรับเรื่องและยืนยันว่าจะมาแล้ว ไม่ใช้ขณะที่ยังหาคนช่วยไม่ได้","provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"speaker":"staff","th":"พนักงานที่ดูแลเรื่องนี้กำลังมาค่ะ รอสักครู่นะคะ"},{"cat":"contract","en":"We cannot complete the procedure now. Please speak with us again once you have the required items.","essential":false,"id":"p109","introduced":"1.1","jp":"{今|いま}はお{手続|てつづ}きを{完了|かんりょう}できません。{必要|ひつよう}なものがそろいましたら、{改|あらた}めてご{相談|そうだん}ください。","learning":{"audience":"customer","function":"Cannot finish now; explain the return point","mode":"active"},"note":"After identifying the missing items and confirming this is the appropriate next action. This does not promise approval or completion on the next visit.","noteTh":"ใช้หลังระบุสิ่งที่ขาดและตรวจแล้วว่ ":"Buy time while checking"},{"en":"Thank you for waiting. Is it the August bill?","enAction":"Read the verified billing month and confirm which bill they intend to pay.","gate":"Replace August with the billing month you actually verified. A billing month is not necessarily the month of usage. If the customer is unsure, check the bill with your trainer instead of guessing.","gateTh":"เปลี่ยนเดือนสิงหาคมเป็นเดือนของรอบบิลที่ตรวจสอบจริง เดือนของรอบบิลไม่จำเป็นต้องตรงกับเดือนที่ใช้งาน ถ้าลูกค้าไม่แน่ใจ ให้ตรวจสอบบิลกับผู้สอนงานแทนการเดา","hear":{"en":"Yes, that one.","id":"payment-05-hear","jp":"はい、それです。","learning":{"audience":"learner","function":"Hear the reaction: Confirm the billing month","mode":"recognize","trigger":"Read the verified billing month and confirm which bill they intend to pay.","triggerTh":"อ่านเดือนของรอบบิลที่ตรวจสอบแล้ว และยืนยันว่าลูกค้าต้องการชำระบิลนั้น"},"provenance":{"basis":{"category":"C","scope":"General workplace-Japanese teaching; no employer-specific claim.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"th":"ใช่ บิลนั้นครับ/ค่ะ"},"id":"payment-05","jp":"お{待|ま}たせしました。{8月|はちがつ}ご{請求分|せいきゅうぶん}でよろしいですか。","learning":{"audience":"customer","function":"Confirm bill","mode":"active"},"provenance":{"basis":{"category":"B","scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below.","sourceIds":["reported-payment"]},"explanations":"C","facts":[],"language":"C"},"th":"ขอบคุณที่รอค่ะ เป็นรอบบิลเดือนสิงหาคมใช่ไหมคะ","thAction":"อ่านเดือนของรอบบิลที่ตรวจสอบแล้ว และยืนยันว่าลูกค้าต้องการชำระบิลนั้น","title":"Confirm the billing month"},{"en":"The amount due is ¥13,600.","enAction":"Point out the verified amount due.","id":"payment-06","jp":"お{支払|しはら}いは{13,600円|いちまんさんぜんろっぴゃくえん}です。","learning":{"audience":"customer","function":"State amount","mode":"active"},"provenance":{"basis":{"category":"B","scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below.","sourceIds":["reported-payment"]},"explanations":"C","facts":[],"language":"C"},"th":"ยอดชำระ 13,600 เยนค่ะ","thAction":"ชี้และแจ้งยอดชำระที่ตรวจสอบแล้ว","title":"Show the amount"},{"en":"Would you like cash or credit card?","enAction":"Ask the payment method from the options approved for this bill.","gate":"Cash and credit card are the options in your reported training, not a universal rule for every payment. Confirm the options for this transaction. If card is chosen and you have not learned that procedure, ask your trainer.","gateTh":"เงินสดและบัตรเครดิตเป็นตัวเลือกตามที่คุณเล่าว่าเรียนมา ไม่ใช่กฎที่ใช้ได้กับการชำระทุกกรณี ให้ยืนยันว่ารายการนี้ใช้วิธีใดได้บ้าง ถ้าลูกค้าเลือกบัตรและคุณยังไม่เคยเรียนขั้นตอนนี้ ให้ถามผู้สอนงาน","hear":{"en":"Cash, please.","id":"payment-07-hear","jp":"{現金|げんきん}でお{願|ねが}いします。","learning":{"audience":"learner","function":"Hear the reaction: Ask how to pay","mode":"recognize","trigger":"Ask the payment method from the options approved for this bill.","triggerTh":"ถามวิธีชำระจากตัวเลือกที่ใช้ได้กับบิลนี้"},"provenance":{"basis":{"category":"C","scope":"General workplace-Japanese teaching; no employer-specific claim.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"th":"จ่ายเงินสดครับ/ค่ะ"},"id":"payment-07","jp":"{現金|げんきん}とクレジットカード、どちらにされますか。","learning":{"audience":"customer","function":"Offer verified choices","mode":"active"},"provenance":{"basis":{"category":"B","scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below.","sourceIds":["reported-payment"]},"explanations":"C","facts":[],"language":"C"},"th":"ต้องการชำระด้วยเงินสดหรือบัตรเครดิตคะ","thAction":"ถามวิธีชำระจากตัวเลือกที่ใช้ได้กับบิลนี้","title":"Ask how to pay"},{"en":"I have received ¥15,000.","enAction":"Count the cash using the shop's method and say the amount actually received.","id":"payment-08","jp":"{15,000円|いちまんごせんえん}お{預|あず}かりします。","learning":{"audience":"customer","function":"Acknowledge receipt","mode":"active"},"provenance":{"basis":{"category":"B","scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below.","sourceIds":["reported-payment"]},"explanations":"C","facts":[],"language":"C"},"th":"รับเงินมา 15,000 เยนนะคะ","thAction":"นับเงินตามวิธีของร้าน แล้วแจ้งจำนวนเงินที่รับมาจริง","title":"Confirm the cash received"},{"en":"I will prepare your change and receipt. Please wait a moment.","enAction":"Explain the short wait while you complete the cash and receipt steps you were taught.","gate":"The spoken line does not describe how to operate the till or issue the receipt. Use your trainer's procedure and check the change before handing it over.","gateTh":"ประโยคนี้ไม่ได้อธิบายวิธีใช้เครื่องรับเงินหรือออกใบเสร็จ ให้ทำตามขั้นตอนของผู้สอนงาน และตรวจสอบเงินทอนก่อนส่งให้ลูกค้า","id":"payment-09","jp":"お{釣|つ}りと{領収書|りょうしゅうしょ}をご{用意|ようい}します。{少々|しょうしょう}お{待|ま}ちください。","learning":{"audience":"customer","function":"Explain wait","mode":"active"},"provenance":{"basis":{"category":"B","scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below.","sourceIds":["reported-payment"]},"explanations":"C","facts":[],"language":"C"},"th":"ขอเตรียมเงินทอนและใบเสร็จ กรุณารอสักครู่ค่ะ","thAction":"แจ้งให้ลูกค้ารอระหว่างทำขั้นตอนรับเงิน ทอนเงิน และออกใบเสร็จตามที่เรียนมา","title":"Prepare the change and receipt"},{"en":"Thank you for waiting. Is the name shown here correct?","enAction":"Point to the name being checked, using the display or document your trainer specified.","gate":"Your reported script does not establish which name or document this check refers to. Confirm the object and how to show it with your trainer :"That completes the procedure. Thank you.","enAction":"Close once the payment process and any required final checks are complete.","id":"payment-14","jp":"お{手続|てつづ}きは{以上|いじょう}です。ありがとうございました。","learning":{"audience":"customer","function":"Close","mode":"active"},"provenance":{"basis":{"category":"B","scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below.","sourceIds":["reported-payment"]},"explanations":"C","facts":[],"language":"C"},"th":"ดำเนินการเรียบร้อยแล้วค่ะ ขอบคุณค่ะ","thAction":"กล่าวปิดเมื่อดำเนินการชำระเงินและตรวจสอบขั้นตอนสุดท้ายที่จำเป็นครบแล้ว","title":"Close the visit"}],"th":"รับชำระค่าบริการ","title":"料金収納"},{"doneWhen":"The customer has checked the final details and agreed setup. Any unfinished data or app work has a clear next action. Detailed price explanations still need trainer practice.","doneWhenTh":"ลูกค้าตรวจรายละเอียดและงานตั้งค่าที่ตกลงไว้แล้ว หากข้อมูลหรือแอปยังไม่เสร็จ ต้องบอกขั้นตอนต่อไปให้ชัด ยังต้องฝึกอธิบายราคาจริงกับพี่เลี้ยง","en":"Change to a new phone","followupIds":["p089","p093","p094","p095"],"id":"upgrade","intro":"Practice one stage at a time: understand the request → check → choose → explain → get agreement → process → set up → hand over.","introTh":"ฝึกทีละช่วง: ฟังความต้องการ → ตรวจสอบ → เลือกเครื่อง → อธิบาย → ขอความยินยอม → ดำเนินการ → ตั้งค่า → ส่งมอบ","outcome":"Reach a checked handover of the chosen phone.","outcomeTh":"ฝึกจนถึงตรวจและส่งมอบเครื่องที่เลือก","provenance":{"basis":{"category":"B","scope":"Original communicative stage order based on the cited context. Neither completeness nor exact internal order is established.","sourceIds":["public-upgrade-1"]},"explanations":"C","facts":[],"language":"C"},"reading":"きしゅへんこう","scope":"For an existing docomo customer buying a new phone. Docomo's public shop guide supports preparation, product selection/application, and confirmation/receipt. The eight-stage speakin ิมหรือไม่ ฟังให้ชัดก่อนเลือกประเภทงานค่ะ","title":"Confirm the request"},{"en":"Are you the contract holder? Your identification document, please.","enAction":"Identify the contract holder and use the store's approved identity-check procedure.","gate":"Trainer check: acceptable documents, representative/family cases, and the customer's current phone/SIM. If anything is missing, confirm the permitted next step before proceeding.","gateTh":"ให้พี่เลี้ยงตรวจ: เอกสารที่ใช้ได้ กรณีตัวแทนหรือครอบครัว และเครื่องกับ SIM ที่ใช้อยู่ หากขาดสิ่งใด ให้ถามก่อนว่าสามารถดำเนินการต่ออย่างไรได้ค่ะ","id":"upgrade-02","jp":"ご{契約者|けいやくしゃ}ご{本人|ほんにん}ですか。{本人確認書類|ほんにんかくにんしょるい}をお{願|ねが}いします。","learning":{"audience":"customer","function":"Check applicant","mode":"active"},"provenance":{"basis":{"category":"B","scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below.","sourceIds":["public-upgrade-1"]},"explanations":"C","facts":[],"language":"C"},"th":"เป็นเจ้าของสัญญาเองใช่ไหมคะ ขอเอกสารยืนยันตัวตนด้วยค่ะ","thAction":"ตรวจสอบว่าใครเป็นเจ้าของสัญญา แล้วดำเนินการยืนยันตัวตนตามขั้นตอนของร้านค่ะ","title":"Check who is applying"},{"en":"Do you have a model in mind?","enAction":"Ask what matters to the customer, then check the actual model, colour, storage and availability.","hear":{"en":"I'm not good with complicated things, so I'd like one that's easy to use.","id":"upgrade-03-hear","jp":"{難|むずか}しいのは{苦手|にがて}なので、{使|つか}いやすいのがいいです。","learning":{"audience":"learner","function":"Hear the reaction: Choose a phone","mode":"recognize","trigger":"Ask what matters to the customer, then check the actual model, colour, storage and availability.","triggerTh":"ถามสิ่งที่ลูกค้าให้ความสำคัญ แล้วตรวจสอบรุ่น สี ความจุ และสินค้าที่มีจริงค่ะ"},"provenance":{"basis":{"category":"C","scope":"General workplace-Japanese teaching; no employer-specific claim.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"th":"ไม่ถนัดอะไรยุ่งยาก อยากได้แบบใช้งานง่าย"},"id":"upgrade-03","jp":"ご{希望|きぼう}の{機種|きしゅ}はありますか。","learning":{"audience":"customer","function":"Ask preference","mode":"active"},"provenance":{"basis":{"category":"B","scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below.","sourceIds":["public-upgrade-1"]},"explanations":"C","facts":[],"language":"C"},"th":"มีรุ่นที่ต้องการไหมคะ","thAction":"ถามสิ่งที่ลูกค้าให้ความสำคัญ แล้วตรวจสอบรุ่น สี ความจุ และสินค้าที่มีจริงค่ะ","title":"Choose a phone"},{"en":"I will explain the phone price and monthly charges separately.","enAction":"Use the approved estimate. Separate the phone cost, recurring charges and other charges; explain any conditions that affect the estimate.","gate":"Use actual verified amounts. Have a trainer check instalment terms, optional services, any existing balance or return programme, and when each charge applies before explaining them.","gateTh":"ใช้ยอดจริงที่ตรวจสอบแล้ว ให้พี่เลี้ยงตรวจเงื่อนไขผ่อน บริการเสริม ยอดคงเหลือหรือโครงการคืนเครื่องที่เกี่ยวข้อง และช่วงเวลาที่เรียกเก็บแต่ละรายการก่อนอธิบายค่ะ","hear":{"en":"Is this the monthly total? Will there be other charges?","id":"upgrade-04-hear","jp":"これが{毎月|まいつき}の{合計|ごうけい}ですか。ほかにもかかりますか。","learning":{"audience":"learner","function":"Hear the reaction: Explain the verified costs","mode":"recognize","trigger":"Use the approved estimate. Separate the phone cost, recurring charges and other charges; explain any conditions that affect the estimate.","triggerTh":"ใช้ใบประมาณราคาที่ตรวจสอบแล้ว แยกราคาเครื่อง ค่าบริการรายเดือน และค่าใช้จ่ายอื่น พร้อมอธิบายเงื่อนไขที่มีผลต่อยอดค่ะ"},"provenance":{"basis":{"category":"C","scope":"General workplace-Japanese teaching; no employer-specific claim.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"th":"นี่คือยอดรวมต่อเดือนใช่ไหม มีค่าใช้จ่ายอื่นอีกไหม"},"id":"upgrade-04","jp":"{機種代金|きしゅだいきん}と{毎月|まいつき}の{料金|りょうきん}を{分|わ}けてご{説明|せつめい}します。","learning":{"audience":"customer","function":"Explain costs","mode":"active"},"provenance":{"basis":{"category":"B","scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below.","sourceIds":["public-upgrade-1"]},"explanations":"C","facts":[],"language":"C"},"reply":{"en":"I will explain it again, including any separate charges.","id":"upgrade-04-reply","jp":"{別|べつ}にかかる{費用|ひよう}も{含|ふく}めて、もう{一度|いちど}ご{説明|せつめい}します。","learning":{"audience":"customer","function":"Answer the reaction: Explain the verified costs","mode":"active","trigger":"Use the approved estimate. Separate the phone cost, recurring charges and other charges; explain any conditions that affect the estimate.","triggerTh":"ใช้ใบประมาณราคาที่ตรวจสอบแล้ว แยกราคาเครื่อง ค่าบริการรายเดือน และค่าใช้จ่ายอื่น พร้อมอธิบายเงื่อนไขที่มีผลต่อยอดค่ะ"},"provenance":{"basis":{"category":"C","scope":"General workplace-Japanese teaching; no employer-specific claim.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"th":"จะอธิบายอีกครั้งโดยรวมค่าใช้จ่ายที่ต้องจ่ายแยกด้วยค่ะ"},"th":"จะแยกอธิบายราคาเครื่องกับค่าบริการรายเดือนค่ะ","thAction":"ใช้ใบประมาณราคาที่ตรวจสอบแล้ว แยกราคาเครื่อง ค่าบริการรายเดือน และค่าใช้จ่ายอื่น พร้อมอธิบายเงื่อนไขที่มีผลต่อยอดค่ะ","title":"Explain the verified costs"},{"en":"Is anything unclear? Are these details okay?","enAction":"Finish the required explanation, resolve questions and confirm the customer's choice before submitting anything.","gate":"A short spoken confirmation does not replace the store's required explanations, signatures or consent process.","gateTh":"การถามยืนยันสั้น ๆ นี้ไม่แทนการอธิบาย การลงนาม หรือขั้นตอนขอความยินยอมที่ร้านกำหนดค่ะ","id":"upgrade-05","jp":"ご{不明|ふめい}な{点|てん}はありますか。この{内容|ないよう}でよろしいですか。","learning":{"audience":"customer","function":"Confirm / agree","mode":"active"},"provenance":{"basis":{"category":"B","scope":"Commu ailable route","mode":"recognize","trigger":"Ask the trained staff member which options fit this case before recommending a route.","triggerTh":"ให้พนักงานที่ผ่านการฝึกตรวจว่ากรณีนี้ใช้ทางเลือกใดได้บ้าง ก่อนแนะนำขั้นตอนให้ลูกค้าค่ะ"},"provenance":{"basis":{"category":"C","scope":"General workplace-Japanese teaching; no employer-specific claim.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"th":"ต้องใช้ทำงาน อยากกลับมาใช้ได้ให้เร็วที่สุด"},"id":"replacement-04","jp":"{修理|しゅうり}か{交換|こうかん}か、{対応|たいおう}できる{方法|ほうほう}を{確認|かくにん}します。","learning":{"audience":"customer","function":"Check options","mode":"active"},"provenance":{"basis":{"category":"B","scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below.","sourceIds":["public-replacement-1","public-replacement-2","public-replacement-3"]},"explanations":"C","facts":[],"language":"C"},"reply":{"en":"You need it urgently, right? I’ll check when you could have a working phone.","id":"replacement-04-reply","jp":"お{急|いそ}ぎですね。いつ{使|つか}えるようになるか、{確認|かくにん}します。","learning":{"audience":"customer","function":"Answer the reaction: Check the available route","mode":"active","trigger":"Ask the trained staff member which options fit this case before recommending a route.","triggerTh":"ให้พนักงานที่ผ่านการฝึกตรวจว่ากรณีนี้ใช้ทางเลือกใดได้บ้าง ก่อนแนะนำขั้นตอนให้ลูกค้าค่ะ"},"provenance":{"basis":{"category":"C","scope":"General workplace-Japanese teaching; no employer-specific claim.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"th":"ต้องการใช้ด่วนใช่ไหมคะ ขอตรวจว่าจะกลับมาใช้งานได้เมื่อไรค่ะ"},"th":"ขอตรวจสอบวิธีที่ดำเนินการได้ เช่น ซ่อมหรือเปลี่ยนเครื่องค่ะ","thAction":"ให้พนักงานที่ผ่านการฝึกตรวจว่ากรณีนี้ใช้ทางเลือกใดได้บ้าง ก่อนแนะนำขั้นตอนให้ลูกค้าค่ะ","title":"Check the available route"},{"en":"I will explain the cost and how to receive the phone.","enAction":"Once replacement is confirmed as an option,  not start, or the customer is unsure, stop here and ask your trainer how to handle the case. This question is not permission to erase it yourself.","gateTh":"docomo ขอให้ลูกค้าลบข้อมูลด้วยตนเอง หากยังไม่ลบ เปิดเครื่องไม่ได้ หรือไม่แน่ใจ ให้หยุดตรงนี้แล้วถามพี่เลี้ยงว่าควรทำอย่างไร คำถามนี้ไม่ใช่การขออนุญาตให้คุณลบข้อมูลเองค่ะ","id":"recycle-05","jp":"{携帯電話|けいたいでんわ}のデータは、もう{消|け}してありますか。","learning":{"audience":"customer","function":"Check erasure","mode":"active"},"provenance":{"basis":{"category":"B","scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below.","sourceIds":["public-recycle-1","public-recycle-2"]},"explanations":"C","facts":[{"category":"A","scope":"FAQ asks the customer to erase data before collection.","sourceIds":["public-recycle-2"]}],"language":"C"},"th":"ลบข้อมูลในโทรศัพท์แล้วหรือยังคะ","thAction":"ถามว่าลูกค้าลบข้อมูลในเครื่องแล้วหรือยัง ก่อนลบต้องจัดการข้อมูลที่ยังต้องใช้ รวมถึงบริการกระเป๋าเงินในมือถือที่เกี่ยวข้องค่ะ","title":"Confirm erasure is finished"},{"en":"Please check that no SIM card or SD card is left inside.","enAction":"Check that removable SIM and memory cards are not left in the phone. Ask your trainer about the actual model.","id":"recycle-06","jp":"{SIM|シム}カードや{SD|エスディー}カードが{残|のこ}っていないか、{確認|かくにん}をお{願|ねが}いします。","learning":{"audience":"customer","function":"Request a card check","mode":"active"},"provenance":{"basis":{"category":"B","scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below.","sourceIds":["public-recycle-1","public-recycle-2"]},"explanations":"C","facts":[{"category":"A","scope":"Collection conditions require checking/removing SIM and memory cards.","sourceIds":["public-recycle-1"]}],"language":"C"},"th":"รบกวนตรวจว่าไม่มี SIM หรือ SD card ค้างอยู่ในเครื่องนะคะ","thAction":"ตรวจว่าไม่มี SIM หรือการ์ดความจำแบบถ :"C"},"th":"ขอตรวจสอบวิธีรับเครื่องรุ่นนี้ก่อนค่ะ กรุณารอสักครู่นะคะ","thAction":"ถามพี่เลี้ยงว่ารุ่นนี้ต้องใช้วิธีใด และอธิบายวิธีนั้นก่อนดำเนินการค่ะ","title":"Check the correct collection method"},{"en":"After collection, we cannot return the phone or its data. May we collect it?","enAction":"After all checks and explanations, clearly explain that collection cannot be undone and wait for a clear yes.","gate":"If the customer hesitates or still needs something from the device, pause here. Do not accept or destroy it until the outstanding issue and required consent are resolved.","gateTh":"หากลูกค้าลังเลหรือยังต้องการอะไรจากเครื่อง ให้พักไว้ก่อน อย่ารับหรือทำลายเครื่องจนกว่าจะจัดการเรื่องที่ค้างและได้รับความยินยอมครบค่ะ","id":"recycle-08","jp":"{回収後|かいしゅうご}は、{携帯電話|けいたいでんわ}もデータもお{返|かえ}しできません。{回収|かいしゅう}してもよろしいですか。","learning":{"audience":"customer","function":"Explain limit / ask permission","mode":"active"},"provenance":{"basis":{"category":"B","scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below.","sourceIds":["public-recycle-1","public-recycle-2"]},"explanations":"C","facts":[{"category":"A","scope":"Collection conditions: the device and its data cannot be returned after collection.","sourceIds":["public-recycle-1"]}],"language":"C"},"th":"หลังรับไปแล้ว เราไม่สามารถคืนเครื่องหรือข้อมูลได้นะคะ ยินยอมให้รับเครื่องไปรีไซเคิลไหมคะ","thAction":"หลังตรวจและอธิบายครบแล้ว แจ้งให้ชัดว่ารับเครื่องไปแล้วคืนไม่ได้ และรอคำตอบยินยอมที่ชัดเจนค่ะ","title":"Get explicit final agreement"},{"en":"We’ve accepted this phone for recycling. Thank you.","enAction":"Use this after the approved collection procedure is complete. Keep the wording about recycling, without claiming that mobile service was cancelled.","id":"recycle-09","jp":"こちらの{携帯電話|けいたいでんわ}は、リサイクルとしてお{引|ひ}き{取|と}りしました。ありがとうございます。","learning":{"audience":"customer","function":"Close collection","mode":"active"},"provenance":{"basis":{"category":"B","scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below.","sourceIds":["public-recycle-1","public-recycle-2"]},"explanations":"C","facts":[],"language":"C"},"th":"รับโทรศัพท์เครื่องนี้ไปรีไซเคิลเรียบร้อยแล้วค่ะ ขอบคุณค่ะ","thAction":"ใช้เมื่อขั้นตอนรับเครื่องของร้านเสร็จแล้ว พูดให้ชัดว่าเสร็จเฉพาะการรับเครื่อง ไม่บอกว่ายกเลิกบริการมือถือแล้วค่ะ","title":"Finish the collection"}],"th":"รับโทรศัพท์เก่าเพื่อรีไซเคิล","title":"携帯電話の回収"},{"doneWhen":"The customer checks the agreed items, knows what remains and receives the devices back. A finished progress bar is not proof that all apps and data work.","doneWhenTh":"ลูกค้าตรวจรายการที่ตกลง รู้ว่ายังเหลืออะไร และรับเครื่องคืน แถบย้ายข้อมูลเต็มไม่ได้ยืนยันว่าแอปและข้อมูลทั้งหมดใช้ได้แล้ว","en":"Set up a phone & transfer data","followupIds":["p107","p105","p106","p095"],"id":"setup","intro":"Find out what they need → agree what the support covers → set up → check together.","introTh":"ถามสิ่งที่ต้องการ → ตกลงขอบเขตบริการ → ตั้งค่า → ตรวจด้วยกัน","outcome":"Check the agreed data and explain unfinished work.","outcomeTh":"ตรวจข้อมูลที่ตกลงไว้และแจ้งงานที่ยังเหลือ","provenance":{"basis":{"category":"B","scope":"Original communicative stage order based on the cited context. Neither completeness nor exact internal order is established.","sourceIds":["public-setup-1","public-setup-2"]},"explanations":"C","facts":[],"language":"C"},"reading":"しょきせってい・データいこう","scope":"The employer's materials include initial setup support. Docomo's public guidance covers supported setup and data-transfer services; availability, charges and transfer method depend on the case. Your trainer demonstrates the actual tools and screens.","scopeTh":"เอกสารบริษัทมีงานช่วยตั้งค่าเริ่มต้น คู่มือสาธารณะของ docomo อธิบายบริการตั้งค่าและย้ายข้อมูล ขอบเขตที่ทำได้ ค่าบริการ และวิธีย้ายขึ้นอยู่กับกรณี ให้พี่เลี้ยงสอนเครื่องมือและหน้า "},{"en":"What data would you like to transfer? Do you have a backup?","enAction":"Ask about photos, contacts and important apps, and whether a backup exists. Check app transfers separately.","gate":"Use the supported method for the actual devices and apps. Do not promise that every photo, chat, account or payment service will transfer.","gateTh":"ใช้วิธีที่รองรับเครื่องและแอปจริง อย่ารับปากว่ารูป แชต บัญชี หรือบริการชำระเงินทุกอย่างจะย้ายได้ค่ะ","hear":{"en":"I'd like to transfer my photos and LINE.","id":"setup-03-hear","jp":"{写真|しゃしん}と{LINE|ライン}を{移|うつ}したいです。","learning":{"audience":"learner","function":"Hear the reaction: List the data they want to keep","mode":"recognize","trigger":"Ask about photos, contacts and important apps, and whether a backup exists. Check app transfers separately.","triggerTh":"ถามเรื่องรูป รายชื่อ และแอปสำคัญ รวมถึงสำรองข้อมูลไว้หรือไม่ ตรวจการย้ายข้อมูลของแต่ละแอปแยกกันค่ะ"},"provenance":{"basis":{"category":"C","scope":"General workplace-Japanese teaching; no employer-specific claim.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"th":"อยากย้ายรูปกับ LINE"},"id":"setup-03","jp":"{移|うつ}したいデータは{何|なん}ですか。バックアップはありますか。","learning":{"audience":"customer","function":"Ask about data","mode":"active"},"provenance":{"basis":{"category":"B","scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below.","sourceIds":["public-setup-1","public-setup-2"]},"explanations":"C","facts":[],"language":"C"},"reply":{"en":"I'll check how to transfer LINE.","id":"setup-03-reply","jp":"{LINE|ライン}は、{引|ひ}き{継|つ}ぎ{方法|ほうほう}を{確認|かくにん}しますね。","learning":{"audience":"customer","function":"Answer the reaction: List the data they want to keep","mode":"active","trigger":"Ask about photos, contacts and important apps, and whether a backup exists. Check app transfers separately.","triggerTh":"ถามเรื่องรูป รายชื่อ และแอปสำคัญ รวมถึงสำรองข้อมูลไว้หรือไม่ ตรวจกา ะงานที่อธิบาย ไม่ใช่อนุญาตให้ลบข้อมูลเครื่องใด หากวิธีนั้นต้องล้างเครื่องหรือลบข้อมูลเดิม ให้พี่เลี้ยงตรวจก่อนและขอความยินยอมเรื่องนั้นอย่างชัดเจนแยกต่างหากค่ะ","id":"setup-05","jp":"この{内容|ないよう}で、{設定|せってい}とデータ{移行|いこう}を{進|すす}めてもよろしいですか。","learning":{"audience":"customer","function":"Ask permission","mode":"active"},"provenance":{"basis":{"category":"B","scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below.","sourceIds":["public-setup-1","public-setup-2"]},"explanations":"C","facts":[],"language":"C"},"th":"ขอเริ่มตั้งค่าและย้ายข้อมูลตามรายละเอียดนี้ได้ไหมคะ","thAction":"เมื่อตกลงขอบเขต ค่าบริการ และสิ่งที่ต้องเตรียมแล้ว ขอความยินยอมก่อนเริ่มตั้งค่าและย้ายข้อมูลจริงค่ะ","title":"Confirm agreement before starting"},{"en":"Please enter the password yourself.","enAction":"Guide the sign-in screen. Have the customer enter passwords or verification codes themselves.","hear":{"en":"I've forgotten my password.","id":"setup-06-hear","jp":"パスワードを{忘|わす}れてしまいました。","learning":{"audience":"learner","function":"Hear the reaction: Let the customer enter credentials","mode":"recognize","trigger":"Guide the sign-in screen. Have the customer enter passwords or verification codes themselves.","triggerTh":"แนะนำหน้าจอเข้าสู่ระบบ ให้ลูกค้ากรอกรหัสผ่านหรือรหัสยืนยันเองค่ะ"},"provenance":{"basis":{"category":"C","scope":"General workplace-Japanese teaching; no employer-specific claim.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"th":"ลืมรหัสผ่านไปแล้ว"},"id":"setup-06","jp":"パスワードは、ご{自身|じしん}で{入力|にゅうりょく}をお{願|ねが}いします。","learning":{"audience":"customer","function":"Request an action","mode":"active"},"provenance":{"basis":{"category":"B","scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below.","sourceIds":["public-setup-1","public-setup-2"]},"explanations":"C","facts":[],"language":"C"},"reply":{"en":"I'll check how to reset it.","id":"setup-06-reply","jp":"{再設定|さいせってい}の{方法|ほうほう}を{確認|かくにん}します。","learning":{"audience":"customer","function":"Answer the reaction: Let the customer enter credentials","mode":"active","trigger":"Guide the sign-in screen. Have the customer enter passwords or verification codes themselves.","triggerTh":"แนะนำหน้าจอเข้าสู่ระบบ ให้ลูกค้ากรอกรหัสผ่านหรือรหัสยืนยันเองค่ะ"},"provenance":{"basis":{"category":"C","scope":"General workplace-Japanese teaching; no employer-specific claim.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"th":"ขอตรวจสอบวิธีตั้งรหัสใหม่ก่อนค่ะ"},"th":"รบกวนกรอกรหัสผ่านด้วยตัวเองนะคะ","thAction":"แนะนำหน้าจอเข้าสู่ระบบ ให้ลูกค้ากรอกรหัสผ่านหรือรหัสยืนยันเองค่ะ","title":"Let the customer enter credentials"},{"en":"The data is transferring. Please wait a little longer.","enAction":"When transfer is actually running, explain the wait without guessing the remaining time.","hear":{"en":"How much longer will it take?","id":"setup-07-hear","jp":"あとどれくらいかかりますか。","learning":{"audience":"learner","function":"Hear the reaction: Give a short update while it runs","mode":"recognize","trigger":"When transfer is actually running, explain the wait without guessing the remaining time.","triggerTh":"เมื่อกำลังย้ายข้อมูลจริง ให้แจ้งระหว่างรอโดยไม่เดาเวลาที่เหลือค่ะ"},"provenance":{"basis":{"category":"C","scope":"General workplace-Japanese teaching; no employer-specific claim.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"th":"ต้องรออีกนานแค่ไหน"},"id":"setup-07","jp":"データを{移|うつ}しています。もう{少々|しょうしょう}お{待|ま}ちください。","learning":{"audience":"customer","function":"Update wait","mode":"active"},"provenance":{"basis":{"category":"B","scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below.","sourceIds":["public-setup-1","public-setup-2"]},"explanations":"C","facts":[],"languag o do.","enAction":"Point out anything still to do and return both devices. Finish only the work that has actually been checked.","gate":"The old phone is not automatically a recycling or return request. Use the appropriate separate flow if the customer asks for that.","gateTh":"อย่าถือว่าลูกค้าต้องการรีไซเคิลหรือคืนเครื่องเก่าโดยอัตโนมัติ หากลูกค้าขอ ให้ใช้ขั้นตอนนั้นแยกต่างหากค่ะ","id":"setup-09","jp":"{設定|せってい}できた{内容|ないよう}と、このあと{必要|ひつよう}なことをご{案内|あんない}します。","learning":{"audience":"customer","function":"Explain next action","mode":"active"},"provenance":{"basis":{"category":"B","scope":"Communicative step inferred for practice; enAction, thAction and trainer checks are teaching guidance unless a factual claim is separately tagged below.","sourceIds":["public-setup-1","public-setup-2"]},"explanations":"C","facts":[],"language":"C"},"th":"ขออธิบายว่าตั้งค่าอะไรเสร็จแล้ว และยังต้องทำอะไรต่อบ้างนะคะ","thAction":"บอกสิ่งที่ยังต้องทำและคืนทั้งสองเครื่อง สรุปเฉพาะงานที่ตรวจว่าเสร็จจริงแล้วค่ะ","title":"Explain remaining tasks and hand back"}],"th":"ตั้งค่าเครื่องและย้ายข้อมูล","title":"初期設定・データ移行"},{"briefs":[{"en":"The 2026.09 cover names docomo Hikari, home 5G and ahamo Hikari. home 5G needs no dedicated internet-line construction, but it is for the registered installation address. Check service availability and conditions before offering it as an alternative.","id":"home-reference-services","provenance":{"basis":{"category":"B","scope":"Original communication pattern. Source motivates the topic, not an official script or an individual customer result.","sourceIds":["photo-new-74","public-home5g"]},"explanations":"C","facts":[{"category":"A","scope":"Paraphrase: names on supplied cover; construction/address restriction in official home 5G guidance.","sourceIds":["photo-new-74","public-home5g"]}],"language":"C"},"th":"ปกเดือน 2026.09 มี docomo Hikari, home 5G และ ahamo Hikari ส่วน home 5G ไม่ต้องติดตั้งสายอินเทอร์เน็ต แต่ใช้ได้ที่ที่อยู่ติดตั้งที่ลงทะเบียนไว้ ต้องตรวจพื้นที่และเงื่อนไขก่อนเสนอเป็นทางเลือก","title":"Recognize the services"},{"en":"Page 17 separates line-installation work from customer-side setup. Ask who handles the router and phone Wi-Fi connection. An existing socket alone does not settle whether work or setup is needed.","id":"home-reference-installation","provenance":{"basis":{"category":"B","scope":"Original communication pattern. Source motivates the topic, not an official script or an individual customer result.","sourceIds":["photo-new-73"]},"explanations":"C","facts":[{"category":"A","scope":"Paraphrase of the labelled work/setup boundary; questions are authored coaching.","sourceIds":["photo-new-73"]}],"language":"C"},"th":"หน้า 17 แยกงานติดตั้งสายกับการตั้งค่าฝั่งลูกค้า ถามให้ชัดว่าใครดูแลเราเตอร์และการต่อ Wi-Fi ในมือถือ มีช่องต่อเดิมอย่างเดียวก็ยังสรุปไม่ได้ว่าต้องทำอะไรเพิ่ม","title":"Installation is not device setup"},{"en":"Your flyers show conditional, time-limited discounts and points offers. Check the later price and any extra submission. Points are not cash. Use the actual customer’s applicable conditions; do not tell them to cancel their old line just from the flyer’s simplified arrows.","id":"home-reference-offers","provenance":{"basis":{"category":"B","scope":"Original communication pattern. Source motivates the topic, not an official script or an individual customer result.","sourceIds":["photo-new-75","photo-new-76","photo-new-77","photo-new-78","public-hikari-benefit"]},"explanations":"C","facts":[{"category":"A","scope":"Paraphrase of conditional/period columns and documentary submission; no amounts or deadlines repeated.","sourceIds":["photo-new-75","photo-new-76","photo-new-77","photo-new-78","public-hikari-benefit"]}],"language":"C"},"th":"ใบปลิวมีส่วนลดและคะแนนที่มีเงื่อนไขหรือระยะจำกัด ตรวจราคาหลังหมดส่วนลดและสิ่งที่ต้องส่งเพิ่ม คะแนนไม่ใช่เงินสด ใช้เงื่อนไขที่ตรงกับลูกค้าจริง อย่าให้ยกเลิกเน็ตเดิมเพียงเพราะเห็นลูกศรขั้นตอนย่อในใบปลิว","title":"A headline is only part of the offer"}],"doneWhen":"The colleague has accepted the case. The customer knows the coverage result and that installation, timing and price still need checking. The application is not complete.","doneWhenTh":"เพื่อนร่วมงานรับเรื่องแล้ว ลูกค้ารู้ผลพื้นที่และรู้ว่ายังต้องตรวจการติดตั้ง เวลา และราคา ยังไม่ได้สมัครเสร็จ","en":"Home internet consultation","followupIds":["p105","p106","p093","p116","p117","p118"],"id":"home-internet","intro":"A first consultation: understand the home and current service, check coverage, explain the limits, and arrange a colleague to finish the open checks.","introTh":"เริ่มปรึกษา: ถามบ้านและบริการเดิม ตรวจพื้นที่ อธิบายสิ่งที่ยังสรุปไม่ได้ แล้วให้เพื่อนร่วมงานช่วยตรวจต่อ","introduced":"1.2","outcome":"Clarify the home-internet request and arrange a handoff.","outcomeTh":"ถามเรื่องเน็ตบ้านให้ชัด แล้วส่งต่อให้เพื่อนร่วมงาน","provenance":{"basis":{"category":"B","scope":"Original communication pattern. Source motivates the topic, not an official script or an individual customer result.","sourceIds":["photo-new-71","photo-new-72","photo-new-73","photo-new-74"]},"explanations":"C","facts":[],"language":"C"},"reading":"ごじたくのインターネット","scope":"Original speaking path, informed by the September 2026 catalogue. This lesson ends with an accepted handoff for installation, timing and quotation checks. It is not a complete application, a recommendation for a particular product or the internal screen order.","scopeTh":"เส้นทางฝึกพูดที่แต่งโดยอิงแค็ตตาล็อกกันยายน 2026 จบที่เพื่อนร่วมงานรับช่วงตรวจการติดตั้ง เวลา และราคา ยังไม่ใช่ขั้นตอนสมัครครบทั้งหมด การแนะนำสินค้าเฉพาะ หรือผังหน้าจอภายในร้าน","sourceIds":["photo-new-71","photo-new-72","photo-new-73","photo-new-74","public-hikari","public-hikari-speed","public-home5g"],"sources":[{"checked":"2026-09-15","label":"Supplied catalogue: 2026.09 cover, 10-giga / 1-giga pages and p.17 installation diagram"},{"checked":"2026-09-15","label":"Docomo Hikari: service and area checks","url":"https://www.docomo.ne.jp/internet/hikari/"},{"checked":"2026-09-15","label":"Docomo Hikari 10-giga: maximum speed","url":"https://www.docomo.ne.jp/internet/hikari/10g_plan/"},{"checked":"2026-09-15","label":"home 5G: installation and address","url":"https://www.docomo.ne.jp/home_5g/"}],"steps":[{"en":"You would like to discuss internet for your home, correct?","enAction":"After hearing the request, confirm that the customer wants home internet rather than extra mobile data.","id":"home-internet-01","introduced":"1.2","jp":"ご{自宅|じたく}のインターネットのご{相談|そうだん}ですね。","learning":{"audience":"customer","function":"Respond in the home-internet consultation","mode":"active"},"provenance":{"basis":{"category":"C","scope":"Original communication pattern. Source motivates the topic, not an official script or an individual customer result.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"role":"staff","th":"ต้องการปรึกษาเรื่องอินเทอร์เน็ตที่บ้านใช่ไหมคะ","thAction":"ฟังความต้องการก่อน แล้วยืนยันว่าอยากได้เน็ตบ้าน ไม่ใช่เพิ่มเน็ตมือถือ","title":"Confirm the request"},{"cat":"needs","en":"Do you currently use internet at home?","enAction":"Ask about the current connection and the reason for changing. If yes, ask the service name; if none, continue to the residence.","essential":false,"hear":{"en":"I currently use another company’s service.","id":"home-internet-02-hear","introduced":"1.2","jp":"{今|いま}は{別|べつ}の{会社|かいしゃ}のを{使|つか}っています。","learning":{"audience":"learner","function":"Respond in the home-internet consultation","mode":"recognize"},"provenance":{"basis":{"category":"C","scope":"Original communication pattern. Source motivates the topic, not an official script or an individual customer result.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"role":"customer","th":"ตอนนี้ใช้ของอีกบริษัทอยู่"},"id":"home-internet-02","introduced":"1.2","jp":"{今|いま}、ご{自宅|じたく}でインターネットを{使|つか}っていますか。","learning":{"audience":"customer","function":"Ask about current home internet","mode":"active"},"note":"After a home-internet request. If yes, ask which service and what they want to change; this question alone does not identify the line.","noteTh":"ใช้หลังลูกค้าขอปรึกษาเน็ตบ้าน ถ้าใช้อยู่ให้ถามต่อว่าใช้บริการไหนและอยากเปลี่ยนอะไร คำถามนี้ยังไม่ระบุชนิดของเน็ต","provenance":{"basis":{"category":"B","scope":"Original communication pattern. Source motivates the topic, not an official script or an individual customer result.","sourceIds":["photo-new-74"]},"explanations":"C","facts":[],"language":"C"},"reply":{"en":"Which company’s service do you use?","id":"home-internet-02-reply","introduced":"1.2","jp":"どちらの{会社|かいしゃ}のサービスをお{使|つか}いですか。","learning":{"audience":"customer","function":"Respond in the home-internet consultation","mode":"active"},"provenance":{"basis":{"category":"C","scope":"Original communication pattern. Source motivates the topic, not an official script or an individual customer result.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"role":"staff","th":"ใช้บริการของบริษัทไหนอยู่คะ"},"role":"staff","sharedId":"p110","th":"ตอนนี้ที่บ้านใช้อินเทอร์เน็ตอยู่ไหมคะ","thAction":"ถามเน็ตที่ใช้อยู่และเหตุผลที่อยากเปลี่ยน ถ้ามีให้ถามชื่อบริการ ถ้ายังไม่มีให้ถามที่พักต่อ","title":"Ask what they use now"},{"cat":"needs","en":"Is it a detached house or an apartment building?","enAction":"Learn the residence type; check the building details as needed. Do not decide availability from this answer alone.","essential":false,"id":"home-internet-03","introduced":"1.2","jp":"{戸建|こだ}てですか、マンションですか。","learning":{"audience":"customer","function":"Ask the residence type","mode":"active"},"note":"Ask about the place of use. マンション describes an apartment/condominium building, not a mansion. Building type alone does not determine the plan or price.","noteTh":"ถามสถานที่ที่จะใช้ マンション คืออาคารอพาร์ตเมนต์หรือคอนโด ไม่ใช่คฤหาสน์ ชนิดอาคารอย่างเดียวยังตัดสินแพ็กเกจหรือราคาไม่ได้","provenance":{"basis":{"category":"B","scope":"Original communication pattern. Source motivates the topi fter the exact address is confirmed in the service area. Otherwise state that checking remains open and hand off.","essential":false,"id":"home-internet-05","introduced":"1.2","jp":"こちらの{住所|じゅうしょ}は、このサービスの{提供|ていきょう}エリア{内|ない}です。","learning":{"audience":"customer","function":"Explain the checked coverage result","mode":"active"},"note":"Only after checking the exact service and full address. Area coverage is a limited result: it does not confirm installation, activation date, indoor speed or approval.","noteTh":"ใช้หลังตรวจบริการและที่อยู่เต็มแล้ว ยืนยันได้แค่พื้นที่บริการ ยังไม่ยืนยันการติดตั้ง วันเปิดใช้ ความเร็วในบ้าน หรือผลอนุมัติ","provenance":{"basis":{"category":"B","scope":"Original communication pattern. Source motivates the topic, not an official script or an individual customer result.","sourceIds":["public-hikari","public-home5g"]},"explanations":"C","facts":[],"language":"C"},"role":"staff","sharedId":"p113","th":"ที่อยู่นี้อยู่ในพื้นที่ให้บริการของบริการนี้ค่ะ","thAction":"ใช้ทางเลือกตอบรับนี้เมื่อตรวจแล้วว่าที่อยู่ตรงอยู่ในพื้นที่ ถ้ายังยืนยันไม่ได้ให้บอกว่ายังต้องตรวจและส่งต่อ","title":"Return with the coverage result"},{"cat":"support","en":"This is the maximum speed. Actual speed varies with your usage environment.","enAction":"If discussing the catalogue’s 1/10-giga speed, clarify what the number does and does not mean.","essential":false,"hear":{"en":"Can I always use it at this speed?","id":"home-internet-06-hear","introduced":"1.2","jp":"いつでもこの{速|はや}さで{使|つか}えるんですか。","learning":{"audience":"learner","function":"Respond in the home-internet consultation","mode":"recognize"},"provenance":{"basis":{"category":"C","scope":"Original communication pattern. Source motivates the topic, not an official script or an individual customer result.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"role":"customer","th":"จะใช้ได้เร็วเท่านี้ตลอดเลยไหม"},"id":"home-internet-06","introduced":"1.2","jp":"こちらは{最大|さいだい}の{速度|そくど}です。{実際|じっさい}の{速度|そくど}は、ご{利用 let marks={},wordMarks={},saveOK=true,view='practice',guideTab='role',query='',category='all',speaker='all',filter='all',essentials=false;
let wordQuery='',wordCat='all',wordUse='all',wordFilter='all',openWords=new Set();

let progressUpdatedAt=0,loadProblem=false;
const IS_LOCAL_FILE=location.protocol==='file:';
function validateBackup(obj){
 if(!obj||typeof obj!=='object'||obj.app!=='counter-notes-amo'||obj.version!==1||!obj.marks||typeof obj.marks!=='object'||Array.isArray(obj.marks))throw Error('This is not a Counter Notes backup.');
 const clean={};
 for(const [id,m] of Object.entries(obj.marks)){
  if(!byId.has(id))continue;
  if(!m||!['known','shaky'].includes(m.status)||!Number.isFinite(m.at)||m.at<0)throw Error('The backup contains invalid progress.');
  clean[id]={status:m.status,at:Math.min(m.at,Date.now()),reviews:Number.isInteger(m.reviews)?Math.max(0,Math.min(m.reviews,1000000)):0};
 }
 return clean;
}
// Word marks live beside the phrase marks in the same envelope. They are sanitised, never
// validated by throwing: a damaged word entry must not stop phrase progress from loading.
function sanitiseWords(raw){
 const clean={};
 if(!raw||typeof raw!=='object'||Array.isArray(raw))return clean;
 for(const [id,m] of Object.entries(raw)){
  if(!wordById.has(id)||!m||typeof m!=='object'||m.status!=='learned')continue;
  clean[id]={status:'learned',at:Number.isFinite(m.at)&&m.at>=0?Math.min(m.at,Date.now()):Date.now()};
 }
 return clean;
}
function progressEnvelope(){return {app:'counter-notes-amo',version:1,updatedAt:progressUpdatedAt,marks,words:wordMarks};}
function readEnvelope(raw){
 const obj=JSON.parse(raw),clean=validateBackup(obj),words=sanitiseWords(obj.words);
 const newestMark=Math.max(0,...Object.values(clean).map(m=>m.at),...Object.values(words).map(m=>m.at));
 const updatedAt=Number.isFinite(obj.updatedAt)?Math.max(0,obj.updatedAt):newestMark;
 return {marks:clean,words,updatedAt};
}
function updateStorageNotice(){
 const el=document.getElementById('storageNotice'),message=document.getElementById('storageMessage');
 el.hidden=saveOK&&!IS_LOCAL_FILE&&!loadProblem;
 const en=loadProblem?'Some saved progress could not be read. Restore a backup before clearing anything.':!saveOK?'Automatic saving could not be verified. Save a progress copy before closing.':'Local file: automatic saving is not guaranteed. Keep a progress copy.';
 const th=loadProblem?'อ่านข้อมูลเดิมบางส่วนไม่ได้ โปรดลองนำข้อมูลสำรองกลับมาใช้ก่อนล้างข้อมูล':!saveOK?'ตรวจสอบการบันทึกอัตโนมัติไม่สำเร็จ ควรบันทึกไฟล์พร้อมความคืบหน้าก่อนปิด':'เมื่อเปิดไฟล์โดยตรง การบันทึกอัตโนมัติอาจสูญหาย ควรเก็บไฟล์พร้อมความคืบหน้า';
 message.innerHTML=esc(en)+thai(th);
}
function save(){
 const raw=JSON.stringify(progressEnvelope());
 try{
  if(loadProblem)throw Error('Keep unreadable data until explicit recovery.');
  localStorage.setItem(STORE_KEY,raw);
  if(localStorage.getItem(STORE_KEY)!==raw)throw Error('Storage readback did not match.');
  saveOK=true;
 }catch(e){saveOK=false;}
 updateStorageNotice();
}

function initProgress(){

 try{const raw=document.getElementById('portableProgress').textContent;if(raw.trim()!=='null')embedded=readEnvelope(raw);}catch(e){loadProblem=true;}
 try{const raw=localStorage.getItem(STORE_KEY);if(raw)cached=readEnvelope(raw);}catch(e){saveOK=false;try{if(localStorage.getItem(STORE_KEY))loadProblem=true;}catch(ignored){}}
 // Compare complete states: a newer reset or unmark must not resurrect an old embedded mark.
 const selected=cached&&(!embedded||cached.updatedAt>=embedded.updatedAt)?cached:embedded;
 if(selected){marks=selected.marks;wordMarks=selected.words||{};progressUpdatedAt=selected.updatedAt;}
 save();
}

 a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();

}

in('')}</select></label></div><div class="chips" aria-label="Filter vocabulary">${[['all','All words'],['core','Start here'],['new','Not yet learned'],['learned','Learned']].map(([id,t])=>`<button class="chip ${wordFilter===id?'active':''}" data-word-filter="${id}" aria-pressed="${wordFilter===id}">${t}</button>`).join('')}</div></div><div class="list-caption"><span id="wordCount" aria-live="polite" tabindex="-1"></span></div><div id="wordList" class="cards"></div><div class="word-legend"><span><b>You say</b> · words you produce at the counter</span><span><b>You hear</b> · words customers bring to you</span><span><b>You read</b> · words printed in catalogues and on screens</span></div><p class="footer-note">Headwords come from the supplied catalogue pages and from counter work described in your documents. Definitions, notes and example sentences are written for learning; they are not an approved script. Prices, eligibility and point conditions must be checked in current store material before you tell a customer anything.</p></section>`;

function practiceHTML(){return `<section><div class="practice-top"><div class="hero"><div><div class="eyebrow">For your shop counter</div><h1>Your Japanese,<br><em>ready for work.</em></h1><p class="sub">Speak, check, try again.<br><span lang="th" class="th">ฝึกพูดให้พร้อมใช้จริงในที่ทำงาน</span></p></div><div class="hero-number" aria-label="${PHRASES.length} phrase cards"><strong>${PHRASES.length}</strong><span>phrase cards</span></div></div><div><div id="practiceStats">${statsHTML()}</div><button class="cta full" data-action="quick-recall"><span>Start a 10-card recall<span class="small"> · ฝึกนึกคำพูด</span></span>${svg('arrow')}</button><p class="intro-note">Shaky cards first, then unmarked. Read → reveal → say it aloud.</p></div></div><div class="controls"><div class="searchwrap">${svg('search')}<input id="search" type="search" value="${esc(query)}" placeholder="Search Japanese, kana, English, ไทย" aria-label="Search phrases in Japanese, kana, English or Thai" autocomplete="off"><button class="clear" data-action="clear-search" aria-label="Clear search" ${query?'':'hidden'}>×</button></div><div class="filter-row"><label class="field" for="category">Situation<select id="category">${options(category)}</select></label><label class="field" for="speaker">Direction<select id="speaker"><option value="all" ${speaker==='all'?'selected':''}>Say + hear</option><option value="staff" ${speaker==='staff'?'selected':''}>What I say</option><option value="hear" ${speaker==='hear'?'selected':''}>What I hear</option><option value="to-customer" ${speaker==='to-customer'?'selected':''}>Say to a customer</option><option value="to-coworker" ${speaker==='to-coworker'?'selected':''}>Say to my team</option></select></label></div><div class="chips" aria-label="Filter by confidence">${[['all','All cards'],['shaky','Shaky'],['new','Unmarked'],['known','Known']].map(([id,label])=>`<button class="chip ${filter===id?'active':''}" data-filter="${id}" aria-pressed="${filter===id}">${label}</button>`).join('')}</div></div><div class="list-caption"><span id="resultCount" aria-live="polite" tabindex="-1"></span><label class="checklabel"><input id="essentials" type="checkbox" ${essentials?'checked':''}>Day-one essentials</label></div><div id="phraseList" class="cards"></div><p class="footer-note">Practice sentences are written for learning. Company and role facts come from your two supplied documents. Store procedures, plan terms and fees must be checked in current workplace materials.</p></section>`;}

function recallCandidates(){let pool=PHRASES.filter(p=>p.speaker==='staff'&&(recallCategory==='all'||p.cat===recallCategory)&&(recallScope==='all'||recallCategory!=='all'||p.learning?.mode!=='reference'));if(recallScope==='shaky')pool=pool.filter(p=>status(p.id)==='shaky');if(recallScope==='focus')pool=pool.filter(p=>status(p.id)!=='known');if(recallScope==='essential')pool=pool.filter(p=>p.essential);return pool;}
function startSession(quick=false){if(quick){recallCategory='all';recallScope='focus';if(!recallCandidates().length)recallScope='all';}const rank={shaky:0,new:1,known:2};let candidates=recallCandidates();if(quick)candidates=candidates.filter(p=>p.learning?.mode!=='reference');let pool=candidates.map(p=>({p,tie:Math.random()})).sort((a,b)=>(rank[status(a.p.id)]-rank[status(b.p.id)])||((marks[a.p.id]?.at||0)-(marks[b.p.id]?.at||0))||(a.tie-b.tie)).slice(0,10).map(x=>x.p.id);if(!pool.length){notify('No speaking cards match. Try another focus.');render();return;}session={ids:pool,index:0,revealed:false,results:[]};go('recall');}

 if(!session)return `<section class="recall-shell">${heading}<div class="panel recall-setup"><h3>A small speaking session</h3><p class="sub">Up to 10 things you would say at work. Daily speaking comes first; choose All speaking cards or a specific topic for role reference. Listening cards stay in Practice.</p><label class="field" for="recallScope">Review focus<select id="recallScope">${[['focus','Shaky + unmarked'],['shaky','Shaky only'],['all','All speaking cards'],['essential','Day-one essentials']].map(([id,t])=>`<option value="${id}" ${recallScope===id?'selected':''}>${t}</option>`).join('')}</select></label><label class="field" for="recallCategory">Situation<select id="recallCategory">${options(recallCategory)}</select></label><p id="recallAvailability" class="intro-note">${recallCandidates().length} speaking cards available. Weak spots come first.</p><button class="cta full" data-action="start-recall" ${recallCandidates().length?'':'disabled'}><span>Start recall · <span lang="th">เริ่มฝึก</span></span>${svg('arrow')}</button></div><p class="recall-tip">Say it in your own voice. A natural sentence with the same meaning counts. No recording or microphone is used.</p></section>`;
 if(session.index>=session.ids.length){const k=session.results.filter(r=>r.status==='known').length,s=session.results.length-k;return `<section class="recall-shell"><div class="panel recall-end"><div class="completion-icon">${svg('check')}</div><div class="eyebrow">Session complete · ฝึกครบแล้ว</div><h2>${session.ids.length} chances to speak.</h2><p class="sub" style="margin-left:auto;margin-right:auto">${saveOK?'Your latest marks were written and read back in this browser.':'Your latest marks are available in this open session.'} Keep a progress copy before closing; browser storage can be lost.</p><div class="session-numbers"><div><strong>${k}</strong><span>Said it · มั่นใจ</span></div><div><strong>${s}</strong><span>Still shaky · ยังไม่คล่อง</span></div></div>${s?`<button class="cta full" data-action="retry-shaky"><span>Repeat these ${s} weak spots</span>${svg('arrow')}</button>`:`<button class="cta full" data-action="quick-recall"><span>Another short session</span>${svg('arrow')}</button>`}<div style="margin-top:14px"><button class="btn" data-action="setup-recall">Choose a new session</button></div>${portablePrompt()}</div></section>`;}
 const p=byId.get(session.ids[session.index]);return `<section class="recall-shell"><div class="recall-progress"><span class="number-label">RECALL ${session.index+1} / ${session.ids.length}</span><button class="btn text" data-action="setup-recall">End session</button></div><progress value="${session.index}" max="${session.ids.length}" aria-label="Recall progress"></progress><div class="panel"><span class="tag say">${roleCue(p)} · ${esc(catName(p.cat))}</span><p class="recall-prompt">${esc(p.en)}</p><div class="recall-th th" lang="th">${esc(p.th)}</div><p class="recall-tip">Say the Japanese aloud. Then check your answer.<br><span class="th" lang="th">ลองพูดภาษาญี่ปุ่นออกเสียง แล้วค่อยดูคำตอบ</span></p>${session.revealed?`<div class="answer readings"><div class="eyebrow">One natural way to say it</div>${jpHTML(p.jp)}${p.note?`<div class="usage">${esc(p.note)}${p.noteTh?thai(p.noteTh):''}</div>`:''}${gradeHTML(p,true)}<p class="grade-hint">Rate your speaking, not just recognition. Your mark updates the same card in Practice.</p></div>`:`<button class="cta full" data-action="reveal-recall"><span>Show Japanese · <span lang="th">ดูคำตอบ</span></span>${svg('eye')}</button>`}</div><p class="recall-tip">If you needed the answer, choose “Need practice.” Shaky cards return first in future sessions.</p></section>`;}
function dialoguesHTML(){const sc=DATA.scenarios.find(s=>s.id===scenarioId)||DATA.scenarios[0];return `<section class="guide-width"><div class="page-heading"><div class="eyebrow">Follow the whole exchange</div><h1>Conversations<br>with a few turns.</h1><p class="sub">Customers hesitate, ask again, and push back. Practise keeping the conversation moving.<br><span class="th" lang="th">ฝึกทั้งบทสนทนา เมื่อลูกค้าลังเล สงสัย หรือไม่พอใจ</span></p></div><label class="field" for="scenarioSelect">Choose a conversation<select id="scenarioSelect">${DATA.scenarios.map((s,i)=>`<option value="${s.id}" ${s.id===sc.id?'selected':''}>${i+1}. ${s.learning?.mode==='reference'?'Reference · ':''}${esc(s.title)}</option>`).join('')}</select></label><div class="dialogue-tools"><div class="segmented" aria-label="Conversation mode"><button data-dialogue-mode="read" class="${!roleplay?'active':''}" aria-pressed="${!roleplay}">Read exchange</button><button data-dialogue-mode="role" class="${roleplay?'active':''}" aria-pressed="${roleplay}">Play your role</button></div><button class="btn text" data-action="all-translations">${showAll?(roleplay?'Hide models & meanings':'Hide meanings'):(roleplay?'Reveal models & meanings':'Reveal all meanings')}</button></div><div class="scene-context"><h2>${esc(sc.title)}</h2>${thai(sc.titleTh)}<p>${esc(sc.context)}</p>${thai(sc.contextTh)}<p class="goal"><b>Your task:</b> ${esc(sc.goal)}</p>${thai(sc.goalTh)}<p class="intro-note"><b>This exchange reaches:</b> ${esc(sc.boundary)}</p>${thai(sc.boundaryTh)}</div>${roleplay?`<div class="intro-note">Your turns show English and Thai first. Say the Japanese, then reveal a model. Other speakers’ meanings appear on tap.<br><span lang="th" class="th">ถึงตาคุณ ให้ลองพูดภาษาญี่ปุ่นก่อน แล้วค่อยดูตัวอย่างคำตอบ</span></div>`:''}<div class="conversation">${sc.turns.map((t,i)=>turnHTML(t,i)).join('')}</div><div class="takeaway"><strong>Take this into your next conversation</strong>${esc(sc.takeaway)}${thai(sc.takeawayTh)}</
