let marks={},saveOK=true,view='practice',guideTab='role',query='',category='all',speaker='all',filter='all',essentials=false;
let scenarioId=DATA.scenarios[0].id,roleplay=false,showAll=false,openTurns=new Set(),openCards=new Set(),session=null;
let recallScope='focus',recallCategory='all',toastTimer;
let progressUpdatedAt=0,loadProblem=false;
const IS_LOCAL_FILE=location.protocol==='file:';
function validateBackup(obj){
 if(!obj||typeof obj!=='object'||obj.app!=='counter-notes-amo'||obj.version!==1||!obj.marks||typeof obj.marks!=='object'||Array.isArray(obj.marks))throw Error('This is not a Counter Notes backup.');
 const clean={};
 for(const [id,m] of Object.entries(obj.marks)){
  if(!byId.has(id))continue;
  if(!m||!['known','shaky'].includes(m.status)||!Number.isFinite(m.at)||m.at<0)throw Error('The backup contains invalid progress.');
  clean[id]={status:m.status,at:Math.min(m.at,Date.now()),reviews:Number.isInteger(m.reviews)?Math.max(0,Math.min(m.reviews,1000000)):0};
 }
 return clean;
}
function progressEnvelope(){return {app:'counter-notes-amo',version:1,updatedAt:progressUpdatedAt,marks};}
function readEnvelope(raw){
 const obj=JSON.parse(raw),clean=validateBackup(obj);
 const newestMark=Math.max(0,...Object.values(clean).map(m=>m.at));
 const updatedAt=Number.isFinite(obj.updatedAt)?Math.max(0,obj.updatedAt):newestMark;
 return {marks:clean,updatedAt};
}
function updateStorageNotice(){
 const el=document.getElementById('storageNotice'),message=document.getElementById('storageMessage');
 el.hidden=saveOK&&!IS_LOCAL_FILE&&!loadProblem;
 const en=loadProblem?'Some saved progress could not be read. Restore a backup before clearing anything.':!saveOK?'Automatic saving could not be verified. Save a progress copy before closing.':'Local file: automatic saving is not guaranteed. Keep a progress copy.';
 const th=loadProblem?'อ่านข้อมูลเดิมบางส่วนไม่ได้ โปรดลองนำข้อมูลสำรองกลับมาใช้ก่อนล้างข้อมูล':!saveOK?'ตรวจสอบการบันทึกอัตโนมัติไม่สำเร็จ ควรบันทึกไฟล์พร้อมความคืบหน้าก่อนปิด':'เมื่อเปิดไฟล์โดยตรง การบันทึกอัตโนมัติอาจสูญหาย ควรเก็บไฟล์พร้อมความคืบหน้า';
 message.innerHTML=esc(en)+thai(th);
}
function save(){
 const raw=JSON.stringify(progressEnvelope());
 try{
  if(loadProblem)throw Error('Keep unreadable data until explicit recovery.');
  localStorage.setItem(STORE_KEY,raw);
  if(localStorage.getItem(STORE_KEY)!==raw)throw Error('Storage readback did not match.');
  saveOK=true;
 }catch(e){saveOK=false;}
 updateStorageNotice();
}
function changed(){progressUpdatedAt=Math.max(Date.now(),progressUpdatedAt+1);}
function initProgress(){
 let embedded=null,cached=null;
 try{const raw=document.getElementById('portableProgress').textContent;if(raw.trim()!=='null')embedded=readEnvelope(raw);}catch(e){loadProblem=true;}
 try{const raw=localStorage.getItem(STORE_KEY);if(raw)cached=readEnvelope(raw);}catch(e){saveOK=false;try{if(localStorage.getItem(STORE_KEY))loadProblem=true;}catch(ignored){}}
 // Compare complete states: a newer reset or unmark must not resurrect an old embedded mark.
 const selected=cached&&(!embedded||cached.updatedAt>=embedded.updatedAt)?cached:embedded;
 if(selected){marks=selected.marks;progressUpdatedAt=selected.updatedAt;}
 save();
}
initProgress();
function portableHTML(){
 const clean=PRISTINE_DOCUMENT.cloneNode(true);
 clean.querySelector('#portableProgress').textContent=JSON.stringify(progressEnvelope()).replace(/</g,()=>String.fromCharCode(92)+'u003c');
 return '<!doctype html>\n'+clean.outerHTML;
}
function downloadBlob(blob,name){
 const url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),60000);
}
function savePortableCopy(){
 try{
  const stamp=new Date().toISOString().replace(/[:.]/g,'-');
  downloadBlob(new Blob([portableHTML()],{type:'text/html;charset=utf-8'}),'Counter-Notes-progress-'+stamp+'.html');
  notify('Copy prepared. Finish saving it in your browser or Files.');
 }catch(e){notify('Could not prepare the HTML copy. Use Backup as text.');}
}
function portablePrompt(){return `<div class="backup-prompt"><strong>Keep this practice</strong><p>Save a new HTML copy with your marks inside. Reopen your newest saved copy next time. Later changes need a new copy.</p>${thai('บันทึกไฟล์ HTML ใหม่พร้อมความคืบหน้า ครั้งต่อไปเปิดไฟล์ล่าสุดที่บันทึกไว้ หากฝึกเพิ่มให้บันทึกไฟล์ใหม่อีกครั้ง')}<button class="btn" data-action="save-portable">${svg('download')}Save HTML + progress</button></div>`;}

function status(id){return marks[id]?.status||'new';}
function counts(items=PHRASES){return items.reduce((a,p)=>{a[status(p.id)]++;return a},{known:0,shaky:0,new:0});}
function statsHTML(){const c=counts();return `<div class="stats" aria-label="Your phrase progress"><div class="stat known"><strong>${c.known}</strong><span>Know it</span><span class="th" lang="th">มั่นใจ</span></div><div class="stat shaky"><strong>${c.shaky}</strong><span>Shaky</span><span class="th" lang="th">ยังไม่คล่อง</span></div><div class="stat"><strong>${c.new}</strong><span>Unmarked</span><span class="th" lang="th">ยังไม่ทำ</span></div></div>`;}
function notify(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,2400);}
function setMark(id,value,fromRecall=false){
 if(!byId.has(id))return;
 if(!fromRecall&&status(id)===value){delete marks[id];notify('Mark cleared · ล้างเครื่องหมายแล้ว');}
 else marks[id]={status:value,at:Date.now(),reviews:(marks[id]?.reviews||0)+(fromRecall?1:0)};
 changed();save();
}
function navHTML(){return [['practice','cards','Practice'],['recall','recall','Recall'],['dialogues','dialogue','Dialogues'],['rescue','help','Get unstuck'],['guide','guide','Guide']].map(([id,ic,label])=>`<button class="nav-item ${view===id?'active':''}" data-nav="${id}" ${view===id?'aria-current="page"':''}>${svg(ic)}<span>${label}</span></button>`).join('');}
function go(v){view=v;render();window.scrollTo({top:0,behavior:'instant'});document.getElementById('main').focus({preventScroll:true});}
function render(){document.getElementById('nav').innerHTML=navHTML();document.getElementById('main').innerHTML=view==='practice'?practiceHTML():view==='recall'?recallHTML():view==='dialogues'?dialoguesHTML():view==='rescue'?rescueHTML():guideHTML();if(view==='practice')renderList();}
function gradeHTML(p,recall=false){const st=status(p.id);return `<div class="grade"><button data-grade="shaky" data-id="${p.id}" ${recall?'data-recall="true"':''} aria-pressed="${!recall&&st==='shaky'}">${recall?'Need practice':'Shaky'} <span lang="th">· ยังไม่คล่อง</span></button><button data-grade="known" data-id="${p.id}" ${recall?'data-recall="true"':''} aria-pressed="${!recall&&st==='known'}">${recall?'Said it':'Know it'} <span lang="th">· มั่นใจ</span></button></div>`;}
function phraseHTML(p){const opened=openCards.has(p.id),st=status(p.id);return `<article class="phrase ${opened?'readings':''}" id="card-${p.id}"><div class="phrase-top"><span class="tag ${p.speaker==='staff'?'say':''}">${p.speaker==='staff'?'YOU SAY':p.speaker==='customer'?'CUSTOMER SAYS':'COWORKER SAYS'}</span><span class="status-word ${st}">${st==='new'?(p.essential?'DAY ONE':'UNMARKED'):st==='known'?'KNOWN':'SHAKY'}</span></div><button class="phrase-reveal" data-reveal="${p.id}" aria-expanded="${opened}" aria-controls="translation-${p.id}">${jpHTML(p.jp)}<span class="tapcue">${svg('eye')}${opened?'Hide reading & meaning':'Tap for reading & meaning · แตะเพื่อดู'}</span></button><div class="translation" id="translation-${p.id}" ${opened?'':'hidden'}><div class="en">${esc(p.en)}</div>${thai(p.th)}${p.note?`<div class="usage">${esc(p.note)}${p.noteTh?thai(p.noteTh):''}</div>`:''}${gradeHTML(p)}<div class="grade-hint">Tap a selected mark again to clear it.</div></div></article>`;}
function practiceHTML(){return `<section><div class="practice-top"><div class="hero"><div><div class="eyebrow">Area Marketing Office · Osaka</div><h1>Your Japanese,<br><em>ready for work.</em></h1><p class="sub">Speak, check, try again.<br><span lang="th" class="th">ฝึกพูดให้พร้อมใช้จริงในที่ทำงาน</span></p></div><div class="hero-number" aria-label="${PHRASES.length} phrase cards"><strong>${PHRASES.length}</strong><span>phrase cards</span></div></div><div><div id="practiceStats">${statsHTML()}</div><button class="cta full" data-action="quick-recall"><span>Start a 10-card recall<span class="small"> · ฝึกนึกคำพูด</span></span>${svg('arrow')}</button><p class="intro-note">Shaky cards first, then unmarked. Read → reveal → say it aloud.</p></div></div><div class="controls"><div class="searchwrap">${svg('search')}<input id="search" type="search" value="${esc(query)}" placeholder="Search Japanese, kana, English, ไทย" aria-label="Search phrases in Japanese, kana, English or Thai" autocomplete="off"><button class="clear" data-action="clear-search" aria-label="Clear search" ${query?'':'hidden'}>×</button></div><div class="filter-row"><label class="field" for="category">Situation<select id="category">${options(category)}</select></label><label class="field" for="speaker">Direction<select id="speaker"><option value="all" ${speaker==='all'?'selected':''}>Say + hear</option><option value="staff" ${speaker==='staff'?'selected':''}>What I say</option><option value="hear" ${speaker==='hear'?'selected':''}>What I hear</option></select></label></div><div class="chips" aria-label="Filter by confidence">${[['all','All cards'],['shaky','Shaky'],['new','Unmarked'],['known','Known']].map(([id,label])=>`<button class="chip ${filter===id?'active':''}" data-filter="${id}" aria-pressed="${filter===id}">${label}</button>`).join('')}</div></div><div class="list-caption"><span id="resultCount" aria-live="polite" tabindex="-1"></span><label class="checklabel"><input id="essentials" type="checkbox" ${essentials?'checked':''}>Day-one essentials</label></div><div id="phraseList" class="cards"></div><p class="footer-note">Practice sentences are written for learning. Company and role facts come from your two supplied documents. Store procedures, plan terms and fees must be checked in current workplace materials.</p></section>`;}
function filteredPhrases(){let q=query.trim().toLocaleLowerCase().normalize('NFKC');return PHRASES.filter(p=>(category==='all'||p.cat===category)&&(speaker==='all'||(speaker==='hear'?p.speaker!=='staff':p.speaker==='staff'))&&(filter==='all'||status(p.id)===filter)&&(!essentials||p.essential)&&(!q||[baseJP(p.jp),readingJP(p.jp),p.en,p.th].join(' ').toLocaleLowerCase().normalize('NFKC').includes(q)));}
function renderList(){const ps=filteredPhrases();document.getElementById('resultCount').textContent=`${ps.length} ${ps.length===1?'card':'cards'} · ${category==='all'?'All situations':catName(category)}`;document.getElementById('phraseList').innerHTML=ps.length?ps.map(phraseHTML).join(''):`<div class="empty"><h3>No cards in this view.</h3><p>Try another word or clear your filters.<br><span class="th" lang="th">ลองคำอื่นหรือล้างตัวกรอง</span></p><button class="btn" data-action="clear-filters">Show all cards</button></div>`;}
function recallCandidates(){let pool=PHRASES.filter(p=>p.speaker==='staff'&&(recallCategory==='all'||p.cat===recallCategory));if(recallScope==='shaky')pool=pool.filter(p=>status(p.id)==='shaky');if(recallScope==='focus')pool=pool.filter(p=>status(p.id)!=='known');if(recallScope==='essential')pool=pool.filter(p=>p.essential);return pool;}
function startSession(quick=false){if(quick){recallCategory='all';recallScope='focus';if(!PHRASES.some(p=>p.speaker==='staff'&&status(p.id)!=='known'))recallScope='all';}const rank={shaky:0,new:1,known:2};let pool=recallCandidates().map(p=>({p,tie:Math.random()})).sort((a,b)=>(rank[status(a.p.id)]-rank[status(b.p.id)])||((marks[a.p.id]?.at||0)-(marks[b.p.id]?.at||0))||(a.tie-b.tie)).slice(0,10).map(x=>x.p.id);if(!pool.length){notify('No speaking cards match. Try another focus.');render();return;}session={ids:pool,index:0,revealed:false,results:[]};go('recall');}
function recallHTML(){const heading=`<div class="page-heading"><div class="eyebrow">English / Thai → Japanese</div><h1>Find the words.<br>Then say them.</h1><p class="sub">Speak from memory before revealing the Japanese.<br><span class="th" lang="th">ดูความหมาย แล้วลองพูดภาษาญี่ปุ่นจากความจำ</span></p></div>`;
 if(!session)return `<section class="recall-shell">${heading}<div class="panel recall-setup"><h3>A small speaking session</h3><p class="sub">Up to 10 things you would say at work. Customer and coworker listening cards stay in Practice.</p><label class="field" for="recallScope">Review focus<select id="recallScope">${[['focus','Shaky + unmarked'],['shaky','Shaky only'],['all','All speaking cards'],['essential','Day-one essentials']].map(([id,t])=>`<option value="${id}" ${recallScope===id?'selected':''}>${t}</option>`).join('')}</select></label><label class="field" for="recallCategory">Situation<select id="recallCategory">${options(recallCategory)}</select></label><p id="recallAvailability" class="intro-note">${recallCandidates().length} speaking cards available. Weak spots come first.</p><button class="cta full" data-action="start-recall" ${recallCandidates().length?'':'disabled'}><span>Start recall · <span lang="th">เริ่มฝึก</span></span>${svg('arrow')}</button></div><p class="recall-tip">Say it in your own voice. A natural sentence with the same meaning counts. No recording or microphone is used.</p></section>`;
 if(session.index>=session.ids.length){const k=session.results.filter(r=>r.status==='known').length,s=session.results.length-k;return `<section class="recall-shell"><div class="panel recall-end"><div class="completion-icon">${svg('check')}</div><div class="eyebrow">Session complete · ฝึกครบแล้ว</div><h2>${session.ids.length} chances to speak.</h2><p class="sub" style="margin-left:auto;margin-right:auto">${saveOK?'Your latest marks were written and read back in this browser.':'Your latest marks are available in this open session.'} Keep a progress copy before closing; browser storage can be lost.</p><div class="session-numbers"><div><strong>${k}</strong><span>Said it · มั่นใจ</span></div><div><strong>${s}</strong><span>Still shaky · ยังไม่คล่อง</span></div></div>${s?`<button class="cta full" data-action="retry-shaky"><span>Repeat these ${s} weak spots</span>${svg('arrow')}</button>`:`<button class="cta full" data-action="quick-recall"><span>Another short session</span>${svg('arrow')}</button>`}<div style="margin-top:14px"><button class="btn" data-action="setup-recall">Choose a new session</button></div>${portablePrompt()}</div></section>`;}
 const p=byId.get(session.ids[session.index]);return `<section class="recall-shell"><div class="recall-progress"><span class="number-label">RECALL ${session.index+1} / ${session.ids.length}</span><button class="btn text" data-action="setup-recall">End session</button></div><progress value="${session.index}" max="${session.ids.length}" aria-label="Recall progress"></progress><div class="panel"><span class="tag say">YOU SAY · ${esc(catName(p.cat))}</span><p class="recall-prompt">${esc(p.en)}</p><div class="recall-th th" lang="th">${esc(p.th)}</div><p class="recall-tip">Say the Japanese aloud. Then check your answer.<br><span class="th" lang="th">ลองพูดภาษาญี่ปุ่นออกเสียง แล้วค่อยดูคำตอบ</span></p>${session.revealed?`<div class="answer readings"><div class="eyebrow">One natural way to say it</div>${jpHTML(p.jp)}${p.note?`<div class="usage">${esc(p.note)}${p.noteTh?thai(p.noteTh):''}</div>`:''}${gradeHTML(p,true)}<p class="grade-hint">Rate your speaking, not just recognition. Your mark updates the same card in Practice.</p></div>`:`<button class="cta full" data-action="reveal-recall"><span>Show Japanese · <span lang="th">ดูคำตอบ</span></span>${svg('eye')}</button>`}</div><p class="recall-tip">If you needed the answer, choose “Need practice.” Shaky cards return first in future sessions.</p></section>`;}
function dialoguesHTML(){const sc=DATA.scenarios.find(s=>s.id===scenarioId)||DATA.scenarios[0];return `<section class="guide-width"><div class="page-heading"><div class="eyebrow">Follow the whole exchange</div><h1>Conversations<br>with a few turns.</h1><p class="sub">Customers hesitate, ask again, and push back. Practise keeping the conversation moving.<br><span class="th" lang="th">ฝึกทั้งบทสนทนา เมื่อลูกค้าลังเล สงสัย หรือไม่พอใจ</span></p></div><label class="field" for="scenarioSelect">Choose a conversation<select id="scenarioSelect">${DATA.scenarios.map((s,i)=>`<option value="${s.id}" ${s.id===sc.id?'selected':''}>${i+1}. ${esc(s.title)}</option>`).join('')}</select></label><div class="dialogue-tools"><div class="segmented" aria-label="Conversation mode"><button data-dialogue-mode="read" class="${!roleplay?'active':''}" aria-pressed="${!roleplay}">Read exchange</button><button data-dialogue-mode="role" class="${roleplay?'active':''}" aria-pressed="${roleplay}">Play your role</button></div><button class="btn text" data-action="all-translations">${showAll?(roleplay?'Hide models & meanings':'Hide meanings'):(roleplay?'Reveal models & meanings':'Reveal all meanings')}</button></div><div class="scene-context"><h2>${esc(sc.title)}</h2>${thai(sc.titleTh)}<p>${esc(sc.context)}</p>${thai(sc.contextTh)}<p class="goal"><b>Your task:</b> ${esc(sc.goal)}</p>${thai(sc.goalTh)}</div>${roleplay?`<div class="intro-note">Your turns show English and Thai first. Say the Japanese, then reveal a model. Other speakers’ meanings appear on tap.<br><span lang="th" class="th">ถึงตาคุณ ให้ลองพูดภาษาญี่ปุ่นก่อน แล้วค่อยดูตัวอย่างคำตอบ</span></div>`:''}<div class="conversation">${sc.turns.map((t,i)=>turnHTML(t,i)).join('')}</div><div class="takeaway"><strong>Take this into your next conversation</strong>${esc(sc.takeaway)}${thai(sc.takeawayTh)}</div><p class="footer-note">Constructed practice dialogue based on the work described in your documents. These exchanges do not establish docomo or store policy.</p></section>`;}
function turnHTML(t,i){const opened=showAll||openTurns.has(i);const role=t.role==='staff'?'You':t.role==='customer'?'Customer':'Coworker';return `<article class="turn ${t.role==='staff'?'staff':''}"><div class="turn-label"><span>${i+1}</span>${role}</div><div class="bubble ${opened?'readings':''}">${roleplay&&t.role==='staff'?`<div class="role-prompt">${esc(t.en)}${thai(t.th)}<button class="btn" data-turn="${i}" aria-expanded="${opened}" aria-controls="turn-answer-${i}">${opened?'Hide model':'Show model Japanese'}</button></div><div class="model" id="turn-answer-${i}" ${opened?'':'hidden'}>${jpHTML(t.jp)}</div>`:`<button class="phrase-reveal" data-turn="${i}" aria-expanded="${opened}" aria-controls="turn-answer-${i}">${jpHTML(t.jp)}<span class="tapcue">${svg('eye')}${opened?'Hide reading & meaning':'Tap for reading & meaning'}</span></button><div class="translation" id="turn-answer-${i}" ${opened?'':'hidden'}><div class="en">${esc(t.en)}</div>${thai(t.th)}</div>`}</div></article>`;}
function rescueHTML(){return `<section class="rescue-page"><div class="page-heading"><div class="eyebrow">Keep these close on day one</div><h1>When you’re<br>stuck for words.</h1><p class="sub">You can be polite and honest while you find the answer.<br><span lang="th" class="th">ฟังไม่ทันหรือตอบไม่ได้ ก็ขอเวลาและขอความช่วยเหลืออย่างสุภาพได้</span></p></div><div class="rescue-intro">${[['01 · Pause','ตั้งหลัก'],['02 · Clarify','ถามให้ชัด'],['03 · Check','ตรวจสอบ'],['04 · Return','กลับมาแจ้ง']].map(([a,b])=>`<div class="rescue-step"><b>${a}</b><span lang="th" class="th">${b}</span></div>`).join('')}</div><p class="intro-note">Tap a sentence for readings and meaning. These cards share the same marks and recall queue as Practice.</p><div class="cards">${DATA.rescue.map(phraseHTML).join('')}</div></section>`;}
function guideHTML(){return `<section class="guide-width"><div class="page-heading"><div class="eyebrow">Your role · your language · your progress</div><h1>A little context<br>goes a long way.</h1><p class="sub">Grounded in your materials, shaped for your first weeks.<br><span class="th" lang="th">เข้าใจงานและฝึกภาษาสำหรับช่วงเริ่มต้น</span></p></div><div class="guide-nav segmented" aria-label="Guide pages">${[['role','Company & role'],['keigo','Keigo in use'],['progress','Progress']].map(([id,t])=>`<button data-guide="${id}" class="${guideTab===id?'active':''}" aria-pressed="${guideTab===id}">${t}</button>`).join('')}</div>${guideTab==='role'?roleGuideHTML():guideTab==='keigo'?keigoHTML():progressHTML()}</section>`;}
function roleGuideHTML(){const co=DATA.company;return `<div><p style="font-size:14px">${esc(co.intro)}</p><div class="sub th" lang="th">${esc(co.introTh)}</div><div style="margin-top:26px">${co.facts.map((f,i)=>`<article class="fact"><h3>${esc(f.label)} <span class="small muted th" lang="th">${esc(f.labelTh)}</span></h3><p class="en">${esc(f.en)}</p>${thai(f.th)}<button class="fact-jp" data-fact="${i}" aria-expanded="false" aria-label="Reveal Japanese reading: ${esc(f.label)}">${jpHTML(f.jp)}<span class="tapcue">Tap for furigana · แตะเพื่อดูคำอ่าน</span></button><p class="source">Source: ${esc(f.source)}</p></article>`).join('')}</div>${co.boundaries.map(b=>`<div class="boundary">${esc(b.en)}${thai(b.th)}</div>`).join('')}<details class="sourcebox"><summary>The two source documents · เอกสารอ้างอิง</summary>${co.sources.map(s=>`<div class="source-item"><strong>${esc(s.name)}</strong><span>${esc(s.label)} · ${esc(s.scope)}</span></div>`).join('')}<p>All study content is embedded in this HTML. The original documents are not needed to use it offline. Practice dialogue and language explanations are authored learning material, not quotations or an official training manual.</p></details></div>`;}
function keigoHTML(){return `<p class="intro-note">Compare the everyday sentence with the version you can use at work. Tap the workplace sentence for readings, English, Thai, and the reason for the wording. Match the speaker and situation.<br><span lang="th" class="th">เปรียบเทียบประโยคทั่วไปกับประโยคสุภาพที่ใช้ในงาน แตะเพื่อดูคำอ่าน ความหมาย และวิธีใช้</span></p><div>${DATA.keigo.map((k,i)=>`<article class="keigo-card" id="keigo-${i}"><h3>${esc(k.title)} <span class="small muted th" lang="th">${esc(k.titleTh)}</span></h3><div class="compare-label">Everyday form · for comparison</div>${jpHTML(k.plain,'plain')}<div class="compare-label" style="color:var(--red)">At work · use in this situation</div><button class="phrase-reveal" data-keigo="${i}" aria-expanded="false" aria-controls="keigo-meaning-${i}">${jpHTML(k.polite)}<span class="tapcue">${svg('eye')}Tap for reading, meaning & use</span></button><div class="translation" id="keigo-meaning-${i}" hidden><div class="en">${esc(k.en)}</div>${thai(k.th)}<div class="usage">${esc(k.why)}${thai(k.whyTh)}</div></div></article>`).join('')}</div>`;}
function progressHTML(){const totals=counts();return `<div><h2>Your confidence map</h2><div id="guideStats" style="margin-top:20px">${statsHTML()}</div><p class="intro-note">Marks reflect your own confidence. Listening cards and speaking cards both count here; recall sessions use only your speaking cards.</p>${CATS.map(c=>{const ps=PHRASES.filter(p=>p.cat===c[0]),n=counts(ps);return `<div class="topic-progress"><div class="row"><span>${esc(c[1])}</span><span class="muted">${n.known}/${ps.length} known</span></div><div class="progressbar" role="img" aria-label="${esc(c[1])}: ${n.known} known, ${n.shaky} shaky, ${n.new} unmarked"><span class="known" style="width:${100*n.known/ps.length}%"></span><span class="shaky" style="width:${100*n.shaky/ps.length}%"></span></div><p class="small muted">${n.shaky} shaky · ${n.new} unmarked</p></div>`;}).join('')}<div class="section-rule"><h2>A useful five minutes</h2></div><ol class="study-steps"><li>Start with the 25 Day-one essentials, in batches of five. Read the Japanese without help. Tap, check the readings, then say the whole sentence.<div class="th" lang="th">เริ่มจาก 25 ประโยคจำเป็น ฝึกครั้งละ 5 ประโยค อ่านก่อนดูคำแปล ตรวจคำอ่าน แล้วพูดทั้งประโยค</div></li><li>Use Recall to produce Japanese from the English and Thai. Mark the sentence shaky if you needed the model.<div class="th" lang="th">ฝึกนึกประโยคญี่ปุ่นจากความหมาย ถ้ายังต้องดูคำตอบให้เลือก Shaky</div></li><li>Choose one dialogue and play your role. Practise the reply after the customer pushes back.<div class="th" lang="th">ฝึกหนึ่งบทสนทนา โดยลองตอบเมื่อลูกค้าไม่เห็นด้วยหรือถามซ้ำ</div></li></ol><p class="intro-note">Thai translations use ค่ะ / คะ where appropriate for a female speaker. Use ครับ to suit your voice. The Japanese sentences are usable regardless of gender. Standard polite Japanese is used for Osaka customer service.</p><div class="backup"><h2>Keep your progress</h2><p class="sub">The lessons run offline. Browser auto-save is a convenience, not a guarantee. For a local file, including iPhone Safari, a successful write today cannot prove the marks will survive closing, moving the file, or browser cleanup.</p>${thai('บทเรียนใช้แบบออฟไลน์ได้ แต่ข้อมูลที่เบราว์เซอร์บันทึกอาจสูญหาย แม้ตอนนี้จะบันทึกสำเร็จ โดยเฉพาะเมื่อเปิดไฟล์โดยตรง ควรเก็บไฟล์พร้อมความคืบหน้าไว้ด้วย')}${portablePrompt()}<p class="intro-note">An HTML copy contains the entire app and your marks at the moment you click save. It does not rewrite the file you opened. Finish saving the download; if file download is unavailable, copy a JSON backup below. Resetting marks in an open copy does not change older saved copies.</p><div class="backup-actions"><button class="btn" data-action="export">${svg('download')}Download backup</button><button class="btn" data-action="backup-text">Backup as text</button></div><details><summary>Restore a backup · นำข้อมูลกลับมาใช้</summary><p class="small muted">Restore merges saved marks. The more recent mark wins for each card.</p><input type="file" id="importFile" accept=".json,application/json" aria-label="Choose a Counter Notes progress backup"><label class="field" style="margin-top:15px" for="restoreText">Or paste backup text</label><textarea id="restoreText" placeholder="Paste a Counter Notes backup here"></textarea><button class="btn" data-action="restore-text">Restore pasted backup</button></details><div id="backupTextArea" hidden><label class="field" for="backupText" style="margin-top:15px">Select and copy this backup to a safe place</label><textarea id="backupText" readonly></textarea></div><p class="intro-note">On iPhone, a Files preview is not proof that the app can run: some viewers do not execute JavaScript, and Safari may not open an arbitrary local HTML file as an interactive page. Use a local HTML viewer that executes scripts. Verify by tapping a card and reopening a saved progress copy. This build has not been tested on a physical iPhone; a successful desktop/mobile-width test does not verify iOS Safari.</p><div class="resetbox"><button class="btn text" data-action="ask-reset">Reset all marks</button><div class="confirm" id="resetConfirm" hidden><p>Clear all ${totals.known+totals.shaky} marked cards in this browser?<br><span lang="th" class="th">ล้างความคืบหน้าทั้งหมดในเบราว์เซอร์นี้หรือไม่</span></p><button class="btn" data-action="cancel-reset">Keep my marks</button> <button class="btn" data-action="reset">Yes, clear all marks</button></div></div></div><p class="footer-note">Counter Notes · personal study companion<br>Japanese · English · Thai · no network requests · no audio</p></div>`;}
function exportObject(){return {...progressEnvelope(),exportedAt:new Date().toISOString()};}
function restore(raw){try{if(raw.length>2000000)throw Error('This backup is too large.');const imported=validateBackup(JSON.parse(raw));let n=0;for(const [id,m]of Object.entries(imported)){if(!marks[id]||m.at>=marks[id].at){marks[id]=m;n++;}}loadProblem=false;if(n)changed();save();render();notify(`Restored ${n} marks · นำข้อมูลกลับมาแล้ว`);}catch(e){notify('Could not restore: '+e.message);}}
document.getElementById('storageHelp').addEventListener('click',()=>{guideTab='progress';go('guide');document.querySelector('.backup')?.scrollIntoView({block:'start'});});
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-nav]');if(b)go(b.dataset.nav);});
document.getElementById('main').addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;document.querySelector('[data-action="clear-search"]').hidden=!query;renderList();}});
document.getElementById('main').addEventListener('change',async e=>{
 const t=e.target;
 if(t.id==='category'){category=t.value;renderList();}
 if(t.id==='speaker'){speaker=t.value;renderList();}
 if(t.id==='essentials'){essentials=t.checked;renderList();}
 if(t.id==='recallScope'||t.id==='recallCategory'){if(t.id==='recallScope')recallScope=t.value;else recallCategory=t.value;render();document.getElementById(t.id)?.focus({preventScroll:true});}
 if(t.id==='scenarioSelect'){scenarioId=t.value;openTurns.clear();showAll=false;render();document.getElementById('scenarioSelect')?.focus({preventScroll:true});}
 if(t.id==='importFile'&&t.files[0]){if(t.files[0].size>2000000){notify('That file is too large for a progress backup.');return;}try{restore(await t.files[0].text());}catch(err){notify('This file could not be read. Try pasting backup text.');}}
});
document.getElementById('main').addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.reveal){const id=b.dataset.reveal;openCards.has(id)?openCards.delete(id):openCards.add(id);const opened=openCards.has(id);document.getElementById('card-'+id).classList.toggle('readings',opened);document.getElementById('translation-'+id).hidden=!opened;b.setAttribute('aria-expanded',opened);b.querySelector('.tapcue').innerHTML=svg('eye')+(opened?'Hide reading & meaning':'Tap for reading & meaning · แตะเพื่อดู');return;}
 if(b.dataset.grade){const id=b.dataset.id,value=b.dataset.grade;if(b.dataset.recall){if(!session||!session.revealed||session.ids[session.index]!==id)return;setMark(id,value,true);session.results.push({id,status:value});session.index++;session.revealed=false;render();window.scrollTo({top:0,behavior:'instant'});document.getElementById('main').focus({preventScroll:true});}else{const before=view==='practice'?filteredPhrases():[];const oldIndex=before.findIndex(p=>p.id===id);setMark(id,value);const card=document.getElementById('card-'+id),st=status(id),p=byId.get(id);card.querySelector('.status-word').className='status-word '+st;card.querySelector('.status-word').textContent=st==='new'?(p.essential?'DAY ONE':'UNMARKED'):st.toUpperCase();card.querySelectorAll('[data-grade]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.grade===st));if(view==='practice'){document.getElementById('practiceStats').innerHTML=statsHTML();if(filter!=='all'){renderList();const after=filteredPhrases();const target=after[Math.min(oldIndex,after.length-1)];if(target)document.querySelector(`[data-reveal="${target.id}"]`)?.focus({preventScroll:true});else document.getElementById('resultCount').focus({preventScroll:true});}}}return;}
 if(b.dataset.filter){filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>{x.classList.toggle('active',x.dataset.filter===filter);x.setAttribute('aria-pressed',x.dataset.filter===filter);});renderList();return;}
 if(b.dataset.guide){guideTab=b.dataset.guide;render();document.querySelector(`[data-guide="${guideTab}"]`).focus({preventScroll:true});return;}
 if(b.dataset.dialogueMode){roleplay=b.dataset.dialogueMode==='role';showAll=false;openTurns.clear();render();document.querySelector(`[data-dialogue-mode="${b.dataset.dialogueMode}"]`).focus({preventScroll:true});return;}
 if(b.dataset.turn!==undefined){const i=Number(b.dataset.turn);if(showAll){showAll=false;const sc=DATA.scenarios.find(s=>s.id===scenarioId);openTurns=new Set(sc.turns.map((_,x)=>x));}openTurns.has(i)?openTurns.delete(i):openTurns.add(i);const t=DATA.scenarios.find(s=>s.id===scenarioId).turns[i],el=b.closest('.turn');el.outerHTML=turnHTML(t,i);document.querySelector(`[data-turn="${i}"]`)?.focus({preventScroll:true});const allButton=document.querySelector('[data-action="all-translations"]');if(allButton)allButton.textContent=roleplay?'Reveal models & meanings':'Reveal all meanings';return;}
 if(b.dataset.keigo!==undefined){const i=b.dataset.keigo,box=document.getElementById('keigo-'+i),meaning=document.getElementById('keigo-meaning-'+i);meaning.hidden=!meaning.hidden;box.classList.toggle('readings',!meaning.hidden);b.setAttribute('aria-expanded',!meaning.hidden);return;}
 if(b.dataset.fact!==undefined){const on=!b.classList.contains('readings');b.classList.toggle('readings',on);b.setAttribute('aria-expanded',on);b.querySelector('.tapcue').textContent=on?'Hide furigana · ซ่อนคำอ่าน':'Tap for furigana · แตะเพื่อดูคำอ่าน';return;}
 const action=b.dataset.action;
 if(action==='quick-recall')startSession(true);
 if(action==='start-recall')startSession();
 if(action==='setup-recall'){session=null;render();window.scrollTo({top:0,behavior:'instant'});}
 if(action==='reveal-recall'){session.revealed=true;render();document.querySelector('[data-recall]')?.focus({preventScroll:true});}
 if(action==='retry-shaky'){const ids=session.results.filter(r=>r.status==='shaky').map(r=>r.id);session={ids,index:0,revealed:false,results:[]};render();window.scrollTo({top:0,behavior:'instant'});}
 if(action==='clear-search'){query='';document.getElementById('search').value='';b.hidden=true;renderList();document.getElementById('search').focus();}
 if(action==='clear-filters'){query='';category='all';speaker='all';filter='all';essentials=false;render();}
 if(action==='all-translations'){showAll=!showAll;openTurns.clear();render();document.querySelector('[data-action="all-translations"]')?.focus({preventScroll:true});}
 if(action==='save-portable')savePortableCopy();
 if(action==='export'){const blob=new Blob([JSON.stringify(exportObject(),null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='counter-notes-progress-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);notify('Backup prepared. If needed, use Backup as text.');}
 if(action==='backup-text'){document.getElementById('backupTextArea').hidden=false;const t=document.getElementById('backupText');t.value=JSON.stringify(exportObject());t.focus();t.select();}
 if(action==='restore-text')restore(document.getElementById('restoreText').value);
 if(action==='ask-reset')document.getElementById('resetConfirm').hidden=false;
 if(action==='cancel-reset')document.getElementById('resetConfirm').hidden=true;
 if(action==='reset'){marks={};loadProblem=false;changed();save();session=null;render();notify('All marks cleared · ล้างความคืบหน้าแล้ว');}
});
render();
</script>
</body>
</html>
