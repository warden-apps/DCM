th":"ต้องเล่าเรื่องเดิมอีกกี่รอบคะ","essential":false},{"id":"p063","cat":"complaints","speaker":"customer","jp":"{責任者|せきにんしゃ}と{話|はな}したいです。","en":"I want to speak to the person in charge.","th":"ขอคุยกับผู้รับผิดชอบค่ะ","essential":false},{"id":"p064","cat":"coworkers","speaker":"staff","jp":"お{疲|つか}れさまです。{今|いま}、{少|すこ}しよろしいですか。","en":"Hi. Do you have a moment?","th":"สวัสดีค่ะ ตอนนี้พอมีเวลาสักครู่ไหมคะ","note":"お疲れさまです is a normal coworker greeting during the day, not just at closing.","noteTh":"お疲れさまです ใช้ทักทายเพื่อนร่วมงานระหว่างวันได้ ไม่ได้ใช้เฉพาะตอนเลิกงานค่ะ","essential":true},{"id":"p065","cat":"coworkers","speaker":"staff","jp":"この{申請|しんせい}の{手順|てじゅん}を{教|おし}えていただけますか。","en":"Could you show me the steps for this application?","th":"ช่วยสอนขั้นตอนการยื่นคำขอนี้ได้ไหมคะ","essential":true},{"id":"p066","cat":"coworkers","speaker":"staff","jp":"{入力内容|にゅうりょくないよう}を{確認|かくにん}していただけますか。","en":"Could you check the information I've entered?","th":"ช่วยตรวจสอบข้อมูลที่กรอกให้หน่อยได้ไหมคะ","essential":true},{"id":"p067","cat":"coworkers","speaker":"staff","jp":"こちらの{契約書類|けいやくしょるい}は、どこに{保管|ほかん}すればよいですか。","en":"Where should I store these contract documents?","th":"ควรเก็บเอกสารสัญญาชุดนี้ไว้ที่ไหนคะ","essential":false},{"id":"p068","cat":"coworkers","speaker":"staff","jp":"この{端末|たんまつ}の{在庫|ざいこ}を{確認|かくにん}するには、どこを{見|み}ればよいですか。","en":"Where should I look to check stock for this handset?","th":"ถ้าจะตรวจสอบสต็อกเครื่องรุ่นนี้ ต้องดูตรงไหนคะ","essential":false},{"id":"p069","cat":"coworkers","speaker":"staff","jp":"{先|さき}にどちらを{進|すす}めればよいでしょうか。","en":"Which of these should I work on first?","th":"ควรทำอันไหนก่อนคะ","essential":false},{"id":"p070","cat":"coworkers","speaker":"staff","jp":"{対応|たいおう}した{内容|ないよう}と、まだ{確認|かくにん}できていない{点|てん}を{共有|きょうゆう}します。","en":"I'll share what has been done and what still needs checking.","th":"ขอแจ้งสิ่งที่ดำเนินการแล้วกับประเด็นที่ยังตรวจสอบไม่เสร็จค่ะ","essential":false},{"id":"p071","cat":"coworkers","speaker":"staff","jp":"{私|わたし}の{入力|にゅうりょく}に{誤|あやま}りがありました。{修正方法|しゅうせいほうほう}を{確認|かくにん}してもよろしいですか。","en":"I made a data-entry error. May I check the correct way to fix it?","th":"กรอกข้อมูลผิดค่ะ ขอสอบถามวิธีแก้ไขที่ถูกต้องได้ไหมคะ","essential":false},{"id":"p072","cat":"coworkers","speaker":"staff","jp":"{今日|きょう}、{教|おし}えていただいたことをメモにまとめました。","en":"I've organized what you taught me today into notes.","th":"สรุปสิ่งที่สอนวันนี้ไว้เป็นบันทึกแล้วค่ะ","essential":false},{"id":"p073","cat":"coworkers","speaker":"coworker","jp":"この{件|けん}、{本部|ほんぶ}に{確認|かくにん}してもらえますか。","en":"Could you check this with head office?","th":"ช่วยสอบถามเรื่องนี้กับสำนักงานใหญ่ได้ไหมคะ","essential":false},{"id":"p074","cat":"coworkers","speaker":"coworker","jp":"{引|ひ}き{継|つ}ぎをお{願|ねが}いします。まだ{確認中|かくにんちゅう}のことはありますか。","en":"Please hand this over. Is anything still being checked?","th":"ช่วยส่งต่องานด้วยค่ะ มีเรื่องไหนที่ยังอยู่ระหว่างตรวจสอบไหมคะ","essential":false},{"id":"p075","cat":"multilingual","speaker":"staff","jp":"どの{言語|げんご}でのご{説明|せつめい}をご{希望|きぼう}ですか。","en":"Which language would you prefer for the explanation?","th":"ต้องการให้ใช้ภาษาอะไรในการอธิบายคะ","note":"Confirm what support is available before promising a language service.","noteTh":"ตรวจสอบก่อนว่ามีบริการช่วยเหลือภาษาใดบ้าง แล้วจึงรับปากค่ะ","essential":false},{"id":"p076","cat":"multilingual","speaker":"staff","jp":"{日本語|にほんご}とタイ{語|ご}の{表現|ひょうげん}に、{意味|いみ}のずれがないか{確認|かくにん}します。","en":"I'll check that the Japanese and Thai wording convey the same meaning.","th":"จะตรวจสอบว่าข้อความภาษาญี่ปุ่นกับภาษาไทยมีความหมายตรงกันค่ะ","essential":false},{"id":"p077","cat":"multilingual","speaker":"staff","jp":"この{用語|ようご}は、タイ{語|ご}では{短|みじか}い{説明|せつめい}を{添|そ}えたほうが{伝|つた}わりやすいと{思|おも}います。","en":"I think this term would be clearer in Thai with a short explanation.","th":"คิดว่าคำนี้ถ้าเพิ่มคำอธิบายสั้น ๆ ในภาษาไทย จะเข้าใจง่ายขึ้นค่ะ","essential":false},{"id":"p078","cat":"multilingual","speaker":"staff","jp":"{契約|けいやく}の{補助資料|ほじょしりょう}を{翻訳|ほんやく}しました。{内容|ないよう}の{確認|かくにん}をお{願|ねが}いできますか。","en":"I've translated the supporting contract material. Could you review the content?","th":"แปลเอกสารประกอบการทำสัญญาแล้วค่ะ ช่วยตรวจสอบเนื้อหาได้ไหมคะ","essential":false},{"id":"p079","cat":"multilingual","speaker":"staff","jp":"よくあるお{問|と}い{合|あ}わせを、FAQに{追加|ついか}してはどうでしょうか。","en":"Could we add the questions we often receive to the FAQ?","th":"ลองเพิ่มคำถามที่ลูกค้าถามบ่อยลงใน FAQ ดีไหมคะ","essential":false},{"id":"p080","cat":"multilingual","speaker":"staff","jp":"{案内文|あんないぶん}をやさしい{日本語|にほんご}に{書|か}き{換|か}えてみました。","en":"I've tried rewriting the guidance in plain Japanese.","th":"ลองปรับข้อความแนะนำให้เป็นภาษาญี่ปุ่นที่เข้าใจง่ายแล้วค่ะ","essential":false},{"id":"p081","cat":"multilingual","speaker":"staff","jp":"お{問|と}い{合|あ}わせの{内容|ないよう}を、{言語別|げんごべつ}に{整理|せいり}しています。","en":"I'm organizing the inquiries by language.","th":"กำลังจัดหมวดหมู่เนื้อหาคำถามแยกตามภาษาค่ะ","essential":false},{"id":"p082","cat":"multilingual","speaker":"staff","jp":"{集計|しゅうけい}する{期間|きかん}と{対象|たいしょう}を{確認|かくにん}してもよろしいですか。","en":"May I confirm the reporting period and which records to include?","th":"ขอยืนยันช่วงเวลาและข้อมูลที่จะนำมารวมสถิติได้ไหมคะ","essential":false},{"id":"p083","cat":"multilingual","speaker":"staff","jp":"{前月|ぜんげつ}と{比較|ひかく}して、どのような{変化|へんか}があるか{調|しら}べます。","en":"I'll look at what has changed compared with last month.","th":"จะตรวจสอบว่ามีอะไรเปลี่ยนแปลงไปจากเดือนก่อนบ้างค่ะ","essential":false},{"id":"p084","cat":"multilingual","speaker":"staff","jp":"{件数|けんすう}が{少|すく}ないので、まだ{傾向|けいこう}とは{言|い}い{切|き}れません。","en":"There are too few cases to say confidently that this is a trend yet.","th":"จำนวนกรณียังน้อย จึงยังสรุปแน่ชัดว่าเป็นแนวโน้มไม่ได้ค่ะ","essential":false},{"id":"p085","cat":"multilingual","speaker":"staff","jp":"{国籍|こくせき}だけで{判断|はんだん}せず、ご{本人|ほんにん}の{希望|きぼう}も{確認|かくにん}したいです。","en":"I'd like to check each person's preferences as well, without judging by nationality alone.","th":"อยากตรวจสอบความต้องการของแต่ละคนด้วย โดยไม่ตัดสินจากสัญชาติเพียงอย่างเดียวค่ะ","essential":false},{"id":"p086","cat":"multilingual","speaker":"staff","jp":"{分析結果|ぶんせきけっか}と{改善案|かいぜんあん}を、{報告書|ほうこくしょ}にまとめます。","en":"I'll put the analysis findings and proposed improvements into a report.","th":"จะสรุปผลการวิเคราะห์และข้อเสนอปรับปรุงเป็นรายงานค่ะ","essential":false},{"id":"p087","cat":"multilingual","speaker":"staff","jp":"この{改善案|かいぜんあん}について、{店舗|てんぽ}と{本部|ほんぶ}のご{意見|いけん}を{伺|うかが}いたいです。","en":"I'd like input from the shop and head office on this improvement proposal.","th":"อยากขอความคิดเห็นจากสาขาและสำนักงานใหญ่เกี่ยวกับข้อเสนอปรับปรุงนี้ค่ะ","essential":false},{"id":"p088","cat":"multilingual","speaker":"staff","jp":"{資料|しりょう}を{更新|こうしん}する{担当者|たんとうしゃ}と、{確認|かくにん}の{流|なが}れを{決|き}めておきませんか。","en":"Could we agree on who will update the materials and how they will be reviewed?","th":"กำหนดผู้รับผิดชอบอัปเดตเอกสารและขั้นตอนตรวจสอบไว้ก่อนดีไหมคะ","essential":false}],"rescue":[{"id":"r01","cat":"rescue","speaker":"staff","jp":"{恐|おそ}れ{入|い}りますが、もう{一度|いちど}お{願|ねが}いできますか。","en":"I'm sorry, could you say that again?","th":"ขอโทษค่ะ ช่วยพูดอีกครั้งได้ไหมคะ","note":"For a customer or senior coworker when you missed what was said. A calm first response is enough.","noteTh":"ใช้กับลูกค้าหรือรุ่นพี่เมื่อฟังไม่ทัน เริ่มด้วยประโยคนี้อย่างใจเย็นได้เลยค่ะ","essential":true},{"id":"r02","cat":"rescue","speaker":"staff","jp":"{恐|おそ}れ{入|い}りますが、{少|すこ}しゆっくりお{話|はな}しいただけますか。","en":"I'm sorry, could you speak a little more slowly?","th":"ขอโทษค่ะ ช่วยพูดช้าลงอีกนิดได้ไหมคะ","note":"Useful with fast speech. お話しいただけますか is a polite request for the other person to speak.","noteTh":"ใช้เมื่ออีกฝ่ายพูดเร็ว お話しいただけますか เป็นรูปสุภาพสำหรับขอให้อีกฝ่ายพูดค่ะ","essential":true},{"id":"r03","cat":"rescue","speaker":"staff","jp":"「○○」というのは、どういう{意味|いみ}でしょうか。","en":"What does “___” mean?","th":"คำว่า “___” หมายความว่าอย่างไรคะ","note":"Repeat the unfamiliar word in place of ○○. Especially useful for checking a technical term with a coworker.","noteTh":"แทน ○○ ด้วยคำที่ไม่เข้าใจ เหมาะสำหรับถามความหมายของศัพท์เฉพาะกับเพื่อนร่วมงานค่ะ","essential":false},{"id":"r04","cat":"rescue","speaker":"staff","jp":"プランを{変更|へんこう}したい、ということでしょうか。","en":"Just to confirm, you'd like to change your plan?","th":"ขอทวนเพื่อความแน่ใจค่ะ คุณต้องการเปลี่ยนแพ็กเกจ ใช่ไหมคะ","note":"Check your understanding instead of guessing. Replace プランを変更したい with the request you think you heard.","noteTh":"ใช้ทวนความเข้าใจแทนการเดาค่ะ เปลี่ยน プランを変更したい เป็นสิ่งที่คุณคิดว่าลูกค้าต้องการ","essential":true},{"id":"r05","cat":"rescue","speaker":"staff","jp":"{恐|おそ}れ{入|い}りますが、こちらに{書|か}いていただけますか。","en":"I'm sorry, could you write it here?","th":"ขอโทษค่ะ ช่วยเขียนตรงนี้ให้ได้ไหมคะ","note":"For an unfamiliar word or model name when hearing it again has not helped.","noteTh":"ใช้กับคำที่ไม่คุ้นหรือชื่อรุ่น เมื่อฟังซ้ำแล้วยังไม่เข้าใจค่ะ","essential":false},{"id":"r06","cat":"rescue","speaker":"staff","jp":"{正確|せいかく}にご{案内|あんない}するため、{確認|かくにん}してまいります。{少々|しょうしょう}お{待|ま}ちいただけますか。","en":"I'll check so I can give you accurate information. Could you wait a moment?","th":"ขอตรวจสอบเพื่อให้ข้อมูลที่ถูกต้องค่ะ รอสักครู่ได้ไหมคะ","note":"Use when you will go and check with a colleague or another source, then return. Do not invent an answer.","noteTh":"ใช้เมื่อจะไปตรวจสอบกับเพื่อนร่วมงานหรือแหล่งข้อมูล แล้วกลับมาแจ้งลูกค้าค่ะ","essential":true},{"id":"r07","cat":"rescue","speaker":"staff","jp":"{申|もう}し{訳|わけ}ございません。{私|わたくし}では{判断|はんだん}できないため、{担当者|たんとうしゃ}に{確認|かくにん}いたします。","en":"I'm sorry. I can't make that determination myself, so I'll check with the person in charge.","th":"ขออภัยค่ะ ดิฉันยังตัดสินเรื่องนี้เองไม่ได้ จึงขอตรวจสอบกับผู้รับผิดชอบค่ะ","note":"For a request beyond your knowledge or authority, such as an exception or disputed charge.","noteTh":"ใช้กับคำขอที่เกินความรู้หรืออำนาจตัดสินใจของคุณ เช่น การขอยกเว้นเงื่อนไขหรือการโต้แย้งยอดเรียกเก็บค่ะ","essential":true},{"id":"r08","cat":"rescue","speaker":"staff","jp":"お{待|ま}たせして{申|もう}し{訳|わけ}ございません。{確認|かくにん}にもう{少|すこ}しお{時間|じかん}がかかりそうです。","en":"I'm sorry to keep you waiting. It looks like checking will take a little longer.","th":"ขออภัยที่ให้รอค่ะ การตรวจสอบน่าจะใช้เวลาอีกสักหน่อยค่ะ","note":"Give an update while the customer waits. This does not promise a completion time.","noteTh":"แจ้งความคืบหน้าให้ลูกค้าที่กำลังรอ ประโยคนี้ไม่ได้รับรองว่าจะเสร็จเมื่อไรค่ะ","essential":false},{"id":"r09","cat":"rescue","speaker":"staff","jp":"{先|さき}ほどのご{案内|あんない}に{誤|あやま}りがございました。{申|もう}し{訳|わけ}ございません。{正|ただ}しい{内容|ないよう}を{確認|かくにん}して、{改|あらた}めてご{説明|せつめい}いたします。","en":"There was an error in the information I gave you earlier. I'm sorry. I'll check the correct information and explain it again.","th":"ข้อมูลที่ดิฉันแจ้งไปเมื่อสักครู่มีข้อผิดพลาดค่ะ ขออภัยด้วยค่ะ ดิฉันจะตรวจสอบข้อมูลที่ถูกต้องแล้วอธิบายให้อีกครั้งค่ะ","note":"Use as soon as you discover you gave incorrect information. Confirm the correction before explaining it.","noteTh":"ใช้ทันทีที่พบว่าตนเองให้ข้อมูลผิด ตรวจสอบข้อมูลที่แก้ไขให้แน่ใจก่อนอธิบายอีกครั้งค่ะ","essential":true},{"id":"r10","cat":"rescue","speaker":"staff","jp":"{担当|たんとう}の{者|もの}に{引|ひ}き{継|つ}いでもよろしいでしょうか。お{話|はなし}の{内容|ないよう}はこちらから{伝|つた}えます。","en":"May I hand you over to the person in charge? I'll explain what you've told me to them.","th":"ขอส่งต่อให้ผู้รับผิดชอบดูแลได้ไหมคะ ดิฉันจะเล่าเรื่องที่คุณแจ้งมาให้เขาทราบค่ะ","note":"Use when a handoff is appropriate. Follow through by briefing your coworker so the customer does not need to start again.","noteTh":"ใช้เมื่อควรส่งต่อให้ผู้รับผิดชอบ แล้วสรุปเรื่องให้เพื่อนร่วมงานจริง ๆ เพื่อให้ลูกค้าไม่ต้องเริ่มอธิบายใหม่ค่ะ","essential":true},{"id":"r11","cat":"rescue","speaker":"staff","jp":"この{手順|てじゅん}で{合|あ}っているか、{確認|かくにん}していただけますか。","en":"Could you check whether I'm following the right steps?","th":"ช่วยตรวจให้หน่อยได้ไหมคะว่าขั้นตอนที่ทำอยู่นี้ถูกต้องหรือเปล่า","note":"To your trainer or a senior coworker, before proceeding with a step you are unsure about.","noteTh":"พูดกับผู้สอนงานหรือรุ่นพี่ ก่อนทำขั้นตอนที่ยังไม่มั่นใจต่อไปค่ะ","essential":false},{"id":"r12","cat":"rescue","speaker":"staff","jp":"すみません。どこまで{進|すす}めればよいか、{教|おし}えていただけますか。","en":"Excuse me, could you tell me how far I should proceed?","th":"ขอโทษค่ะ ช่วยบอกได้ไหมคะว่าควรทำต่อไปถึงขั้นตอนไหน","note":"To your trainer or a senior coworker. Useful when you understand the task but are unsure where your responsibility ends.","noteTh":"พูดกับผู้สอนงานหรือรุ่นพี่ เมื่อเข้าใจงานแล้วแต่ยังไม่แน่ใจว่าตนเองควรทำถึงขั้นไหนค่ะ","essential":false}],"scenarios":[{"id":"plan-pushback","title":"Plan change: “Will it really be cheaper?”","titleTh":"เปลี่ยนแพ็กเกจ: “จะถูกลงจริงไหม?”","context":"Practice dialogue based on the listing’s plan-review work. No actual price or plan condition is assumed.","contextTh":"บทสนทนาฝึกจากงานทบทวนแพ็กเกจในประกาศรับสมัคร ไม่ได้กำหนดราคาหรือเงื่อนไขแพ็กเกจจริง","goal":"Find the customer’s priorities, compare the whole bill, and confirm conditions before suggesting a change.","goalTh":"ถามสิ่งที่ลูกค้าให้ความสำคัญ เปรียบเทียบยอดรวม และตรวจสอบเงื่อนไขก่อนเสนอให้เปลี่ยน","turns":[{"role":"staff","jp":"{本日|ほんじつ}はどのようなご{相談|そうだん}でしょうか。","en":"What would you like to discuss today?","th":"วันนี้ต้องการปรึกษาเรื่องอะไรคะ"},{"role":"customer","jp":"{毎月|まいつき}の{料金|りょうきん}が{高|たか}いので、もっと{安|やす}くしたいです。","en":"My monthly bill is high. I’d like to reduce it.","th":"ค่าโทรศัพท์แต่ละเดือนแพง อยากลดค่าใช้จ่ายลง"},{"role":"staff","jp":"{料金|りょうきん}を{見直|みなお}したいということですね。{普段|ふだん}は、どのようにスマートフォンをお{使|つか}いですか。","en":"You’d like to review the cost. How do you usually use your smartphone?","th":"ต้องการทบทวนค่าใช้จ่ายใช่ไหมคะ ปกติใช้สมาร์ตโฟนทำอะไรบ้างคะ"},{"role":"customer","jp":"{家|いえ}ではWi-Fiを{使|つか}っています。でも、{外|そと}では{動画|どうが}も{見|み}ます。","en":"I use Wi-Fi at home, but I also watch videos when I’m out.","th":"ที่บ้านใช้ Wi-Fi แต่เวลาออกไปข้างนอกก็ดูวิดีโอด้วย"},{"role":"staff","jp":"{現在|げんざい}のご{契約|けいやく}とデータ{使用量|しようりょう}を{確認|かくにん}し、{合|あ}いそうなプランを{比較|ひかく}いたします。{確認|かくにん}を{進|すす}めてもよろしいでしょうか。","en":"I’ll check your current contract and data usage, then compare plans that may suit you. May I go ahead with the checks?","th":"จะตรวจสอบสัญญาปัจจุบันและปริมาณอินเทอร์เน็ตที่ใช้ แล้วเปรียบเทียบแพ็กเกจที่น่าจะเหมาะสมค่ะ ขอเริ่มตรวจสอบได้ไหมคะ"},{"role":"customer","jp":"はい。でも、{安|やす}いプランにしても、ほかの{料金|りょうきん}が{増|ふ}えるんじゃないですか。","en":"Yes. But if I switch to a cheaper plan, won’t other charges go up?","th":"ได้ แต่เปลี่ยนเป็นแพ็กเกจถูกกว่าแล้ว ค่าใช้จ่ายอย่างอื่นจะเพิ่มหรือเปล่า"},{"role":"staff","jp":"ご{心配|しんぱい}ですよね。プランの{料金|りょうきん}だけでなく、{通話料|つうわりょう}やオプションなども{含|ふく}めて、{合計|ごうけい}を{確認|かくにん}いたします。","en":"I understand your concern. I’ll check the total, including calls and options, as well as the plan charge.","th":"เข้าใจว่ากังวลค่ะ จะตรวจสอบยอดรวม ทั้งค่าแพ็กเกจ ค่าโทร และบริการเสริมด้วยค่ะ"},{"role":"customer","jp":"{今|いま}の{割引|わりびき}は、そのまま{使|つか}えますか。","en":"Will I still be able to use my current discount?","th":"ส่วนลดที่ใช้อยู่ตอนนี้จะยังใช้ได้ไหม"},{"role":"staff","jp":"{変更後|へんこうご}も{対象|たいしょう}になるか、{適用条件|てきようじょうけん}を{確認|かくにん}いたします。{確認|かくにん}できるまでは、{安|やす}くなるとはお{約束|やくそく}できません。","en":"I’ll check the eligibility conditions after the change. Until I’ve checked, I can’t promise that it will be cheaper.","th":"จะตรวจสอบเงื่อนไขว่ายังได้รับส่วนลดหลังเปลี่ยนแพ็กเกจหรือไม่ค่ะ ก่อนตรวจสอบเสร็จ ยังรับรองไม่ได้ว่าจะถูกลงค่ะ"},{"role":"customer","jp":"じゃあ、{今日|きょう}すぐには{変|か}えたくないです。まず{違|ちが}いを{知|し}りたいです。","en":"Then I don’t want to change it right away today. I want to understand the differences first.","th":"ถ้าอย่างนั้นวันนี้ยังไม่อยากเปลี่ยนทันที อยากรู้ความแตกต่างก่อน"},{"role":"staff","jp":"かしこまりました。まず{料金|りょうきん}と{条件|じょうけん}の{違|ちが}いをご{説明|せつめい}いたします。{変更|へんこう}するかどうかは、ご{説明|せつめい}の{後|あと}にお{決|き}めください。","en":"Certainly. I’ll explain the differences in cost and conditions first. Please decide whether to change after the explanation.","th":"ได้ค่ะ จะอธิบายความแตกต่างด้านราคาและเงื่อนไขก่อน แล้วค่อยตัดสินใจว่าจะเปลี่ยนหรือไม่ค่ะ"},{"role":"customer","jp":"それならお{願|ねが}いします。{毎月|まいつき}の{合計|ごうけい}がどう{変|か}わるか、{知|し}りたいです。","en":"In that case, please go ahead. I want to know how my monthly total would change.","th":"ถ้าอย่างนั้นช่วยอธิบายด้วย อยากรู้ว่ายอดรวมแต่ละเดือนจะเปลี่ยนอย่างไร"}],"takeaway":"Mirror the goal → ask about use → check the total and discounts → let the customer decide. “I’ll check” is a useful answer when the conditions are not yet verified.","takeawayTh":"ทวนความต้องการ → ถามการใช้งาน → ตรวจยอดรวมและส่วนลด → ให้ลูกค้าตัดสินใจ หากยังไม่ได้ตรวจสอบเงื่อนไข ใช้คำว่า “ขอตรวจสอบค่ะ” ได้"},{"id":"billing-complaint","title":"Billing complaint: an unfamiliar charge","titleTh":"ข้อร้องเรียนเรื่องบิล: มีค่าบริการที่ไม่คุ้น","context":"Practice a billing inquiry that needs a senior colleague’s help. The charge, refund eligibility, and response time remain unverified.","contextTh":"ฝึกตอบคำถามเรื่องบิลที่ต้องให้รุ่นพี่ช่วย ยังไม่ทราบข้อเท็จจริงของค่าบริการ สิทธิคืนเงิน หรือเวลาที่จะได้คำตอบ","goal":"Acknowledge the concern without guessing, ask to check details, and hand over the unresolved point clearly.","goalTh":"รับฟังความกังวลโดยไม่เดา ขออนุญาตตรวจสอบรายละเอียด และส่งต่อประเด็นที่ยังไม่ชัดเจน","turns":[{"role":"customer","jp":"この{請求|せいきゅう}、おかしくないですか。{先月|せんげつ}より{高|たか}いんですけど。","en":"Isn’t this bill wrong? It’s higher than last month.","th":"บิลนี้ผิดหรือเปล่า แพงกว่าเดือนที่แล้ว"},{"role":"staff","jp":"{先月|せんげつ}より{高|たか}くなっていて、ご{心配|しんぱい}なのですね。どの{項目|こうもく}か、{一緒|いっしょ}に{確認|かくにん}してもよろしいでしょうか。","en":"You’re concerned because it’s higher than last month. May we check which item it is together?","th":"กังวลเพราะยอดสูงกว่าเดือนที่แล้วใช่ไหมคะ ขอช่วยตรวจสอบด้วยกันว่าเป็นรายการไหนได้ไหมคะ"},{"role":"customer","jp":"このオプションです。{申|もう}し{込|こ}んだ{覚|おぼ}えはありません。","en":"This option here. I don’t remember signing up for it.","th":"บริการเสริมตรงนี้ จำไม่ได้ว่าเคยสมัคร"},{"role":"staff","jp":"お{申|もう}し{込|こ}みの{覚|おぼ}えがないということですね。{請求内容|せいきゅうないよう}と、お{申|もう}し{込|こ}みの{記録|きろく}を{確認|かくにん}いたします。","en":"You don’t remember signing up for it. I’ll check the billing details and the application record.","th":"จำไม่ได้ว่าเคยสมัครรายการนี้ใช่ไหมคะ จะตรวจสอบรายละเอียดบิลและบันทึกการสมัครค่ะ"},{"role":"customer","jp":"{調|しら}べるだけじゃなくて、{返金|へんきん}してください。","en":"Don’t just look into it. I want a refund.","th":"อย่าแค่ตรวจสอบ ขอให้คืนเงินด้วย"},{"role":"staff","jp":"{返金|へんきん}をご{希望|きぼう}ですね。{申|もう}し{訳|わけ}ございませんが、{現時点|げんじてん}では{返金|へんきん}できるか{判断|はんだん}できません。{内容|ないよう}を{確認|かくにん}し、{責任者|せきにんしゃ}に{相談|そうだん}いたします。","en":"You would like a refund. I’m sorry, but I can’t determine at this point whether a refund is possible. I’ll check the details and consult the person in charge.","th":"ต้องการให้คืนเงินใช่ไหมคะ ขออภัยค่ะ ตอนนี้ยังตัดสินไม่ได้ว่าสามารถคืนเงินได้หรือไม่ จะตรวจสอบรายละเอียดและปรึกษาผู้รับผิดชอบค่ะ"},{"role":"customer","jp":"また{同|おな}じ{説明|せつめい}をしないといけないんですか。","en":"Am I going to have to explain everything again?","th":"ต้องอธิบายเรื่องเดิมซ้ำอีกหรือ"},{"role":"staff","jp":"これまで{伺|うかが}った{内容|ないよう}は、{私|わたし}から{引|ひ}き{継|つ}ぎます。{追加|ついか}で{確認|かくにん}が{必要|ひつよう}な{点|てん}があれば、お{伺|うかが}いします。","en":"I’ll pass on what you’ve told me so far. If anything else needs checking, we’ll ask you about it.","th":"ดิฉันจะส่งต่อเรื่องที่ได้รับฟังมาค่ะ หากมีประเด็นที่ต้องตรวจสอบเพิ่มเติม จะสอบถามอีกครั้งค่ะ"},{"role":"customer","jp":"どのくらい{待|ま}ちますか。あまり{時間|じかん}がないんです。","en":"How long will I have to wait? I don’t have much time.","th":"ต้องรอนานแค่ไหน มีเวลาไม่มาก"},{"role":"staff","jp":"お{待|ま}ちいただく{時間|じかん}の{目安|めやす}を{確認|かくにん}してまいります。お{急|いそ}ぎであることも{伝|つた}えます。","en":"I’ll check the estimated wait and let them know you’re in a hurry.","th":"จะไปตรวจสอบเวลารอโดยประมาณค่ะ และจะแจ้งด้วยว่าคุณมีเวลาจำกัดค่ะ"},{"role":"staff","jp":"こちらのお{客様|きゃくさま}は、オプションを{申|もう}し{込|こ}んだ{覚|おぼ}えがなく、{返金|へんきん}をご{希望|きぼう}です。{申込記録|もうしこみきろく}はまだ{確認|かくにん}できていません。ご{対応|たいおう}をお{願|ねが}いできますか。","en":"[To a colleague] This customer doesn’t remember signing up for the option and wants a refund. I haven’t been able to verify the application record yet. Could you help with this?","th":"[พูดกับเพื่อนร่วมงาน] ลูกค้าท่านนี้จำไม่ได้ว่าเคยสมัครบริการเสริมและต้องการคืนเงินค่ะ ยังตรวจสอบบันทึกการสมัครไม่ได้ รบกวนช่วยรับเรื่องได้ไหมคะ"},{"role":"coworker","jp":"{分|わ}かりました。まず{記録|きろく}を{確認|かくにん}しましょう。{分|わ}かったことと、まだ{確認|かくにん}が{必要|ひつよう}なことを{分|わ}けて{説明|せつめい}しましょう。","en":"Understood. Let’s check the record first, then explain separately what we know and what still needs checking.","th":"เข้าใจแล้ว เริ่มจากตรวจสอบบันทึกกันก่อน แล้วแยกอธิบายส่วนที่ทราบแล้วกับส่วนที่ยังต้องตรวจสอบ"}],"takeaway":"Acknowledge the customer’s account without declaring the bill wrong. A useful handover includes their concern, their request, and what is still unverified.","takeawayTh":"รับฟังสิ่งที่ลูกค้าเล่าโดยยังไม่สรุปว่าบิลผิด เวลาส่งต่อให้บอกข้อกังวล สิ่งที่ลูกค้าต้องการ และส่วนที่ยังไม่ได้ตรวจสอบ"},{"id":"repair-data-cost","title":"Repair: photos, cost, and uncertainty","titleTh":"ส่งซ่อม: รูปถ่าย ค่าใช้จ่าย และสิ่งที่ยังไม่ทราบ","context":"Practice repair reception and after-sales support from the job listing. Repair outcome, data handling, cost, and timing must be checked for the actual case.","contextTh":"ฝึกงานรับซ่อมและดูแลหลังการขายตามประกาศรับสมัคร ต้องตรวจสอบผลการซ่อม การจัดการข้อมูล ค่าใช้จ่าย และเวลาตามกรณีจริง","goal":"Ask about symptoms and priorities; explain uncertainty without promising data recovery, free repair, or same-day completion.","goalTh":"ถามอาการและสิ่งที่ลูกค้ากังวล อธิบายส่วนที่ยังไม่ทราบโดยไม่รับรองการกู้ข้อมูล การซ่อมฟรี หรือการซ่อมเสร็จภายในวันเดียว","turns":[{"role":"customer","jp":"スマホが{動|うご}かなくなりました。{画面|がめん}を{触|さわ}っても{反応|はんのう}しません。","en":"My phone has stopped working. The screen doesn’t respond when I touch it.","th":"มือถือใช้งานไม่ได้ แตะหน้าจอแล้วไม่ตอบสนอง"},{"role":"staff","jp":"{画面|がめん}が{反応|はんのう}しないのですね。いつごろからでしょうか。","en":"The screen isn’t responding. When did that start?","th":"หน้าจอไม่ตอบสนองใช่ไหมคะ เริ่มเป็นตั้งแต่เมื่อไรคะ"},{"role":"customer","jp":"{今朝|けさ}からです。{昨日|きのう}{落|お}としたんですけど、{写真|しゃしん}は{消|き}えませんよね。","en":"Since this morning. I dropped it yesterday, but my photos won’t be lost, will they?","th":"ตั้งแต่เช้านี้ เมื่อวานทำตก แต่รูปจะไม่หายใช่ไหม"},{"role":"staff","jp":"{写真|しゃしん}が{心配|しんぱい}なのですね。{今|いま}の{段階|だんかい}では、データが{残|のこ}るとはお{約束|やくそく}できません。バックアップはお{済|す}みですか。","en":"You’re worried about the photos. At this stage, I can’t promise that the data will be preserved. Have you made a backup?","th":"กังวลเรื่องรูปถ่ายใช่ไหมคะ ตอนนี้ยังรับรองไม่ได้ว่าข้อมูลจะคงอยู่ค่ะ ได้สำรองข้อมูลไว้ไหมคะ"},{"role":"customer","jp":"よく{分|わ}かりません。バックアップって、{何|なん}ですか。","en":"I’m not sure. What’s a backup?","th":"ไม่ค่อยเข้าใจ การสำรองข้อมูลคืออะไร"},{"role":"staff","jp":"{写真|しゃしん}などのデータを、{別|べつ}の{場所|ばしょ}にも{保存|ほぞん}しておくことです。{別|べつ}の{端末|たんまつ}やサービスに、{写真|しゃしん}を{保存|ほぞん}した{覚|おぼ}えはありますか。","en":"It means saving data such as photos in another place as well. Do you remember saving your photos to another device or service?","th":"คือการเก็บข้อมูล เช่น รูปถ่าย ไว้ในอีกที่หนึ่งด้วยค่ะ จำได้ไหมคะว่าเคยบันทึกรูปไว้ในอุปกรณ์อื่นหรือบริการอื่น"},{"role":"customer","jp":"たぶん、していません。それと、{修理|しゅうり}は{無料|むりょう}ですよね。{補償|ほしょう}に{入|はい}ったはずです。","en":"I probably haven’t. Also, the repair is free, right? I think I signed up for coverage.","th":"น่าจะไม่ได้ทำไว้ แล้วซ่อมฟรีใช่ไหม คิดว่าเคยสมัครบริการคุ้มครองไว้"},{"role":"staff","jp":"ご{加入中|かにゅうちゅう}のサービスと、{今回|こんかい}の{故障|こしょう}が{対象|たいしょう}になるかを{確認|かくにん}いたします。{費用|ひよう}についても、{確認後|かくにんご}にご{案内|あんない}いたします。","en":"I’ll check the service you’re enrolled in and whether this fault is covered. I’ll explain the cost once it has been checked too.","th":"จะตรวจสอบบริการที่สมัครอยู่และอาการเสียครั้งนี้ว่าอยู่ในความคุ้มครองหรือไม่ค่ะ ส่วนค่าใช้จ่ายจะแจ้งหลังตรวจสอบค่ะ"},{"role":"customer","jp":"{仕事|しごと}で{使|つか}うので、{今日|きょう}{直|なお}してほしいんです。","en":"I need it for work, so I want it fixed today.","th":"ต้องใช้ทำงาน อยากให้ซ่อมเสร็จวันนี้"},{"role":"staff","jp":"お{仕事|しごと}で{必要|ひつよう}なのですね。{本日中|ほんじつちゅう}に{直|なお}るとはお{約束|やくそく}できません。{対応方法|たいおうほうほう}と、かかる{時間|じかん}の{目安|めやす}を{確認|かくにん}いたします。","en":"You need it for work. I can’t promise it will be fixed today. I’ll check the available options and the estimated time.","th":"จำเป็นต้องใช้ทำงานใช่ไหมคะ ยังรับรองไม่ได้ว่าจะซ่อมเสร็จวันนี้ค่ะ จะตรวจสอบวิธีดำเนินการและระยะเวลาโดยประมาณค่ะ"},{"role":"customer","jp":"{勝手|かって}にデータを{消|け}さないでください。{先|さき}に{説明|せつめい}してほしいです。","en":"Please don’t erase my data without asking me. I want an explanation first.","th":"อย่าลบข้อมูลโดยไม่ถามก่อน อยากให้อธิบายก่อนดำเนินการ"},{"role":"staff","jp":"{承知|しょうち}いたしました。データの{扱|あつか}いを{確認|かくにん}し、{手続|てつづ}きの{前|まえ}にご{説明|せつめい}いたします。まず、{端末|たんまつ}の{状態|じょうたい}を{拝見|はいけん}してもよろしいでしょうか。","en":"Understood. I’ll check how the data would be handled and explain it before proceeding. First, may I look at the condition of the device?","th":"รับทราบค่ะ จะตรวจสอบวิธีจัดการข้อมูลและอธิบายก่อนดำเนินเรื่องค่ะ ก่อนอื่นขอดูสภาพเครื่องได้ไหมคะ"}],"takeaway":"Separate symptoms, data concerns, coverage, and urgency. Permission to look at a device is not permission to erase it or proceed with a repair.","takeawayTh":"แยกถามอาการเสีย ความกังวลเรื่องข้อมูล ความคุ้มครอง และความเร่งด่วน การอนุญาตให้ดูเครื่องไม่ได้หมายถึงอนุญาตให้ลบข้อมูลหรือส่งซ่อม"},{"id":"contract-language-support","title":"Contract support: “I don’t understand the terms”","titleTh":"ช่วยเรื่องสัญญา: “ไม่เข้าใจเงื่อนไข”","context":"Practice language support connected to the revised role’s translated contract aids and multilingual materials. Do not assume which documents are accepted or that a translation replaces the contract.","contextTh":"ฝึกช่วยด้านภาษาซึ่งเชื่อมกับงานแปลเอกสารประกอบสัญญาและจัดทำสื่อหลายภาษาในเอกสารหน้าที่งานฉบับแก้ไข ไม่สมมติว่าเอกสารใดใช้ได้หรือคำแปลใช้แทนสัญญาได้","goal":"Offer understandable language, check document requirements, and confirm understanding before asking for consent.","goalTh":"เสนอภาษาที่เข้าใจได้ ตรวจสอบเอกสารที่จำเป็น และเช็กความเข้าใจก่อนขอความยินยอม","turns":[{"role":"customer","jp":"{新|あたら}しく{契約|けいやく}したいです。でも、{難|むずか}しい{日本語|にほんご}はあまり{分|わ}かりません。","en":"I want to sign up for a new contract, but I don’t understand difficult Japanese very well.","th":"อยากเปิดสัญญาใหม่ แต่ไม่ค่อยเข้าใจภาษาญี่ปุ่นยาก ๆ"},{"role":"staff","jp":"{分|わ}かりやすい{言葉|ことば}で、{一|ひと}つずつご{説明|せつめい}いたします。{日本語|にほんご}とタイ{語|ご}では、どちらが{分|わ}かりやすいですか。","en":"I’ll explain each point in clear language. Which is easier for you, Japanese or Thai?","th":"จะอธิบายทีละข้อด้วยคำที่เข้าใจง่ายค่ะ ระหว่างภาษาญี่ปุ่นกับภาษาไทย ภาษาไหนเข้าใจง่ายกว่าคะ"},{"role":"customer","jp":"タイ{語|ご}のほうが{分|わ}かりやすいです。{今日|きょう}、{契約|けいやく}できますか。","en":"Thai is easier for me. Can I sign up today?","th":"ภาษาไทยเข้าใจง่ายกว่า วันนี้ทำสัญญาได้ไหม"},{"role":"staff","jp":"まず、お{手続|てつづ}きの{条件|じょうけん}と{必要|ひつよう}な{書類|しょるい}を{確認|かくにん}いたします。{本日|ほんじつ}お{手続|てつづ}きできるかは、{確認後|かくにんご}にご{案内|あんない}いたします。","en":"First I’ll check the requirements and the necessary documents. Once I’ve checked, I’ll let you know whether we can process it today.","th":"ก่อนอื่นจะตรวจสอบเงื่อนไขและเอกสารที่จำเป็นค่ะ หลังตรวจสอบจะแจ้งว่าสามารถดำเนินการวันนี้ได้หรือไม่ค่ะ"},{"role":"customer","jp":"{在留|ざいりゅう}カードだけ{持|も}ってきました。これだけで{大丈夫|だいじょうぶ}ですか。","en":"I only brought my residence card. Is this enough?","th":"เอามาแค่บัตรประจำตัวผู้พำนัก แค่นี้พอไหม"},{"role":"staff","jp":"こちらの{書類|しょるい}でお{手続|てつづ}きできるか、{確認|かくにん}が{必要|ひつよう}です。ほかに{必要|ひつよう}なものがないかも{調|しら}べます。","en":"I need to check whether we can process it with this document. I’ll also check whether anything else is required.","th":"ต้องตรวจสอบก่อนว่าใช้เอกสารนี้ดำเนินการได้หรือไม่ค่ะ และจะตรวจสอบด้วยว่าต้องใช้สิ่งใดเพิ่มเติมหรือไม่ค่ะ"},{"role":"customer","jp":"{友達|ともだち}は、この{書類|しょるい}だけでできたと{言|い}っていました。どうしてですか。","en":"My friend said they could do it with just this document. Why is that?","th":"เพื่อนบอกว่าใช้แค่เอกสารนี้ก็ทำได้ ทำไมถึงต่างกัน"},{"role":"staff","jp":"お{友達|ともだち}のお{手続|てつづ}きの{内容|ないよう}は{分|わ}かりませんので、{同|おな}じ{条件|じょうけん}かどうかは{判断|はんだん}できません。{今回|こんかい}のお{手続|てつづ}きについて、{担当者|たんとうしゃ}に{確認|かくにん}いたします。","en":"I don’t know the details of your friend’s application, so I can’t tell whether the conditions were the same. I’ll check your application with the colleague responsible.","th":"ไม่ทราบรายละเอียดการทำเรื่องของเพื่อน จึงยังบอกไม่ได้ว่าเงื่อนไขเหมือนกันหรือไม่ค่ะ จะตรวจสอบการทำเรื่องครั้งนี้กับผู้ดูแลค่ะ"},{"role":"customer","jp":"この{説明|せつめい}も{難|むずか}しいです。どこに{名前|なまえ}を{書|か}けばいいですか。","en":"This explanation is difficult too. Where should I write my name?","th":"คำอธิบายตรงนี้ก็ยาก ต้องเขียนชื่อตรงไหน"},{"role":"staff","jp":"ご{署名|しょめい}の{前|まえ}に、{内容|ないよう}を{一緒|いっしょ}に{確認|かくにん}しましょう。タイ{語|ご}で{説明|せつめい}を{補足|ほそく}してもよろしいでしょうか。","en":"Before you sign, let’s check the content together. May I add an explanation in Thai?","th":"ก่อนลงลายมือชื่อ มาตรวจสอบเนื้อหาด้วยกันก่อนค่ะ ขออธิบายเสริมเป็นภาษาไทยได้ไหมคะ"},{"role":"customer","jp":"はい。{特|とく}に、{毎月|まいつき}{払|はら}う{金額|きんがく}と、やめるときのことを{知|し}りたいです。","en":"Yes. In particular, I want to know how much I’ll pay each month and what happens when I cancel.","th":"ได้ อยากรู้โดยเฉพาะว่าต้องจ่ายเดือนละเท่าไร และถ้าจะยกเลิกต้องทำอย่างไร"},{"role":"staff","jp":"{承知|しょうち}いたしました。{料金|りょうきん}と{解約|かいやく}の{条件|じょうけん}を{確認|かくにん}してご{説明|せつめい}いたします。{分|わ}かりにくい{点|てん}があれば、いつでもおっしゃってください。","en":"Understood. I’ll verify and explain the charges and cancellation conditions. Please tell me whenever anything is unclear.","th":"รับทราบค่ะ จะตรวจสอบและอธิบายค่าใช้จ่ายกับเงื่อนไขการยกเลิกค่ะ หากมีส่วนไหนไม่เข้าใจ บอกได้ตลอดเลยค่ะ"}],"takeaway":"Do not infer preferred language from nationality. Ask, check requirements for this application, and resolve unclear terms before moving toward a signature.","takeawayTh":"อย่าเดาภาษาที่ลูกค้าถนัดจากสัญชาติ ให้ถาม ตรวจสอบเงื่อนไขของการทำเรื่องครั้งนี้ และอธิบายจุดที่ไม่ชัดเจนก่อนขั้นตอนลงลายมือชื่อ"},{"id":"coworker-faq-data","title":"With a coworker: improve a Thai FAQ","titleTh":"คุยกับเพื่อนร่วมงาน: ปรับปรุง FAQ ภาษาไทย","context":"A fictional team discussion grounded in the revised role: inquiry analysis, multilingual FAQ improvement, and coordination with stores and head office. Its observations are practice examples, not company findings.","contextTh":"บทสนทนาทีมสมมติจากหน้าที่งานฉบับแก้ไข ได้แก่ วิเคราะห์คำถาม ปรับปรุง FAQ หลายภาษา และประสานร้านกับสำนักงานใหญ่ ข้อสังเกตในบทฝึกไม่ใช่ผลวิเคราะห์จริงของบริษัท","goal":"Report a tentative pattern, accept wording feedback, and suggest a limited improvement with review.","goalTh":"รายงานแนวโน้มเบื้องต้น รับข้อเสนอแนะด้านถ้อยคำ และเสนอการปรับปรุงขอบเขตเล็กพร้อมขอให้ตรวจสอบ","turns":[{"role":"staff","jp":"お{疲|つか}れさまです。タイ{語|ご}のFAQ{案|あん}について、ご{相談|そうだん}してもよろしいですか。","en":"Hello. May I ask for your advice on the Thai FAQ draft?","th":"สวัสดีค่ะ ขอปรึกษาเรื่องร่าง FAQ ภาษาไทยได้ไหมคะ"},{"role":"coworker","jp":"はい。どんな{問|と}い{合|あ}わせをもとに{作|つく}りましたか。","en":"Of course. What kinds of inquiries did you base it on?","th":"ได้สิ ใช้คำถามแบบไหนเป็นข้อมูลในการทำร่าง"},{"role":"staff","jp":"{今回|こんかい}{確認|かくにん}した{記録|きろく}では、{料金|りょうきん}の{内訳|うちわけ}に{関|かん}する{質問|しつもん}が{目立|めだ}ちました。ただ、{件数|けんすう}が{少|すく}ないため、まだ{傾向|けいこう}とは{言|い}い{切|き}れません。","en":"In the records I checked this time, questions about the bill breakdown stood out. However, there are too few cases to call it a clear trend yet.","th":"ในบันทึกที่ตรวจสอบครั้งนี้ พบคำถามเรื่องรายละเอียดค่าใช้จ่ายค่อนข้างเด่นค่ะ แต่จำนวนกรณียังน้อย จึงยังสรุปว่าเป็นแนวโน้มไม่ได้ค่ะ"},{"role":"coworker","jp":"いいですね。{言語別|げんごべつ}に{整理|せいり}するときも、{国籍|こくせき}だけで{使|つか}う{言語|げんご}を{決|き}めつけないようにしましょう。","en":"That’s a good approach. When grouping by language, let’s avoid assuming the language someone uses based only on nationality.","th":"ดีแล้ว เวลาจัดกลุ่มตามภาษา ก็อย่าสรุปภาษาที่ใช้จากสัญชาติอย่างเดียว"},{"role":"staff","jp":"{承知|しょうち}しました。{記録|きろく}にある{対応言語|たいおうげんご}を{確認|かくにん}し、{不明|ふめい}なものは{不明|ふめい}として{整理|せいり}します。","en":"Understood. I’ll check the language used for support in the records and mark unknown cases as unknown.","th":"รับทราบค่ะ จะตรวจสอบภาษาที่ใช้ให้บริการตามบันทึก และกรณีที่ไม่ทราบจะระบุว่าไม่ทราบค่ะ"},{"role":"coworker","jp":"この{訳|やく}だと、「{必|かなら}ず{安|やす}くなる」という{意味|いみ}に{読|よ}めませんか。{条件|じょうけん}が{伝|つた}わるように{直|なお}したいですね。","en":"Could this translation be read as saying “it will definitely be cheaper”? We should revise it so the conditions come across.","th":"คำแปลตรงนี้อาจอ่านแล้วเข้าใจว่า “จะถูกลงแน่นอน” หรือเปล่า อยากปรับให้สื่อเงื่อนไขได้ชัดเจน"},{"role":"staff","jp":"{確|たし}かに、そのように{読|よ}めます。{元|もと}の{日本語|にほんご}をもう{一度|いちど}{確認|かくにん}し、{条件|じょうけん}が{抜|ぬ}けないように{修正|しゅうせい}します。","en":"Yes, it could be read that way. I’ll check the original Japanese again and revise it so no conditions are left out.","th":"จริงค่ะ อ่านแล้วอาจเข้าใจแบบนั้นได้ จะตรวจต้นฉบับภาษาญี่ปุ่นอีกครั้งและแก้ไขไม่ให้เงื่อนไขตกหล่นค่ะ"},{"role":"coworker","jp":"{直訳|ちょくやく}だけでなく、お{客様|きゃくさま}がどこで{迷|まよ}うかも{考|かんが}えてみてください。","en":"Along with translating the words, think about where a customer might get confused.","th":"นอกจากแปลตามตัวอักษรแล้ว ลองคิดด้วยว่าลูกค้าน่าจะสับสนตรงไหน"},{"role":"staff","jp":"では、{最初|さいしょ}に{請求|せいきゅう}の{内訳|うちわけ}を{説明|せつめい}し、その{後|あと}に{条件|じょうけん}を{確認|かくにん}する{流|なが}れはどうでしょうか。","en":"How about explaining the bill breakdown first, then moving on to checking the conditions?","th":"ถ้าเริ่มจากอธิบายรายละเอียดค่าใช้จ่าย แล้วค่อยตรวจสอบเงื่อนไขตามลำดับนี้ ดีไหมคะ"},{"role":"coworker","jp":"その{案|あん}で{作|つく}ってみましょう。お{客様|きゃくさま}に{使|つか}う{前|まえ}に、{内容|ないよう}の{確認|かくにん}を{誰|だれ}にお{願|ねが}いするかも{相談|そうだん}しましょう。","en":"Let’s draft it that way. Before using it with customers, let’s also discuss who should review the content.","th":"ลองทำร่างตามแนวนั้นกัน ก่อนนำไปใช้กับลูกค้า มาคุยกันด้วยว่าจะให้ใครตรวจสอบเนื้อหา"},{"role":"staff","jp":"はい。{修正案|しゅうせいあん}と、{確認|かくにん}していただきたい{点|てん}をまとめます。{店舗|てんぽ}と{本部|ほんぶ}のどちらに{相談|そうだん}するかも{確認|かくにん}します。","en":"Yes. I’ll put together the revised draft and the points that need review. I’ll also check whether to consult the store or head office.","th":"ค่ะ จะรวบรวมร่างแก้ไขกับจุดที่ต้องการให้ตรวจสอบ และเช็กด้วยว่าควรปรึกษาทางร้านหรือสำนักงานใหญ่ค่ะ"},{"role":"coworker","jp":"お{願|ねが}いします。{使|つか}い{始|はじ}めたら、{同|おな}じ{質問|しつもん}が{減|へ}ったかも{見|み}て、また{改善|かいぜん}しましょう。","en":"Thank you. Once we start using it, let’s see whether repeat questions decrease and use that to improve it further.","th":"ฝากด้วยนะ หลังเริ่มใช้แล้ว ลองดูว่าคำถามซ้ำลดลงหรือไม่ แล้วค่อยปรับปรุงต่อกัน"}],"takeaway":"The revised role links counter observations to analysis, translation, and improvement. Report evidence limits, preserve conditions in translation, and propose a review step without inventing an approval policy.","takeawayTh":"หน้าที่ฉบับแก้ไขเชื่อมสิ่งที่พบหน้าร้านกับการวิเคราะห์ การแปล และการปรับปรุง ระบุข้อจำกัดของข้อมูล รักษาเงื่อนไขให้ครบในคำแปล และเสนอขั้นตอนตรวจสอบโดยไม่สมมติระเบียบอนุมัติของบริษัท"}],"keigo":[{"id":"keigo-ukagau","title":"Ask the customer: 伺う","titleTh":"ถามลูกค้าอย่างนอบน้อม: 伺う","plain":"お{名前|なまえ}を{聞|き}いてもいいですか。","polite":"お{名前|なまえ}を{伺|うかが}ってもよろしいでしょうか。","en":"May I have your name?","th":"ขอทราบชื่อได้ไหมคะ","why":"伺う humbles your own act of asking (also listening or visiting in other contexts). Here you are asking; the customer is not the subject of 伺う. お名前 honors the customer’s name.","whyTh":"伺う เป็นคำถ่อมตนสำหรับการถามของเราเอง (ในบริบทอื่นอาจหมายถึงฟังหรือไปพบ) ประโยคนี้เราเป็นผู้ถาม ไม่ใช้ 伺う เพื่อยกย่องการกระทำของลูกค้า ส่วน お名前 ใช้กล่าวถึงชื่อลูกค้าอย่างสุภาพ"},{"id":"keigo-ossharu","title":"Invite the customer to speak: おっしゃる","titleTh":"เชิญให้ลูกค้าบอก: おっしゃる","plain":"{分|わ}からないことがあったら、{言|い}ってください。","polite":"ご{不明|ふめい}な{点|てん}がございましたら、おっしゃってください。","en":"Please tell me if anything is unclear.","th":"หากมีส่วนไหนไม่เข้าใจ แจ้งได้เลยค่ะ","why":"おっしゃる honors the customer’s act of speaking. Use 言う or 申す for your own speech, depending on context. おっしゃられる adds an unnecessary second honorific layer.","whyTh":"おっしゃる ยกย่องการพูดของลูกค้า ถ้าพูดถึงการพูดของตัวเอง ใช้ 言う หรือ 申す ตามบริบท ไม่จำเป็นต้องซ้อนคำยกย่องเป็น おっしゃられる"},{"id":"keigo-haiken","title":"Look at a document: 拝見する","titleTh":"ขอดูเอกสาร: 拝見する","plain":"こちらの{書類|しょるい}を{見|み}てもいいですか。","polite":"こちらの{書類|しょるい}を{拝見|はいけん}してもよろしいでしょうか。","en":"May I look at this document?","th":"ขอดูเอกสารนี้ได้ไหมคะ","why":"拝見する humbles your act of looking at the customer’s document or device. To ask the customer to look, use ご覧ください instead. 拝見させていただいても… is usually more elaborate than needed here.","whyTh":"拝見する ถ่อมตนเมื่อเราดูเอกสารหรืออุปกรณ์ของลูกค้า หากเชิญให้ลูกค้าดู ใช้ ご覧ください แทน บริบทนี้ไม่จำเป็นต้องใช้รูปยาวอย่าง 拝見させていただいても…"},{"id":"keigo-goran","title":"Show the customer: ご覧になる","titleTh":"เชิญลูกค้าดู: ご覧になる","plain":"こちらの{画面|がめん}を{見|み}てください。","polite":"こちらの{画面|がめん}をご{覧|らん}ください。","en":"Please look at this screen.","th":"กรุณาดูหน้าจอนี้ค่ะ","why":"ご覧になる honors the customer’s act of looking; ご覧ください is the request form. Pair it with 拝見する: customer looks → ご覧になる; you look at the customer’s item → 拝見する.","whyTh":"ご覧になる ยกย่องการดูของลูกค้า และ ご覧ください เป็นรูปขอให้ดู จำคู่กับ 拝見する: ลูกค้าเป็นผู้ดูใช้ ご覧になる ส่วนเราดูสิ่งของของลูกค้าใช้ 拝見する"},{"id":"keigo-mousu","title":"Introduce yourself: 申す","titleTh":"แนะนำตัว: 申す","plain":"{担当|たんとう}の［{名前|なまえ}］です。","polite":"{担当|たんとう}の［{名前|なまえ}］と{申|もう}します。","en":"My name is [name], and I’ll be assisting you.","th":"ดิฉันชื่อ [ชื่อ] เป็นผู้ดูแลให้บริการค่ะ","why":"申す is a humble/polite way to speak of your own saying or name. Replace the bracket with your name. Do not introduce the customer with と申します. The です version is already polite and may be sufficient.","whyTh":"申す ใช้กล่าวถึงการพูดหรือชื่อของตนอย่างนอบน้อม ใส่ชื่อตัวเองแทนวงเล็บ ไม่ใช้ と申します แนะนำชื่อลูกค้า รูป です ก็สุภาพอยู่แล้วและใช้ได้ตามสถานการณ์"},{"id":"keigo-itasu","title":"Explain or check: いたす","titleTh":"อธิบายหรือตรวจสอบ: いたす","plain":"{料金|りょうきん}の{内訳|うちわけ}を{説明|せつめい}します。","polite":"{料金|りょうきん}の{内訳|うちわけ}をご{説明|せつめい}いたします。","en":"I’ll explain the breakdown of the charges.","th":"จะอธิบายรายละเอียดค่าใช้จ่ายค่ะ","why":"ご＋action noun＋いたします humbly presents an action you perform for the customer. ご説明いたします is a standard combination. Do not use いたす to honor an action the customer performs.","whyTh":"ご＋คำนามแสดงการกระทำ＋いたします ใช้บอกการกระทำที่เราทำให้ลูกค้าอย่างนอบน้อม ご説明いたします เป็นรูปที่ใช้ทั่วไป ไม่ใช้ いたす ยกย่องการกระทำของลูกค้า"},{"id":"keigo-moushiwake","title":"Apologize and name the issue","titleTh":"ขอโทษพร้อมบอกประเด็นให้ชัด","plain":"{説明|せつめい}が{分|わ}かりにくくて、すみません。","polite":"{説明|せつめい}が{分|わ}かりにくく、{申|もう}し{訳|わけ}ございません。","en":"I’m sorry my explanation was unclear.","th":"ขออภัยที่อธิบายไม่ชัดเจนค่ะ","why":"申し訳ございません is a formal apology. Tie it to what you actually know happened, then offer a next step, such as explaining one point at a time. For an unverified bill, do not apologize for a billing error you have not confirmed.","whyTh":"申し訳ございません เป็นคำขอโทษแบบเป็นทางการ ระบุเรื่องที่ทราบว่าเกิดขึ้นจริง แล้วเสนอขั้นตอนต่อไป เช่น อธิบายทีละประเด็น หากยังไม่ได้ตรวจสอบบิล อย่าเพิ่งขอโทษโดยสรุปว่าออกบิลผิด"},{"id":"keigo-shochi","title":"Acknowledge the customer: 承知する","titleTh":"รับทราบความต้องการลูกค้า: 承知する","plain":"{分|わ}かりました。{条件|じょうけん}を{確認|かくにん}します。","polite":"{承知|しょうち}いたしました。{条件|じょうけん}を{確認|かくにん}いたします。","en":"Understood. I’ll check the conditions.","th":"รับทราบค่ะ จะตรวจสอบเงื่อนไขค่ะ","why":"承知いたしました acknowledges what the customer said and suits formal service. It does not mean the request has been approved. If the answer is unknown, attach a concrete check instead of implying a promise.","whyTh":"承知いたしました ใช้รับทราบสิ่งที่ลูกค้าพูดอย่างสุภาพ เหมาะกับงานบริการ แต่ไม่ได้หมายความว่าอนุมัติคำขอแล้ว หากยังไม่ทราบคำตอบ ให้บอกว่าจะตรวจสอบอะไรแทนการพูดเหมือนรับปาก"},{"id":"keigo-itadaku","title":"Ask for time: いただく","titleTh":"ขอเวลา: いただく","plain":"{少|すこ}し{待|ま}ってもらえますか。","polite":"{確認|かくにん}いたしますので、{少々|しょうしょう}お{待|ま}ちいただけますか。","en":"I’ll check that. Could you wait a moment, please?","th":"ขอตรวจสอบก่อนค่ะ รบกวนรอสักครู่ได้ไหมคะ","why":"お待ちいただけますか frames the customer’s waiting as something you receive. It is a request, not an order. 少々 is not a fixed duration; if the wait grows, check an estimate and update the customer.","whyTh":"お待ちいただけますか แสดงการขอให้ลูกค้ารอโดยเราเป็นฝ่ายได้รับความกรุณา เป็นคำขอ ไม่ใช่คำสั่ง 少々 ไม่ได้กำหนดจำนวนนาที หากต้องรอนานขึ้น ให้ตรวจสอบเวลาประมาณและแจ้งลูกค้า"},{"id":"keigo-company-handoff","title":"Refer to your own colleague to a customer","titleTh":"กล่าวถึงเพื่อนร่วมงานของเราต่อลูกค้า","plain":"{担当者|たんとうしゃ}に{確認|かくにん}してきます。","polite":"{担当|たんとう}の{者|もの}に{確認|かくにん}してまいります。","en":"I’ll go and check with the colleague responsible.","th":"จะไปตรวจสอบกับผู้ดูแลเรื่องนี้ค่ะ","why":"When speaking to a customer, your colleague belongs to your own company group: 担当の者 is natural. まいります humbly describes your own going/returning. Within the team, addressing that colleague by name plus さん may be appropriate; the audience changes the wording.","whyTh":"เมื่อพูดกับลูกค้า เพื่อนร่วมงานถือเป็นคนฝ่ายเดียวกับเรา จึงใช้ 担当の者 ได้เป็นธรรมชาติ ส่วน まいります ถ่อมตนสำหรับการไปหรือกลับของเราเอง แต่เวลาคุยกันในทีม อาจเรียกชื่อเพื่อนร่วมงานตามด้วย さん ได้ ถ้อยคำเปลี่ยนตามผู้ฟัง"}],"company":{"intro":"Your materials name Area Marketing Office as the employer. The revised role document is especially important: it describes a specialist role supporting foreign customers through analysis, multilingual resources and service improvement. Counter practice helps you understand those customers and work with the store team.","introTh":"เอกสารที่คุณให้มาระบุว่าบริษัท Area Marketing Office เป็นนายจ้าง เอกสารหน้าที่งานฉบับแก้ไขสำคัญเป็นพิเศษ เพราะระบุว่าเป็นงานเฉพาะทางด้านการวิเคราะห์ จัดทำสื่อหลายภาษา และปรับปรุงบริการสำหรับลูกค้าชาวต่างชาติ การฝึกบทสนทนาหน้าเคาน์เตอร์จะช่วยให้คุณเข้าใจลูกค้าและทำงานร่วมกับทีมสาขาได้ค่ะ","facts":[{"label":"Who employs you","labelTh":"นายจ้างของคุณ","jp":"{求人票|きゅうじんひょう}の{企業名|きぎょうめい}は「{株式会社|かぶしきがいしゃ}エリアマーケティングオフィス」です。ドコモショップを{運営|うんえい}しています。","en":"The employer named in the listing is 株式会社エリアマーケティングオフィス (Area Marketing Office), whose businesses include operating docomo shops.","th":"นายจ้างที่ระบุในประกาศคือบริษัท 株式会社エリアマーケティングオフィス (Area Marketing Office) ซึ่งดำเนินธุรกิจบริหารร้าน docomo shop ด้วยค่ะ","source":"PDF p.1–2"},{"label":"The store in the listing","labelTh":"สาขาที่ระบุในประกาศ","jp":"2026{年|ねん}3{月|がつ}{1日|ついたち}の{求人票|きゅうじんひょう}には、ドコモショップ{吹田店|すいたてん}（{大阪府|おおさかふ}{吹田市|すいたし}{朝日町|あさひまち}2-101）と{記載|きさい}されています。","en":"The listing dated 1 March 2026 names docomo Shop Suita at 2-101 Asahimachi, Suita, Osaka. This is the listed workplace, not confirmation of your final assignment.","th":"ประกาศลงวันที่ 1 มีนาคม 2026 ระบุร้าน docomo Shop Suita ที่ 2-101 Asahimachi เมือง Suita จังหวัด Osaka นี่คือสถานที่ทำงานในประกาศ ยังไม่ใช่การยืนยันสาขาที่คุณจะได้รับมอบหมายจริงค่ะ","source":"PDF p.1"},{"label":"Your revised specialist role","labelTh":"ตำแหน่งเฉพาะทางตามฉบับแก้ไข","jp":"{修正版|しゅうせいばん}では、{主|おも}な{業務|ぎょうむ}は、{外国人|がいこくじん}のお{客様|きゃくさま}に{関|かん}する{分析|ぶんせき}・{企画|きかく}・{改善|かいぜん}とされています。","en":"The revised document explicitly places the main work in analysis, planning and improvement for foreign customers, rather than simple store sales. Use that specific role description when discussing your duties.","th":"เอกสารฉบับแก้ไขระบุชัดว่างานหลักคือการวิเคราะห์ วางแผน และปรับปรุงงานเกี่ยวกับลูกค้าชาวต่างชาติ ไม่ใช่งานขายทั่วไปในร้าน เวลาพูดคุยเรื่องหน้าที่ของคุณ ให้ยึดรายละเอียดตำแหน่งฉบับนี้ค่ะ","source":"DOCX 採用理由・業務内容"},{"label":"How the first stage is described","labelTh":"งานในช่วงเริ่มต้น","jp":"{入社|にゅうしゃ}{初期|しょき}は、{契約|けいやく}の{事務処理|じむしょり}や{顧客情報|こきゃくじょうほう}の{管理|かんり}などを{通|とお}して、{料金体系|りょうきんたいけい}や{業務|ぎょうむ}の{流|なが}れを{学|まな}びます。","en":"The initial stage centers on back-office work such as contract administration, customer information management and applications, to learn telecom services, pricing structures and workflows.","th":"ช่วงเริ่มต้นเน้นงานหลังบ้าน เช่น งานเอกสารสัญญา การจัดการข้อมูลลูกค้า และงานยื่นคำขอต่าง ๆ เพื่อเรียนรู้บริการสื่อสาร โครงสร้างค่าบริการ และขั้นตอนการทำงานค่ะ","source":"DOCX 業務内容・キャリアプラン"},{"label":"Your Japanese and Thai have a purpose","labelTh":"ใช้ภาษาญี่ปุ่นและภาษาไทยกับงานอย่างไร","jp":"{日本語|にほんご}と{母国語|ぼこくご}を{使|つか}って、{契約|けいやく}の{補助資料|ほじょしりょう}や{案内文書|あんないぶんしょ}、FAQの{翻訳|ほんやく}・ローカライズを{行|おこな}います。","en":"The role includes translating and localizing contract support materials, notices and FAQs using Japanese and your native language, and creating or improving multilingual materials and internal manuals.","th":"งานนี้ใช้ภาษาญี่ปุ่นและภาษาแม่ในการแปลและปรับเนื้อหาให้เหมาะกับผู้อ่าน เช่น เอกสารเสริมการอธิบายสัญญา เอกสารแนะนำ และ FAQ รวมถึงจัดทำหรือปรับปรุงสื่อหลายภาษาและคู่มือภายในค่ะ","source":"DOCX 業務内容"},{"label":"Turn customer questions into improvements","labelTh":"นำคำถามของลูกค้ามาปรับปรุงงาน","jp":"{問|と}い{合|あ}わせの{内容|ないよう}や{利用動向|りようどうこう}を{分析|ぶんせき}し、{店舗|てんぽ}や{本部|ほんぶ}と{連携|れんけい}して、{改善|かいぜん}の{提案|ていあん}を{行|おこな}います。","en":"The document calls for analyzing usage and inquiries, identifying needs by language and nationality, and working with stores and headquarters on improvements, promotional planning and implementation support.","th":"เอกสารระบุให้วิเคราะห์แนวโน้มการใช้บริการและคำถามของลูกค้า รวบรวมความต้องการแยกตามภาษาและสัญชาติ แล้วร่วมงานกับสาขาและสำนักงานใหญ่เพื่อเสนอการปรับปรุง วางแผนส่งเสริมการขาย และสนับสนุนการดำเนินงานค่ะ","source":"DOCX 業務内容"},{"label":"The wider shop work you will hear about","labelTh":"งานทั่วไปของสาขาที่คุณจะได้ยิน","jp":"{一般|いっぱん}の{店舗|てんぽ}スタッフの{求人票|きゅうじんひょう}には、{受付|うけつけ}、{契約|けいやく}やプランの{変更|へんこう}、{修理|しゅうり}の{受付|うけつけ}、{操作|そうさ}のサポートなどが{記載|きさい}されています。","en":"The general shop-staff listing covers reception, new contracts, device and plan changes, billing-plan explanations, repair intake, operation/setup support, displays, inventory and data entry. These give the practice its workplace context; they do not replace the revised specialist description.","th":"ประกาศรับพนักงานสาขาทั่วไประบุงานต้อนรับ ทำสัญญาใหม่ เปลี่ยนเครื่องหรือแพ็กเกจ อธิบายค่าบริการ รับเรื่องซ่อม ช่วยใช้งานและตั้งค่า จัดสื่อในร้าน ดูแลสต็อก และป้อนข้อมูล บทฝึกใช้บริบทเหล่านี้ โดยยังยึดหน้าที่เฉพาะทางตามเอกสารฉบับแก้ไขค่ะ","source":"PDF p.1 / DOCX 採用理由"},{"label":"How the company describes its values","labelTh":"ค่านิยมที่บริษัทอธิบายไว้","jp":"{企業情報|きぎょうじょうほう}シートでは、お{客様|きゃくさま}の{視点|してん}を{重視|じゅうし}し、{社会貢献|しゃかいこうけん}・{社員|しゃいん}の{幸|しあわ}せ・{企業|きぎょう}の{利益|りえき}のバランスを{大切|たいせつ}にすると{説明|せつめい}しています。","en":"The company sheet presents a customer-focused philosophy balancing social contribution, employee happiness and business profit. It also describes helping others grow as part of one's own growth. These are statements in the employer's PR material.","th":"เอกสารบริษัทอธิบายปรัชญาที่ให้ความสำคัญกับมุมมองลูกค้า และความสมดุลระหว่างการช่วยเหลือสังคม ความสุขของพนักงาน และกำไรของบริษัท อีกทั้งกล่าวว่าการช่วยให้ผู้อื่นเติบโตทำให้ตนเองเติบโตด้วย ข้อมูลนี้เป็นคำอธิบายในเอกสารประชาสัมพันธ์ของนายจ้างค่ะ","source":"PDF p.2"}],"boundaries":[{"en":"This is speaking practice based on your documents. Sample conversations are newly written practice, not official store scripts. Confirm the current procedure with your trainer before using a promise, price, eligibility rule, document requirement or repair estimate.","th":"นี่คือบทฝึกพูดที่อิงเอกสารของคุณ บทสนทนาตัวอย่างแต่งขึ้นเพื่อฝึก ไม่ใช่บทพูดทางการของร้าน ก่อนแจ้งคำรับรอง ราคา เงื่อนไขสิทธิ์ เอกสารที่ต้องใช้ หรือประมาณการซ่อม ให้ตรวจสอบขั้นตอนปัจจุบันกับผู้สอนงานค่ะ"},{"en":"The two sources have different scopes: the PDF is a general shop-staff listing dated 1 March 2026; the revised DOCX describes the specialist duties and career plan. Your final assignment and day-to-day responsibilities should be checked with the employer.","th":"แหล่งข้อมูลทั้งสองมีขอบเขตต่างกัน: PDF เป็นประกาศพนักงานสาขาทั่วไป ลงวันที่ 1 มีนาคม 2026 ส่วน DOCX ฉบับแก้ไขอธิบายหน้าที่เฉพาะทางและแผนอาชีพ ให้ตรวจสอบสาขาที่ได้รับมอบหมายและหน้าที่ประจำวันกับนายจ้างค่ะ"}],"sources":[{"name":"株式会社エリアマーケティングオフィス様 (求人票）xlsx.pdf","label":"PDF · Job listing and company sheet · 1 March 2026","scope":"Page 1: employer, listed Suita workplace and general shop duties. Page 2: company description and stated values."},{"name":"エリアマーケティングオフィス留学生採用関係(業務内容等修正）.docx","label":"DOCX · Revised duties, career plan and hiring rationale","scope":"Specialist role, initial back-office learning, analysis, multilingual materials, translation/localization, improvement and coordination. No issue date is visible in the supplied text."}]}};
