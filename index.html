 function mount(host,flows,extra){

  function focus(selector){const el=body.querySelector(selector||'h1');if(el){el.focus({preventScroll:true});if(selector)el.scrollIntoView({behavior:'instant',block:'start'});else window.scrollTo({top:window.scrollY+body.getBoundingClientRect().top,behavior:'instant'});}}

  function menu(){return `<header class="intro"><div class="eyebrow">See the action. Find the sentence.</div><h1 tabindex="-1">Your counter map.</h1><p class="sub">Choose the job. Follow its branch. Say one short line at a time.</p>${th('เลือกงาน → ดูแต่ละขั้น → พูดประโยคสั้น ๆ ทีละประโยค')}</header><div class="tree-root"><strong>A customer visits</strong>${th('ลูกค้ามาที่ร้าน')}</div><div class="tree">${groups.map((g,i)=>`<details class="branch"><summary><span><strong>${esc(g.en)}</strong>${th(g.th)}</span></summary><div class="branch-list">${g.ids.map(id=>flows.find(f=>f.id===id)).filter(Boolean).map(f=>`<button class="flow-option" data-wf-open="${esc(f.id)}"><span class="ja" lang="ja">${esc(f.title)}</span><span class="en">${esc(f.en)}</span>${th(f.th)}<span class="menu-foot"><span>${f.steps.length} actions · ${esc(f.reading)}</span><span class="arrow">→</span></span></button>`).join('')}</div></details>`).join('')}</div><div class="start-note">Today: choose one task and rehearse only its first three sentences.${th('วันนี้เลือกงานเดียว แล้วฝึกแค่สามประโยคแรกก่อน')}</div><section class="support">${helpers()}</section>`;}
  function step(s,i,total){return `<article class="step ${full?'':'focused'}" data-wf-step="${i}"><div class="step-number"><span class="pin">${i+1}</span> Action ${i+1} / ${total}</div><h3 tabindex="-1"><button data-wf-focus="${i}" title="Focus on this action">${esc(s.title)}</button></h3>${!full?`<div class="action">${esc(s.enAction)}${th(s.thAction)}${s.relatedFlow?`<button class="button" data-wf-open="${esc(s.relatedFlow)}">Practise the plan explanation →<br><span lang="th">ไปฝึกอธิบายแพ็กเกจ</span></button>`:''}</div>`:''}<span class="label">${s.learning?.audience==='coworker'?'To your coworker · พูดกับเพื่อนร่วมงาน':'You say · คุณพูด'}</span>${line(s,'s'+i,recall)}${full?`<details class="action-details"><summary>What you do · สิ่งที่ทำ</summary><div class="action">${esc(s.enAction)}${th(s.thAction)}${s.relatedFlow?`<button class="button" data-wf-open="${esc(s.relatedFlow)}">Practise the plan explanation →<br><span lang="th">ไปฝึกอธิบายแพ็กเกจ</span></button>`:''}</div></details>`:''}${s.hear?`<details class="side-branch"><summary>${s.hear.role==='coworker'?'What your coworker says · คำตอบเพื่อนร่วมงาน':s.reply?'If the customer asks… · คำถามลูกค้า':'What you might hear · คำตอบลูกค้า'}</summary><div class="listen"><span class="label">${s.hear.role==='coworker'?'Coworker':'Customer'}</span>${line(s.hear,'h'+i)}</div>${s.reply?`<div class="reply"><span class="label">You can answer · ตอบได้ว่า</span>${line(s.reply,'reply'+i,recall)}</div>`:''}</details>`:''}${s.gate?`<details class="gate" ${!full?'open':''}><summary>Check before this step · เช็กก่อนทำ</summary><p>${esc(s.gate)}</p>${th(s.gateTh)}</details>`:''}${s.coach?`<div class="reply"><span class="label">Ask your coworker</span>${line(s.coach,'coach'+i)}</div>`:''}</article>`;}
  function followups(f){const items=(f.followupIds||[]).map(id=>(extra.followups||[]).find(p=>p.id===id)).filter(Boolean);return items.length?`<details class="followups"><summary>After checking / if stuck · แจ้งผลหรือขอความช่วยเหลือ</summary><p class="small">Choose the line that matches the actual result. These are alternatives, not consecutive procedure steps. The same phrases can be marked and reviewed in Practice.</p>${th('เลือกประโยคให้ตรงผลที่ตรวจจริง ไม่ต้องพูดทุกประโยคตามลำดับ ฝึกและทำเครื่องหมายประโยคเดียวกันได้ใน Practice')}${items.map(p=>`<div class="mini"><span class="label">${esc(p.learning.function)} · ${p.learning.audience==='coworker'?'To your team · พูดกับทีม':'To customer · พูดกับลูกค้า'}</span>${line(p,'followup-'+p.id,recall)}<p class="small">${esc(p.note)}</p>${th(p.noteTh)}</div>`).join('')}</details>`:'';}
  function briefs(f){return f.briefs?.length?`<details class="reference-notes"><summary>Understand the leaflet · อ่านใบปลิวให้เข้าใจ</summary>${f.briefs.map(b=>`<div class="mini"><h3>${esc(b.title)}</h3><p>${esc(b.en)}</p>${th(b.th)}</div>`).join('')}</details>`:'';}
  function lesson(f){index=Math.max(0,Math.min(index,f.steps.length-1));return `<div class="toolbar"><button class="button text" data-wf-back>← All tasks</button><span class="tag">Short, polite Japanese</span></div><header class="flow-title"><div class="eyebrow">${esc(f.en)}</div><h1 tabindex="-1" lang="ja">${esc(f.title)}</h1><p class="reading" lang="ja">${esc(f.reading)}</p>${th(f.th)}</header><div class="mini-tip"><strong>${esc(f.outcome)}</strong>${th(f.outcomeTh)}</div><details class="scope"><summary>Scenario & store checks · ขอบเขตบทฝึก</summary><p>${esc(f.intro)}</p>${th(f.introTh)}<p style="margin-top:12px">${esc(f.scope)}</p>${th(f.scopeTh)}</details><div class="switches"><button data-wf-full="true" aria-pressed="${full}">Connected map</button><button data-wf-full="false" aria-pressed="${!full}">One action</button><button data-wf-recall aria-pressed="${recall}">${recall?'Recall on':'Hide Japanese & try'}</button></div>${!full?`<div class="map"><label for="wf-step-select">Choose an action · เลือกขั้นตอน</label><select id="wf-step-select">${f.steps.map((s,i)=>`<option value="${i}" ${index===i?'selected':''}>${i+1}. ${esc(s.title)}</option>`).join('')}</select></div>`:`<div class="path-caption"><span>Follow the line ↓</span><span>Tap an action title to focus</span></div>`}<div class="steps ${full?'tree-steps':''}" id="wf-steps">${full?f.steps.map((s,i)=>step(s,i,f.steps.length)).join(''):step(f.steps[index],index,f.steps.length)}</div>${!full?`<div class="next"><button class="button" data-wf-prev ${index===0?'disabled':''}>← Previous</button><button class="button red" data-wf-next ${index===f.steps.length-1?'disabled':''}>Next action →</button></div>`:''}${full||index===f.steps.length-1?`<div class="finish"><h3>What needs to be clear at the end</h3><p>${esc(f.doneWhen)}</p>${th(f.doneWhenTh)}<p class="small">If a check is still open, use the coworker help below. Saying “I’ll check” starts that work; it does not finish it.</p>${th('ถ้ายังตรวจไม่เสร็จ ใช้ประโยคถามเพื่อนร่วมงานด้านล่าง การบอกว่าจะตรวจเป็นจุดเริ่ม ไม่ใช่จบงาน')}<h3>Practise just three actions.</h3><p>Look at the action, cover the Japanese, and say it. Add the next action when those three feel familiar.</p>${th('ดูชื่อขั้นตอน ปิดภาษาญี่ปุ่น แล้วลองพูด เมื่อสามขั้นแรกคล่องแล้ว ค่อยเพิ่มขั้นต่อไป')}<button class="button" data-wf-restart style="margin-top:12px">Start with action 1</button></div>`:''}<section class="support">${followups(f)}${briefs(f)}${helpers()}<details><summary>Sources & scope · ที่มาของบทฝึก</summary><div class="sources">${sources(f.sources)}<p>Original practice sentences based on your training and public docomo guidance. Your store supplies its internal screen order and checks. Lessons work offline; source links need internet.</p>${th('ประโยคฝึกอิงจากที่คุณเล่าว่าเรียนมาและข้อมูลสาธารณะของ docomo ลำดับหน้าจอและจุดตรวจสอบภายในให้เรียนจากร้าน บทเรียนใช้ออฟไลน์ได้ ลิงก์อ้างอิงต้องใช้อินเทอร์เน็ต')}</div></details></section>`;}
  function wordCard(w,i){const key='v'+i,show=open.has(key);return `<article class="word" data-wf-word="${esc(w.id)}"><span class="tag">${esc(w.cat)}</span><p class="small">${studyLabel(w)}</p><div class="utterance ${show?'is-open':''}"><button class="speech" data-wf-reveal="${key}" aria-expanded="${show}" aria-controls="wf-answer-${key}">${jp(w.jp)}<span class="cue">${show?'Hide reading & meaning':'Tap for reading & meaning'}</span></button><div class="meaning" id="wf-answer-${key}" ${show?'':'hidden'}><strong>${esc(w.en)}</strong>${th(w.th)}<div class="when">${esc(w.when)}${th(w.whenTh)}</div><div class="example"><span class="label">You say to a customer · พูดกับลูกค้า</span>${jp(w.example.jp)}<p>${esc(w.example.en)}</p>${th(w.example.th)}</div></div></div></article>`;}
  function wordList(){const q=query.normalize('NFKC').toLowerCase().trim();const matches=(extra.vocab||[]).map((w,i)=>({w,i})).filter(({w})=>(allWords||w.first||q)&&(!q||[w.jp,plain(w.jp),w.en,w.th,w.cat].join(' ').normalize('NFKC').toLowerCase().includes(q)));return matches.length?matches.map(({w,i})=>wordCard(w,i)).join(''):'<p class="empty">No matching word. Try English, Thai, kanji or kana.</p>';}
  function words(){return `<header class="intro"><div class="eyebrow">Small words you can use today</div><h1 tabindex="-1">Starter vocabulary.</h1><p class="sub">The 27 words tied to these task lessons, starting with 12. Recognize a term or practise saying it; learn the customer example as a whole. The full 280-word list lives in the Words section.</p>${th('27 คำที่ผูกกับบทเรียนในหน้านี้ เริ่มจาก 12 คำ ดูว่าควรฝึกพูดหรือฟังให้เข้าใจ แล้วฝึกประโยคตัวอย่างทั้งประโยค ส่วนคำศัพท์ครบ 280 คำอยู่ในหน้า Words')}</header><div class="word-controls"><label class="small" for="wf-word-search">Search all words · ค้นหาคำศัพท์ทั้งหมด</label><input id="wf-word-search" type="search" placeholder="Japanese, English, ไทย" value="${esc(query)}"><div class="word-filters"><button class="button ${allWords?'':'active'}" data-wf-words="first" aria-pressed="${!allWords}">First 12</button><button class="button ${allWords?'active':''}" data-wf-words="all" aria-pressed="${allWords}">All ${(extra.vocab||[]).length}</button></div></div><div class="word-grid" id="wf-word-list">${wordList()}</div><section class="support"><details><summary>Plan names in your leaflet · ชื่อแพ็กเกจในเอกสาร</summary><div class="sources"><p>${esc(extra.productNote)}</p>${th(extra.productNoteTh)}${(extra.products||[]).map(p=>`<div class="product"><strong lang="ja">${esc(p.name)}</strong><p>${esc(p.en)}</p>${th(p.th)}</div>`).join('')}${sources(extra.sources)}</div></details></section>`;}
  function cushions(){return `<header class="intro"><div class="eyebrow">A gentle opening, then the request</div><h1 tabindex="-1">Cushion phrases.</h1><p class="sub">Choose by purpose: request, effort, apology, offer or recheck. These six include openings and complete responses. Ordinary statements can be direct.</p>${th('เลือกตามสิ่งที่ต้องทำ เช่น ขอข้อมูล ขอให้ช่วยทำ ขอโทษ เสนอ หรือเช็กซ้ำ ทั้งหกอันมีทั้งคำเกริ่นและประโยคตอบ ไม่ต้องเกริ่นทุกประโยค')}</header><div class="mini-tip">Start with the first three. Practise the full example, so the opening and request come out together.${th('เริ่มจากสามอันแรก ฝึกทั้งประโยคเพื่อให้คำเกริ่นกับคำขอต่อกันได้')}</div><div class="cushions">${(extra.cushions||[]).map((c,i)=>`<article class="cushion" data-wf-cushion="${esc(c.id)}"><span class="tag">${c.learning.mode==='recognize'?'Recognize first':i<3?'Start here':'When you need it'} · ${esc(c.tag)}</span><div class="when">${esc(c.when)}${th(c.whenTh)}</div>${line(c,'c'+i)}<div class="use-note">${esc(c.note)}${th(c.noteTh)}</div></article>`).join('')}</div>`;}
  function render(){body.innerHTML=topTabs()+(tab==='words'?words():tab==='cushions'?cushions():chosen?lesson(flows.find(f=>f.id===chosen)):menu());}
  function fail(){body.innerHTML='<div class="alert"><h2>This view could not open.</h2><p>Choose another app tab to keep studying. Your saved phrase marks are unchanged.</p><button class="button" data-wf-back>Back to the map</button></div>';}
  body.onclick=e=>{try{const b=e.target.closest('button');if(!b||b.disabled)return;
   if(b.hasAttribute('data-wf-tab')){tab=b.dataset.wfTab;render();focus();return;}
   if(b.hasAttribute('data-wf-open')){chosen=b.dataset.wfOpen;index=0;full=true;recall=false;open.clear();render();focus();return;}
   if(b.hasAttribute('data-wf-back')){chosen=null;tab='map';open.clear();render();focus();return;}
   if(b.hasAttribute('data-wf-full')){full=b.dataset.wfFull==='true';render();body.querySelector(`[data-wf-full="${full}"]`).focus({preventScroll:true});return;}
   if(b.hasAttribute('data-wf-focus')){index=Number(b.dataset.wfFocus);full=false;render();focus('.step h3');return;}
   if(b.hasAttribute('data-wf-prev')||b.hasAttribute('data-wf-next')){index+=b.hasAttribute('data-wf-next')?1:-1;render();focus('.step h3');return;}
   if(b.hasAttribute('data-wf-recall')){recall=!recall;open.clear();render();body.querySelector('[data-wf-recall]').focus({preventScroll:true});return;}
   if(b.hasAttribute('data-wf-restart')){index=0;full=false;open.clear();render();focus('.step h3');return;}
   if(b.hasAttribute('data-wf-words')){allWords=b.dataset.wfWords==='all';render();body.querySelector(`[data-wf-words="${allWords?'all':'first'}"]`).focus({preventScroll:true});return;}
   if(b.hasAttribute('data-wf-reveal')){const key=b.dataset.wfReveal;open.has(key)?open.delete(key):open.add(key);const show=open.has(key);b.closest('.utterance').classList.toggle('is-open',show);root.getElementById(b.getAttribute('aria-controls')).hidden=!show;b.setAttribute('aria-expanded',show);const cue=b.querySelector('.cue');if(cue)cue.textContent=show?'Hide reading & meaning':'Tap for furigana · English · ไทย';else{b.textContent=show?'Hide Japanese':'Say it → show Japanese';b.classList.toggle('red',!show);}return;}
  }catch(e){fail();}};
  body.onchange=e=>{try{if(e.target.id==='wf-step-select'){index=Number(e.target.value);render();body.querySelector('#wf-step-select').focus({preventScroll:true});}}catch(e){fail();}};
  body.oninput=e=>{try{if(e.target.id==='wf-word-search'){query=e.target.value;body.querySelector('#wf-word-list').innerHTML=wordList();}}catch(e){fail();}};
  render();
 }
 window.CounterNotesWorkflows={mount};
})();

</script>

/corporate/csr/ecology/resources/collect_inquiry/"},"public-replacement-1":{"checked":"2026-09-10","scope":"The named public service/preparation guidance. Does not establish employee screen order or a complete internal procedure.","title":"Docomo: trouble options under ケータイ補償サービス","type":"official public guidance","url":"https://www.docomo.ne.jp/service/compensation_service/trouble_guidance.html"},"public-replacement-2":{"checked":"2026-09-10","scope":"The named public service/preparation guidance. Does not establish employee screen order or a complete internal procedure.","title":"Docomo: replacement phones under smartあんしん補償","type":"official public guidance","url":"https://www.docomo.ne.jp/service/smart_anshin_hoshou/replacement_phone.html"},"public-replacement-3":{"checked":"2026-09-10","scope":"The named public service/preparation guidance. Does not establish employee screen order or a complete internal procedure.","title":"Docomo: trouble options under smartあんしん補償","type":"official public guidance","url":"https://www.docomo.ne.jp/service/smart_anshin_hoshou/trouble_guidance.html"},"public-setup-1":{"checked":"2026-09-10","scope":"The named public service/preparation guidance. Does not establish employee screen order or a complete internal procedure.","title":"Docomo: initial setup support and support scope","type":"official public guidance","url":"https://shop.smt.docomo.ne.jp/dss/shop_info/setup_support/"},"public-setup-2":{"checked":"2026-09-10","scope":"The named public service/preparation guidance. Does not establish employee screen order or a complete internal procedure.","title":"Docomo: backup and data-transfer preparation","type":"official public guidance","url":"https://www.docomo.ne.jp/support/backup/"},"public-signup-1":{"checked":"2026-09-10","scope":"The named public service/preparation guidance. Does not establish employee screen order or a complete internal procedure.","title":"Docomo: new-contract shop procedure","type":"official public guidance","url":"https://www.docomo.ne.jp/support/subscribe/"},"public-signup-2":{"checked":"2026-09-10","scope":"The named public service/preparation guidance. Does not establish employee screen order or a complete internal procedure.","title":"Docomo: identification documents for shop procedures","type":"official public guidance","url":"https://www.docomo.ne.jp/support/identification/"},"public-upgrade-1":{"checked":"2026-09-12","scope":"The named public service/preparation guidance. Does not establish employee screen order or a complete internal procedure.","title":"Docomo: changing phones at a shop","type":"official public guidance","url":"https://www.docomo.ne.jp/support/switch_shop/"},"reported-payment":{"scope":"User’s no-bill cash-payment training account. Practice values: August bill due ¥13,600, cash received ¥15,000, change ¥1,400. The object of the name check and all access/till details remain unspecified.","type":"user report"},"revised-role":{"path":"Supplied revised duties document (DOCX), held outside this project","reviewed":"2026-09-12","scope":"採用理由・業務内容・キャリアプラン: specialist responsibilities and initial back-office learning. Not confirmation of today’s assignment.","type":"supplied DOCX"}},"version":1},"keigo":[{"en":"May I have your name?","id":"keigo-ukagau","learning":{"audience":"customer","function":"Compare register","guidance":"Understand the formal form; learn one usable version, not both as separate scripts.","mode":"recognize"},"plain":"お{名前|なまえ}を{聞|き}いてもいいですか。","polite":"お{名前|なまえ}を{伺|うかが}ってもよろしいでしょうか。","provenance":{"basis":{"category":"C","scope":"General Japanese register analysis. The supplied language tables are not authority for these particular sentence pairs.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"th":"ขอทราบชื่อได้ไหมคะ","title":"Ask the customer: 伺う","titleTh":"ถามลูกค้าอย่างนอบน้อม: 伺う","why":"伺う humbles your own act of asking (also listening or visiting in other contexts). Here you are asking; the customer is not the subject of 伺う. お名前 honors the customer’s name.","whyTh":"伺う เป็นคำถ่อมตนสำหรับการถามของเราเอง (ในบริบทอื่นอาจหมายถึงฟังหรือไปพบ) ประโยคนี้เราเป็นผู้ถาม ไม่ใช้ 伺う เพื่อยกย่องการกระทำของลูกค้า ส่วน お名前 ใช้กล่าวถึงชื่อลูกค้าอย่างสุภาพ"},{"en":"Please tell me if anything is unclear.","id":"keigo-ossharu","learning":{"audience":"customer","function":"Compare register","guidance":"Understand the formal form; learn one usable version, not both as separate scripts.","mode":"recognize"},"plain":"{分|わ}からないことがあったら、{言|い}ってください。","polite":"ご{不明|ふめい}な{点|てん}がございましたら、おっしゃってください。","provenance":{"basis":{"category":"C","scope":"General Japanese register analysis. The supplied language tables are not authority for these particular sentence pairs.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"th":"หากมีส่วนไหนไม่เข้าใจ แจ้งได้เลยค่ะ","title":"Invite the customer to speak: おっしゃる","titleTh":"เชิญให้ลูกค้าบอก: おっしゃる","why":"おっしゃる honors the customer’s act of speaking. Use 言う or 申す for your own speech, depending on context. おっしゃられる adds an unnecessary second honorific layer.","whyTh":"おっしゃる ยกย่องการพูดของลูกค้า ถ้าพูดถึงการพูดของตัวเอง ใช้ 言う หรือ 申す ตามบริบท ไม่จำเป็นต้องซ้อนคำยกย่องเป็น おっしゃられる"},{"en":"May I look at this document?","id":"keigo-haiken","learning":{"audience":"customer","function":"Compare register","guidance":"Understand the formal form; learn one usable version, not both as separate scripts.","mode":"recognize"},"plain":"こちらの{書類|しょるい}を{見|み}てもいいですか。","polite":"こちらの{書類|しょるい}を{拝見|はいけん}してもよろしいでしょうか。","provenance":{"basis":{"category":"C","scope":"General Japanese register analysis. The supplied language tables are not authority for these particular sentence pairs.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"th":"ขอดูเอกสารนี้ได้ไหมคะ","title":"Look at a document: 拝見する","titleTh":"ขอดูเอกสาร: 拝見する","why":"拝見する humbles your act of looking at the customer’s document or device. To ask the customer to look, use ご覧ください instead. 拝見させていただいても… is usually more elaborate than needed here.","whyTh":"拝見する ถ่อมตนเมื่อเราดูเอกสารหรืออุปกรณ์ของลูกค้า หากเชิญให้ลูกค้าดู ใช้ ご覧ください แทน บริบทนี้ไม่จำเป็นต้องใช้รูปยาวอย่าง 拝見させていただいても…"},{"en":"Please look at this screen.","id":"keigo-goran","learning":{"audience":"customer","function":"Compare register","guidance":"Understand the formal form; learn one usable version, not both as separate scripts.","mode":"active"},"plain":"こちらの{画面|がめん}を{見|み}てください。","polite":"こちらの{画面|がめん}をご{覧|らん}ください。","provenance":{"basis":{"category":"C","scope":"General Japanese register analysis. The supplied language tables are not authority for these particular sentence pairs.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"th":"กรุณาดูหน้าจอนี้ค่ะ","title":"Show the customer: ご覧になる","titleTh":"เชิญลูกค้าดู: ご覧になる","why":"ご覧になる honors the customer’s act of looking; ご覧ください is the request form. Pair it with 拝見する: customer looks → ご覧になる; you look at the customer’s item → 拝見する.","whyTh":"ご覧になる ยกย่องการดูของลูกค้า และ ご覧ください เป็นรูปขอให้ดู จำคู่กับ 拝見する: ลูกค้าเป็นผู้ดูใช้ ご覧になる ส่วนเราดูสิ่งของของลูกค้าใช้ 拝見する"},{"en":"My name is [name], and I’ll be assisting you.","id":"keigo-mousu","learning":{"audience":"customer","function":"Compare register","guidance":"Understand the formal form; learn one usable version, not both as separate scripts.","mode":"active"},"plain":"{担当|たんとう}の［{名前|なまえ}］です。","polite":"{担当|たんとう}の［{名前|なまえ}］と{申|もう}します。","provenance":{"basis":{"category":"C","scope":"General Japanese register analysis. The supplied language tables are not authority for these particular sentence pairs.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"th":"ดิฉันชื่อ [ชื่อ] เป็นผู้ดูแลให้บริการค่ะ","title":"Introduce yourself: 申す","titleTh":"แนะนำตัว: 申す","why":"申す is a humble/polite way to speak of your own saying or name. Replace the bracket with your name. Do not introduce the customer with と申します. The です version is already polite and may be sufficient.","whyTh":"申す ใช้กล่าวถึงการพูดหรือชื่อของตนอย่างนอบน้อม ใส่ชื่อตัวเองแทนวงเล็บ ไม่ใช้ と申します แนะนำชื่อลูกค้า รูป です ก็สุภาพอยู่แล้วและใช้ได้ตามสถานการณ์"},{"en":"I’ll explain the breakdown of the charges.","id":"keigo-itasu","learning":{"audience":"customer","function":"Compare register","guidance":"Understand the formal form; learn one usable version, not both as separate scripts.","mode":"recognize"},"plain":"{料金|りょうきん}の{内訳|うちわけ}を{説明|せつめい}します。","polite":"{料金|りょうきん}の{内訳|うちわけ}をご{説明|せつめい}いたします。","provenance":{"basis":{"category":"C","scope":"General Japanese register analysis. The supplied language tables are not authority for these particular sentence pairs.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"th":"จะอธิบายรายละเอียดค่าใช้จ่ายค่ะ","title":"Explain or check: いたす","titleTh":"อธิบายหรือตรวจสอบ: いたす","why":"ご説明いたします is a standard humble combination for your own explanation. 説明します is already polite. Learn established combinations; do not add ご to every action noun or use いたす for the customer’s action.","whyTh":"ご説明いたします เป็นรูปถ่อมตนที่ใช้ทั่วไปเมื่อเราอธิบาย ส่วน 説明します ก็สุภาพแล้ว จำเป็นชุดคำที่ใช้จริง ไม่เติม ご ให้คำนามการกระทำทุกคำ และไม่ใช้ いたす กับการกระทำของลูกค้า"},{"en":"I’m sorry my explanation was unclear.","id":"keigo-moushiwake","learning":{"audience":"customer","function":"Compare register","guidance":"Understand the formal form; learn one usable version, not both as separate scripts.","mode":"recognize"},"plain":"{説明|せつめい}が{分|わ}かりにくくて、すみません。","polite":"{説明|せつめい}が{分|わ}かりにくく、{申|もう}し{訳|わけ}ございません。","provenance":{"basis":{"category":"C","scope":"General Japanese register analysis. The supplied language tables are not authority for these particular sentence pairs.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"th":"ขออภัยที่อธิบายไม่ชัดเจนค่ะ","title":"Apologize and name the issue","titleTh":"ขอโทษพร้อมบอกประเด็นให้ชัด","why":"申し訳ございません is a formal apology. Tie it to what you actually know happened, then offer a next step, such as explaining one point at a time. For an unverified bill, do not apologize for a billing error you have not confirmed.","whyTh":"申し訳ございません เป็นคำขอโทษแบบเป็นทางการ ระบุเรื่องที่ทราบว่าเกิดขึ้นจริง แล้วเสนอขั้นตอนต่อไป เช่น อธิบายทีละประเด็น หากยังไม่ได้ตรวจสอบบิล อย่าเพิ่งขอโทษโดยสรุปว่าออกบิลผิด"},{"en":"Understood. I’ll check the conditions.","id":"keigo-shochi","learning":{"audience":"customer","function":"Compare register","guidance":"Understand the formal form; learn one usable version, not both as separate scripts.","mode":"active"},"plain":"{分|わ}かりました。{条件|じょうけん}を{確認|かくにん}します。","polite":"{承知|しょうち}いたしました。{条件|じょうけん}を{確認|かくにん}いたします。","provenance":{"basis":{"category":"C","scope":"General Japanese register analysis. The supplied language tables are not authority for these particular sentence pairs.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"th":"รับทราบค่ะ จะตรวจสอบเงื่อนไขค่ะ","title":"Acknowledge the customer: 承知する","titleTh":"รับทราบความต้องการลูกค้า: 承知する","why":"承知いたしました acknowledges what the customer said and suits formal service. It does not mean the request has been approved. If the answer is unknown, attach a concrete check instead of implying a promise.","whyTh":"承知いたしました ใช้รับทราบสิ่งที่ลูกค้าพูดอย่างสุภาพ เหมาะกับงานบริการ แต่ไม่ได้หมายความว่าอนุมัติคำขอแล้ว หากยังไม่ทราบคำตอบ ให้บอกว่าจะตรวจสอบอะไรแทนการพูดเหมือนรับปาก"},{"en":"I’ll check that. Could you wait a moment, please?","id":"keigo-itadaku","learning":{"audience":"customer","function":"Compare register","guidance":"Understand the formal form; learn one usable version, not both as separate scripts.","mode":"active"},"plain":"{確認|かくにん}しますので、{少|すこ}し{待|ま}ってもらえますか。","polite":"{確認|かくにん}いたしますので、{少々|しょうしょう}お{待|ま}ちいただけますか。","provenance":{"basis":{"category":"C","scope":"General Japanese register analysis. The supplied language tables are not authority for these particular sentence pairs.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"th":"ขอตรวจสอบก่อนค่ะ รบกวนรอสักครู่ได้ไหมคะ","title":"Ask for time: いただく","titleTh":"ขอเวลา: いただく","why":"お待ちいただけますか frames the customer’s waiting as something you receive. It is a request, not an order. 少々 is not a fixed duration; if the wait grows, check an estimate and update the customer.","whyTh":"お待ちいただけますか แสดงการขอให้ลูกค้ารอโดยเราเป็นฝ่ายได้รับความกรุณา เป็นคำขอ ไม่ใช่คำสั่ง 少々 ไม่ได้กำหนดจำนวนนาที หากต้องรอนานขึ้น ให้ตรวจสอบเวลาประมาณและแจ้งลูกค้า"},{"en":"I’ll go and check with the colleague responsible.","id":"keigo-company-handoff","learning":{"audience":"customer","function":"Compare register","guidance":"Understand the formal form; learn one usable version, not both as separate scripts.","mode":"recognize"},"plain":"{担当者|たんとうしゃ}に{確認|かくにん}してきます。","polite":"{担当|たんとう}の{者|もの}に{確認|かくにん}してまいります。","provenance":{"basis":{"category":"C","scope":"General Japanese register analysis. The supplied language tables are not authority for these particular sentence pairs.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"th":"จะไปตรวจสอบกับผู้ดูแลเรื่องนี้ค่ะ","title":"Refer to your own colleague to a customer","titleTh":"กล่าวถึงเพื่อนร่วมงานของเราต่อลูกค้า","why":"担当の者 refers to someone on your own team when speaking to a customer; it does not necessarily mean a manager. In this sentence, 確認してまいります means going to check and coming back. With the colleague directly, a name plus さん can be appropriate.","whyTh":"เมื่อพูดกับลูกค้า 担当の者 หมายถึงคนในทีมเราที่ดูแลเรื่องนั้น ไม่จำเป็นต้องเป็นผู้จัดการ ในประโยคนี้ 確認してまいります คือไปตรวจแล้วกลับมา หากพูดกับเพื่อนร่วมงานโดยตรง อาจเรียกชื่อด้วย さん ได้"}],"phrases":[{"cat":"welcome","en":"Welcome. What can we help you with today?","essential":true,"id":"p001","jp":"いらっしゃいませ。{本日|ほんじつ}はどのようなご{用件|ようけん}でしょうか。","learning":{"audience":"customer","function":"Open the visit","mode":"active"},"provenance":{"basis":{"category":"B","scope":"The document supplies work context only. This sentence, its frequency/priority judgment and any scenario are authored teaching material.","sourceIds":["job-listing"]},"explanations":"C","facts":[],"language":"C"},"speaker":"staff","th":"ยินดีต้อนรับค่ะ วันนี้มาติดต่อเรื่องอะไรคะ"},{"cat":"welcome","en":"Do you have an appointment?","essential":true,"id":"p002","jp":"ご{予約|よやく}はございますか。","learning":{"audience":"customer","function":"Check an appointment","mode":"active"},"note":"Ask whether they have a booking; this does not imply bookings are required.","noteTh":"ใช้ถามว่านัดหมายไว้หรือไม่ ไม่ได้หมายความว่าร้านบังคับให้จองก่อนค่ะ","provenance":{"basis":{"category":"B","scope":"The document supplies work context only. This sentence, its frequency/priority judgment and any scenario are authored teaching material.","sourceIds":["job-listing"]},"explanations":"C","facts":[],"language":"C"},"speaker":"staff","th":"ได้นัดหมายไว้ไหมคะ"},{"cat":"welcome","en":"May I have your name?","essential":true,"id":"p003","jp":"お{名前|なまえ}を{伺|うかが}ってもよろしいでしょうか。","learning":{"audience":"customer","function":"Ask a name","mode":"active"},"note":"伺う is the humble form of 聞く here.","noteTh":"ในประโยคนี้ 伺う เป็นรูปถ่อมตัวของ 聞く ซึ่งหมายถึงถามค่ะ","provenance":{"basis":{"category":"B","scope":"The document supplies work context only. This sentence, its frequency/priority judgment and any scenario are authored teaching material.","sourceIds":["job-listing"]},"explanations":"C","facts":[],"language":"C"},"speaker":"staff","th":"ขอทราบชื่อได้ไหมคะ"},{"cat":"welcome","en":"Please take a seat here.","essential":true,"id":"p004","jp":"こちらのお{席|せき}へどうぞ。","learning":{"audience":"customer","function":"Guide to a seat","mode":"active"},"provenance":{"basis":{"category":"B","scope":"The document supplies work context only. This sentence, its frequency/priority judgment and any scenario are authored teaching material.","sourceIds":["job-listing"]},"explanations":"C","facts":[],"language":"C"},"speaker":"staff","th":"เชิญนั่งทางนี้ค่ะ"},{"cat":"welcome","en":"Thank you for waiting.","essential":true,"id":"p005","jp":"お{待|ま}たせ rence"},"provenance":{"basis":{"category":"B","scope":"The document supplies work context only. This sentence, its frequency/priority judgment and any scenario are authored teaching material.","sourceIds":["revised-role"]},"explanations":"C","facts":[],"language":"C"},"speaker":"staff","th":"กำลังจัดหมวดหมู่เนื้อหาคำถามแยกตามภาษาค่ะ"},{"cat":"multilingual","en":"May I confirm the reporting period and which records to include?","essential":false,"id":"p082","jp":"{集計|しゅうけい}する{期間|きかん}と{対象|たいしょう}を{確認|かくにん}してもよろしいですか。","learning":{"audience":"coworker","function":"Confirm an analysis scope","mode":"reference"},"provenance":{"basis":{"category":"B","scope":"The document supplies work context only. This sentence, its frequency/priority judgment and any scenario are authored teaching material.","sourceIds":["revised-role"]},"explanations":"C","facts":[],"language":"C"},"speaker":"staff","th":"ขอยืนยันช่วงเวลาและข้อมูลที่จะนำมารวมสถิติได้ไหมคะ"},{"cat":"multilingual","en":"I'll look at what has changed compared with last month.","essential":false,"id":"p083","jp":"{前月|ぜんげつ}と{比較|ひかく}して、どのような{変化|へんか}があるか{調|しら}べます。","learning":{"audience":"coworker","function":"Compare periods","mode":"reference"},"provenance":{"basis":{"category":"B","scope":"The document supplies work context only. This sentence, its frequency/priority judgment and any scenario are authored teaching material.","sourceIds":["revised-role"]},"explanations":"C","facts":[],"language":"C"},"speaker":"staff","th":"จะตรวจสอบว่ามีอะไรเปลี่ยนแปลงไปจากเดือนก่อนบ้างค่ะ"},{"cat":"multilingual","en":"There are too few cases to say confidently that this is a trend yet.","essential":false,"id":"p084","jp":"{件数|けんすう}が{少|すく}ないので、まだ{傾向|けいこう}とは{言|い}い{切|き}れません。","learning":{"audience":"coworker","function":"Qualify a small sample","mode":"reference"},"provenance":{"basis":{"category":"B","scope":"The document supplies work context only. This sentence, its frequency/priority judgment and any scenario are authored teaching materi s":"C","facts":[],"language":"C"},"speaker":"staff","th":"อยากขอความคิดเห็นจากสาขาและสำนักงานใหญ่เกี่ยวกับข้อเสนอปรับปรุงนี้ค่ะ"},{"cat":"multilingual","en":"Could we agree on who will update the materials and how they will be reviewed?","essential":false,"id":"p088","jp":"{資料|しりょう}を{更新|こうしん}する{担当者|たんとうしゃ}と、{確認|かくにん}の{流|なが}れを{決|き}めておきませんか。","learning":{"audience":"coworker","function":"Agree a review owner","mode":"reference"},"provenance":{"basis":{"category":"B","scope":"The document supplies work context only. This sentence, its frequency/priority judgment and any scenario are authored teaching material.","sourceIds":["revised-role"]},"explanations":"C","facts":[],"language":"C"},"speaker":"staff","th":"กำหนดผู้รับผิดชอบอัปเดตเอกสารและขั้นตอนตรวจสอบไว้ก่อนดีไหมคะ"},{"cat":"contract","en":"Thank you for waiting. We can proceed using this method.","essential":false,"id":"p089","introduced":"1.1","jp":"お{待|ま}たせしました。この{方法|ほうほう}でお{手続|てつづ}きできます。","learning":{"audience":"customer","function":"Possible after checking","mode":"active"},"note":"After the actual method has been checked and confirmed available. Point out which method; this does not mean the application is approved.","noteTh":"ใช้หลังตรวจแล้วว่าวิธีนี้ใช้ได้จริง ระบุให้ชัดว่าวิธีไหน ไม่ได้แปลว่าคำขออนุมัติแล้ว","provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"speaker":"staff","th":"ขอบคุณที่รอค่ะ ดำเนินการด้วยวิธีนี้ได้ค่ะ"},{"cat":"contract","en":"After checking, we cannot proceed using this method.","essential":false,"id":"p090","introduced":"1.1","jp":"{確認|かくにん}したところ、この{方法|ほうほう}ではお{手続|てつづ}きできません。","learning":{"audience":"customer","function":"Method not available","mode":"active"},"note":"A confirmed negative result, not an unknown answer. Follow with the verified reason or an available alternative.","noteTh":"ใช้เมื่อยืนยันแล้วว่าทำด้วยวิธีนี้ไม่ได้ ไม่ใช่เมื่อยังไม่รู้คำตอบ บอกเหตุผลที่ตรวจแล้วหรือทางเลือกต่อ","provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"speaker":"staff","th":"ตรวจสอบแล้ว ไม่สามารถดำเนินการด้วยวิธีนี้ได้ค่ะ"},{"cat":"contract","en":"This procedure requires the document shown here.","essential":false,"id":"p091","introduced":"1.1","jp":"このお{手続|てつづ}きには、こちらの{書類|しょるい}が{必要|ひつよう}です。","learning":{"audience":"customer","function":"Explain a checked requirement","mode":"active"},"note":"Point to the specific document on the checked list. No document type or docomo requirement is supplied by this example.","noteTh":"ชี้เอกสารที่ต้องใช้จากรายการที่ตรวจแล้ว ตัวอย่างนี้ไม่ได้กำหนดว่าต้องเป็นเอกสารชนิดใดหรือเป็นกฎของ docomo","provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"speaker":"staff","th":"ขั้นตอนนี้ต้องใช้เอกสารที่แสดงตรงนี้ค่ะ"},{"cat":"contract","en":"We cannot proceed yet because the necessary information is incomplete.","essential":false,"id":"p092","introduced":"1.1","jp":"{必要|ひつよう}な{情報|じょうほう}がそろっていないため、{今|いま}は{先|さき}に{進|すす}めません。","learning":{"audience":"customer","function":"Give a simple reason","mode":"active"},"note":"Use only when missing information really prevents the next step. Identify the missing item; do not just repeat this general reason.","noteTh":"ใช้เมื่อข้อมูลที่ขาดทำให้ไปต่อไม่ได้จริง ต้องระบุด้วยว่าขาดอะไร ไม่พูดแค่เหตุผลกว้าง ๆ ซ้ำ","provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"speaker":"staff","th":"ข้อมูลที่ต้องใช้ยังไม่ครบ จึงยังดำเนินการต่อไม่ได้ค่ะ"},{"cat":"contract","en":"We can help using this alternative. Would you like to proceed this way?","essential":false,"id":"p093","introduced":"1.1","jp":"こちらの{方法|ほうほう}なら{対応|たいおう}できます。こちらで{進|すす}めますか。","learning":{"audience":"customer","function":"Offer an available alternative","mode":"active"},"note":"Only after checking the alternative and explaining any differences, costs or conditions. なら limits the statement to this method.","noteTh":"ตรวจทางเลือกก่อน และอธิบายความต่าง ค่าใช้จ่ายหรือเงื่อนไขที่เกี่ยวข้อง なら จำกัดความหมายว่าเป็นวิธีนี้","provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"speaker":"staff","th":"ถ้าเป็นวิธีนี้ ดำเนินการได้ค่ะ ต้องการใช้วิธีนี้ไหมคะ"},{"cat":"contract","en":"Next, please check these details.","essential":false,"id":"p094","introduced":"1.1","jp":"{次|つぎ}に、こちらの{内容|ないよう}をご{確認|かくにん}ください。","learning":{"audience":"customer","function":"Give the next customer action","mode":"active"},"note":"Point to the actual details. 次に is a simple transition, not a cushion that needs another apology.","noteTh":"ชี้รายละเอียดที่ต้องตรวจจริง 次に ใช้เปลี่ยนไปขั้นตอนถัดไป ไม่ต้องเติมคำขอโทษ","provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"speaker":"staff","th":"ต่อไป รบกวนตรวจรายละเอียดตรงนี้ค่ะ"},{"cat":"contract","en":"I have confirmed it. This procedure is complete.","essential":false,"id":"p095","introduced":"1.1","jp":"{確認|かくにん}できました。こちらのお{手続|てつづ}きは{完了|かんりょう}しています。","learning":{"audience":"customer","function":"Report verified completion","mode":"active"},"note":"Only after confirming the actual completion status. Name or point to the completed task; do not include pending work or a future activation.","noteTh":"ใช้หลังตรวจสถานะว่าเสร็จจริง ระบุงานที่เสร็จ ไม่รวมงานค้างหรือการเปิดใช้งานในอนาคต","provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"speaker":"staff","th":"ตรวจสอบแล้วค่ะ ขั้นตอนนี้เสร็จเรียบร้อยแล้วค่ะ"},{"cat":"coworkers","en":"This is a billing question. The customer says the amount differs from what was explained.","essential":false,"id":"p096","introduced":"1.1","jp":"{料金|りょうきん}についてのご{相談|そうだん}です。{説明|せつめい}された{金額|きんがく}と{違|ちが}うとのことです。","learning":{"audience":"coworker","function":"Brief the customer situation","mode":"active"},"note":"To a colleague: report the customer’s claim, not a confirmed billing error. とのことです marks reported information.","noteTh":"บอกเพื่อนร่วมงานว่านี่คือสิ่งที่ลูกค้าแจ้ง ยังไม่ได้ยืนยันว่าบิลผิด とのことです ใช้รายงานคำพูดอีกฝ่าย","provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"speaker":"staff","th":"ลูกค้ามาปรึกษาเรื่องค่าบริการค่ะ บอกว่ายอดไม่ตรงกับที่อธิบายไว้"},{"cat":"coworkers","en":"I checked the billing details. I have not checked the application record yet.","essential":false,"id":"p097","introduced":"1.1","jp":"{請求内容|せいきゅうないよう}は{確認|かくにん}しました。{申込記録|もうしこみきろく}はまだです。","learning":{"audience":"coworker","function":"Say what is checked and pending","mode":"active"},"note":"Internal shorthand: はまだです refers to the checking just mentioned. Use only for work actually done.","noteTh":"รูปย่อที่ใช้ในทีม はまだです หมายถึงยังไม่ได้ตรวจตามประโยคก่อนหน้า แจ้งเฉพาะงานที่ทำแล้วจริง","provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"speaker":"staff","th":"ตรวจรายละเอียดบิลแล้วค่ะ แต่ยังไม่ได้ตรวจประวัติการสมัคร"},{"cat":"coworkers","en":"I do not understand why this charge applies. Could you check it with me?","essential":false,"id":"p098","introduced":"1.1","jp":"この{料金|りょうきん}がかかる{理由|りゆう}が{分|わ}かりません。{一緒|いっしょ}に{確認|かくにん}してもらえますか。","learning":{"audience":"coworker","function":"Name uncertainty and ask for help","mode":"active"},"note":"To a coworker; state the specific unknown. もらえますか is ordinary polite team language.","noteTh":"พูดกับเพื่อนร่วมงานและระบุจุดที่ไม่แน่ใจ もらえますか เป็นคำขอสุภาพทั่วไปในทีม","provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"speaker":"staff","th":"ยังไม่เข้าใจว่าทำไมถึงมีค่าบริการนี้ค่ะ ช่วยตรวจด้วยกันได้ไหมคะ"},{"cat":"coworkers","en":"Please check whether this explanation is correct.","essential":false,"id":"p099","introduced":"1.1","jp":"この{案内|あんない}で{合|あ}っているか、{確認|かくにん}をお{願|ねが}いします。","learning":{"audience":"coworker","function":"Ask a supervisor to check your explanation","mode":"active"},"note":"Show or repeat the proposed explanation to the colleague or supervisor. この案内 needs a concrete referent.","noteTh":"แสดงหรือพูดคำอธิบายที่เตรียมไว้ให้เพื่อนร่วมงานหรือหัวหน้าฟัง ต้องบอกให้รู้ว่า この案内 หมายถึงคำอธิบายใด","provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"speaker":"staff","th":"รบกวนตรวจความถูกต้องของคำอธิบายนี้ให้หน่อยค่ะ"},{"cat":"coworkers","en":"Could you take over from here?","essential":false,"id":"p100","introduced":"1.1","jp":"ここから{対応|たいおう}を{代|か}わってもらえますか。","learning":{"audience":"coworker","function":"Ask a colleague to take over","mode":"active"},"note":"After briefing the situation, completed checks and open questions. This asks for a takeover; it does not assume the colleague has accepted.","noteTh":"ใช้หลังสรุปเรื่อง งานที่ตรวจแล้ว และข้อสงสัยที่ค้าง เป็นการขอให้รับช่วง ยังไม่ถือว่าอีกฝ่ายตกลงแล้ว","provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"speaker":"staff","th":"ช่วยรับช่วงดูแลต่อจากตรงนี้ได้ไหมคะ"},{"cat":"coworkers","en":"Understood. I will come over now and take over.","essential":false,"id":"p101","introduced":"1.1","jp":"{分|わ}かりました。{今|いま}、そちらに{行|い}って{代|か}わります。","learning":{"audience":"learner","function":"Hear acceptance of a handoff","mode":"recognize"},"note":"Coworker speaking to you. This accepts the handoff, not the customer’s underlying request.","noteTh":"เพื่อนร่วมงานพูดกับคุณ เป็นการตกลงรับช่วง ไม่ใช่อนุมัติคำขอของลูกค้า","provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"speaker":"coworker","th":"เข้าใจแล้ว เดี๋ยวไปตรงนั้นรับช่วงต่อให้นะ"},{"cat":"coworkers","en":"Check the application record first.","essential":false,"id":"p102","introduced":"1.1","jp":"{先|さき}に{申込記録|もうしこみきろく}を{確認|かくにん}してください。","learning":{"audience":"learner","function":"Hear a next-step instruction","mode":"recognize"},"note":"Coworker instruction in this constructed billing case. 先に tells you the priority; access and system steps still come from training.","noteTh":"คำสั่งจากเพื่อนร่วมงานในกรณีบิลสมมตินี้ 先に บอกว่าต้องทำก่อน ส่วนสิทธิ์เข้าถึงและวิธีใช้ระบบให้ยึดที่ฝึกงาน","provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"speaker":"coworker","th":"ตรวจประวัติการสมัครก่อนนะ"},{"cat":"coworkers","en":"It is not confirmed yet. Tell the customer it is still being checked.","essential":false,"id":"p103","introduced":"1.1","jp":"まだ{確定|かくてい}していません。お{客様|きゃくさま}には、{確認中|かくにんちゅう}と{伝|つた}えてください。","learning":{"audience":"learner","function":"Hear that a result is not final","mode":"recognize"},"note":"Coworker to you. Do not turn an unfinished check into a yes/no answer to the customer.","noteTh":"เพื่อนร่วมงานพูดกับคุณ อย่านำเรื่องที่ยังตรวจไม่เสร็จไปตอบลูกค้าว่าได้หรือไม่ได้","provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"speaker":"coworker","th":"ยังไม่ได้ข้อสรุป แจ้งลูกค้าว่ากำลังตรวจสอบอยู่นะ"},{"cat":"contract","en":"A required document is missing, so we cannot proceed yet.","essential":false,"id":"p104","introduced":"1.1","jp":"{必要|ひつよう}な{書類|しょるい}が{足|た}りないので、{今|いま}はお{手続|てつづ}きを{進|すす}められません。","learning":{"audience":"customer","function":"Missing required document","mode":"active"},"note":"Only after checking the actual requirements. Show exactly what is missing and the permitted next action.","noteTh":"ใช้หลังตรวจข้อกำหนดจริงแล้ว ระบุเอกสารที่ขาดและสิ่งที่ลูกค้าทำต่อได้","provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"speaker":"staff","th":"เอกสารที่ต้องใช้ยังไม่ครบ จึงยังดำเนินการต่อไม่ได้ค่ะ"},{"cat":"rescue","en":"I cannot confirm it here. I will check with the colleague who handles it.","essential":false,"id":"p105","introduced":"1.1","jp":"こちらでは{確認|かくにん}できません。{担当|たんとう}の{者|もの}に{確認|かくにん}します。","learning":{"audience":"customer","function":"Unable to confirm here","mode":"active"},"note":"Unable to verify with your current information or tools; not the same as saying the request is impossible.","noteTh":"ใช้เมื่อข้อมูลหรือเครื่องมือที่มีไม่พอจะยืนยัน ไม่ได้หมายความว่าคำขอลูกค้าทำไม่ได้","provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"speaker":"staff","th":"ตรงนี้ยังยืนยันไม่ได้ ขอเช็กกับผู้ดูแลเรื่องนี้ค่ะ"},{"cat":"rescue","en":"There is one more point I need to check. Please wait a moment.","essential":false,"id":"p106","introduced":"1.1","jp":"もう{一点|いってん}、{確認|かくにん}が{必要|ひつよう}です。{少々|しょうしょう}お{待|ま}ちください。","learning":{"audience":"customer","function":"One more check is needed","mode":"active"},"note":"A specific extra check remains. If you do not know the waiting time, do not invent a duration.","noteTh":"ใช้เมื่อยังมีจุดที่ต้องตรวจเพิ่ม หากไม่รู้เวลารอ ไม่กำหนดเวลาเอง","provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"speaker":"staff","th":"มีอีกจุดที่ต้องตรวจสอบค่ะ รอสักครู่นะคะ"},{"cat":"support","en":"Please fill this in first. Let me know when you have finished.","essential":false,"id":"p107","introduced":"1.1","jp":"{先|さき}に、こちらの{入力|にゅうりょく}をお{願|ねが}いします。{終|お}わりましたらお{知|し}らせください。","learning":{"audience":"customer","function":"Customer action must come first","mode":"active"},"note":"Show the required field after explaining it. For a password/code, let the customer enter it privately; this is not permission to ask them to read it aloud.","noteTh":"อธิบายแล้วชี้ช่องที่ต้องกรอก หากเป็นรหัสผ่านหรือรหัสยืนยัน ให้ลูกค้ากรอกเองเป็นส่วนตัว ไม่ใช่ขอให้อ่านรหัสออกมา","provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"speaker":"staff","th":"รบกวนกรอกตรงนี้ก่อนค่ะ เสร็จแล้วแจ้งด้วยนะคะ"},{"cat":"rescue","en":"The colleague handling this is coming. Please wait a moment.","essential":false,"id":"p108","introduced":"1.1","jp":"{担当|たんとう}の{者|もの}がまいりますので、{少々|しょうしょう}お{待|ま}ちください。","learning":{"audience":"customer","function":"Wait for the colleague who accepted","mode":"active"},"note":"Use after the colleague has accepted and confirmed they are coming. It is not a promise to use while still looking for help.","noteTh":"ใช้เมื่อเพื่อนร่วมงานรับเรื่องและยืนยันว่าจะมาแล้ว ไม่ใช้ขณะที่ยังหาคนช่วยไม่ได้","provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"speaker":"staff","th":"พนักงานที่ดูแลเรื่องนี้กำลังมาค่ะ รอสักครู่นะคะ"},{"cat":"contract","en":"We cannot complete the procedure now. Please speak with us again once you have the required items.","essential":false,"id":"p109","introduced":"1.1","jp":"{今|いま}はお{手続|てつづ}きを{完了|かんりょう}できません。{必要|ひつよう}なものがそろいましたら、{改|あらた}めてご{相談|そうだん}ください。","learning":{"audience":"customer","function":"Cannot finish now; explain the return point","mode":"active"},"note":"After identifying the missing items and confirming this is the appropriate next action. This does not promise approval or completion on the next visit.","noteTh":"ใช้หลังระบุสิ่งที่ขาดและตรวจแล้วว่าควรทำต่อแบบนี้ ไม่ได้รับปากว่ามาครั้งหน้าจะอนุมัติหรือเสร็จแน่นอน","provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"speaker":"staff","th":"ตอนนี้ยังดำเนินการให้เสร็จไม่ได้ค่ะ เมื่อเตรียมสิ่งที่ต้องใช้ครบแล้ว รบกวนติดต่อมาใหม่นะคะ"},{"cat":"needs","en":"Do you currently use internet at home?","essential":false,"id":"p110","introduced":"1.2","jp":"{今|いま}、ご{自宅|じたく}でインターネットを{使|つか}っていますか。","learning":{"audience":"customer","function":"Ask about current home internet","mode":"active"},"note":"After a home-internet request. If yes, ask which service and what they want to change; this question alone does not identify the line.","noteTh":"ใช้หลังลูกค้าขอปรึกษาเน็ตบ้าน ถ้าใช้อยู่ให้ถามต่อว่าใช้บริการไหนและอยากเปลี่ยนอะไร คำถามนี้ยังไม่ระบุชนิดของเน็ต","provenance":{"basis":{"category":"B","scope":"Original communication pattern. Source motivates the topic, not an official script or an individual customer result.","sourceIds":["photo-new-74"]},"explanations":"C","facts":[],"language":"C"},"speaker":"staff","th":"ตอนนี้ที่บ้านใช้อินเทอร์เน็ตอยู่ไหมคะ"},{"cat":"needs","en":"Is it a detached house or an apartment building?","essential":false,"id":"p111","introduced":"1.2","jp":"{戸建|こだ}てですか、マンションですか。","learning":{"audience":"customer","function":"Ask the residence type","mode":"active"},"note":"Ask about the place of use. マンション describes an apartment/condominium building, not a mansion. Building type alone does not determine the plan or price.","noteTh":"ถามสถานที่ที่จะใช้ マンション คืออาคารอพาร์ตเมนต์หรือคอนโด ไม่ใช่คฤหาสน์ ชนิดอาคารอย่างเดียวยังตัดสินแพ็กเกจหรือราคาไม่ได้","provenance":{"basis":{"category":"B","scope":"Original communication pattern. Source motivates the topic, not an official script or an individual customer result.","sourceIds":["photo-new-72"]},"explanations":"C","facts":[],"language":"C"},"speaker":"staff","th":"เป็นบ้านเดี่ยวหรืออาคารที่พักอาศัยคะ"},{"cat":"needs","en":"Could you tell me the address where you plan to use it?","essential":false,"id":"p112","introduced":"1.2","jp":"ご{利用予定|りようよてい}の{住所|じゅうしょ}を{教|おし}えていただけますか。","learning":{"audience":"customer","function":"Ask the intended service address","mode":"active"},"note":"Use for an area/address check after the customer agrees to discuss the service. It may differ from their current home address. Follow store handling for addresses; do not put customer data in this study app.","noteTh":"ใช้ตรวจพื้นที่บริการเมื่อเริ่มปรึกษาบริการแล้ว อาจต่างจากที่อยู่ปัจจุบัน จัดการข้อมูลตามขั้นตอนร้าน ไม่บันทึกข้อมูลลูกค้าในแอปฝึกนี้","provenance":{"basis":{"category":"B","scope":"Original communication pattern. Source motivates the topic, not an official script or an individual customer result.","sourceIds":["public-hikari","public-home5g"]},"explanations":"C","facts":[],"language":"C"},"speaker":"staff","th":"ขอที่อยู่ที่จะใช้งานได้ไหมคะ"},{"cat":"contract","en":"This address is within the service area for this service.","essential":false,"id":"p113","introduced":"1.2","jp":"こちらの{住所|じゅうしょ}は、このサービスの{提供|ていきょう}エリア{内|ない}です。","learning":{"audience":"customer","function":"Explain the checked coverage result","mode":"active"},"note":"Only after checking the exact service and full address. Area coverage is a limited result: it does not confirm installation, activation date, indoor speed or approval.","noteTh":"ใช้หลังตรวจบริการและที่อยู่เต็มแล้ว ยืนยันได้แค่พื้นที่บริการ ยังไม่ยืนยันการติดตั้ง วันเปิดใช้ ความเร็วในบ้าน หรือผลอนุมัติ","provenance":{"basis":{"category":"B","scope":"Original communication pattern. Source motivates the topic, not an official script or an individual customer result.","sourceIds":["public-hikari","public-home5g"]},"explanations":"C","facts":[],"language":"C"},"speaker":"staff","th":"ที่อยู่นี้อยู่ในพื้นที่ให้บริการของบริการนี้ค่ะ"},{"cat":"contract","en":"I will check whether installation work is needed and when you can start using it.","essential":false,"id":"p114","introduced":"1.2","jp":"{工事|こうじ}が{必要|ひつよう}か、いつから{使|つか}えるかを{確認|かくにん}します。","learning":{"audience":"customer","function":"Check installation and start timing","mode":"active"},"note":"For a fixed-line inquiry with those checks still open. A wall socket does not prove construction is unnecessary. Return with checked details or an explicit handoff.","noteTh":"ใช้ปรึกษาเน็ตบ้านแบบมีสายเมื่อยังไม่รู้สองเรื่องนี้ มีช่องต่อบนผนังก็ยังสรุปไม่ได้ว่าไม่ต้องติดตั้ง ตรวจแล้วกลับมาแจ้งผลหรือส่งต่อให้ชัด","provenance":{"basis":{"category":"B","scope":"Original communication pattern. Source motivates the topic, not an official script or an individual customer result.","sourceIds":["photo-new-73"]},"explanations":"C","facts":[],"language":"C"},"speaker":"staff","th":"จะตรวจว่าต้องติดตั้งสายหรือไม่ และเริ่มใช้ได้เมื่อไรค่ะ"},{"cat":"support","en":"This is the maximum speed. Actual speed varies with your usage environment.","essential":false,"id":"p115","introduced":"1.2","jp":"こちらは{最大|さいだい}の{速度|そくど}です。{実際|じっさい}の{速度|そくど}は、ご{利用環境|りようかんきょう}によって{変|か}わります。","learning":{"audience":"customer","function":"Explain maximum versus actual speed","mode":"active"},"note":"Point to the technical maximum, not a measured result. Equipment and congestion also matter. In 1/10ギガ home plans, Gbps is speed; mobile GB is a data amount.","noteTh":"ชี้ตัวเลขความเร็วสูงสุดตามสเปก ไม่ใช่ค่าที่วัดจริง อุปกรณ์และความหนาแน่นของการใช้งานก็มีผล Gbps ของเน็ตบ้านคือความเร็ว ส่วน GB ของมือถือคือปริมาณข้อมูล","provenance":{"basis":{"category":"B","scope":"Original communication pattern. Source motivates the topic, not an official script or an individual customer result.","sourceIds":["photo-new-71","public-hikari-speed"]},"explanations":"C","facts":[{"category":"A","scope":"Paraphrase of the maximum-versus-actual-speed caveat; no numerical performance promise.","sourceIds":["photo-new-71","public-hikari-speed"]}],"language":"C"},"speaker":"staff","th":"นี่คือความเร็วสูงสุดค่ะ ความเร็วจริงขึ้นอยู่กับสภาพแวดล้อมที่ใช้งาน"},{"cat":"billing","en":"This discount has conditions. I will check whether you qualify.","essential":false,"id":"p116","introduced":"1.2","jp":"この{割引|わりびき}には{条件|じょうけん}があります。{対象|たいしょう}になるか{確認|かくにん}します。","learning":{"audience":"customer","function":"Check advertised-discount eligibility","mode":"active"},"note":"When the customer points to an advertised discount. This promises a check, not a discount; explain the actual result before proceeding. Age or a headline price alone is insufficient.","noteTh":"ใช้เมื่อลูกค้าถามส่วนลดในโฆษณา บอกว่าจะตรวจ ยังไม่รับปากว่าได้ส่วนลด ต้องแจ้งผลก่อนดำเนินการ อายุหรือราคาตัวใหญ่อย่างเดียวยังไม่พอ","provenance":{"basis":{"category":"B","scope":"Original communication pattern. Source motivates the topic, not an official script or an individual customer result.","sourceIds":["photo-new-76","photo-new-77","photo-new-78"]},"explanations":"C","facts":[{"category":"A","scope":"These supplied flyers have conditional discounts; no specific eligibility rule is taught.","sourceIds":["photo-new-76","photo-new-77","photo-new-78"]}],"language":"C"},"speaker":"staff","th":"ส่วนลดนี้มีเงื่อนไขค่ะ จะตรวจว่าเข้าเกณฑ์ไหม"},{"cat":"billing","en":"Let us also check the price after the discount ends, here.","essential":false,"id":"p117","introduced":"1.2","jp":"{割引|わりびき}が{終|お}わった{後|あと}の{料金|りょうきん}も、こちらで{確認|かくにん}しましょう。","learning":{"audience":"customer","function":"Compare the later-period price","mode":"active"},"note":"Use with a verified comparison showing a temporary discount and later charges. Explain the amount and end date shown; do not infer them from an old flyer.","noteTh":"ใช้กับข้อมูลเปรียบเทียบที่ตรวจแล้วว่ามีส่วนลดชั่วคราวและราคาหลังหมดส่วนลด แจ้งราคาและวันสิ้นสุดจริง ไม่เดาจากใบปลิวเก่า","provenance":{"basis":{"category":"B","scope":"Original communication pattern. Source motivates the topic, not an official script or an individual customer result.","sourceIds":["photo-new-76","photo-new-77","photo-new-78"]},"explanations":"C","facts":[{"category":"A","scope":"Flyers separately show promotional and subsequent periods. No amounts or dates are prescribed.","sourceIds":["photo-new-76","photo-new-77","photo-new-78"]}],"language":"C"},"speaker":"staff","th":"มาดูตรงนี้ด้วยนะคะว่าหมดส่วนลดแล้วราคาเท่าไร"},{"cat":"billing","en":"Receiving the points requires a separate procedure.","essential":false,"id":"p118","introduced":"1.2","jp":"ポイントを{受|う}け{取|と}るには、{別|べつ}にお{手続|てつづ}きが{必要|ひつよう}です。","learning":{"audience":"customer","function":"Explain an extra step for points","mode":"active"},"note":"Only for a checked benefit that needs an additional action, such as the supplied switching offer. Then show exactly what to submit, how and by when under the applicable current conditions. Not all point offers work this way.","noteTh":"ใช้กับสิทธิพิเศษที่ตรวจแล้วว่าต้องทำเพิ่ม เช่น สิทธิย้ายค่ายในใบปลิว จากนั้นบอกให้ชัดว่าต้องส่งอะไร ทางไหน และเมื่อไรตามเงื่อนไขที่ใช้จริง ไม่ใช่ทุกโปรโมชันคะแนนจะเหมือนกัน","provenance":{"basis":{"category":"B","scope":"Original communication pattern. Source motivates the topic, not an official script or an individual customer result.","sourceIds":["photo-new-75","public-hikari-benefit"]},"explanations":"C","facts":[{"category":"A","scope":"The supplied switching offer and official guidance require documentary submission and review; this sentence does not certify eligibility.","sourceIds":["photo-new-75","public-hikari-benefit"]}],"language":"C"},"speaker":"staff","th":"ต้องดำเนินการอีกขั้นตอนหนึ่งเพื่อรับคะแนนค่ะ"},{"cat":"coworkers","en":"I have checked the address. Could you check with me whether installation work is needed?","essential":false,"id":"p119","introduced":"1.2","jp":"{住所|じゅうしょ}は{確認|かくにん}しました。{工事|こうじ}が{必要|ひつよう}か、{一緒|いっしょ}に{確認|かくにん}してもらえますか。","learning":{"audience":"coworker","function":"Report a completed check and ask for help","mode":"active"},"note":"To a coworker who has been told this is a home-internet inquiry. Separate the completed address check from the unresolved installation question. もらえますか is natural polite team speech.","noteTh":"พูดกับเพื่อนร่วมงานที่รู้แล้วว่าเป็นเรื่องเน็ตบ้าน แยกสิ่งที่ตรวจแล้วคือที่อยู่ กับเรื่องติดตั้งที่ยังไม่รู้ ใช้ความสุภาพแบบคุยในทีม","provenance":{"basis":{"category":"C","scope":"Original communication pattern. Source motivates the topic, not an official script or an individual customer result.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"speaker":"staff","th":"ตรวจที่อยู่แล้วค่ะ ช่วยดูด้วยกันหน่อยได้ไหมคะว่าต้องติดตั้งสายหรือเปล่า"}],"release":"1.2","rescue":[{"cat":"rescue","en":"Excuse me, could you say that again?","essential":true,"id":"r01","jp":"{恐|おそ}れ{入|い}りますが、もう{一度|いちど}お{願|ねが}いできますか。","learning":{"audience":"customer","function":"Ask for repetition","mode":"active"},"note":"For a customer or senior coworker when you missed what was said. A calm first response is enough.","noteTh":"ใช้กับลูกค้าหรือรุ่นพี่เมื่อฟังไม่ทัน เริ่มด้วยประโยคนี้อย่างใจเย็นได้เลยค่ะ","provenance":{"basis":{"category":"C","scope":"General workplace-Japanese teaching; no employer-specific claim.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"speaker":"staff","th":"รบกวนพูดอีกครั้งได้ไหมคะ"},{"cat":"rescue","en":"Excuse me, could you speak a little more slowly?","essential":true,"id":"r02","jp":"{恐|おそ}れ{入|い}りますが、{少|すこ}しゆっくりお{話|はな}しいただけますか。","learning":{"audience":"customer","function":"Ask for slower speech","mode":"active"},"note":"Useful with fast speech. お話しいただけますか is a polite request for the other person to speak.","noteTh":"ใช้เมื่ออีกฝ่ายพูดเร็ว お話しいただけますか เป็นรูปสุภาพสำหรับขอให้อีกฝ่ายพูดค่ะ","provenance":{"basis":{"category":"C","scope":"General workplace-Japanese teaching; no employer-specific claim.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"speaker":"staff","th":"รบกวนพูดช้าลงอีกนิดได้ไหมคะ"},{"cat":"rescue","en":"What does “___” mean?","essential":false,"id":"r03","jp":"「○○」というのは、どういう{意味|いみ}でしょうか。","learning":{"audience":"customer","function":"Ask what a term means","mode":"active"},"note":"Repeat the unfamiliar word in place of ○○. Especially useful for checking a technical term with a coworker.","noteTh":"แทน ○○ ด้วยคำที่ไม่เข้าใจ เหมาะสำหรับถามความหมายของศัพท์เฉพาะกับเพื่อนร่วมงานค่ะ","provenance":{"basis":{"category":"C","scope":"General workplace-Japanese teaching; no employer-specific claim.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"speaker":"staff","th":"คำว่า “___” หมายความว่าอย่างไรคะ"},{"cat":"rescue","en":"Just to confirm, you'd like to change your plan?","essential":true,"id":"r04","jp":"プランを{変更|へんこう}したい、ということでしょうか。","learning":{"audience":"customer","function":"Confirm your understanding","mode":"active"},"note":"Check your understanding instead of guessing. Replace プランを変更したい with the request you think you heard.","noteTh":"ใช้ทวนความเข้าใจแทนการเดาค่ะ เปลี่ยน プランを変更したい เป็นสิ่งที่คุณคิดว่าลูกค้าต้องการ","provenance":{"basis":{"category":"C","scope":"General workplace-Japanese teaching; no employer-specific claim.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"speaker":"staff","th":"ขอทวนเพื่อความแน่ใจค่ะ คุณต้องการเปลี่ยนแพ็กเกจ ใช่ไหมคะ"},{"cat":"rescue","en":"Excuse me, could you write it here?","essential":false,"id":"r05","jp":"{恐|おそ}れ{入|い}りますが、こちらに{書|か}いていただけますか。","learning":{"audience":"customer","function":"Ask for a written detail","mode":"active"},"note":"For an unfamiliar word or model name when hearing it again has not helped.","noteTh":"ใช้กับคำที่ไม่คุ้นหรือชื่อรุ่น เมื่อฟังซ้ำแล้วยังไม่เข้าใจค่ะ","provenance":{"basis":{"category":"C","scope":"General workplace-Japanese teaching; no employer-specific claim.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"speaker":"staff","th":"รบกวนเขียนตรงนี้ให้หน่อยได้ไหมคะ"},{"cat":"rescue","en":"I'll check so I can give you accurate information. Could you wait a moment?","essential":true,"id":"r06","jp":"{正確|せいかく}にご{案内|あんない}するため、{確認|かくにん}してまいります。{少々|しょうしょう}お{待|ま}ちいただけますか。","learning":{"audience":"customer","function":"Explain a check and wait","mode":"active"},"note":"Use when you will go and check with a colleague or another source, then return. Do not invent an answer.","noteTh":"ใช้เมื่อจะไปตรวจสอบกับเพื่อนร่วมงานหรือแหล่งข้อมูล แล้วกลับมาแจ้งลูกค้าค่ะ","provenance":{"basis":{"category":"C","scope":"General workplace-Japanese teaching; no employer-specific claim.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"speaker":"staff","th":"ขอตรวจสอบเพื่อให้ข้อมูลที่ถูกต้องค่ะ รอสักครู่ได้ไหมคะ"},{"cat":"rescue","en":"I can’t decide this myself, so I’ll check with the colleague who handles it.","essential":true,"id":"r07","jp":"{私|わたし}では{判断|はんだん}できないので、{担当|たんとう}の{者|もの}に{確認|かくにん}します。","learning":{"audience":"customer","function":"Refer a decision to a colleague","mode":"active"},"note":"For a request beyond your knowledge or authority, such as an exception or disputed charge.","noteTh":"ใช้กับคำขอที่เกินความรู้หรืออำนาจตัดสินใจของคุณ เช่น การขอยกเว้นเงื่อนไขหรือการโต้แย้งยอดเรียกเก็บค่ะ","provenance":{"basis":{"category":"C","scope":"General workplace-Japanese teaching; no employer-specific claim.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"speaker":"staff","th":"เรื่องนี้ตัดสินใจเองไม่ได้ ขอเช็กกับผู้ดูแลเรื่องนี้ก่อนค่ะ"},{"cat":"rescue","en":"I'm sorry to keep you waiting. It looks like checking will take a little longer.","essential":false,"id":"r08","jp":"お{待|ま}たせして{申|もう}し{訳|わけ}ございません。{確認|かくにん}にもう{少|すこ}しお{時間|じかん}がかかりそうです。","learning":{"audience":"customer","function":"Update a longer wait","mode":"active"},"note":"Give an update while the customer waits. This does not promise a completion time.","noteTh":"แจ้งความคืบหน้าให้ลูกค้าที่กำลังรอ ประโยคนี้ไม่ได้รับรองว่าจะเสร็จเมื่อไรค่ะ","provenance":{"basis":{"category":"C","scope":"General workplace-Japanese teaching; no employer-specific claim.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"speaker":"staff","th":"ขออภัยที่ให้รอค่ะ การตรวจสอบน่าจะใช้เวลาอีกสักหน่อยค่ะ"},{"cat":"rescue","en":"The information I gave you earlier was incorrect. I’m sorry. I’ll check and explain it again.","essential":true,"id":"r09","jp":"{先|さき}ほどのご{案内|あんない}に{誤|あやま}りがありました。{申|もう}し{訳|わけ}ありません。{確認|かくにん}して、{改|あらた}めてご{説明|せつめい}します。","learning":{"audience":"customer","function":"Correct your earlier information","mode":"active"},"note":"Use as soon as you discover you gave incorrect information. Confirm the correction before explaining it.","noteTh":"ใช้ทันทีที่พบว่าตนเองให้ข้อมูลผิด ตรวจสอบข้อมูลที่แก้ไขให้แน่ใจก่อนอธิบายอีกครั้งค่ะ","provenance":{"basis":{"category":"C","scope":"General workplace-Japanese teaching; no employer-specific claim.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"speaker":"staff","th":"เมื่อครู่ให้ข้อมูลผิดค่ะ ขออภัยด้วย จะตรวจสอบแล้วอธิบายใหม่ค่ะ"},{"cat":"rescue","en":"May I hand this over to the colleague who handles it? I’ll pass on what you’ve told me.","essential":true,"id":"r10","jp":"{担当|たんとう}の{者|もの}に{引|ひ}き{継|つ}いでもよろしいでしょうか。お{話|はなし}の{内容|ないよう}はこちらから{伝|つた}えます。","learning":{"audience":"customer","function":"Arrange a handoff","mode":"active"},"note":"担当の者 is the colleague handling the matter, not necessarily a manager. Tell the customer about the handoff, then pass on the request and what is still unchecked.","noteTh":"担当の者 คือพนักงานที่ดูแลเรื่องนั้น ไม่จำเป็นต้องเป็นผู้จัดการ แจ้งลูกค้าก่อนส่งต่อ แล้วบอกผู้รับช่วงว่าลูกค้าต้องการอะไรและยังไม่ได้ตรวจอะไร","provenance":{"basis":{"category":"C","scope":"General workplace-Japanese teaching; no employer-specific claim.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"speaker":"staff","th":"ขอส่งต่อให้ผู้รับผิดชอบดูแลได้ไหมคะ ดิฉันจะเล่าเรื่องที่คุณแจ้งมาให้เขาทราบค่ะ"},{"cat":"rescue","en":"Could you check whether I'm following the right steps?","essential":false,"id":"r11","jp":"この{手順|てじゅん}で{合|あ}っているか、{確認|かくにん}していただけますか。","learning":{"audience":"coworker","function":"Ask for a procedure check","mode":"active"},"note":"To your trainer or a senior coworker, before proceeding with a step you are unsure about.","noteTh":"พูดกับผู้สอนงานหรือรุ่นพี่ ก่อนทำขั้นตอนที่ยังไม่มั่นใจต่อไปค่ะ","provenance":{"basis":{"category":"C","scope":"General workplace-Japanese teaching; no employer-specific claim.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"speaker":"staff","th":"ช่วยตรวจให้หน่อยได้ไหมคะว่าขั้นตอนที่ทำอยู่นี้ถูกต้องหรือเปล่า"},{"cat":"rescue","en":"Excuse me, could you tell me how far I should proceed?","essential":false,"id":"r12","jp":"すみません。どこまで{進|すす}めればよいか、{教|おし}えていただけますか。","learning":{"audience":"coworker","function":"Ask how far to proceed","mode":"active"},"note":"To your trainer or a senior coworker. Useful when you understand the task but are unsure where your responsibility ends.","noteTh":"พูดกับผู้สอนงานหรือรุ่นพี่ เมื่อเข้าใจงานแล้วแต่ยังไม่แน่ใจว่าตนเองควรทำถึงขั้นไหนค่ะ","provenance":{"basis":{"category":"C","scope":"General workplace-Japanese teaching; no employer-specific claim.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"speaker":"staff","th":"ขอโทษค่ะ ช่วยบอกได้ไหมคะว่าควรทำต่อไปถึงขั้นตอนไหน"}],"scenarios":[{"boundary":"This exchange reaches agreement to compare costs. It does not yet explain actual figures or complete a plan change.","boundaryTh":"บทนี้จบที่ตกลงจะเปรียบเทียบค่าใช้จ่าย ยังไม่ได้อธิบายยอดจริงหรือเปลี่ยนแพ็กเกจเสร็จ","context":"Practice dialogue based on the listing’s plan-review work. No actual price or plan condition is assumed.","contextTh":"บทสนทนาฝึกจากงานทบทวนแพ็กเกจในประกาศรับสมัคร ไม่ได้กำหนดราคาหรือเงื่อนไขแพ็กเกจจริง","goal":"Find the customer’s priorities, compare the whole bill, and confirm conditions before suggesting a change.","goalTh":"ถามสิ่งที่ลูกค้าให้ความสำคัญ เปรียบเทียบยอดรวม และตรวจสอบเงื่อนไขก่อนเสนอให้เปลี่ยน","id":"plan-pushback","learning":{"audience":"customer","function":"Follow a partial encounter","mode":"active"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["job-listing"]},"explanations":"C","facts":[],"language":"C"},"takeaway":"Mirror the goal → ask about use → check the total and discounts → let the customer decide. “I’ll check” is a useful answer when the conditions are not yet verified.","takeawayTh":"ทวนความต้องการ → ถามการใช้งาน → ตรวจยอดรวมและส่วนลด → ให้ลูกค้าตัดสินใจ หากยังไม่ได้ตรวจสอบเงื่อนไข ใช้คำว่า “ขอตรวจสอบค่ะ” ได้","title":"Plan change: “Will it really be cheaper?”","titleTh":"เปลี่ยนแพ็กเกจ: “จะถูกลงจริงไหม?”","turns":[{"en":"What would you like to discuss today?","id":"plan-pushback-01","jp":"{本日|ほんじつ}はどのようなご{相談|そうだん}でしょうか。","learning":{"audience":"customer","function":"Continue the constructed exchange","mode":"active"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["job-listing"]},"explanations":"C","facts":[],"language":"C"},"role":"staff","th":"วันนี้ต้องการปรึกษาเรื่องอะไรคะ"},{"en":"My monthly bill is high. I’d like to reduce it.","id":"plan-pushback-02","jp":"{毎月|まいつき}の{料金|りょうきん}が{高|たか}いので、もっと{安|やす}くしたいです。","learning":{"audience":"learner","function":"Continue the constructed exchange","mode":"recognize"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["job-listing"]},"explanations":"C","facts":[],"language":"C"},"role":"customer","th":"ค่าโทรศัพท์แต่ละเดือนแพง อยากลดค่าใช้จ่ายลง"},{"en":"You’d like to review the cost. How do you usually use your smartphone?","id":"plan-pushback-03","jp":"{料金|りょうきん}を{見直|みなお}したいということですね。{普段|ふだん}は、どのようにスマートフォンをお{使|つか}いですか。","learning":{"audience":"customer","function":"Continue the constructed exchange","mode":"active"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["job-listing"]},"explanations":"C","facts":[],"language":"C"},"role":"staff","th":"ต้องการทบทวนค่าใช้จ่ายใช่ไหมคะ ปกติใช้สมาร์ตโฟนทำอะไรบ้างคะ"},{"en":"I use Wi-Fi at home, but I also watch videos when I’m out.","id":"plan-pushback-04","jp":"{家|いえ}では{Wi-Fi|ワイファイ}を{使|つか}っています。でも、{外|そと}では{動画|どうが}も{見|み}ます。","learning":{"audience":"learner","function":"Continue the constructed exchange","mode":"recognize"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["job-listing"]},"explanations":"C","facts":[],"language":"C"},"role":"customer","th":"ที่บ้านใช้ Wi-Fi แต่เวลาออกไปข้างนอกก็ดูวิดีโอด้วย"},{"en":"I’ll check your current contract and data usage, then compare plans that may suit you. May I go ahead with the checks?","id":"plan-pushback-05","jp":"{現在|げんざい}のご{契約|けいやく}とデータ{使用量|しようりょう}を{確認|かくにん}し、{合|あ}いそうなプランを{比較|ひかく}いたします。{確認|かくにん}を{進|すす}めてもよろしいでしょうか。","learning":{"audience":"customer","function":"Continue the constructed exchange","mode":"active"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["job-listing"]},"explanations":"C","facts":[],"language":"C"},"role":"staff","th":"จะตรวจสอบสัญญาปัจจุบันและปริมาณอินเทอร์เน็ตที่ใช้ แล้วเปรียบเทียบแพ็กเกจที่น่าจะเหมาะสมค่ะ ขอเริ่มตรวจสอบได้ไหมคะ"},{"en":"Yes. But if I switch to a cheaper plan, won’t other charges go up?","id":"plan-pushback-06","jp":"はい。でも、{安|やす}いプランにしても、ほかの{料金|りょうきん}が{増|ふ}えるんじゃないですか。","learning":{"audience":"learner","function":"Continue the constructed exchange","mode":"recognize"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["job-listing"]},"explanations":"C","facts":[],"language":"C"},"role":"customer","th":"ได้ แต่เปลี่ยนเป็นแพ็กเกจถูกกว่าแล้ว ค่าใช้จ่ายอย่างอื่นจะเพิ่มหรือเปล่า"},{"en":"I’ll check the total, including call charges and optional services.","id":"plan-pushback-07","jp":"{通話料|つうわりょう}やオプションも{含|ふく}めて、{合計|ごうけい}を{確認|かくにん}します。","learning":{"audience":"customer","function":"Continue the constructed exchange","mode":"active"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["job-listing"]},"explanations":"C","facts":[],"language":"C"},"role":"staff","th":"จะตรวจยอดรวมที่รวมค่าโทรและบริการเสริมด้วยค่ะ"},{"en":"Will I still be able to use my current discount?","id":"plan-pushback-08","jp":"{今|いま}の{割引|わりびき}は、そのまま{使|つか}えますか。","learning":{"audience":"learner","function":"Continue the constructed exchange","mode":"recognize"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["job-listing"]},"explanations":"C","facts":[],"language":"C"},"role":"customer","th":"ส่วนลดที่ใช้อยู่ตอนนี้จะยังใช้ได้ไหม"},{"en":"I’ll check whether your current discounts can be used. Let’s compare the total after the change too.","id":"plan-pushback-09","jp":"{今|いま}の{割引|わりびき}が{使|つか}えるか{確認|かくにん}します。{変更後|へんこうご}の{合計|ごうけい}も{比|くら}べてみましょう。","learning":{"audience":"customer","function":"Continue the constructed exchange","mode":"active"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["job-listing"]},"explanations":"C","facts":[],"language":"C"},"role":"staff","th":"จะตรวจว่าส่วนลดเดิมยังใช้ได้ไหม แล้วมาเทียบยอดรวมหลังเปลี่ยนกันนะคะ"},{"en":"Then I don’t want to change it right away today. I want to understand the differences first.","id":"plan-pushback-10","jp":"じゃあ、{今日|きょう}すぐには{変|か}えたくないです。まず{違|ちが}いを{知|し}りたいです。","learning":{"audience":"learner","function":"Continue the constructed exchange","mode":"recognize"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["job-listing"]},"explanations":"C","facts":[],"language":"C"},"role":"customer","th":"ถ้าอย่างนั้นวันนี้ยังไม่อยากเปลี่ยนทันที อยากรู้ความแตกต่างก่อน"},{"en":"Certainly. I’ll explain the differences in cost and conditions first. Please decide whether to change after the explanation.","id":"plan-pushback-11","jp":"かしこまりました。まず{料金|りょうきん}と{条件|じょうけん}の{違|ちが}いをご{説明|せつめい}いたします。{変更|へんこう}するかどうかは、ご{説明|せつめい}の{後|あと}にお{決|き}めください。","learning":{"audience":"customer","function":"Continue the constructed exchange","mode":"active"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["job-listing"]},"explanations":"C","facts":[],"language":"C"},"role":"staff","th":"ได้ค่ะ จะอธิบายความแตกต่างด้านราคาและเงื่อนไขก่อน แล้วค่อยตัดสินใจว่าจะเปลี่ยนหรือไม่ค่ะ"},{"en":"In that case, please go ahead. I want to know how my monthly total would change.","id":"plan-pushback-12","jp":"それならお{願|ねが}いします。{毎月|まいつき}の{合計|ごうけい}がどう{変|か}わるか、{知|し}りたいです。","learning":{"audience":"learner","function":"Continue the constructed exchange","mode":"recognize"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["job-listing"]},"explanations":"C","facts":[],"language":"C"},"role":"customer","th":"ถ้าอย่างนั้นช่วยอธิบายด้วย อยากรู้ว่ายอดรวมแต่ละเดือนจะเปลี่ยนอย่างไร"}]},{"boundary":"This exchange reaches a handoff for investigation. No billing error or refund decision has been established.","boundaryTh":"บทนี้จบที่ส่งต่อเพื่อตรวจสอบ ยังไม่ได้ยืนยันว่าบิลผิดหรือคืนเงินได้","context":"Practice a billing inquiry that needs a senior colleague’s help. The charge, refund eligibility, and response time remain unverified.","contextTh":"ฝึกตอบคำถามเรื่องบิลที่ต้องให้รุ่นพี่ช่วย ยังไม่ทราบข้อเท็จจริงของค่าบริการ สิทธิคืนเงิน หรือเวลาที่จะได้คำตอบ","goal":"Acknowledge the concern without guessing, ask to check details, and hand over the unresolved point clearly.","goalTh":"รับฟังความกังวลโดยไม่เดา ขออนุญาตตรวจสอบรายละเอียด และส่งต่อประเด็นที่ยังไม่ชัดเจน","id":"billing-complaint","learning":{"audience":"customer","function":"Follow a partial encounter","mode":"active"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["job-listing"]},"explanations":"C","facts":[],"language":"C"},"takeaway":"Acknowledge the customer’s account without declaring the bill wrong. A useful handover includes their concern, their request, and what is still unverified.","takeawayTh":"รับฟังสิ่งที่ลูกค้าเล่าโดยยังไม่สรุปว่าบิลผิด เวลาส่งต่อให้บอกข้อกังวล สิ่งที่ลูกค้าต้องการ และส่วนที่ยังไม่ได้ตรวจสอบ","title":"Billing complaint: an unfamiliar charge","titleTh":"ข้อร้องเรียนเรื่องบิล: มีค่าบริการที่ไม่คุ้น","turns":[{"en":"Isn’t this bill wrong? It’s higher than last month.","id":"billing-complaint-01","jp":"この{請求|せいきゅう}、おかしくないですか。{先月|せんげつ}より{高|たか}いんですけど。","learning":{"audience":"learner","function":"Continue the constructed exchange","mode":"recognize"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["job-listing"]},"explanations":"C","facts":[],"language":"C"},"role":"customer","th":"บิลนี้ผิดหรือเปล่า แพงกว่าเดือนที่แล้ว"},{"en":"It’s higher than last month, I see. Let’s check the breakdown together.","id":"billing-complaint-02","j
