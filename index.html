p":"{先月|せんげつ}より{高|たか}くなっているのですね。{内訳|うちわけ}を{一緒|いっしょ}に{確認|かくにん}しましょう。","learning":{"audience":"customer","function":"Continue the constructed exchange","mode":"active"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["job-listing"]},"explanations":"C","facts":[],"language":"C"},"role":"staff","th":"ยอดสูงกว่าเดือนที่แล้วใช่ไหมคะ มาดูรายละเอียดด้วยกันนะคะ"},{"en":"This option here. I don’t remember signing up for it.","id":"billing-complaint-03","jp":"このオプションです。{申|もう}し{込|こ}んだ{覚|おぼ}えはありません。","learning":{"audience":"learner","function":"Continue the constructed exchange","mode":"recognize"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["job-listing"]},"explanations":"C","facts":[],"language":"C"},"role":"customer","th":"บริการเสริมตรงนี้ จำไม่ได้ว่าเคยสมัคร"},{"en":"You don’t remember signing up for it. I’ll check the billing details and the application record.","id":"billing-complaint-04","jp":"お{申|もう}し{込|こ}みの{覚|おぼ}えがないということですね。{請求内容|せいきゅうないよう}と、お{申|もう}し{込|こ}みの{記録|きろく}を{確認|かくにん}いたします。","learning":{"audience":"customer","function":"Continue the constructed exchange","mode":"active"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["job-listing"]},"explanations":"C","facts":[],"language":"C"},"role":"staff","th":"จำไม่ได้ว่าเคยสมัครรายการนี้ใช่ไหมคะ จะตรวจสอบรายละเอียดบิลและบันทึกการสมัครค่ะ"},{"en":"Don’t just look into it. I want a refund.","id":"billing-complaint-05","jp":"{調|しら}べるだけじゃなくて、{返金|へんきん}してください。","learning":{"audience":"learner","function":"Continue the constructed exchange","mode":"recognize"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["job-listing"]},"explanations":"C","facts":[],"language":"C"},"role":"customer","th":"อย่าแค่ตรวจสอบ ขอให้คืนเงินด้วย"},{"en":"You would like a refund. I’m sorry, but I can’t determine at this point whether a refund is possible. I’ll check the details and consult the person in charge.","id":"billing-complaint-06","jp":"{返金|へんきん}をご{希望|きぼう}ですね。{申|もう}し{訳|わけ}ございませんが、{現時点|げんじてん}では{返金|へんきん}できるか{判断|はんだん}できません。{内容|ないよう}を{確認|かくにん}し、{責任者|せきにんしゃ}に{相談|そうだん}いたします。","learning":{"audience":"customer","function":"Continue the constructed exchange","mode":"active"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["job-listing"]},"explanations":"C","facts":[],"language":"C"},"role":"staff","th":"ต้องการให้คืนเงินใช่ไหมคะ ขออภัยค่ะ ตอนนี้ยังตัดสินไม่ได้ว่าสามารถคืนเงินได้หรือไม่ จะตรวจสอบรายละเอียดและปรึกษาผู้รับผิดชอบค่ะ"},{"en":"Am I going to have to explain everything again?","id":"billing-complaint-07","jp":"また{同|おな}じ{説明|せつめい}をしないといけないんですか。","learning":{"audience":"learner","function":"Continue the constructed exchange","mode":"recognize"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["job-listing"]},"explanations":"C","facts":[],"language":"C"},"role":"customer","th":"ต้องอธิบายเรื่องเดิมซ้ำอีกหรือ"},{"en":"I’ll pass on what you’ve told me so far. If anything else needs checking, we’ll ask you about it.","id":"billing-complaint-08","jp":"これまで{伺|うかが}った{内容|ないよう}は、{私|わたし}から{引|ひ}き{継|つ}ぎます。{追加|ついか}で{確認|かくにん}が{必要|ひつよう}な{点|てん}があれば、お{伺|うかが}いします。","learning":{"audience":"customer","function":"Continue the constructed exchange","mode":"active"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["job-listing"]},"explanations":"C","facts":[],"language":"C"},"role":"staff","th":"ดิฉันจะส่งต่อเรื่องที่ได้รับฟังมาค่ะ หากมีประเด็นที่ต้องตรวจสอบเพิ่มเติม จะสอบถามอีกครั้งค่ะ"},{"en":"How long will I have to wait? I don’t have much time.","id":"billing-complaint-09","jp":"どのくらい{待|ま}ちますか。あまり{時間|じかん}がないんです。","learning":{"audience":"learner","function":"Continue the constructed exchange","mode":"recognize"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["job-listing"]},"explanations":"C","facts":[],"language":"C"},"role":"customer","th":"ต้องรอนานแค่ไหน มีเวลาไม่มาก"},{"en":"I’ll check the estimated wait and let them know you’re in a hurry.","id":"billing-complaint-10","jp":"お{待|ま}ちいただく{時間|じかん}の{目安|めやす}を{確認|かくにん}してまいります。お{急|いそ}ぎであることも{伝|つた}えます。","learning":{"audience":"customer","function":"Continue the constructed exchange","mode":"active"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["job-listing"]},"explanations":"C","facts":[],"language":"C"},"role":"staff","th":"จะไปตรวจสอบเวลารอโดยประมาณค่ะ และจะแจ้งด้วยว่าคุณมีเวลาจำกัดค่ะ"},{"en":"[To a colleague] This customer doesn’t remember signing up for the option and wants a refund. I haven’t been able to verify the application record yet. Could you help with this?","id":"billing-complaint-11","jp":"こちらのお{客様|きゃくさま}は、オプションを{申|もう}し{込|こ}んだ{覚|おぼ}えがなく、{返金|へんきん}をご{希望|きぼう}です。{申込記録|もうしこみきろく}はまだ{確認|かくにん}できていません。ご{対応|たいおう}をお{願|ねが}いできますか。","learning":{"audience":"coworker","function":"Continue the constructed exchange","mode":"active"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["job-listing"]},"explanations":"C","facts":[],"language":"C"},"role":"staff","th":"[พูดกับเพื่อนร่วมงาน] ลูกค้าท่านนี้จำไม่ได้ว่าเคยสมัครบริการเสริมและต้องการคืนเงินค่ะ ยังตรวจสอบบันทึกการสมัครไม่ได้ รบกวนช่วยรับเรื่องได้ไหมคะ"},{"en":"Understood. Let’s check the record first, then explain separately what we know and what still needs checking.","id":"billing-complaint-12","jp":"{分|わ}かりました。まず{記録|きろく}を{確認|かくにん}しましょう。{分|わ}かったことと、まだ{確認|かくにん}が{必要|ひつよう}なことを{分|わ}けて{説明|せつめい}しましょう。","learning":{"audience":"learner","function":"Continue the constructed exchange","mode":"recognize"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["job-listing"]},"explanations":"C","facts":[],"language":"C"},"role":"coworker","th":"เข้าใจแล้ว เริ่มจากตรวจสอบบันทึกกันก่อน แล้วแยกอธิบายส่วนที่ทราบแล้วกับส่วนที่ยังต้องตรวจสอบ"}]},{"boundary":"This exchange reaches permission to inspect the phone. Repair eligibility, costs, data recovery and timing remain unchecked.","boundaryTh":"บทนี้จบที่ลูกค้าอนุญาตให้ดูเครื่อง ยังไม่ได้ยืนยันสิทธิ์ซ่อม ค่าใช้จ่าย การกู้ข้อมูล หรือเวลา","context":"Practice repair reception and after-sales support from the job listing. Repair outcome, data handling, cost, and timing must be checked for the actual case.","contextTh":"ฝึกงานรับซ่อมและดูแลหลังการขายตามประกาศรับสมัคร ต้องตรวจสอบผลการซ่อม การจัดการข้อมูล ค่าใช้จ่าย และเวลาตามกรณีจริง","goal":"Ask about symptoms and priorities; explain uncertainty without promising data recovery, free repair, or same-day completion.","goalTh":"ถามอาการและสิ่งที่ลูกค้ากังวล อธิบายส่วนที่ยังไม่ทราบโดยไม่รับรองการกู้ข้อมูล การซ่อมฟรี หรือการซ่อมเสร็จภายในวันเดียว","id":"repair-data-cost","learning":{"audience":"customer","function":"Follow a partial encounter","mode":"active"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["job-listing"]},"explanations":"C","facts":[],"language":"C"},"takeaway":"Separate symptoms, data concerns, coverage, and urgency. Permission to look at a device is not permission to erase it or proceed with a repair.","takeawayTh":"แยกถามอาการเสีย ความกังวลเรื่องข้อมูล ความคุ้มครอง และความเร่งด่วน การอนุญาตให้ดูเครื่องไม่ได้หมายถึงอนุญาตให้ลบข้อมูลหรือส่งซ่อม","title":"Repair: photos, cost, and uncertainty","titleTh":"ส่งซ่อม: รูปถ่าย ค่าใช้จ่าย และสิ่งที่ยังไม่ทราบ","turns":[{"en":"My phone has stopped working. The screen doesn’t respond when I touch it.","id":"repair-data-cost-01","jp":"スマホが{動|うご}かなくなりました。{画面|がめん}を{触|さわ}っても{反応|はんのう}しません。","learning":{"audience":"learner","function":"Continue the constructed exchange","mode":"recognize"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["job-listing"]},"explanations":"C","facts":[],"language":"C"},"role":"customer","th":"มือถือใช้งานไม่ได้ แตะหน้าจอแล้วไม่ตอบสนอง"},{"en":"The screen isn’t responding. When did that start?","id":"repair-data-cost-02","jp":"{画面|がめん}が{反応|はんのう}しないのですね。いつごろからでしょうか。","learning":{"audience":"customer","function":"Continue the constructed exchange","mode":"active"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["job-listing"]},"explanations":"C","facts":[],"language":"C"},"role":"staff","th":"หน้าจอไม่ตอบสนองใช่ไหมคะ เริ่มเป็นตั้งแต่เมื่อไรคะ"},{"en":"Since this morning. I dropped it yesterday, but my photos won’t be lost, will they?","id":"repair-data-cost-03","jp":"{今朝|けさ}からです。{昨日|きのう}{落|お}としたんですけど、{写真|しゃしん}は{消|き}えませんよね。","learning":{"audience":"learner","function":"Continue the constructed exchange","mode":"recognize"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["job-listing"]},"explanations":"C","facts":[],"language":"C"},"role":"customer","th":"ตั้งแต่เช้านี้ เมื่อวานทำตก แต่รูปจะไม่หายใช่ไหม"},{"en":"You’re worried about the photos. At this stage, I can’t promise that the data will be preserved. Have you made a backup?","id":"repair-data-cost-04","jp":"{写真|しゃしん}が{心配|しんぱい}なのですね。{今|いま}の{段階|だんかい}では、データが{残|のこ}るとはお{約束|やくそく}できません。バックアップはお{済|す}みですか。","learning":{"audience":"customer","function":"Continue the constructed exchange","mode":"active"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["job-listing"]},"explanations":"C","facts":[],"language":"C"},"role":"staff","th":"กังวลเรื่องรูปถ่ายใช่ไหมคะ ตอนนี้ยังรับรองไม่ได้ว่าข้อมูลจะคงอยู่ค่ะ ได้สำรองข้อมูลไว้ไหมคะ"},{"en":"I’m not sure. What’s a backup?","id":"repair-data-cost-05","jp":"よく{分|わ}かりません。バックアップって、{何|なん}ですか。","learning":{"audience":"learner","function":"Continue the constructed exchange","mode":"recognize"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["job-listing"]},"explanations":"C","facts":[],"language":"C"},"role":"customer","th":"ไม่ค่อยเข้าใจ การสำรองข้อมูลคืออะไร"},{"en":"It means saving data such as photos in another place as well. Do you remember saving your photos to another device or service?","id":"repair-data-cost-06","jp":"{写真|しゃしん}などのデータを、{別|べつ}の{場所|ばしょ}にも{保存|ほぞん}しておくことです。{別|べつ}の{端末|たんまつ}やサービスに、{写真|しゃしん}を{保存|ほぞん}した{覚|おぼ}えはありますか。","learning":{"audience":"customer","function":"Continue the constructed exchange","mode":"active"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["job-listing"]},"explanations":"C","facts":[],"language":"C"},"role":"staff","th":"คือการเก็บข้อมูล เช่น รูปถ่าย ไว้ในอีกที่หนึ่งด้วยค่ะ จำได้ไหมคะว่าเคยบันทึกรูปไว้ในอุปกรณ์อื่นหรือบริการอื่น"},{"en":"I probably haven’t. Also, the repair is free, right? I think I signed up for coverage.","id":"repair-data-cost-07","jp":"たぶん、していません。それと、{修理|しゅうり}は{無料|むりょう}ですよね。{補償|ほしょう}に{入|はい}ったはずです。","learning":{"audience":"learner","function":"Continue the constructed exchange","mode":"recognize"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["job-listing"]},"explanations":"C","facts":[],"language":"C"},"role":"customer","th":"น่าจะไม่ได้ทำไว้ แล้วซ่อมฟรีใช่ไหม คิดว่าเคยสมัครบริการคุ้มครองไว้"},{"en":"I’ll check whether you are enrolled in coverage and whether this fault is covered. I’ll check the cost too and let you know.","id":"repair-data-cost-08","jp":"{補償|ほしょう}の{加入状況|かにゅうじょうきょう}と、{今回|こんかい}の{故障|こしょう}が{対象|たいしょう}になるかを{確認|かくにん}します。{費用|ひよう}も{確認|かくにん}してご{案内|あんない}します。","learning":{"audience":"customer","function":"Continue the constructed exchange","mode":"active"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["job-listing"]},"explanations":"C","facts":[],"language":"C"},"role":"staff","th":"จะตรวจว่าสมัครบริการคุ้มครองไว้หรือไม่ และอาการเสียครั้งนี้อยู่ในเงื่อนไขไหม แล้วตรวจค่าใช้จ่ายให้ด้วยค่ะ"},{"en":"I need it for work, so I want it fixed today.","id":"repair-data-cost-09","jp":"{仕事|しごと}で{使|つか}うので、{今日|きょう}{直|なお}してほしいんです。","learning":{"audience":"learner","function":"Continue the constructed exchange","mode":"recognize"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["job-listing"]},"explanations":"C","facts":[],"language":"C"},"role":"customer","th":"ต้องใช้ทำงาน อยากให้ซ่อมเสร็จวันนี้"},{"en":"You need it for work. I can’t promise it will be fixed today. I’ll check the available options and the estimated time.","id":"repair-data-cost-10","jp":"お{仕事|しごと}で{必要|ひつよう}なのですね。{本日中|ほんじつちゅう}に{直|なお}るとはお{約束|やくそく}できません。{対応方法|たいおうほうほう}と、かかる{時間|じかん}の{目安|めやす}を{確認|かくにん}いたします。","learning":{"audience":"customer","function":"Continue the constructed exchange","mode":"active"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["job-listing"]},"explanations":"C","facts":[],"language":"C"},"role":"staff","th":"จำเป็นต้องใช้ทำงานใช่ไหมคะ ยังรับรองไม่ได้ว่าจะซ่อมเสร็จวันนี้ค่ะ จะตรวจสอบวิธีดำเนินการและระยะเวลาโดยประมาณค่ะ"},{"en":"Please don’t erase my data without asking me. I want an explanation first.","id":"repair-data-cost-11","jp":"{勝手|かって}にデータを{消|け}さないでください。{先|さき}に{説明|せつめい}してほしいです。","learning":{"audience":"learner","function":"Continue the constructed exchange","mode":"recognize"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["job-listing"]},"explanations":"C","facts":[],"language":"C"},"role":"customer","th":"อย่าลบข้อมูลโดยไม่ถามก่อน อยากให้อธิบายก่อนดำเนินการ"},{"en":"Understood. I’ll check how the data would be handled and explain it before proceeding. First, may I look at the condition of the device?","id":"repair-data-cost-12","jp":"{承知|しょうち}いたしました。データの{扱|あつか}いを{確認|かくにん}し、{手続|てつづ}きの{前|まえ}にご{説明|せつめい}いたします。まず、{端末|たんまつ}の{状態|じょうたい}を{拝見|はいけん}してもよろしいでしょうか。","learning":{"audience":"customer","function":"Continue the constructed exchange","mode":"active"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["job-listing"]},"explanations":"C","facts":[],"language":"C"},"role":"staff","th":"รับทราบค่ะ จะตรวจสอบวิธีจัดการข้อมูลและอธิบายก่อนดำเนินเรื่องค่ะ ก่อนอื่นขอดูสภาพเครื่องได้ไหมคะ"}]},{"boundary":"This exchange reaches an agreement to explain in accessible language. It does not establish document eligibility or complete a contract.","boundaryTh":"บทนี้จบที่ตกลงจะอธิบายให้เข้าใจ ยังไม่ได้ยืนยันว่าเอกสารใช้ได้หรือทำสัญญาเสร็จ","context":"Practice language support connected to the revised role’s translated contract aids and multilingual materials. Do not assume which documents are accepted or that a translation replaces the contract.","contextTh":"ฝึกช่วยด้านภาษาซึ่งเชื่อมกับงานแปลเอกสารประกอบสัญญาและจัดทำสื่อหลายภาษาในเอกสารหน้าที่งานฉบับแก้ไข ไม่สมมติว่าเอกสารใดใช้ได้หรือคำแปลใช้แทนสัญญาได้","goal":"Offer understandable language, check document requirements, and confirm understanding before asking for consent.","goalTh":"เสนอภาษาที่เข้าใจได้ ตรวจสอบเอกสารที่จำเป็น และเช็กความเข้าใจก่อนขอความยินยอม","id":"contract-language-support","learning":{"audience":"customer","function":"Follow a partial encounter","mode":"active"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["job-listing"]},"explanations":"C","facts":[],"language":"C"},"takeaway":"Do not infer preferred language from nationality. Ask, check requirements for this application, and resolve unclear terms before moving toward a signature.","takeawayTh":"อย่าเดาภาษาที่ลูกค้าถนัดจากสัญชาติ ให้ถาม ตรวจสอบเงื่อนไขของการทำเรื่องครั้งนี้ และอธิบายจุดที่ไม่ชัดเจนก่อนขั้นตอนลงลายมือชื่อ","title":"Contract support: “I don’t understand the terms”","titleTh":"ช่วยเรื่องสัญญา: “ไม่เข้าใจเงื่อนไข”","turns":[{"en":"I want to sign up for a new contract, but I don’t understand difficult Japanese very well.","id":"contract-language-support-01","jp":"{新|あたら}しく{契約|けいやく}したいです。でも、{難|むずか}しい{日本語|にほんご}はあまり{分|わ}かりません。","learning":{"audience":"learner","function":"Continue the constructed exchange","mode":"recognize"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["job-listing"]},"explanations":"C","facts":[],"language":"C"},"role":"customer","th":"อยากเปิดสัญญาใหม่ แต่ไม่ค่อยเข้าใจภาษาญี่ปุ่นยาก ๆ"},{"en":"I’ll explain each point in clear language. Which is easier for you, Japanese or Thai?","id":"contract-language-support-02","jp":"{分|わ}かりやすい{言葉|ことば}で、{一|ひと}つずつご{説明|せつめい}いたします。{日本語|にほんご}とタイ{語|ご}では、どちらが{分|わ}かりやすいですか。","learning":{"audience":"customer","function":"Continue the constructed exchange","mode":"active"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["job-listing"]},"explanations":"C","facts":[],"language":"C"},"role":"staff","th":"จะอธิบายทีละข้อด้วยคำที่เข้าใจง่ายค่ะ ระหว่างภาษาญี่ปุ่นกับภาษาไทย ภาษาไหนเข้าใจง่ายกว่าคะ"},{"en":"Thai is easier for me. Can I sign up today?","id":"contract-language-support-03","jp":"タイ{語|ご}のほうが{分|わ}かりやすいです。{今日|きょう}、{契約|けいやく}できますか。","learning":{"audience":"learner","function":"Continue the constructed exchange","mode":"recognize"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["job-listing"]},"explanations":"C","facts":[],"language":"C"},"role":"customer","th":"ภาษาไทยเข้าใจง่ายกว่า วันนี้ทำสัญญาได้ไหม"},{"en":"First I’ll check the requirements and the necessary documents. Once I’ve checked, I’ll let you know whether we can process it today.","id":"contract-language-support-04","jp":"まず、お{手続|てつづ}きの{条件|じょうけん}と{必要|ひつよう}な{書類|しょるい}を{確認|かくにん}いたします。{本日|ほんじつ}お{手続|てつづ}きできるかは、{確認後|かくにんご}にご{案内|あんない}いたします。","learning":{"audience":"customer","function":"Continue the constructed exchange","mode":"active"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["job-listing"]},"explanations":"C","facts":[],"language":"C"},"role":"staff","th":"ก่อนอื่นจะตรวจสอบเงื่อนไขและเอกสารที่จำเป็นค่ะ หลังตรวจสอบจะแจ้งว่าสามารถดำเนินการวันนี้ได้หรือไม่ค่ะ"},{"en":"I only brought my residence card. Is this enough?","id":"contract-language-support-05","jp":"{在留|ざいりゅう}カードだけ{持|も}ってきました。これだけで{大丈夫|だいじょうぶ}ですか。","learning":{"audience":"learner","function":"Continue the constructed exchange","mode":"recognize"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["job-listing"]},"explanations":"C","facts":[],"language":"C"},"role":"customer","th":"เอามาแค่บัตรประจำตัวผู้พำนัก แค่นี้พอไหม"},{"en":"I need to check whether we can process it with this document. I’ll also check whether anything else is required.","id":"contract-language-support-06","jp":"こちらの{書類|しょるい}でお{手続|てつづ}きできるか、{確認|かくにん}が{必要|ひつよう}です。ほかに{必要|ひつよう}なものがないかも{調|しら}べます。","learning":{"audience":"customer","function":"Continue the constructed exchange","mode":"active"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["job-listing"]},"explanations":"C","facts":[],"language":"C"},"role":"staff","th":"ต้องตรวจสอบก่อนว่าใช้เอกสารนี้ดำเนินการได้หรือไม่ค่ะ และจะตรวจสอบด้วยว่าต้องใช้สิ่งใดเพิ่มเติมหรือไม่ค่ะ"},{"en":"My friend said they could do it with just this document. Why is that?","id":"contract-language-support-07","jp":"{友達|ともだち}は、この{書類|しょるい}だけでできたと{言|い}っていました。どうしてですか。","learning":{"audience":"learner","function":"Continue the constructed exchange","mode":"recognize"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["job-listing"]},"explanations":"C","facts":[],"language":"C"},"role":"customer","th":"เพื่อนบอกว่าใช้แค่เอกสารนี้ก็ทำได้ ทำไมถึงต่างกัน"},{"en":"I’ll check with the colleague who handles this whether that document can be used for your application.","id":"contract-language-support-08","jp":"{今回|こんかい}のお{手続|てつづ}きで{使|つか}えるか、{担当|たんとう}の{者|もの}に{確認|かくにん}します。","learning":{"audience":"customer","function":"Continue the constructed exchange","mode":"active"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["job-listing"]},"explanations":"C","facts":[],"language":"C"},"role":"staff","th":"ขอเช็กกับผู้ดูแลเรื่องนี้ก่อนค่ะว่าเอกสารนี้ใช้กับคำขอของคุณได้ไหม"},{"en":"This explanation is difficult too. Where should I write my name?","id":"contract-language-support-09","jp":"この{説明|せつめい}も{難|むずか}しいです。どこに{名前|なまえ}を{書|か}けばいいですか。","learning":{"audience":"learner","function":"Continue the constructed exchange","mode":"recognize"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["job-listing"]},"explanations":"C","facts":[],"language":"C"},"role":"customer","th":"คำอธิบายตรงนี้ก็ยาก ต้องเขียนชื่อตรงไหน"},{"en":"Before you sign, let’s check the content together. May I add an explanation in Thai?","id":"contract-language-support-10","jp":"ご{署名|しょめい}の{前|まえ}に、{内容|ないよう}を{一緒|いっしょ}に{確認|かくにん}しましょう。タイ{語|ご}で{説明|せつめい}を{補足|ほそく}してもよろしいでしょうか。","learning":{"audience":"customer","function":"Continue the constructed exchange","mode":"active"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["job-listing"]},"explanations":"C","facts":[],"language":"C"},"role":"staff","th":"ก่อนลงลายมือชื่อ มาตรวจสอบเนื้อหาด้วยกันก่อนค่ะ ขออธิบายเสริมเป็นภาษาไทยได้ไหมคะ"},{"en":"Yes. In particular, I want to know how much I’ll pay each month and what happens when I cancel.","id":"contract-language-support-11","jp":"はい。{特|とく}に、{毎月|まいつき}{払|はら}う{金額|きんがく}と、やめるときのことを{知|し}りたいです。","learning":{"audience":"learner","function":"Continue the constructed exchange","mode":"recognize"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["job-listing"]},"explanations":"C","facts":[],"language":"C"},"role":"customer","th":"ได้ อยากรู้โดยเฉพาะว่าต้องจ่ายเดือนละเท่าไร และถ้าจะยกเลิกต้องทำอย่างไร"},{"en":"Understood. I’ll verify and explain the charges and cancellation conditions. Please tell me whenever anything is unclear.","id":"contract-language-support-12","jp":"{承知|しょうち}いたしました。{料金|りょうきん}と{解約|かいやく}の{条件|じょうけん}を{確認|かくにん}してご{説明|せつめい}いたします。{分|わ}かりにくい{点|てん}があれば、いつでもおっしゃってください。","learning":{"audience":"customer","function":"Continue the constructed exchange","mode":"active"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["job-listing"]},"explanations":"C","facts":[],"language":"C"},"role":"staff","th":"รับทราบค่ะ จะตรวจสอบและอธิบายค่าใช้จ่ายกับเงื่อนไขการยกเลิกค่ะ หากมีส่วนไหนไม่เข้าใจ บอกได้ตลอดเลยค่ะ"}]},{"boundary":"Reference for the specialist role. The team agrees to revise and review a draft; the draft is not approved for customers yet.","boundaryTh":"บทอ้างอิงสำหรับงานเฉพาะทาง ทีมตกลงแก้และตรวจร่าง ยังไม่ได้อนุมัติให้ใช้กับลูกค้า","context":"A fictional team discussion grounded in the revised role: inquiry analysis, multilingual FAQ improvement, and coordination with stores and head office. Its observations are practice examples, not company findings.","contextTh":"บทสนทนาทีมสมมติจากหน้าที่งานฉบับแก้ไข ได้แก่ วิเคราะห์คำถาม ปรับปรุง FAQ หลายภาษา และประสานร้านกับสำนักงานใหญ่ ข้อสังเกตในบทฝึกไม่ใช่ผลวิเคราะห์จริงของบริษัท","goal":"Report a tentative pattern, accept wording feedback, and suggest a limited improvement with review.","goalTh":"รายงานแนวโน้มเบื้องต้น รับข้อเสนอแนะด้านถ้อยคำ และเสนอการปรับปรุงขอบเขตเล็กพร้อมขอให้ตรวจสอบ","id":"coworker-faq-data","learning":{"audience":"coworker","function":"Follow a partial encounter","mode":"reference"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["revised-role"]},"explanations":"C","facts":[],"language":"C"},"takeaway":"The revised role links counter observations to analysis, translation, and improvement. Report evidence limits, preserve conditions in translation, and propose a review step without inventing an approval policy.","takeawayTh":"หน้าที่ฉบับแก้ไขเชื่อมสิ่งที่พบหน้าร้านกับการวิเคราะห์ การแปล และการปรับปรุง ระบุข้อจำกัดของข้อมูล รักษาเงื่อนไขให้ครบในคำแปล และเสนอขั้นตอนตรวจสอบโดยไม่สมมติระเบียบอนุมัติของบริษัท","title":"With a coworker: improve a Thai FAQ","titleTh":"คุยกับเพื่อนร่วมงาน: ปรับปรุง FAQ ภาษาไทย","turns":[{"en":"Hello. May I ask for your advice on the Thai FAQ draft?","id":"coworker-faq-data-01","jp":"お{疲|つか}れさまです。タイ{語|ご}の{FAQ|エフエーキュー}{案|あん}について、ご{相談|そうだん}してもよろしいですか。","learning":{"audience":"coworker","function":"Continue the constructed exchange","mode":"reference"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["revised-role"]},"explanations":"C","facts":[],"language":"C"},"role":"staff","th":"สวัสดีค่ะ ขอปรึกษาเรื่องร่าง FAQ ภาษาไทยได้ไหมคะ"},{"en":"Of course. What kinds of inquiries did you base it on?","id":"coworker-faq-data-02","jp":"はい。どんな{問|と}い{合|あ}わせをもとに{作|つく}りましたか。","learning":{"audience":"learner","function":"Continue the constructed exchange","mode":"reference"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["revised-role"]},"explanations":"C","facts":[],"language":"C"},"role":"coworker","th":"ได้สิ ใช้คำถามแบบไหนเป็นข้อมูลในการทำร่าง"},{"en":"In the records I checked this time, questions about the bill breakdown stood out. However, there are too few cases to call it a clear trend yet.","id":"coworker-faq-data-03","jp":"{今回|こんかい}{確認|かくにん}した{記録|きろく}では、{料金|りょうきん}の{内訳|うちわけ}に{関|かん}する{質問|しつもん}が{目立|めだ}ちました。ただ、{件数|けんすう}が{少|すく}ないため、まだ{傾向|けいこう}とは{言|い}い{切|き}れません。","learning":{"audience":"coworker","function":"Continue the constructed exchange","mode":"reference"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["revised-role"]},"explanations":"C","facts":[],"language":"C"},"role":"staff","th":"ในบันทึกที่ตรวจสอบครั้งนี้ พบคำถามเรื่องรายละเอียดค่าใช้จ่ายค่อนข้างเด่นค่ะ แต่จำนวนกรณียังน้อย จึงยังสรุปว่าเป็นแนวโน้มไม่ได้ค่ะ"},{"en":"That’s a good approach. When grouping by language, let’s avoid assuming the language someone uses based only on nationality.","id":"coworker-faq-data-04","jp":"いいですね。{言語別|げんごべつ}に{整理|せいり}するときも、{国籍|こくせき}だけで{使|つか}う{言語|げんご}を{決|き}めつけないようにしましょう。","learning":{"audience":"learner","function":"Continue the constructed exchange","mode":"reference"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["revised-role"]},"explanations":"C","facts":[],"language":"C"},"role":"coworker","th":"ดีแล้ว เวลาจัดกลุ่มตามภาษา ก็อย่าสรุปภาษาที่ใช้จากสัญชาติอย่างเดียว"},{"en":"Understood. I’ll check the language used for support in the records and mark unknown cases as unknown.","id":"coworker-faq-data-05","jp":"{承知|しょうち}しました。{記録|きろく}にある{対応言語|たいおうげんご}を{確認|かくにん}し、{不明|ふめい}なものは{不明|ふめい}として{整理|せいり}します。","learning":{"audience":"coworker","function":"Continue the constructed exchange","mode":"reference"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["revised-role"]},"explanations":"C","facts":[],"language":"C"},"role":"staff","th":"รับทราบค่ะ จะตรวจสอบภาษาที่ใช้ให้บริการตามบันทึก และกรณีที่ไม่ทราบจะระบุว่าไม่ทราบค่ะ"},{"en":"Could this translation be read as saying “it will definitely be cheaper”? We should revise it so the conditions come across.","id":"coworker-faq-data-06","jp":"この{訳|やく}だと、「{必|かなら}ず{安|やす}くなる」という{意味|いみ}に{読|よ}めませんか。{条件|じょうけん}が{伝|つた}わるように{直|なお}したいですね。","learning":{"audience":"learner","function":"Continue the constructed exchange","mode":"reference"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["revised-role"]},"explanations":"C","facts":[],"language":"C"},"role":"coworker","th":"คำแปลตรงนี้อาจอ่านแล้วเข้าใจว่า “จะถูกลงแน่นอน” หรือเปล่า อยากปรับให้สื่อเงื่อนไขได้ชัดเจน"},{"en":"Yes, it could be read that way. I’ll check the original Japanese again and revise it so no conditions are left out.","id":"coworker-faq-data-07","jp":"{確|たし}かに、そのように{読|よ}めます。{元|もと}の{日本語|にほんご}をもう{一度|いちど}{確認|かくにん}し、{条件|じょうけん}が{抜|ぬ}けないように{修正|しゅうせい}します。","learning":{"audience":"coworker","function":"Continue the constructed exchange","mode":"reference"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["revised-role"]},"explanations":"C","facts":[],"language":"C"},"role":"staff","th":"จริงค่ะ อ่านแล้วอาจเข้าใจแบบนั้นได้ จะตรวจต้นฉบับภาษาญี่ปุ่นอีกครั้งและแก้ไขไม่ให้เงื่อนไขตกหล่นค่ะ"},{"en":"Along with translating the words, think about where a customer might get confused.","id":"coworker-faq-data-08","jp":"{直訳|ちょくやく}だけでなく、お{客様|きゃくさま}がどこで{迷|まよ}うかも{考|かんが}えてみてください。","learning":{"audience":"learner","function":"Continue the constructed exchange","mode":"reference"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["revised-role"]},"explanations":"C","facts":[],"language":"C"},"role":"coworker","th":"นอกจากแปลตามตัวอักษรแล้ว ลองคิดด้วยว่าลูกค้าน่าจะสับสนตรงไหน"},{"en":"How about explaining the bill breakdown first, then moving on to checking the conditions?","id":"coworker-faq-data-09","jp":"では、{最初|さいしょ}に{請求|せいきゅう}の{内訳|うちわけ}を{説明|せつめい}し、その{後|あと}に{条件|じょうけん}を{確認|かくにん}する{流|なが}れはどうでしょうか。","learning":{"audience":"coworker","function":"Continue the constructed exchange","mode":"reference"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["revised-role"]},"explanations":"C","facts":[],"language":"C"},"role":"staff","th":"ถ้าเริ่มจากอธิบายรายละเอียดค่าใช้จ่าย แล้วค่อยตรวจสอบเงื่อนไขตามลำดับนี้ ดีไหมคะ"},{"en":"Let’s draft it that way. Before using it with customers, let’s also discuss who should review the content.","id":"coworker-faq-data-10","jp":"その{案|あん}で{作|つく}ってみましょう。お{客様|きゃくさま}に{使|つか}う{前|まえ}に、{内容|ないよう}の{確認|かくにん}を{誰|だれ}にお{願|ねが}いするかも{相談|そうだん}しましょう。","learning":{"audience":"learner","function":"Continue the constructed exchange","mode":"reference"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["revised-role"]},"explanations":"C","facts":[],"language":"C"},"role":"coworker","th":"ลองทำร่างตามแนวนั้นกัน ก่อนนำไปใช้กับลูกค้า มาคุยกันด้วยว่าจะให้ใครตรวจสอบเนื้อหา"},{"en":"Yes. I’ll put together the revised draft and the points that need review. I’ll also check whether to consult the store or head office.","id":"coworker-faq-data-11","jp":"はい。{修正案|しゅうせいあん}と、{確認|かくにん}していただきたい{点|てん}をまとめます。{店舗|てんぽ}と{本部|ほんぶ}のどちらに{相談|そうだん}するかも{確認|かくにん}します。","learning":{"audience":"coworker","function":"Continue the constructed exchange","mode":"reference"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["revised-role"]},"explanations":"C","facts":[],"language":"C"},"role":"staff","th":"ค่ะ จะรวบรวมร่างแก้ไขกับจุดที่ต้องการให้ตรวจสอบ และเช็กด้วยว่าควรปรึกษาทางร้านหรือสำนักงานใหญ่ค่ะ"},{"en":"Thank you. Once we start using it, let’s see whether repeat questions decrease and use that to improve it further.","id":"coworker-faq-data-12","jp":"お{願|ねが}いします。{使|つか}い{始|はじ}めたら、{同|おな}じ{質問|しつもん}が{減|へ}ったかも{見|み}て、また{改善|かいぜん}しましょう。","learning":{"audience":"learner","function":"Continue the constructed exchange","mode":"reference"},"provenance":{"basis":{"category":"B","scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material.","sourceIds":["revised-role"]},"explanations":"C","facts":[],"language":"C"},"role":"coworker","th":"ฝากด้วยนะ หลังเริ่มใช้แล้ว ลองดูว่าคำถามซ้ำลดลงหรือไม่ แล้วค่อยปรับปรุงต่อกัน"}]},{"boundary":"The fictional procedure is confirmed complete after processing. In real work, say the final line only after verifying the actual status.","boundaryTh":"ในบทสมมติตรวจแล้วว่างานเสร็จหลังดำเนินการ งานจริงใช้ประโยคสุดท้ายได้เมื่อยืนยันสถานะแล้วเท่านั้น","context":"Both methods and the result are hypothetical. Practise returning from a check, explaining the available alternative and confirming the completed task; this does not specify a docomo procedure.","contextTh":"วิธีและผลลัพธ์เป็นสถานการณ์สมมติ ฝึกกลับมาแจ้งผล เสนอทางเลือก และยืนยันงานที่เสร็จ ไม่ได้กำหนดขั้นตอนของ docomo","goal":"Give a checked answer or a clear next action; distinguish facts, unknowns and who takes over.","goalTh":"แจ้งผลที่ตรวจแล้วหรือขั้นตอนต่อไปให้ชัด แยกสิ่งที่รู้ สิ่งที่ยังไม่รู้ และใครรับช่วง","id":"checked-method-result","introduced":"1.1","learning":{"audience":"customer","function":"Complete a result / exception / handoff chain","mode":"active"},"provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"takeaway":"A check needs a return: state the result, explain the limit or requirement, and agree what happens next.","takeawayTh":"ตรวจแล้วต้องกลับมาแจ้งผล อธิบายข้อจำกัดหรือสิ่งที่ต้องใช้ และตกลงว่าจะทำอะไรต่อ","title":"After checking: choose an available method","titleTh":"ตรวจแล้ว: เลือกวิธีที่ใช้ได้","turns":[{"en":"Can I use this method?","id":"checked-method-result-01","jp":"この{方法|ほうほう}で{手続|てつづ}きできますか。","learning":{"audience":"learner","function":"Continue the constructed exchange","mode":"recognize"},"provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"role":"customer","th":"ดำเนินการด้วยวิธีนี้ได้ไหม"},{"cat":"rescue","en":"I'll check so I can give you accurate information. Could you wait a moment?","essential":true,"id":"checked-method-result-02","jp":"{正確|せいかく}にご{案内|あんない}するため、{確認|かくにん}してまいります。{少々|しょうしょう}お{待|ま}ちいただけますか。","learning":{"audience":"customer","function":"Explain a check and wait","mode":"active"},"note":"Use when you will go and check with a colleague or another source, then return. Do not invent an answer.","noteTh":"ใช้เมื่อจะไปตรวจสอบกับเพื่อนร่วมงานหรือแหล่งข้อมูล แล้วกลับมาแจ้งลูกค้าค่ะ","provenance":{"basis":{"category":"C","scope":"General workplace-Japanese teaching; no employer-specific claim.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"role":"staff","sharedId":"r06","th":"ขอตรวจสอบเพื่อให้ข้อมูลที่ถูกต้องค่ะ รอสักครู่ได้ไหมคะ"},{"cat":"contract","en":"After checking, we cannot proceed using this method.","essential":false,"id":"checked-method-result-03","introduced":"1.1","jp":"{確認|かくにん}したところ、この{方法|ほうほう}ではお{手続|てつづ}きできません。","learning":{"audience":"customer","function":"Method not available","mode":"active"},"note":"A confirmed negative result, not an unknown answer. Follow with the verified reason or an available alternative.","noteTh":"ใช้เมื่อยืนยันแล้วว่าทำด้วยวิธีนี้ไม่ได้ ไม่ใช่เมื่อยังไม่รู้คำตอบ บอกเหตุผลที่ตรวจแล้วหรือทางเลือกต่อ","provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"role":"staff","sharedId":"p090","th":"ตรวจสอบแล้ว ไม่สามารถดำเนินการด้วยวิธีนี้ได้ค่ะ"},{"en":"Is there another way?","id":"checked-method-result-04","jp":"ほかの{方法|ほうほう}はありますか。","learning":{"audience":"learner","function":"Continue the constructed exchange","mode":"recognize"},"provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"role":"customer","th":"มีวิธีอื่นไหม"},{"cat":"contract","en":"We can help using this alternative. Would you like to proceed this way?","essential":false,"id":"checked-method-result-05","introduced":"1.1","jp":"こちらの{方法|ほうほう}なら{対応|たいおう}できます。こちらで{進|すす}めますか。","learning":{"audience":"customer","function":"Offer an available alternative","mode":"active"},"note":"Only after checking the alternative and explaining any differences, costs or conditions. なら limits the statement to this method.","noteTh":"ตรวจทางเลือกก่อน และอธิบายความต่าง ค่าใช้จ่ายหรือเงื่อนไขที่เกี่ยวข้อง なら จำกัดความหมายว่าเป็นวิธีนี้","provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"role":"staff","sharedId":"p093","th":"ถ้าเป็นวิธีนี้ ดำเนินการได้ค่ะ ต้องการใช้วิธีนี้ไหมคะ"},{"en":"Then please use that one.","id":"checked-method-result-06","jp":"では、そちらでお{願|ねが}いします。","learning":{"audience":"learner","function":"Continue the constructed exchange","mode":"recognize"},"provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"role":"customer","th":"ถ้าอย่างนั้น ใช้วิธีนั้นเลย"},{"cat":"contract","en":"Next, please check these details.","essential":false,"id":"checked-method-result-07","introduced":"1.1","jp":"{次|つぎ}に、こちらの{内容|ないよう}をご{確認|かくにん}ください。","learning":{"audience":"customer","function":"Give the next customer action","mode":"active"},"note":"Point to the actual details. 次に is a simple transition, not a cushion that needs another apology.","noteTh":"ชี้รายละเอียดที่ต้องตรวจจริง 次に ใช้เปลี่ยนไปขั้นตอนถัดไป ไม่ต้องเติมคำขอโทษ","provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"role":"staff","sharedId":"p094","th":"ต่อไป รบกวนตรวจรายละเอียดตรงนี้ค่ะ"},{"en":"Yes, the details are correct.","id":"checked-method-result-08","jp":"はい、{内容|ないよう}は{合|あ}っています。","learning":{"audience":"learner","function":"Continue the constructed exchange","mode":"recognize"},"provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"role":"customer","th":"ใช่ รายละเอียดถูกต้อง"},{"en":"Then I will proceed.","id":"checked-method-result-09","jp":"では、お{手続|てつづ}きを{進|すす}めます。","learning":{"audience":"customer","function":"Continue the constructed exchange","mode":"active"},"provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"role":"staff","th":"ถ้าอย่างนั้น จะดำเนินการต่อค่ะ"},{"cat":"contract","en":"I have confirmed it. This procedure is complete.","essential":false,"id":"checked-method-result-10","introduced":"1.1","jp":"{確認|かくにん}できました。こちらのお{手続|てつづ}きは{完了|かんりょう}しています。","learning":{"audience":"customer","function":"Report verified completion","mode":"active"},"note":"Only after confirming the actual completion status. Name or point to the completed task; do not include pending work or a future activation.","noteTh":"ใช้หลังตรวจสถานะว่าเสร็จจริง ระบุงานที่เสร็จ ไม่รวมงานค้างหรือการเปิดใช้งานในอนาคต","provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"role":"staff","sharedId":"p095","th":"ตรวจสอบแล้วค่ะ ขั้นตอนนี้เสร็จเรียบร้อยแล้วค่ะ"}]},{"boundary":"The next action is understood; the transaction remains incomplete. Having a document later does not itself guarantee approval.","boundaryTh":"ลูกค้าเข้าใจสิ่งที่ต้องเตรียม แต่งานยังไม่เสร็จ การมีเอกสารภายหลังไม่ได้รับประกันว่าจะอนุมัติ","context":"In this fictional case, the checked list requires a document the customer does not have. No document type, eligibility rule or return appointment is invented.","contextTh":"กรณีสมมตินี้ตรวจรายการแล้วว่าต้องใช้เอกสารที่ลูกค้าไม่ได้เตรียมมา ไม่ได้ระบุชนิดเอกสาร กฎสิทธิ์ หรือการนัดหมาย","goal":"Give a checked answer or a clear next action; distinguish facts, unknowns and who takes over.","goalTh":"แจ้งผลที่ตรวจแล้วหรือขั้นตอนต่อไปให้ชัด แยกสิ่งที่รู้ สิ่งที่ยังไม่รู้ และใครรับช่วง","id":"missing-document-next-action","introduced":"1.1","learning":{"audience":"customer","function":"Complete a result / exception / handoff chain","mode":"active"},"provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"takeaway":"A check needs a return: state the result, explain the limit or requirement, and agree what happens next.","takeawayTh":"ตรวจแล้วต้องกลับมาแจ้งผล อธิบายข้อจำกัดหรือสิ่งที่ต้องใช้ และตกลงว่าจะทำอะไรต่อ","title":"Missing document: a clear next action","titleTh":"เอกสารไม่ครบ: บอกสิ่งที่ต้องทำต่อ","turns":[{"en":"I would like to do the procedure today.","id":"missing-document-next-action-01","jp":"{今日|きょう}、{手続|てつづ}きしたいです。","learning":{"audience":"learner","function":"Continue the constructed exchange","mode":"recognize"},"provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"role":"customer","th":"อยากดำเนินการวันนี้"},{"cat":"contract","en":"I'll check which documents are needed for this procedure.","essential":true,"id":"missing-document-next-action-02","jp":"お{手続|てつづ}きに{必要|ひつよう}な{書類|しょるい}を{確認|かくにん}いたします。","learning":{"audience":"customer","function":"Check required documents","mode":"active"},"note":"Check the actual procedure before naming required documents.","noteTh":"ตรวจสอบขั้นตอนจริงก่อนแจ้งว่าเอกสารใดจำเป็นค่ะ","provenance":{"basis":{"category":"B","scope":"The document supplies work context only. This sentence, its frequency/priority judgment and any scenario are authored teaching material.","sourceIds":["job-listing"]},"explanations":"C","facts":[],"language":"C"},"role":"staff","sharedId":"p023","th":"ขอตรวจสอบว่าการทำรายการนี้ต้องใช้เอกสารอะไรบ้างค่ะ"},{"cat":"contract","en":"A required document is missing, so we cannot proceed yet.","essential":false,"id":"missing-document-next-action-03","introduced":"1.1","jp":"{必要|ひつよう}な{書類|しょるい}が{足|た}りないので、{今|いま}はお{手続|てつづ}きを{進|すす}められません。","learning":{"audience":"customer","function":"Missing required document","mode":"active"},"note":"Only after checking the actual requirements. Show exactly what is missing and the permitted next action.","noteTh":"ใช้หลังตรวจข้อกำหนดจริงแล้ว ระบุเอกสารที่ขาดและสิ่งที่ลูกค้าทำต่อได้","provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"role":"staff","sharedId":"p104","th":"เอกสารที่ต้องใช้ยังไม่ครบ จึงยังดำเนินการต่อไม่ได้ค่ะ"},{"en":"What is missing?","id":"missing-document-next-action-04","jp":"{何|なに}が{足|た}りませんか。","learning":{"audience":"learner","function":"Continue the constructed exchange","mode":"recognize"},"provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"role":"customer","th":"ขาดอะไร"},{"cat":"contract","en":"This procedure requires the document shown here.","essential":false,"id":"missing-document-next-action-05","introduced":"1.1","jp":"このお{手続|てつづ}きには、こちらの{書類|しょるい}が{必要|ひつよう}です。","learning":{"audience":"customer","function":"Explain a checked requirement","mode":"active"},"note":"Point to the specific document on the checked list. No document type or docomo requirement is supplied by this example.","noteTh":"ชี้เอกสารที่ต้องใช้จากรายการที่ตรวจแล้ว ตัวอย่างนี้ไม่ได้กำหนดว่าต้องเป็นเอกสารชนิดใดหรือเป็นกฎของ docomo","provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"role":"staff","sharedId":"p091","th":"ขั้นตอนนี้ต้องใช้เอกสารที่แสดงตรงนี้ค่ะ"},{"en":"I do not have that with me today.","id":"missing-document-next-action-06","jp":"それは{今日|きょう}{持|も}っていません。","learning":{"audience":"learner","function":"Continue the constructed exchange","mode":"recognize"},"provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"role":"customer","th":"วันนี้ไม่ได้เอามา"},{"cat":"contract","en":"We cannot complete the procedure now. Please speak with us again once you have the required items.","essential":false,"id":"missing-document-next-action-07","introduced":"1.1","jp":"{今|いま}はお{手続|てつづ}きを{完了|かんりょう}できません。{必要|ひつよう}なものがそろいましたら、{改|あらた}めてご{相談|そうだん}ください。","learning":{"audience":"customer","function":"Cannot finish now; explain the return point","mode":"active"},"note":"After identifying the missing items and confirming this is the appropriate next action. This does not promise approval or completion on the next visit.","noteTh":"ใช้หลังระบุสิ่งที่ขาดและตรวจแล้วว่าควรทำต่อแบบนี้ ไม่ได้รับปากว่ามาครั้งหน้าจะอนุมัติหรือเสร็จแน่นอน","provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"role":"staff","sharedId":"p109","th":"ตอนนี้ยังดำเนินการให้เสร็จไม่ได้ค่ะ เมื่อเตรียมสิ่งที่ต้องใช้ครบแล้ว รบกวนติดต่อมาใหม่นะคะ"},{"en":"So I should prepare this document, right?","id":"missing-document-next-action-08","jp":"これを{用意|ようい}すればいいんですね。","learning":{"audience":"learner","function":"Continue the constructed exchange","mode":"recognize"},"provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"role":"customer","th":"ต้องเตรียมเอกสารนี้ใช่ไหม"},{"en":"Yes. Please check this list.","id":"missing-document-next-action-09","jp":"はい。こちらのリストをご{確認|かくにん}ください。","learning":{"audience":"customer","function":"Continue the constructed exchange","mode":"active"},"provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"role":"staff","th":"ค่ะ รบกวนตรวจรายการนี้ด้วยนะคะ"},{"en":"Understood. I will prepare it.","id":"missing-document-next-action-10","jp":"{分|わ}かりました。{用意|ようい}します。","learning":{"audience":"learner","function":"Continue the constructed exchange","mode":"recognize"},"provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"role":"customer","th":"เข้าใจแล้ว จะเตรียมมา"}]},{"boundary":"The colleague has accepted the case and is coming. The charge is still being investigated; the handoff is the outcome, not a resolved bill.","boundaryTh":"เพื่อนร่วมงานตกลงรับช่วงและกำลังมา ยังตรวจค่าบริการอยู่ ผลลัพธ์ของบทนี้คือส่งต่อได้ ไม่ใช่แก้บิลเสร็จ","context":"A fictional disputed charge. Staff have checked the bill but not the application record. The team takes over further investigation; no refund or billing error is assumed.","contextTh":"ลูกค้าโต้แย้งยอดในสถานการณ์สมมติ ตรวจบิลแล้วแต่ยังไม่ได้ตรวจประวัติการสมัคร ทีมรับช่วงตรวจต่อ ยังไม่สรุปว่าบิลผิดหรือคืนเงินได้","goal":"Give a checked answer or a clear next action; distinguish facts, unknowns and who takes over.","goalTh":"แจ้งผลที่ตรวจแล้วหรือขั้นตอนต่อไปให้ชัด แยกสิ่งที่รู้ สิ่งที่ยังไม่รู้ และใครรับช่วง","id":"billing-team-handoff","introduced":"1.1","learning":{"audience":"customer","function":"Complete a result / exception / handoff chain","mode":"active"},"provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"takeaway":"A check needs a return: state the result, explain the limit or requirement, and agree what happens next.","takeawayTh":"ตรวจแล้วต้องกลับมาแจ้งผล อธิบายข้อจำกัดหรือสิ่งที่ต้องใช้ และตกลงว่าจะทำอะไรต่อ","title":"Billing uncertainty: brief the team and hand over","titleTh":"ไม่แน่ใจเรื่องบิล: สรุปให้ทีมและส่งต่อ","turns":[{"cat":"billing","en":"This is different from the amount I was told.","essential":false,"id":"billing-team-handoff-01","jp":"{説明|せつめい}された{金額|きんがく}と{違|ちが}うんですけど。","learning":{"audience":"learner","function":"Dispute a quoted amount","mode":"recognize"},"provenance":{"basis":{"category":"B","scope":"The document supplies work context only. This sentence, its frequency/priority judgment and any scenario are authored teaching material.","sourceIds":["job-listing"]},"explanations":"C","facts":[],"language":"C"},"role":"customer","sharedId":"p042","th":"ยอดนี้ไม่ตรงกับที่เคยอธิบายไว้นะคะ"},{"cat":"rescue","en":"I'll check so I can give you accurate information. Could you wait a moment?","essential":true,"id":"billing-team-handoff-02","jp":"{正確|せいかく}にご{案内|あんない}するため、{確認|かくにん}してまいります。{少々|しょうしょう}お{待|ま}ちいただけますか。","learning":{"audience":"customer","function":"Explain a check and wait","mode":"active"},"note":"Use when you will go and check with a colleague or another source, then return. Do not invent an answer.","noteTh":"ใช้เมื่อจะไปตรวจสอบกับเพื่อนร่วมงานหรือแหล่งข้อมูล แล้วกลับมาแจ้งลูกค้าค่ะ","provenance":{"basis":{"category":"C","scope":"General workplace-Japanese teaching; no employer-specific claim.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"role":"staff","sharedId":"r06","th":"ขอตรวจสอบเพื่อให้ข้อมูลที่ถูกต้องค่ะ รอสักครู่ได้ไหมคะ"},{"cat":"coworkers","en":"This is a billing question. The customer says the amount differs from what was explained.","essential":false,"id":"billing-team-handoff-03","introduced":"1.1","jp":"{料金|りょうきん}についてのご{相談|そうだん}です。{説明|せつめい}された{金額|きんがく}と{違|ちが}うとのことです。","learning":{"audience":"coworker","function":"Brief the customer situation","mode":"active"},"note":"To a colleague: report the customer’s claim, not a confirmed billing error. とのことです marks reported information.","noteTh":"บอกเพื่อนร่วมงานว่านี่คือสิ่งที่ลูกค้าแจ้ง ยังไม่ได้ยืนยันว่าบิลผิด とのことです ใช้รายงานคำพูดอีกฝ่าย","provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"role":"staff","sharedId":"p096","th":"ลูกค้ามาปรึกษาเรื่องค่าบริการค่ะ บอกว่ายอดไม่ตรงกับที่อธิบายไว้"},{"cat":"coworkers","en":"I checked the billing details. I have not checked the application record yet.","essential":false,"id":"billing-team-handoff-04","introduced":"1.1","jp":"{請求内容|せいきゅうないよう}は{確認|かくにん}しました。{申込記録|もうしこみきろく}はまだです。","learning":{"audience":"coworker","function":"Say what is checked and pending","mode":"active"},"note":"Internal shorthand: はまだです refers to the checking just mentioned. Use only for work actually done.","noteTh":"รูปย่อที่ใช้ในทีม はまだです หมายถึงยังไม่ได้ตรวจตามประโยคก่อนหน้า แจ้งเฉพาะงานที่ทำแล้วจริง","provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"role":"staff","sharedId":"p097","th":"ตรวจรายละเอียดบิลแล้วค่ะ แต่ยังไม่ได้ตรวจประวัติการสมัคร"},{"cat":"coworkers","en":"I do not understand why this charge applies. Could you check it with me?","essential":false,"id":"billing-team-handoff-05","introduced":"1.1","jp":"この{料金|りょうきん}がかかる{理由|りゆう}が{分|わ}かりません。{一緒|いっしょ}に{確認|かくにん}してもらえますか。","learning":{"audience":"coworker","function":"Name uncertainty and ask for help","mode":"active"},"note":"To a coworker; state the specific unknown. もらえますか is ordinary polite team language.","noteTh":"พูดกับเพื่อนร่วมงานและระบุจุดที่ไม่แน่ใจ もらえますか เป็นคำขอสุภาพทั่วไปในทีม","provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"role":"staff","sharedId":"p098","th":"ยังไม่เข้าใจว่าทำไมถึงมีค่าบริการนี้ค่ะ ช่วยตรวจด้วยกันได้ไหมคะ"},{"cat":"coworkers","en":"Check the application record first.","essential":false,"id":"billing-team-handoff-06","introduced":"1.1","jp":"{先|さき}に{申込記録|もうしこみきろく}を{確認|かくにん}してください。","learning":{"audience":"learner","function":"Hear a next-step instruction","mode":"recognize"},"note":"Coworker instruction in this constructed billing case. 先に tells you the priority; access and system steps still come from training.","noteTh":"คำสั่งจากเพื่อนร่วมงานในกรณีบิลสมมตินี้ 先に บอกว่าต้องทำก่อน ส่วนสิทธิ์เข้าถึงและวิธีใช้ระบบให้ยึดที่ฝึกงาน","provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"role":"coworker","sharedId":"p102","th":"ตรวจประวัติการสมัครก่อนนะ"},{"en":"Thank you. I will check.","id":"billing-team-handoff-07","jp":"ありがとうございます。{確認|かくにん}します。","learning":{"audience":"coworker","function":"Continue the constructed exchange","mode":"active"},"provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"role":"staff","th":"ขอบคุณค่ะ จะตรวจสอบค่ะ"},{"cat":"coworkers","en":"It is not confirmed yet. Tell the customer it is still being checked.","essential":false,"id":"billing-team-handoff-08","introduced":"1.1","jp":"まだ{確定|かくてい}していません。お{客様|きゃくさま}には、{確認中|かくにんちゅう}と{伝|つた}えてください。","learning":{"audience":"learner","function":"Hear that a result is not final","mode":"recognize"},"note":"Coworker to you. Do not turn an unfinished check into a yes/no answer to the customer.","noteTh":"เพื่อนร่วมงานพูดกับคุณ อย่านำเรื่องที่ยังตรวจไม่เสร็จไปตอบลูกค้าว่าได้หรือไม่ได้","provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"role":"coworker","sharedId":"p103","th":"ยังไม่ได้ข้อสรุป แจ้งลูกค้าว่ากำลังตรวจสอบอยู่นะ"},{"cat":"rescue","en":"There is one more point I need to check. Please wait a moment.","essential":false,"id":"billing-team-handoff-09","introduced":"1.1","jp":"もう{一点|いってん}、{確認|かくにん}が{必要|ひつよう}です。{少々|しょうしょう}お{待|ま}ちください。","learning":{"audience":"customer","function":"One more check is needed","mode":"active"},"note":"A specific extra check remains. If you do not know the waiting time, do not invent a duration.","noteTh":"ใช้เมื่อยังมีจุดที่ต้องตรวจเพิ่ม หากไม่รู้เวลารอ ไม่กำหนดเวลาเอง","provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"role":"staff","sharedId":"p106","th":"มีอีกจุดที่ต้องตรวจสอบค่ะ รอสักครู่นะคะ"},{"en":"Could someone familiar with this take over?","id":"billing-team-handoff-10","jp":"{詳|くわ}しい{人|ひと}に{代|か}わってもらえますか。","learning":{"audience":"learner","function":"Continue the constructed exchange","mode":"recognize"},"provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"role":"customer","th":"ให้คนที่ทราบเรื่องนี้รับช่วงแทนได้ไหม"},{"cat":"rescue","en":"May I hand this over to the colleague who handles it? I’ll pass on what you’ve told me.","essential":true,"id":"billing-team-handoff-11","jp":"{担当|たんとう}の{者|もの}に{引|ひ}き{継|つ}いでもよろしいでしょうか。お{話|はなし}の{内容|ないよう}はこちらから{伝|つた}えます。","learning":{"audience":"customer","function":"Arrange a handoff","mode":"active"},"note":"担当の者 is the colleague handling the matter, not necessarily a manager. Tell the customer about the handoff, then pass on the request and what is still unchecked.","noteTh":"担当の者 คือพนักงานที่ดูแลเรื่องนั้น ไม่จำเป็นต้องเป็นผู้จัดการ แจ้งลูกค้าก่อนส่งต่อ แล้วบอกผู้รับช่วงว่าลูกค้าต้องการอะไรและยังไม่ได้ตรวจอะไร","provenance":{"basis":{"category":"C","scope":"General workplace-Japanese teaching; no employer-specific claim.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"role":"staff","sharedId":"r10","th":"ขอส่งต่อให้ผู้รับผิดชอบดูแลได้ไหมคะ ดิฉันจะเล่าเรื่องที่คุณแจ้งมาให้เขาทราบค่ะ"},{"en":"Please do.","id":"billing-team-handoff-12","jp":"お{願|ねが}いします。","learning":{"audience":"learner","function":"Continue the constructed exchange","mode":"recognize"},"provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"role":"customer","th":"รบกวนด้วย"},{"cat":"coworkers","en":"Could you ta  It is not a promise to use while still looking for help.","noteTh":"ใช้เมื่อเพื่อนร่วมงานรับเรื่องและยืนยันว่าจะมาแล้ว ไม่ใช้ขณะที่ยังหาคนช่วยไม่ได้","provenance":{"basis":{"category":"C","scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"role":"staff","sharedId":"p108","th":"พนักงานที่ดูแลเรื่องนี้กำลังมาค่ะ รอสักครู่นะคะ"}]},{"boundary":"Handoff accepted. Installation, timing and price still need checking.","boundaryTh":"รับช่วงต่อแล้ว ยังต้องตรวจการติดตั้ง เวลา และราคา","context":"Practice at the fixed-line leaflet. After checking the address, explain coverage and pass the remaining questions to a colleague.","contextTh":"ฝึกดูใบปลิวเน็ตบ้านแบบมีสาย ตรวจที่อยู่แล้วแจ้งผลพื้นที่ และส่งคำถามที่ยังค้างให้เพื่อนร่วมงาน","goal":"Explain the speed limit and arrange a clear handoff.","goalTh":"อธิบายเรื่องความเร็ว แล้วส่งต่อให้ชัด","id":"home-internet-handoff","introduced":"1.2","learning":{"audience":"customer","function":"Checked coverage result, speed clarification and accepted handoff","mode":"active"},"provenance":{"basis":{"category":"B","scope":"Original communication pattern. Source motivates the topic, not an official script or an individual customer result.","sourceIds":["photo-new-71","photo-new-73"]},"explanations":"C","facts":[],"language":"C"},"takeaway":"Coverage, actual speed and installation are separate questions. Learn the short customer answer and the different team handoff.","takeawayTh":"พื้นที่บริการ ความเร็วจริง และการติดตั้งเป็นคนละเรื่อง ฝึกทั้งคำตอบสั้นให้ลูกค้าและการส่งต่อแบบคุยกับทีม","title":"Home internet: “Will I always get that speed?”","titleTh":"เน็ตบ้าน: “จะเร็วเท่านี้ตลอดเลยไหม?”","trainingPremise":"A fictional first consultation while looking together at a fixed-line home-internet leaflet. Training premise: the full address is supplied privately and a coverage check ":"Counter vocabulary: stock on hand","mode":"active"},"note":"在庫があります / ございません. Check before you say it; do not guess.","noteTh":"在庫があります / ございません ต้องเช็กก่อนพูด อย่าเดา","provenance":{"basis":{"category":"B","scope":"Counter relevance, grouping and learning priority are teaching judgments.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"th":"สต็อกสินค้า","use":"say"},{"cat":"counter","en":"opening hours","id":"v014","jp":"{営業時間|えいぎょうじかん}","learning":{"audience":"customer","function":"Counter vocabulary: opening hours","mode":"active"},"note":"The hours the shop is open. 受付時間 can be shorter than 営業時間 for some procedures.","noteTh":"เวลาที่ร้านเปิด บางขั้นตอนมี 受付時間 สั้นกว่าเวลาทำการ","provenance":{"basis":{"category":"B","scope":"Counter relevance, grouping and learning priority are teaching judgments.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"th":"เวลาทำการ","use":"say"},{"cat":"counter","en":"hours during which a request is accepted","id":"v015","jp":"{受付時間|うけつけじかん}","learning":{"audience":"customer","function":"Counter vocabulary: hours during which a request is accepted","mode":"active"},"note":"The cut-off for starting a procedure. Often earlier than closing time.","noteTh":"เวลาปิดรับเรื่อง มักเร็วกว่าเวลาปิดร้าน","provenance":{"basis":{"category":"B","scope":"Counter relevance, grouping and learning priority are teaching judgments.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"th":"เวลารับเรื่อง","use":"say"},{"cat":"counter","en":"service desk; the place that handles it","id":"v016","jp":"{窓口|まどぐち}","learning":{"audience":"learner","function":"Counter vocabulary: service desk; the place that handles it","mode":"recognize"},"note":"Also used abstractly: the department that handles a case.","noteTh":"ใช้ในความหมายกว้างได้ด้วย คือแผนกที่ดูแลเรื่องนั้น","provenance":{"basis":{"category":"B","scope":"Counter relevance, grouping and learning priority are teaching judgments.","sourceIds":[]},"explanations":" ority are teaching judgments.","sourceIds":["photo-cat-05"]},"explanations":"C","facts":[{"category":"A","scope":"The headword occurs in the named source. Its definition, its counter note and any example sentence are authored.","sourceIds":["photo-cat-05"]}],"language":"C"},"src":["photo-cat-05"],"th":"เครื่องเสีย","use":"hear"},{"cat":"trouble","en":"a fault; something not behaving correctly","id":"v172","jp":"{不具合|ふぐあい}","learning":{"audience":"customer","function":"Counter vocabulary: a fault; something not behaving correctly","mode":"active"},"note":"Softer and more precise than 故障. Good for a problem that is not a total failure.","noteTh":"นุ่มและตรงกว่า 故障 ใช้กับปัญหาที่ยังไม่ถึงกับใช้ไม่ได้เลย","provenance":{"basis":{"category":"B","scope":"Counter relevance, grouping and learning priority are teaching judgments.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"th":"อาการผิดปกติ","use":"say"},{"cat":"trouble","core":true,"en":"the symptoms of the problem","ex":{"en":"Could you tell me in detail what is happening?","jp":"どのような{症状|しょうじょう}か、{詳|くわ}しくお{聞|き}かせいただけますか。","learning":{"audience":"customer","function":"Use the word in a counter sentence","mode":"active"},"provenance":{"basis":{"category":"C","scope":"Authored example sentence. A source word does not make the sentence an approved script.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"th":"รบกวนเล่าอาการให้ละเอียดหน่อยได้ไหมคะ"},"id":"v173","jp":"{症状|しょうじょう}","learning":{"audience":"customer","function":"Counter vocabulary: the symptoms of the problem","mode":"active"},"note":"Ask for 症状 to get facts: when, how often, what the screen shows.","noteTh":"ถามอาการเพื่อให้ได้ข้อเท็จจริง เกิดเมื่อไร บ่อยแค่ไหน หน้าจอขึ้นว่าอะไร","provenance":{"basis":{"category":"B","scope":"Counter relevance, grouping and learning priority are teaching judgments.","sourceIds":[]},"explanations":"C","facts":[],"language":"C"},"th":"อาการที่เกิดขึ้น","use":"say"},{"cat":"trouble","core":true,"en":
