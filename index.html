":[]},"introduced":"1.1"},{"id":"p090","cat":"contract","speaker":"staff","jp":"{確認|かくにん}したところ、この{方法|ほうほう}ではお{手続|てつづ}きできません。","en":"After checking, we cannot proceed using this method.","th":"ตรวจสอบแล้ว ไม่สามารถดำเนินการด้วยวิธีนี้ได้ค่ะ","note":"A confirmed negative result, not an unknown answer. Follow with the verified reason or an available alternative.","noteTh":"ใช้เมื่อยืนยันแล้วว่าทำด้วยวิธีนี้ไม่ได้ ไม่ใช่เมื่อยังไม่รู้คำตอบ บอกเหตุผลที่ตรวจแล้วหรือทางเลือกต่อ","essential":false,"learning":{"mode":"active","audience":"customer","function":"Method not available"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact."},"facts":[]},"introduced":"1.1"},{"id":"p091","cat":"contract","speaker":"staff","jp":"このお{手続|てつづ}きには、こちらの{書類|しょるい}が{必要|ひつよう}です。","en":"This procedure requires the document shown here.","th":"ขั้นตอนนี้ต้องใช้เอกสารที่แสดงตรงนี้ค่ะ","note":"Point to the specific document on the checked list. No document type or docomo requirement is supplied by this example.","noteTh":"ชี้เอกสารที่ต้องใช้จากรายการที่ตรวจแล้ว ตัวอย่างนี้ไม่ได้กำหนดว่าต้องเป็นเอกสารชนิดใดหรือเป็นกฎของ docomo","essential":false,"learning":{"mode":"active","audience":"customer","function":"Explain a checked requirement"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact."},"facts":[]},"introduced":"1.1"},{"id":"p092","cat":"contract","speaker":"staff","jp":"{必要|ひつよう}な{情報|じょうほう}がそろっていないため、{今|いま}は{先|さき}に{進|すす}めません。","en":"We cannot proceed yet because the necessary information is incomplete.","th":"ข้อมูลที่ต้องใช้ยังไม่ครบ จึงยังดำเนินการต่อไม่ได้ค่ะ","note":"Use only when missing information really prevents the next step. Identify the missing item; do not just repeat this general reason.","noteTh":"ใช้เมื่อข้อมูลที่ขาดทำให้ไปต่อไม่ได้จริง ต้องระบุด้วยว่าขาดอะไร ไม่พูดแค่เหตุผลกว้าง ๆ ซ้ำ","essential":false,"learning":{"mode":"active","audience":"customer","function":"Give a simple reason"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact."},"facts":[]},"introduced":"1.1"},{"id":"p093","cat":"contract","speaker":"staff","jp":"こちらの{方法|ほうほう}なら{対応|たいおう}できます。こちらで{進|すす}めますか。","en":"We can help using this alternative. Would you like to proceed this way?","th":"ถ้าเป็นวิธีนี้ ดำเนินการได้ค่ะ ต้องการใช้วิธีนี้ไหมคะ","note":"Only after checking the alternative and explaining any differences, costs or conditions. なら limits the statement to this method.","noteTh":"ตรวจทางเลือกก่อน และอธิบายความต่าง ค่าใช้จ่ายหรือเงื่อนไขที่เกี่ยวข้อง なら จำกัดความหมายว่าเป็นวิธีนี้","essential":false,"learning":{"mode":"active","audience":"customer","function":"Offer an available alternative"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact."},"facts":[]},"introduced":"1.1"},{"id":"p094","cat":"contract","speaker":"staff","jp":"{次|つぎ}に、こちらの{内容|ないよう}をご{確認|かくにん}ください。","en":"Next, please check these details.","th":"ต่อไป รบกวนตรวจรายละเอียดตรงนี้ค่ะ","note":"Point to the actual details. 次に is a simple transition, not a cushion that needs another apology.","noteTh":"ชี้รายละเอียดที่ต้องตรวจจริง 次に ใช้เปลี่ยนไปขั้นตอนถัดไป ไม่ต้องเติมคำขอโทษ","essential":false,"learning":{"mode":"active","audience":"customer","function":"Give the next customer action"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact."},"facts":[]},"introduced":"1.1"},{"id":"p095","cat":"contract","speaker":"staff","jp":"{確認|かくにん}できました。こちらのお{手続|てつづ}きは{完了|かんりょう}しています。","en":"I have confirmed it. This procedure is complete.","th":"ตรวจสอบแล้วค่ะ ขั้นตอนนี้เสร็จเรียบร้อยแล้วค่ะ","note":"Only after confirming the actual completion status. Name or point to the completed task; do not include pending work or a future activation.","noteTh":"ใช้หลังตรวจสถานะว่าเสร็จจริง ระบุงานที่เสร็จ ไม่รวมงานค้างหรือการเปิดใช้งานในอนาคต","essential":false,"learning":{"mode":"active","audience":"customer","function":"Report verified completion"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact."},"facts":[]},"introduced":"1.1"},{"id":"p096","cat":"coworkers","speaker":"staff","jp":"{料金|りょうきん}についてのご{相談|そうだん}です。{説明|せつめい}された{金額|きんがく}と{違|ちが}うとのことです。","en":"This is a billing question. The customer says the amount differs from what was explained.","th":"ลูกค้ามาปรึกษาเรื่องค่าบริการค่ะ บอกว่ายอดไม่ตรงกับที่อธิบายไว้","note":"To a colleague: report the customer’s claim, not a confirmed billing error. とのことです marks reported information.","noteTh":"บอกเพื่อนร่วมงานว่านี่คือสิ่งที่ลูกค้าแจ้ง ยังไม่ได้ยืนยันว่าบิลผิด とのことです ใช้รายงานคำพูดอีกฝ่าย","essential":false,"learning":{"mode":"active","audience":"coworker","function":"Brief the customer situation"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact."},"facts":[]},"introduced":"1.1"},{"id":"p097","cat":"coworkers","speaker":"staff","jp":"{請求内容|せいきゅうないよう}は{確認|かくにん}しました。{申込記録|もうしこみきろく}はまだです。","en":"I checked the billing details. I have not checked the application record yet.","th":"ตรวจรายละเอียดบิลแล้วค่ะ แต่ยังไม่ได้ตรวจประวัติการสมัคร","note":"Internal shorthand: はまだです refers to the checking just mentioned. Use only for work actually done.","noteTh":"รูปย่อที่ใช้ในทีม はまだです หมายถึงยังไม่ได้ตรวจตามประโยคก่อนหน้า แจ้งเฉพาะงานที่ทำแล้วจริง","essential":false,"learning":{"mode":"active","audience":"coworker","function":"Say what is checked and pending"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact."},"facts":[]},"introduced":"1.1"},{"id":"p098","cat":"coworkers","speaker":"staff","jp":"この{料金|りょうきん}がかかる{理由|りゆう}が{分|わ}かりません。{一緒|いっしょ}に{確認|かくにん}してもらえますか。","en":"I do not understand why this charge applies. Could you check it with me?","th":"ยังไม่เข้าใจว่าทำไมถึงมีค่าบริการนี้ค่ะ ช่วยตรวจด้วยกันได้ไหมคะ","note":"To a coworker; state the specific unknown. もらえますか is ordinary polite team language.","noteTh":"พูดกับเพื่อนร่วมงานและระบุจุดที่ไม่แน่ใจ もらえますか เป็นคำขอสุภาพทั่วไปในทีม","essential":false,"learning":{"mode":"active","audience":"coworker","function":"Name uncertainty and ask for help"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact."},"facts":[]},"introduced":"1.1"},{"id":"p099","cat":"coworkers","speaker":"staff","jp":"この{案内|あんない}で{合|あ}っているか、{確認|かくにん}をお{願|ねが}いします。","en":"Please check whether this explanation is correct.","th":"รบกวนตรวจความถูกต้องของคำอธิบายนี้ให้หน่อยค่ะ","note":"Show or repeat the proposed explanation to the colleague or supervisor. この案内 needs a concrete referent.","noteTh":"แสดงหรือพูดคำอธิบายที่เตรียมไว้ให้เพื่อนร่วมงานหรือหัวหน้าฟัง ต้องบอกให้รู้ว่า この案内 หมายถึงคำอธิบายใด","essential":false,"learning":{"mode":"active","audience":"coworker","function":"Ask a supervisor to check your explanation"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact."},"facts":[]},"introduced":"1.1"},{"id":"p100","cat":"coworkers","speaker":"staff","jp":"ここから{対応|たいおう}を{代|か}わってもらえますか。","en":"Could you take over from here?","th":"ช่วยรับช่วงดูแลต่อจากตรงนี้ได้ไหมคะ","note":"After briefing the situation, completed checks and open questions. This asks for a takeover; it does not assume the colleague has accepted.","noteTh":"ใช้หลังสรุปเรื่อง งานที่ตรวจแล้ว และข้อสงสัยที่ค้าง เป็นการขอให้รับช่วง ยังไม่ถือว่าอีกฝ่ายตกลงแล้ว","essential":false,"learning":{"mode":"active","audience":"coworker","function":"Ask a colleague to take over"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact."},"facts":[]},"introduced":"1.1"},{"id":"p101","cat":"coworkers","speaker":"coworker","jp":"{分|わ}かりました。{今|いま}、そちらに{行|い}って{代|か}わります。","en":"Understood. I will come over now and take over.","th":"เข้าใจแล้ว เดี๋ยวไปตรงนั้นรับช่วงต่อให้นะ","note":"Coworker speaking to you. This accepts the handoff, not the customer’s underlying request.","noteTh":"เพื่อนร่วมงานพูดกับคุณ เป็นการตกลงรับช่วง ไม่ใช่อนุมัติคำขอของลูกค้า","essential":false,"learning":{"mode":"recognize","audience":"learner","function":"Hear acceptance of a handoff"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact."},"facts":[]},"introduced":"1.1"},{"id":"p102","cat":"coworkers","speaker":"coworker","jp":"{先|さき}に{申込記録|もうしこみきろく}を{確認|かくにん}してください。","en":"Check the application record first.","th":"ตรวจประวัติการสมัครก่อนนะ","note":"Coworker instruction in this constructed billing case. 先に tells you the priority; access and system steps still come from training.","noteTh":"คำสั่งจากเพื่อนร่วมงานในกรณีบิลสมมตินี้ 先に บอกว่าต้องทำก่อน ส่วนสิทธิ์เข้าถึงและวิธีใช้ระบบให้ยึดที่ฝึกงาน","essential":false,"learning":{"mode":"recognize","audience":"learner","function":"Hear a next-step instruction"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact."},"facts":[]},"introduced":"1.1"},{"id":"p103","cat":"coworkers","speaker":"coworker","jp":"まだ{確定|かくてい}していません。お{客様|きゃくさま}には、{確認中|かくにんちゅう}と{伝|つた}えてください。","en":"It is not confirmed yet. Tell the customer it is still being checked.","th":"ยังไม่ได้ข้อสรุป แจ้งลูกค้าว่ากำลังตรวจสอบอยู่นะ","note":"Coworker to you. Do not turn an unfinished check into a yes/no answer to the customer.","noteTh":"เพื่อนร่วมงานพูดกับคุณ อย่านำเรื่องที่ยังตรวจไม่เสร็จไปตอบลูกค้าว่าได้หรือไม่ได้","essential":false,"learning":{"mode":"recognize","audience":"learner","function":"Hear that a result is not final"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact."},"facts":[]},"introduced":"1.1"},{"id":"p104","cat":"contract","speaker":"staff","jp":"{必要|ひつよう}な{書類|しょるい}が{足|た}りないので、{今|いま}はお{手続|てつづ}きを{進|すす}められません。","en":"A required document is missing, so we cannot proceed yet.","th":"เอกสารที่ต้องใช้ยังไม่ครบ จึงยังดำเนินการต่อไม่ได้ค่ะ","note":"Only after checking the actual requirements. Show exactly what is missing and the permitted next action.","noteTh":"ใช้หลังตรวจข้อกำหนดจริงแล้ว ระบุเอกสารที่ขาดและสิ่งที่ลูกค้าทำต่อได้","essential":false,"learning":{"mode":"active","audience":"customer","function":"Missing required document"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact."},"facts":[]},"introduced":"1.1"},{"id":"p105","cat":"rescue","speaker":"staff","jp":"こちらでは{確認|かくにん}できません。{担当|たんとう}の{者|もの}に{確認|かくにん}します。","en":"I cannot confirm it here. I will check with the colleague who handles it.","th":"ตรงนี้ยังยืนยันไม่ได้ ขอเช็กกับผู้ดูแลเรื่องนี้ค่ะ","note":"Unable to verify with your current information or tools; not the same as saying the request is impossible.","noteTh":"ใช้เมื่อข้อมูลหรือเครื่องมือที่มีไม่พอจะยืนยัน ไม่ได้หมายความว่าคำขอลูกค้าทำไม่ได้","essential":false,"learning":{"mode":"active","audience":"customer","function":"Unable to confirm here"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact."},"facts":[]},"introduced":"1.1"},{"id":"p106","cat":"rescue","speaker":"staff","jp":"もう{一点|いってん}、{確認|かくにん}が{必要|ひつよう}です。{少々|しょうしょう}お{待|ま}ちください。","en":"There is one more point I need to check. Please wait a moment.","th":"มีอีกจุดที่ต้องตรวจสอบค่ะ รอสักครู่นะคะ","note":"A specific extra check remains. If you do not know the waiting time, do not invent a duration.","noteTh":"ใช้เมื่อยังมีจุดที่ต้องตรวจเพิ่ม หากไม่รู้เวลารอ ไม่กำหนดเวลาเอง","essential":false,"learning":{"mode":"active","audience":"customer","function":"One more check is needed"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact."},"facts":[]},"introduced":"1.1"},{"id":"p107","cat":"support","speaker":"staff","jp":"{先|さき}に、こちらの{入力|にゅうりょく}をお{願|ねが}いします。{終|お}わりましたらお{知|し}らせください。","en":"Please fill this in first. Let me know when you have finished.","th":"รบกวนกรอกตรงนี้ก่อนค่ะ เสร็จแล้วแจ้งด้วยนะคะ","note":"Show the required field after explaining it. For a password/code, let the customer enter it privately; this is not permission to ask them to read it aloud.","noteTh":"อธิบายแล้วชี้ช่องที่ต้องกรอก หากเป็นรหัสผ่านหรือรหัสยืนยัน ให้ลูกค้ากรอกเองเป็นส่วนตัว ไม่ใช่ขอให้อ่านรหัสออกมา","essential":false,"learning":{"mode":"active","audience":"customer","function":"Customer action must come first"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact."},"facts":[]},"introduced":"1.1"},{"id":"p108","cat":"rescue","speaker":"staff","jp":"{担当|たんとう}の{者|もの}がまいりますので、{少々|しょうしょう}お{待|ま}ちください。","en":"The colleague handling this is coming. Please wait a moment.","th":"พนักงานที่ดูแลเรื่องนี้กำลังมาค่ะ รอสักครู่นะคะ","note":"Use after the colleague has accepted and confirmed they are coming. It is not a promise to use while still looking for help.","noteTh":"ใช้เมื่อเพื่อนร่วมงานรับเรื่องและยืนยันว่าจะมาแล้ว ไม่ใช้ขณะที่ยังหาคนช่วยไม่ได้","essential":false,"learning":{"mode":"active","audience":"customer","function":"Wait for the colleague who accepted"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact."},"facts":[]},"introduced":"1.1"},{"id":"p109","cat":"contract","speaker":"staff","jp":"{今|いま}はお{手続|てつづ}きを{完了|かんりょう}できません。{必要|ひつよう}なものがそろいましたら、{改|あらた}めてご{相談|そうだん}ください。","en":"We cannot complete the procedure now. Please speak with us again once you have the required items.","th":"ตอนนี้ยังดำเนินการให้เสร็จไม่ได้ค่ะ เมื่อเตรียมสิ่งที่ต้องใช้ครบแล้ว รบกวนติดต่อมาใหม่นะคะ","note":"After identifying the missing items and confirming this is the appropriate next action. This does not promise approval or completion on the next visit.","noteTh":"ใช้หลังระบุสิ่งที่ขาดและตรวจแล้วว่าควรทำต่อแบบนี้ ไม่ได้รับปากว่ามาครั้งหน้าจะอนุมัติหรือเสร็จแน่นอน","essential":false,"learning":{"mode":"active","audience":"customer","function":"Cannot finish now; explain the return point"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact."},"facts":[]},"introduced":"1.1"}],"rescue":[{"id":"r01","cat":"rescue","speaker":"staff","jp":"{恐|おそ}れ{入|い}りますが、もう{一度|いちど}お{願|ねが}いできますか。","en":"Excuse me, could you say that again?","th":"รบกวนพูดอีกครั้งได้ไหมคะ","note":"For a customer or senior coworker when you missed what was said. A calm first response is enough.","noteTh":"ใช้กับลูกค้าหรือรุ่นพี่เมื่อฟังไม่ทัน เริ่มด้วยประโยคนี้อย่างใจเย็นได้เลยค่ะ","essential":true,"learning":{"mode":"active","audience":"customer","function":"Ask for repetition"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[]}},{"id":"r02","cat":"rescue","speaker":"staff","jp":"{恐|おそ}れ{入|い}りますが、{少|すこ}しゆっくりお{話|はな}しいただけますか。","en":"Excuse me, could you speak a little more slowly?","th":"รบกวนพูดช้าลงอีกนิดได้ไหมคะ","note":"Useful with fast speech. お話しいただけますか is a polite request for the other person to speak.","noteTh":"ใช้เมื่ออีกฝ่ายพูดเร็ว お話しいただけますか เป็นรูปสุภาพสำหรับขอให้อีกฝ่ายพูดค่ะ","essential":true,"learning":{"mode":"active","audience":"customer","function":"Ask for slower speech"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[]}},{"id":"r03","cat":"rescue","speaker":"staff","jp":"「○○」というのは、どういう{意味|いみ}でしょうか。","en":"What does “___” mean?","th":"คำว่า “___” หมายความว่าอย่างไรคะ","note":"Repeat the unfamiliar word in place of ○○. Especially useful for checking a technical term with a coworker.","noteTh":"แทน ○○ ด้วยคำที่ไม่เข้าใจ เหมาะสำหรับถามความหมายของศัพท์เฉพาะกับเพื่อนร่วมงานค่ะ","essential":false,"learning":{"mode":"active","audience":"customer","function":"Ask what a term means"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[]}},{"id":"r04","cat":"rescue","speaker":"staff","jp":"プランを{変更|へんこう}したい、ということでしょうか。","en":"Just to confirm, you'd like to change your plan?","th":"ขอทวนเพื่อความแน่ใจค่ะ คุณต้องการเปลี่ยนแพ็กเกจ ใช่ไหมคะ","note":"Check your understanding instead of guessing. Replace プランを変更したい with the request you think you heard.","noteTh":"ใช้ทวนความเข้าใจแทนการเดาค่ะ เปลี่ยน プランを変更したい เป็นสิ่งที่คุณคิดว่าลูกค้าต้องการ","essential":true,"learning":{"mode":"active","audience":"customer","function":"Confirm your understanding"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[]}},{"id":"r05","cat":"rescue","speaker":"staff","jp":"{恐|おそ}れ{入|い}りますが、こちらに{書|か}いていただけますか。","en":"Excuse me, could you write it here?","th":"รบกวนเขียนตรงนี้ให้หน่อยได้ไหมคะ","note":"For an unfamiliar word or model name when hearing it again has not helped.","noteTh":"ใช้กับคำที่ไม่คุ้นหรือชื่อรุ่น เมื่อฟังซ้ำแล้วยังไม่เข้าใจค่ะ","essential":false,"learning":{"mode":"active","audience":"customer","function":"Ask for a written detail"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[]}},{"id":"r06","cat":"rescue","speaker":"staff","jp":"{正確|せいかく}にご{案内|あんない}するため、{確認|かくにん}してまいります。{少々|しょうしょう}お{待|ま}ちいただけますか。","en":"I'll check so I can give you accurate information. Could you wait a moment?","th":"ขอตรวจสอบเพื่อให้ข้อมูลที่ถูกต้องค่ะ รอสักครู่ได้ไหมคะ","note":"Use when you will go and check with a colleague or another source, then return. Do not invent an answer.","noteTh":"ใช้เมื่อจะไปตรวจสอบกับเพื่อนร่วมงานหรือแหล่งข้อมูล แล้วกลับมาแจ้งลูกค้าค่ะ","essential":true,"learning":{"mode":"active","audience":"customer","function":"Explain a check and wait"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[]}},{"id":"r07","cat":"rescue","speaker":"staff","jp":"{私|わたし}では{判断|はんだん}できないので、{担当|たんとう}の{者|もの}に{確認|かくにん}します。","en":"I can’t decide this myself, so I’ll check with the colleague who handles it.","th":"เรื่องนี้ตัดสินใจเองไม่ได้ ขอเช็กกับผู้ดูแลเรื่องนี้ก่อนค่ะ","note":"For a request beyond your knowledge or authority, such as an exception or disputed charge.","noteTh":"ใช้กับคำขอที่เกินความรู้หรืออำนาจตัดสินใจของคุณ เช่น การขอยกเว้นเงื่อนไขหรือการโต้แย้งยอดเรียกเก็บค่ะ","essential":true,"learning":{"mode":"active","audience":"customer","function":"Refer a decision to a colleague"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[]}},{"id":"r08","cat":"rescue","speaker":"staff","jp":"お{待|ま}たせして{申|もう}し{訳|わけ}ございません。{確認|かくにん}にもう{少|すこ}しお{時間|じかん}がかかりそうです。","en":"I'm sorry to keep you waiting. It looks like checking will take a little longer.","th":"ขออภัยที่ให้รอค่ะ การตรวจสอบน่าจะใช้เวลาอีกสักหน่อยค่ะ","note":"Give an update while the customer waits. This does not promise a completion time.","noteTh":"แจ้งความคืบหน้าให้ลูกค้าที่กำลังรอ ประโยคนี้ไม่ได้รับรองว่าจะเสร็จเมื่อไรค่ะ","essential":false,"learning":{"mode":"active","audience":"customer","function":"Update a longer wait"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[]}},{"id":"r09","cat":"rescue","speaker":"staff","jp":"{先|さき}ほどのご{案内|あんない}に{誤|あやま}りがありました。{申|もう}し{訳|わけ}ありません。{確認|かくにん}して、{改|あらた}めてご{説明|せつめい}します。","en":"The information I gave you earlier was incorrect. I’m sorry. I’ll check and explain it again.","th":"เมื่อครู่ให้ข้อมูลผิดค่ะ ขออภัยด้วย จะตรวจสอบแล้วอธิบายใหม่ค่ะ","note":"Use as soon as you discover you gave incorrect information. Confirm the correction before explaining it.","noteTh":"ใช้ทันทีที่พบว่าตนเองให้ข้อมูลผิด ตรวจสอบข้อมูลที่แก้ไขให้แน่ใจก่อนอธิบายอีกครั้งค่ะ","essential":true,"learning":{"mode":"active","audience":"customer","function":"Correct your earlier information"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[]}},{"id":"r10","cat":"rescue","speaker":"staff","jp":"{担当|たんとう}の{者|もの}に{引|ひ}き{継|つ}いでもよろしいでしょうか。お{話|はなし}の{内容|ないよう}はこちらから{伝|つた}えます。","en":"May I hand this over to the colleague who handles it? I’ll pass on what you’ve told me.","th":"ขอส่งต่อให้ผู้รับผิดชอบดูแลได้ไหมคะ ดิฉันจะเล่าเรื่องที่คุณแจ้งมาให้เขาทราบค่ะ","note":"担当の者 is the colleague handling the matter, not necessarily a manager. Tell the customer about the handoff, then pass on the request and what is still unchecked.","noteTh":"担当の者 คือพนักงานที่ดูแลเรื่องนั้น ไม่จำเป็นต้องเป็นผู้จัดการ แจ้งลูกค้าก่อนส่งต่อ แล้วบอกผู้รับช่วงว่าลูกค้าต้องการอะไรและยังไม่ได้ตรวจอะไร","essential":true,"learning":{"mode":"active","audience":"customer","function":"Arrange a handoff"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[]}},{"id":"r11","cat":"rescue","speaker":"staff","jp":"この{手順|てじゅん}で{合|あ}っているか、{確認|かくにん}していただけますか。","en":"Could you check whether I'm following the right steps?","th":"ช่วยตรวจให้หน่อยได้ไหมคะว่าขั้นตอนที่ทำอยู่นี้ถูกต้องหรือเปล่า","note":"To your trainer or a senior coworker, before proceeding with a step you are unsure about.","noteTh":"พูดกับผู้สอนงานหรือรุ่นพี่ ก่อนทำขั้นตอนที่ยังไม่มั่นใจต่อไปค่ะ","essential":false,"learning":{"mode":"active","audience":"coworker","function":"Ask for a procedure check"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[]}},{"id":"r12","cat":"rescue","speaker":"staff","jp":"すみません。どこまで{進|すす}めればよいか、{教|おし}えていただけますか。","en":"Excuse me, could you tell me how far I should proceed?","th":"ขอโทษค่ะ ช่วยบอกได้ไหมคะว่าควรทำต่อไปถึงขั้นตอนไหน","note":"To your trainer or a senior coworker. Useful when you understand the task but are unsure where your responsibility ends.","noteTh":"พูดกับผู้สอนงานหรือรุ่นพี่ เมื่อเข้าใจงานแล้วแต่ยังไม่แน่ใจว่าตนเองควรทำถึงขั้นไหนค่ะ","essential":false,"learning":{"mode":"active","audience":"coworker","function":"Ask how far to proceed"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[]}}],"scenarios":[{"id":"plan-pushback","title":"Plan change: “Will it really be cheaper?”","titleTh":"เปลี่ยนแพ็กเกจ: “จะถูกลงจริงไหม?”","context":"Practice dialogue based on the listing’s plan-review work. No actual price or plan condition is assumed.","contextTh":"บทสนทนาฝึกจากงานทบทวนแพ็กเกจในประกาศรับสมัคร ไม่ได้กำหนดราคาหรือเงื่อนไขแพ็กเกจจริง","goal":"Find the customer’s priorities, compare the whole bill, and confirm conditions before suggesting a change.","goalTh":"ถามสิ่งที่ลูกค้าให้ความสำคัญ เปรียบเทียบยอดรวม และตรวจสอบเงื่อนไขก่อนเสนอให้เปลี่ยน","turns":[{"role":"staff","jp":"{本日|ほんじつ}はどのようなご{相談|そうだん}でしょうか。","en":"What would you like to discuss today?","th":"วันนี้ต้องการปรึกษาเรื่องอะไรคะ","id":"plan-pushback-01","learning":{"mode":"active","audience":"customer","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["job-listing"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}},{"role":"customer","jp":"{毎月|まいつき}の{料金|りょうきん}が{高|たか}いので、もっと{安|やす}くしたいです。","en":"My monthly bill is high. I’d like to reduce it.","th":"ค่าโทรศัพท์แต่ละเดือนแพง อยากลดค่าใช้จ่ายลง","id":"plan-pushback-02","learning":{"mode":"recognize","audience":"learner","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["job-listing"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}},{"role":"staff","jp":"{料金|りょうきん}を{見直|みなお}したいということですね。{普段|ふだん}は、どのようにスマートフォンをお{使|つか}いですか。","en":"You’d like to review the cost. How do you usually use your smartphone?","th":"ต้องการทบทวนค่าใช้จ่ายใช่ไหมคะ ปกติใช้สมาร์ตโฟนทำอะไรบ้างคะ","id":"plan-pushback-03","learning":{"mode":"active","audience":"customer","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["job-listing"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}},{"role":"customer","jp":"{家|いえ}では{Wi-Fi|ワイファイ}を{使|つか}っています。でも、{外|そと}では{動画|どうが}も{見|み}ます。","en":"I use Wi-Fi at home, but I also watch videos when I’m out.","th":"ที่บ้านใช้ Wi-Fi แต่เวลาออกไปข้างนอกก็ดูวิดีโอด้วย","id":"plan-pushback-04","learning":{"mode":"recognize","audience":"learner","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["job-listing"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}},{"role":"staff","jp":"{現在|げんざい}のご{契約|けいやく}とデータ{使用量|しようりょう}を{確認|かくにん}し、{合|あ}いそうなプランを{比較|ひかく}いたします。{確認|かくにん}を{進|すす}めてもよろしいでしょうか。","en":"I’ll check your current contract and data usage, then compare plans that may suit you. May I go ahead with the checks?","th":"จะตรวจสอบสัญญาปัจจุบันและปริมาณอินเทอร์เน็ตที่ใช้ แล้วเปรียบเทียบแพ็กเกจที่น่าจะเหมาะสมค่ะ ขอเริ่มตรวจสอบได้ไหมคะ","id":"plan-pushback-05","learning":{"mode":"active","audience":"customer","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["job-listing"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}},{"role":"customer","jp":"はい。でも、{安|やす}いプランにしても、ほかの{料金|りょうきん}が{増|ふ}えるんじゃないですか。","en":"Yes. But if I switch to a cheaper plan, won’t other charges go up?","th":"ได้ แต่เปลี่ยนเป็นแพ็กเกจถูกกว่าแล้ว ค่าใช้จ่ายอย่างอื่นจะเพิ่มหรือเปล่า","id":"plan-pushback-06","learning":{"mode":"recognize","audience":"learner","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["job-listing"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}},{"role":"staff","jp":"{通話料|つうわりょう}やオプションも{含|ふく}めて、{合計|ごうけい}を{確認|かくにん}します。","en":"I’ll check the total, including call charges and optional services.","th":"จะตรวจยอดรวมที่รวมค่าโทรและบริการเสริมด้วยค่ะ","id":"plan-pushback-07","learning":{"mode":"active","audience":"customer","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["job-listing"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}},{"role":"customer","jp":"{今|いま}の{割引|わりびき}は、そのまま{使|つか}えますか。","en":"Will I still be able to use my current discount?","th":"ส่วนลดที่ใช้อยู่ตอนนี้จะยังใช้ได้ไหม","id":"plan-pushback-08","learning":{"mode":"recognize","audience":"learner","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["job-listing"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}},{"role":"staff","jp":"{今|いま}の{割引|わりびき}が{使|つか}えるか{確認|かくにん}します。{変更後|へんこうご}の{合計|ごうけい}も{比|くら}べてみましょう。","en":"I’ll check whether your current discounts can be used. Let’s compare the total after the change too.","th":"จะตรวจว่าส่วนลดเดิมยังใช้ได้ไหม แล้วมาเทียบยอดรวมหลังเปลี่ยนกันนะคะ","id":"plan-pushback-09","learning":{"mode":"active","audience":"customer","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["job-listing"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}},{"role":"customer","jp":"じゃあ、{今日|きょう}すぐには{変|か}えたくないです。まず{違|ちが}いを{知|し}りたいです。","en":"Then I don’t want to change it right away today. I want to understand the differences first.","th":"ถ้าอย่างนั้นวันนี้ยังไม่อยากเปลี่ยนทันที อยากรู้ความแตกต่างก่อน","id":"plan-pushback-10","learning":{"mode":"recognize","audience":"learner","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["job-listing"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}},{"role":"staff","jp":"かしこまりました。まず{料金|りょうきん}と{条件|じょうけん}の{違|ちが}いをご{説明|せつめい}いたします。{変更|へんこう}するかどうかは、ご{説明|せつめい}の{後|あと}にお{決|き}めください。","en":"Certainly. I’ll explain the differences in cost and conditions first. Please decide whether to change after the explanation.","th":"ได้ค่ะ จะอธิบายความแตกต่างด้านราคาและเงื่อนไขก่อน แล้วค่อยตัดสินใจว่าจะเปลี่ยนหรือไม่ค่ะ","id":"plan-pushback-11","learning":{"mode":"active","audience":"customer","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["job-listing"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}},{"role":"customer","jp":"それならお{願|ねが}いします。{毎月|まいつき}の{合計|ごうけい}がどう{変|か}わるか、{知|し}りたいです。","en":"In that case, please go ahead. I want to know how my monthly total would change.","th":"ถ้าอย่างนั้นช่วยอธิบายด้วย อยากรู้ว่ายอดรวมแต่ละเดือนจะเปลี่ยนอย่างไร","id":"plan-pushback-12","learning":{"mode":"recognize","audience":"learner","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["job-listing"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}}],"takeaway":"Mirror the goal → ask about use → check the total and discounts → let the customer decide. “I’ll check” is a useful answer when the conditions are not yet verified.","takeawayTh":"ทวนความต้องการ → ถามการใช้งาน → ตรวจยอดรวมและส่วนลด → ให้ลูกค้าตัดสินใจ หากยังไม่ได้ตรวจสอบเงื่อนไข ใช้คำว่า “ขอตรวจสอบค่ะ” ได้","boundary":"This exchange reaches agreement to compare costs. It does not yet explain actual figures or complete a plan change.","boundaryTh":"บทนี้จบที่ตกลงจะเปรียบเทียบค่าใช้จ่าย ยังไม่ได้อธิบายยอดจริงหรือเปลี่ยนแพ็กเกจเสร็จ","learning":{"mode":"active","audience":"customer","function":"Follow a partial encounter"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["job-listing"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}},{"id":"billing-complaint","title":"Billing complaint: an unfamiliar charge","titleTh":"ข้อร้องเรียนเรื่องบิล: มีค่าบริการที่ไม่คุ้น","context":"Practice a billing inquiry that needs a senior colleague’s help. The charge, refund eligibility, and response time remain unverified.","contextTh":"ฝึกตอบคำถามเรื่องบิลที่ต้องให้รุ่นพี่ช่วย ยังไม่ทราบข้อเท็จจริงของค่าบริการ สิทธิคืนเงิน หรือเวลาที่จะได้คำตอบ","goal":"Acknowledge the concern without guessing, ask to check details, and hand over the unresolved point clearly.","goalTh":"รับฟังความกังวลโดยไม่เดา ขออนุญาตตรวจสอบรายละเอียด และส่งต่อประเด็นที่ยังไม่ชัดเจน","turns":[{"role":"customer","jp":"この{請求|せいきゅう}、おかしくないですか。{先月|せんげつ}より{高|たか}いんですけど。","en":"Isn’t this bill wrong? It’s higher than last month.","th":"บิลนี้ผิดหรือเปล่า แพงกว่าเดือนที่แล้ว","id":"billing-complaint-01","learning":{"mode":"recognize","audience":"learner","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["job-listing"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}},{"role":"staff","jp":"{先月|せんげつ}より{高|たか}くなっているのですね。{内訳|うちわけ}を{一緒|いっしょ}に{確認|かくにん}しましょう。","en":"It’s higher than last month, I see. Let’s check the breakdown together.","th":"ยอดสูงกว่าเดือนที่แล้วใช่ไหมคะ มาดูรายละเอียดด้วยกันนะคะ","id":"billing-complaint-02","learning":{"mode":"active","audience":"customer","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["job-listing"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}},{"role":"customer","jp":"このオプションです。{申|もう}し{込|こ}んだ{覚|おぼ}えはありません。","en":"This option here. I don’t remember signing up for it.","th":"บริการเสริมตรงนี้ จำไม่ได้ว่าเคยสมัคร","id":"billing-complaint-03","learning":{"mode":"recognize","audience":"learner","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["job-listing"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}},{"role":"staff","jp":"お{申|もう}し{込|こ}みの{覚|おぼ}えがないということですね。{請求内容|せいきゅうないよう}と、お{申|もう}し{込|こ}みの{記録|きろく}を{確認|かくにん}いたします。","en":"You don’t remember signing up for it. I’ll check the billing details and the application record.","th":"จำไม่ได้ว่าเคยสมัครรายการนี้ใช่ไหมคะ จะตรวจสอบรายละเอียดบิลและบันทึกการสมัครค่ะ","id":"billing-complaint-04","learning":{"mode":"active","audience":"customer","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["job-listing"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}},{"role":"customer","jp":"{調|しら}べるだけじゃなくて、{返金|へんきん}してください。","en":"Don’t just look into it. I want a refund.","th":"อย่าแค่ตรวจสอบ ขอให้คืนเงินด้วย","id":"billing-complaint-05","learning":{"mode":"recognize","audience":"learner","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["job-listing"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}},{"role":"staff","jp":"{返金|へんきん}をご{希望|きぼう}ですね。{申|もう}し{訳|わけ}ございませんが、{現時点|げんじてん}では{返金|へんきん}できるか{判断|はんだん}できません。{内容|ないよう}を{確認|かくにん}し、{責任者|せきにんしゃ}に{相談|そうだん}いたします。","en":"You would like a refund. I’m sorry, but I can’t determine at this point whether a refund is possible. I’ll check the details and consult the person in charge.","th":"ต้องการให้คืนเงินใช่ไหมคะ ขออภัยค่ะ ตอนนี้ยังตัดสินไม่ได้ว่าสามารถคืนเงินได้หรือไม่ จะตรวจสอบรายละเอียดและปรึกษาผู้รับผิดชอบค่ะ","id":"billing-complaint-06","learning":{"mode":"active","audience":"customer","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["job-listing"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}},{"role":"customer","jp":"また{同|おな}じ{説明|せつめい}をしないといけないんですか。","en":"Am I going to have to explain everything again?","th":"ต้องอธิบายเรื่องเดิมซ้ำอีกหรือ","id":"billing-complaint-07","learning":{"mode":"recognize","audience":"learner","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["job-listing"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}},{"role":"staff","jp":"これまで{伺|うかが}った{内容|ないよう}は、{私|わたし}から{引|ひ}き{継|つ}ぎます。{追加|ついか}で{確認|かくにん}が{必要|ひつよう}な{点|てん}があれば、お{伺|うかが}いします。","en":"I’ll pass on what you’ve told me so far. If anything else needs checking, we’ll ask you about it.","th":"ดิฉันจะส่งต่อเรื่องที่ได้รับฟังมาค่ะ หากมีประเด็นที่ต้องตรวจสอบเพิ่มเติม จะสอบถามอีกครั้งค่ะ","id":"billing-complaint-08","learning":{"mode":"active","audience":"customer","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["job-listing"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}},{"role":"customer","jp":"どのくらい{待|ま}ちますか。あまり{時間|じかん}がないんです。","en":"How long will I have to wait? I don’t have much time.","th":"ต้องรอนานแค่ไหน มีเวลาไม่มาก","id":"billing-complaint-09","learning":{"mode":"recognize","audience":"learner","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["job-listing"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}},{"role":"staff","jp":"お{待|ま}ちいただく{時間|じかん}の{目安|めやす}を{確認|かくにん}してまいります。お{急|いそ}ぎであることも{伝|つた}えます。","en":"I’ll check the estimated wait and let them know you’re in a hurry.","th":"จะไปตรวจสอบเวลารอโดยประมาณค่ะ และจะแจ้งด้วยว่าคุณมีเวลาจำกัดค่ะ","id":"billing-complaint-10","learning":{"mode":"active","audience":"customer","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["job-listing"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}},{"role":"staff","jp":"こちらのお{客様|きゃくさま}は、オプションを{申|もう}し{込|こ}んだ{覚|おぼ}えがなく、{返金|へんきん}をご{希望|きぼう}です。{申込記録|もうしこみきろく}はまだ{確認|かくにん}できていません。ご{対応|たいおう}をお{願|ねが}いできますか。","en":"[To a colleague] This customer doesn’t remember signing up for the option and wants a refund. I haven’t been able to verify the application record yet. Could you help with this?","th":"[พูดกับเพื่อนร่วมงาน] ลูกค้าท่านนี้จำไม่ได้ว่าเคยสมัครบริการเสริมและต้องการคืนเงินค่ะ ยังตรวจสอบบันทึกการสมัครไม่ได้ รบกวนช่วยรับเรื่องได้ไหมคะ","id":"billing-complaint-11","learning":{"mode":"active","audience":"coworker","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["job-listing"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}},{"role":"coworker","jp":"{分|わ}かりました。まず{記録|きろく}を{確認|かくにん}しましょう。{分|わ}かったことと、まだ{確認|かくにん}が{必要|ひつよう}なことを{分|わ}けて{説明|せつめい}しましょう。","en":"Understood. Let’s check the record first, then explain separately what we know and what still needs checking.","th":"เข้าใจแล้ว เริ่มจากตรวจสอบบันทึกกันก่อน แล้วแยกอธิบายส่วนที่ทราบแล้วกับส่วนที่ยังต้องตรวจสอบ","id":"billing-complaint-12","learning":{"mode":"recognize","audience":"learner","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["job-listing"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}}],"takeaway":"Acknowledge the customer’s account without declaring the bill wrong. A useful handover includes their concern, their request, and what is still unverified.","takeawayTh":"รับฟังสิ่งที่ลูกค้าเล่าโดยยังไม่สรุปว่าบิลผิด เวลาส่งต่อให้บอกข้อกังวล สิ่งที่ลูกค้าต้องการ และส่วนที่ยังไม่ได้ตรวจสอบ","boundary":"This exchange reaches a handoff for investigation. No billing error or refund decision has been established.","boundaryTh":"บทนี้จบที่ส่งต่อเพื่อตรวจสอบ ยังไม่ได้ยืนยันว่าบิลผิดหรือคืนเงินได้","learning":{"mode":"active","audience":"customer","function":"Follow a partial encounter"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["job-listing"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}},{"id":"repair-data-cost","title":"Repair: photos, cost, and uncertainty","titleTh":"ส่งซ่อม: รูปถ่าย ค่าใช้จ่าย และสิ่งที่ยังไม่ทราบ","context":"Practice repair reception and after-sales support from the job listing. Repair outcome, data handling, cost, and timing must be checked for the actual case.","contextTh":"ฝึกงานรับซ่อมและดูแลหลังการขายตามประกาศรับสมัคร ต้องตรวจสอบผลการซ่อม การจัดการข้อมูล ค่าใช้จ่าย และเวลาตามกรณีจริง","goal":"Ask about symptoms and priorities; explain uncertainty without promising data recovery, free repair, or same-day completion.","goalTh":"ถามอาการและสิ่งที่ลูกค้ากังวล อธิบายส่วนที่ยังไม่ทราบโดยไม่รับรองการกู้ข้อมูล การซ่อมฟรี หรือการซ่อมเสร็จภายในวันเดียว","turns":[{"role":"customer","jp":"スマホが{動|うご}かなくなりました。{画面|がめん}を{触|さわ}っても{反応|はんのう}しません。","en":"My phone has stopped working. The screen doesn’t respond when I touch it.","th":"มือถือใช้งานไม่ได้ แตะหน้าจอแล้วไม่ตอบสนอง","id":"repair-data-cost-01","learning":{"mode":"recognize","audience":"learner","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["job-listing"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}},{"role":"staff","jp":"{画面|がめん}が{反応|はんのう}しないのですね。いつごろからでしょうか。","en":"The screen isn’t responding. When did that start?","th":"หน้าจอไม่ตอบสนองใช่ไหมคะ เริ่มเป็นตั้งแต่เมื่อไรคะ","id":"repair-data-cost-02","learning":{"mode":"active","audience":"customer","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["job-listing"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}},{"role":"customer","jp":"{今朝|けさ}からです。{昨日|きのう}{落|お}としたんですけど、{写真|しゃしん}は{消|き}えませんよね。","en":"Since this morning. I dropped it yesterday, but my photos won’t be lost, will they?","th":"ตั้งแต่เช้านี้ เมื่อวานทำตก แต่รูปจะไม่หายใช่ไหม","id":"repair-data-cost-03","learning":{"mode":"recognize","audience":"learner","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["job-listing"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}},{"role":"staff","jp":"{写真|しゃしん}が{心配|しんぱい}なのですね。{今|いま}の{段階|だんかい}では、データが{残|のこ}るとはお{約束|やくそく}できません。バックアップはお{済|す}みですか。","en":"You’re worried about the photos. At this stage, I can’t promise that the data will be preserved. Have you made a backup?","th":"กังวลเรื่องรูปถ่ายใช่ไหมคะ ตอนนี้ยังรับรองไม่ได้ว่าข้อมูลจะคงอยู่ค่ะ ได้สำรองข้อมูลไว้ไหมคะ","id":"repair-data-cost-04","learning":{"mode":"active","audience":"customer","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["job-listing"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}},{"role":"customer","jp":"よく{分|わ}かりません。バックアップって、{何|なん}ですか。","en":"I’m not sure. What’s a backup?","th":"ไม่ค่อยเข้าใจ การสำรองข้อมูลคืออะไร","id":"repair-data-cost-05","learning":{"mode":"recognize","audience":"learner","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["job-listing"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}},{"role":"staff","jp":"{写真|しゃしん}などのデータを、{別|べつ}の{場所|ばしょ}にも{保存|ほぞん}しておくことです。{別|べつ}の{端末|たんまつ}やサービスに、{写真|しゃしん}を{保存|ほぞん}した{覚|おぼ}えはありますか。","en":"It means saving data such as photos in another place as well. Do you remember saving your photos to another device or service?","th":"คือการเก็บข้อมูล เช่น รูปถ่าย ไว้ในอีกที่หนึ่งด้วยค่ะ จำได้ไหมคะว่าเคยบันทึกรูปไว้ในอุปกรณ์อื่นหรือบริการอื่น","id":"repair-data-cost-06","learning":{"mode":"active","audience":"customer","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["job-listing"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}},{"role":"customer","jp":"たぶん、していません。それと、{修理|しゅうり}は{無料|むりょう}ですよね。{補償|ほしょう}に{入|はい}ったはずです。","en":"I probably haven’t. Also, the repair is free, right? I think I signed up for coverage.","th":"น่าจะไม่ได้ทำไว้ แล้วซ่อมฟรีใช่ไหม คิดว่าเคยสมัครบริการคุ้มครองไว้","id":"repair-data-cost-07","learning":{"mode":"recognize","audience":"learner","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["job-listing"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}},{"role":"staff","jp":"{補償|ほしょう}の{加入状況|かにゅうじょうきょう}と、{今回|こんかい}の{故障|こしょう}が{対象|たいしょう}になるかを{確認|かくにん}します。{費用|ひよう}も{確認|かくにん}してご{案内|あんない}します。","en":"I’ll check whether you are enrolled in coverage and whether this fault is covered. I’ll check the cost too and let you know.","th":"จะตรวจว่าสมัครบริการคุ้มครองไว้หรือไม่ และอาการเสียครั้งนี้อยู่ในเงื่อนไขไหม แล้วตรวจค่าใช้จ่ายให้ด้วยค่ะ","id":"repair-data-cost-08","learning":{"mode":"active","audience":"customer","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["job-listing"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}},{"role":"customer","jp":"{仕事|しごと}で{使|つか}うので、{今日|きょう}{直|なお}してほしいんです。","en":"I need it for work, so I want it fixed today.","th":"ต้องใช้ทำงาน อยากให้ซ่อมเสร็จวันนี้","id":"repair-data-cost-09","learning":{"mode":"recognize","audience":"learner","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["job-listing"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}},{"role":"staff","jp":"お{仕事|しごと}で{必要|ひつよう}なのですね。{本日中|ほんじつちゅう}に{直|なお}るとはお{約束|やくそく}できません。{対応方法|たいおうほうほう}と、かかる{時間|じかん}の{目安|めやす}を{確認|かくにん}いたします。","en":"You need it for work. I can’t promise it will be fixed today. I’ll check the available options and the estimated time.","th":"จำเป็นต้องใช้ทำงานใช่ไหมคะ ยังรับรองไม่ได้ว่าจะซ่อมเสร็จวันนี้ค่ะ จะตรวจสอบวิธีดำเนินการและระยะเวลาโดยประมาณค่ะ","id":"repair-data-cost-10","learning":{"mode":"active","audience":"customer","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["job-listing"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}},{"role":"customer","jp":"{勝手|かって}にデータを{消|け}さないでください。{先|さき}に{説明|せつめい}してほしいです。","en":"Please don’t erase my data without asking me. I want an explanation first.","th":"อย่าลบข้อมูลโดยไม่ถามก่อน อยากให้อธิบายก่อนดำเนินการ","id":"repair-data-cost-11","learning":{"mode":"recognize","audience":"learner","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["job-listing"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}},{"role":"staff","jp":"{承知|しょうち}いたしました。データの{扱|あつか}いを{確認|かくにん}し、{手続|てつづ}きの{前|まえ}にご{説明|せつめい}いたします。まず、{端末|たんまつ}の{状態|じょうたい}を{拝見|はいけん}してもよろしいでしょうか。","en":"Understood. I’ll check how the data would be handled and explain it before proceeding. First, may I look at the condition of the device?","th":"รับทราบค่ะ จะตรวจสอบวิธีจัดการข้อมูลและอธิบายก่อนดำเนินเรื่องค่ะ ก่อนอื่นขอดูสภาพเครื่องได้ไหมคะ","id":"repair-data-cost-12","learning":{"mode":"active","audience":"customer","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["job-listing"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}}],"takeaway":"Separate symptoms, data concerns, coverage, and urgency. Permission to look at a device is not permission to erase it or proceed with a repair.","takeawayTh":"แยกถามอาการเสีย ความกังวลเรื่องข้อมูล ความคุ้มครอง และความเร่งด่วน การอนุญาตให้ดูเครื่องไม่ได้หมายถึงอนุญาตให้ลบข้อมูลหรือส่งซ่อม","boundary":"This exchange reaches permission to inspect the phone. Repair eligibility, costs, data recovery and timing remain unchecked.","boundaryTh":"บทนี้จบที่ลูกค้าอนุญาตให้ดูเครื่อง ยังไม่ได้ยืนยันสิทธิ์ซ่อม ค่าใช้จ่าย การกู้ข้อมูล หรือเวลา","learning":{"mode":"active","audience":"customer","function":"Follow a partial encounter"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["job-listing"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}},{"id":"contract-language-support","title":"Contract support: “I don’t understand the terms”","titleTh":"ช่วยเรื่องสัญญา: “ไม่เข้าใจเงื่อนไข”","context":"Practice language support connected to the revised role’s translated contract aids and multilingual materials. Do not assume which documents are accepted or that a translation replaces the contract.","contextTh":"ฝึกช่วยด้านภาษาซึ่งเชื่อมกับงานแปลเอกสารประกอบสัญญาและจัดทำสื่อหลายภาษาในเอกสารหน้าที่งานฉบับแก้ไข ไม่สมมติว่าเอกสารใดใช้ได้หรือคำแปลใช้แทนสัญญาได้","goal":"Offer understandable language, check document requirements, and confirm understanding before asking for consent.","goalTh":"เสนอภาษาที่เข้าใจได้ ตรวจสอบเอกสารที่จำเป็น และเช็กความเข้าใจก่อนขอความยินยอม","turns":[{"role":"customer","jp":"{新|あたら}しく{契約|けいやく}したいです。でも、{難|むずか}しい{日本語|にほんご}はあまり{分|わ}かりません。","en":"I want to sign up for a new contract, but I don’t understand difficult Japanese very well.","th":"อยากเปิดสัญญาใหม่ แต่ไม่ค่อยเข้าใจภาษาญี่ปุ่นยาก ๆ","id":"contract-language-support-01","learning":{"mode":"recognize","audience":"learner","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["job-listing"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}},{"role":"staff","jp":"{分|わ}かりやすい{言葉|ことば}で、{一|ひと}つずつご{説明|せつめい}いたします。{日本語|にほんご}とタイ{語|ご}では、どちらが{分|わ}かりやすいですか。","en":"I’ll explain each point in clear language. Which is easier for you, Japanese or Thai?","th":"จะอธิบายทีละข้อด้วยคำที่เข้าใจง่ายค่ะ ระหว่างภาษาญี่ปุ่นกับภาษาไทย ภาษาไหนเข้าใจง่ายกว่าคะ","id":"contract-language-support-02","learning":{"mode":"active","audience":"customer","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["job-listing"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}},{"role":"customer","jp":"タイ{語|ご}のほうが{分|わ}かりやすいです。{今日|きょう}、{契約|けいやく}できますか。","en":"Thai is easier for me. Can I sign up today?","th":"ภาษาไทยเข้าใจง่ายกว่า วันนี้ทำสัญญาได้ไหม","id":"contract-language-support-03","learning":{"mode":"recognize","audience":"learner","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["job-listing"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}},{"role":"staff","jp":"まず、お{手続|てつづ}きの{条件|じょうけん}と{必要|ひつよう}な{書類|しょるい}を{確認|かくにん}いたします。{本日|ほんじつ}お{手続|てつづ}きできるかは、{確認後|かくにんご}にご{案内|あんない}いたします。","en":"First I’ll check the requirements and the necessary documents. Once I’ve checked, I’ll let you know whether we can process it today.","th":"ก่อนอื่นจะตรวจสอบเงื่อนไขและเอกสารที่จำเป็นค่ะ หลังตรวจสอบจะแจ้งว่าสามารถดำเนินการวันนี้ได้หรือไม่ค่ะ","id":"contract-language-support-04","learning":{"mode":"active","audience":"customer","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["job-listing"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}},{"role":"customer","jp":"{在留|ざいりゅう}カードだけ{持|も}ってきました。これだけで{大丈夫|だいじょうぶ}ですか。","en":"I only brought my residence card. Is this enough?","th":"เอามาแค่บัตรประจำตัวผู้พำนัก แค่นี้พอไหม","id":"contract-language-support-05","learning":{"mode":"recognize","audience":"learner","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["job-listing"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}},{"role":"staff","jp":"こちらの{書類|しょるい}でお{手続|てつづ}きできるか、{確認|かくにん}が{必要|ひつよう}です。ほかに{必要|ひつよう}なものがないかも{調|しら}べます。","en":"I need to check whether we can process it with this document. I’ll also check whether anything else is required.","th":"ต้องตรวจสอบก่อนว่าใช้เอกสารนี้ดำเนินการได้หรือไม่ค่ะ และจะตรวจสอบด้วยว่าต้องใช้สิ่งใดเพิ่มเติมหรือไม่ค่ะ","id":"contract-language-support-06","learning":{"mode":"active","audience":"customer","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["job-listing"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}},{"role":"customer","jp":"{友達|ともだち}は、この{書類|しょるい}だけでできたと{言|い}っていました。どうしてですか。","en":"My friend said they could do it with just this document. Why is that?","th":"เพื่อนบอกว่าใช้แค่เอกสารนี้ก็ทำได้ ทำไมถึงต่างกัน","id":"contract-language-support-07","learning":{"mode":"recognize","audience":"learner","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["job-listing"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}},{"role":"staff","jp":"{今回|こんかい}のお{手続|てつづ}きで{使|つか}えるか、{担当|たんとう}の{者|もの}に{確認|かくにん}します。","en":"I’ll check with the colleague who handles this whether that document can be used for your application.","th":"ขอเช็กกับผู้ดูแลเรื่องนี้ก่อนค่ะว่าเอกสารนี้ใช้กับคำขอของคุณได้ไหม","id":"contract-language-support-08","learning":{"mode":"active","audience":"customer","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["job-listing"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}},{"role":"customer","jp":"この{説明|せつめい}も{難|むずか}しいです。どこに{名前|なまえ}を{書|か}けばいいですか。","en":"This explanation is difficult too. Where should I write my name?","th":"คำอธิบายตรงนี้ก็ยาก ต้องเขียนชื่อตรงไหน","id":"contract-language-support-09","learning":{"mode":"recognize","audience":"learner","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["job-listing"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}},{"role":"staff","jp":"ご{署名|しょめい}の{前|まえ}に、{内容|ないよう}を{一緒|いっしょ}に{確認|かくにん}しましょう。タイ{語|ご}で{説明|せつめい}を{補足|ほそく}してもよろしいでしょうか。","en":"Before you sign, let’s check the content together. May I add an explanation in Thai?","th":"ก่อนลงลายมือชื่อ มาตรวจสอบเนื้อหาด้วยกันก่อนค่ะ ขออธิบายเสริมเป็นภาษาไทยได้ไหมคะ","id":"contract-language-support-10","learning":{"mode":"active","audience":"customer","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["job-listing"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}},{"role":"customer","jp":"はい。{特|とく}に、{毎月|まいつき}{払|はら}う{金額|きんがく}と、やめるときのことを{知|し}りたいです。","en":"Yes. In particular, I want to know how much I’ll pay each month and what happens when I cancel.","th":"ได้ อยากรู้โดยเฉพาะว่าต้องจ่ายเดือนละเท่าไร และถ้าจะยกเลิกต้องทำอย่างไร","id":"contract-language-support-11","learning":{"mode":"recognize","audience":"learner","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["job-listing"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}},{"role":"staff","jp":"{承知|しょうち}いたしました。{料金|りょうきん}と{解約|かいやく}の{条件|じょうけん}を{確認|かくにん}してご{説明|せつめい}いたします。{分|わ}かりにくい{点|てん}があれば、いつでもおっしゃってください。","en":"Understood. I’ll verify and explain the charges and cancellation conditions. Please tell me whenever anything is unclear.","th":"รับทราบค่ะ จะตรวจสอบและอธิบายค่าใช้จ่ายกับเงื่อนไขการยกเลิกค่ะ หากมีส่วนไหนไม่เข้าใจ บอกได้ตลอดเลยค่ะ","id":"contract-language-support-12","learning":{"mode":"active","audience":"customer","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["job-listing"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}}],"takeaway":"Do not infer preferred language from nationality. Ask, check requirements for this application, and resolve unclear terms before moving toward a signature.","takeawayTh":"อย่าเดาภาษาที่ลูกค้าถนัดจากสัญชาติ ให้ถาม ตรวจสอบเงื่อนไขของการทำเรื่องครั้งนี้ และอธิบายจุดที่ไม่ชัดเจนก่อนขั้นตอนลงลายมือชื่อ","boundary":"This exchange reaches an agreement to explain in accessible language. It does not establish document eligibility or complete a contract.","boundaryTh":"บทนี้จบที่ตกลงจะอธิบายให้เข้าใจ ยังไม่ได้ยืนยันว่าเอกสารใช้ได้หรือทำสัญญาเสร็จ","learning":{"mode":"active","audience":"customer","function":"Follow a partial encounter"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["job-listing"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}},{"id":"coworker-faq-data","title":"With a coworker: improve a Thai FAQ","titleTh":"คุยกับเพื่อนร่วมงาน: ปรับปรุง FAQ ภาษาไทย","context":"A fictional team discussion grounded in the revised role: inquiry analysis, multilingual FAQ improvement, and coordination with stores and head office. Its observations are practice examples, not company findings.","contextTh":"บทสนทนาทีมสมมติจากหน้าที่งานฉบับแก้ไข ได้แก่ วิเคราะห์คำถาม ปรับปรุง FAQ หลายภาษา และประสานร้านกับสำนักงานใหญ่ ข้อสังเกตในบทฝึกไม่ใช่ผลวิเคราะห์จริงของบริษัท","goal":"Report a tentative pattern, accept wording feedback, and suggest a limited improvement with review.","goalTh":"รายงานแนวโน้มเบื้องต้น รับข้อเสนอแนะด้านถ้อยคำ และเสนอการปรับปรุงขอบเขตเล็กพร้อมขอให้ตรวจสอบ","turns":[{"role":"staff","jp":"お{疲|つか}れさまです。タイ{語|ご}の{FAQ|エフエーキュー}{案|あん}について、ご{相談|そうだん}してもよろしいですか。","en":"Hello. May I ask for your advice on the Thai FAQ draft?","th":"สวัสดีค่ะ ขอปรึกษาเรื่องร่าง FAQ ภาษาไทยได้ไหมคะ","id":"coworker-faq-data-01","learning":{"mode":"reference","audience":"coworker","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["revised-role"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}},{"role":"coworker","jp":"はい。どんな{問|と}い{合|あ}わせをもとに{作|つく}りましたか。","en":"Of course. What kinds of inquiries did you base it on?","th":"ได้สิ ใช้คำถามแบบไหนเป็นข้อมูลในการทำร่าง","id":"coworker-faq-data-02","learning":{"mode":"reference","audience":"learner","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["revised-role"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}},{"role":"staff","jp":"{今回|こんかい}{確認|かくにん}した{記録|きろく}では、{料金|りょうきん}の{内訳|うちわけ}に{関|かん}する{質問|しつもん}が{目立|めだ}ちました。ただ、{件数|けんすう}が{少|すく}ないため、まだ{傾向|けいこう}とは{言|い}い{切|き}れません。","en":"In the records I checked this time, questions about the bill breakdown stood out. However, there are too few cases to call it a clear trend yet.","th":"ในบันทึกที่ตรวจสอบครั้งนี้ พบคำถามเรื่องรายละเอียดค่าใช้จ่ายค่อนข้างเด่นค่ะ แต่จำนวนกรณียังน้อย จึงยังสรุปว่าเป็นแนวโน้มไม่ได้ค่ะ","id":"coworker-faq-data-03","learning":{"mode":"reference","audience":"coworker","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["revised-role"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}},{"role":"coworker","jp":"いいですね。{言語別|げんごべつ}に{整理|せいり}するときも、{国籍|こくせき}だけで{使|つか}う{言語|げんご}を{決|き}めつけないようにしましょう。","en":"That’s a good approach. When grouping by language, let’s avoid assuming the language someone uses based only on nationality.","th":"ดีแล้ว เวลาจัดกลุ่มตามภาษา ก็อย่าสรุปภาษาที่ใช้จากสัญชาติอย่างเดียว","id":"coworker-faq-data-04","learning":{"mode":"reference","audience":"learner","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["revised-role"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}},{"role":"staff","jp":"{承知|しょうち}しました。{記録|きろく}にある{対応言語|たいおうげんご}を{確認|かくにん}し、{不明|ふめい}なものは{不明|ふめい}として{整理|せいり}します。","en":"Understood. I’ll check the language used for support in the records and mark unknown cases as unknown.","th":"รับทราบค่ะ จะตรวจสอบภาษาที่ใช้ให้บริการตามบันทึก และกรณีที่ไม่ทราบจะระบุว่าไม่ทราบค่ะ","id":"coworker-faq-data-05","learning":{"mode":"reference","audience":"coworker","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["revised-role"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}},{"role":"coworker","jp":"この{訳|やく}だと、「{必|かなら}ず{安|やす}くなる」という{意味|いみ}に{読|よ}めませんか。{条件|じょうけん}が{伝|つた}わるように{直|なお}したいですね。","en":"Could this translation be read as saying “it will definitely be cheaper”? We should revise it so the conditions come across.","th":"คำแปลตรงนี้อาจอ่านแล้วเข้าใจว่า “จะถูกลงแน่นอน” หรือเปล่า อยากปรับให้สื่อเงื่อนไขได้ชัดเจน","id":"coworker-faq-data-06","learning":{"mode":"reference","audience":"learner","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["revised-role"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}},{"role":"staff","jp":"{確|たし}かに、そのように{読|よ}めます。{元|もと}の{日本語|にほんご}をもう{一度|いちど}{確認|かくにん}し、{条件|じょうけん}が{抜|ぬ}けないように{修正|しゅうせい}します。","en":"Yes, it could be read that way. I’ll check the original Japanese again and revise it so no conditions are left out.","th":"จริงค่ะ อ่านแล้วอาจเข้าใจแบบนั้นได้ จะตรวจต้นฉบับภาษาญี่ปุ่นอีกครั้งและแก้ไขไม่ให้เงื่อนไขตกหล่นค่ะ","id":"coworker-faq-data-07","learning":{"mode":"reference","audience":"coworker","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["revised-role"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}},{"role":"coworker","jp":"{直訳|ちょくやく}だけでなく、お{客様|きゃくさま}がどこで{迷|まよ}うかも{考|かんが}えてみてください。","en":"Along with translating the words, think about where a customer might get confused.","th":"นอกจากแปลตามตัวอักษรแล้ว ลองคิดด้วยว่าลูกค้าน่าจะสับสนตรงไหน","id":"coworker-faq-data-08","learning":{"mode":"reference","audience":"learner","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["revised-role"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}},{"role":"staff","jp":"では、{最初|さいしょ}に{請求|せいきゅう}の{内訳|うちわけ}を{説明|せつめい}し、その{後|あと}に{条件|じょうけん}を{確認|かくにん}する{流|なが}れはどうでしょうか。","en":"How about explaining the bill breakdown first, then moving on to checking the conditions?","th":"ถ้าเริ่มจากอธิบายรายละเอียดค่าใช้จ่าย แล้วค่อยตรวจสอบเงื่อนไขตามลำดับนี้ ดีไหมคะ","id":"coworker-faq-data-09","learning":{"mode":"reference","audience":"coworker","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["revised-role"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}},{"role":"coworker","jp":"その{案|あん}で{作|つく}ってみましょう。お{客様|きゃくさま}に{使|つか}う{前|まえ}に、{内容|ないよう}の{確認|かくにん}を{誰|だれ}にお{願|ねが}いするかも{相談|そうだん}しましょう。","en":"Let’s draft it that way. Before using it with customers, let’s also discuss who should review the content.","th":"ลองทำร่างตามแนวนั้นกัน ก่อนนำไปใช้กับลูกค้า มาคุยกันด้วยว่าจะให้ใครตรวจสอบเนื้อหา","id":"coworker-faq-data-10","learning":{"mode":"reference","audience":"learner","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["revised-role"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}},{"role":"staff","jp":"はい。{修正案|しゅうせいあん}と、{確認|かくにん}していただきたい{点|てん}をまとめます。{店舗|てんぽ}と{本部|ほんぶ}のどちらに{相談|そうだん}するかも{確認|かくにん}します。","en":"Yes. I’ll put together the revised draft and the points that need review. I’ll also check whether to consult the store or head office.","th":"ค่ะ จะรวบรวมร่างแก้ไขกับจุดที่ต้องการให้ตรวจสอบ และเช็กด้วยว่าควรปรึกษาทางร้านหรือสำนักงานใหญ่ค่ะ","id":"coworker-faq-data-11","learning":{"mode":"reference","audience":"coworker","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["revised-role"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}},{"role":"coworker","jp":"お{願|ねが}いします。{使|つか}い{始|はじ}めたら、{同|おな}じ{質問|しつもん}が{減|へ}ったかも{見|み}て、また{改善|かいぜん}しましょう。","en":"Thank you. Once we start using it, let’s see whether repeat questions decrease and use that to improve it further.","th":"ฝากด้วยนะ หลังเริ่มใช้แล้ว ลองดูว่าคำถามซ้ำลดลงหรือไม่ แล้วค่อยปรับปรุงต่อกัน","id":"coworker-faq-data-12","learning":{"mode":"reference","audience":"learner","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["revised-role"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}}],"takeaway":"The revised role links counter observations to analysis, translation, and improvement. Report evidence limits, preserve conditions in translation, and propose a review step without inventing an approval policy.","takeawayTh":"หน้าที่ฉบับแก้ไขเชื่อมสิ่งที่พบหน้าร้านกับการวิเคราะห์ การแปล และการปรับปรุง ระบุข้อจำกัดของข้อมูล รักษาเงื่อนไขให้ครบในคำแปล และเสนอขั้นตอนตรวจสอบโดยไม่สมมติระเบียบอนุมัติของบริษัท","boundary":"Reference for the specialist role. The team agrees to revise and review a draft; the draft is not approved for customers yet.","boundaryTh":"บทอ้างอิงสำหรับงานเฉพาะทาง ทีมตกลงแก้และตรวจร่าง ยังไม่ได้อนุมัติให้ใช้กับลูกค้า","learning":{"mode":"reference","audience":"coworker","function":"Follow a partial encounter"},"provenance":{"language":"C","explanations":"C","basis":{"category":"B","sourceIds":["revised-role"],"scope":"Job context only; all people, claims, turns and outcomes in this scenario are fictional teaching material."},"facts":[]}},{"id":"checked-method-result","title":"After checking: choose an available method","titleTh":"ตรวจแล้ว: เลือกวิธีที่ใช้ได้","context":"Both methods and the result are hypothetical. Practise returning from a check, explaining the available alternative and confirming the completed task; this does not specify a docomo procedure.","contextTh":"วิธีและผลลัพธ์เป็นสถานการณ์สมมติ ฝึกกลับมาแจ้งผล เสนอทางเลือก และยืนยันงานที่เสร็จ ไม่ได้กำหนดขั้นตอนของ docomo","goal":"Give a checked answer or a clear next action; distinguish facts, unknowns and who takes over.","goalTh":"แจ้งผลที่ตรวจแล้วหรือขั้นตอนต่อไปให้ชัด แยกสิ่งที่รู้ สิ่งที่ยังไม่รู้ และใครรับช่วง","turns":[{"role":"customer","jp":"この{方法|ほうほう}で{手続|てつづ}きできますか。","en":"Can I use this method?","th":"ดำเนินการด้วยวิธีนี้ได้ไหม","learning":{"mode":"recognize","audience":"learner","function":"Continue the constructed exchange"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact."},"facts":[]},"id":"checked-method-result-01"},{"id":"checked-method-result-02","cat":"rescue","jp":"{正確|せいかく}にご{案内|あんない}するため、{確認|かくにん}してまいります。{少々|しょうしょう}お{待|ま}ちいただけますか。","en":"I'll check so I can give you accurate information. Could you wait a moment?","th":"ขอตรวจสอบเพื่อให้ข้อมูลที่ถูกต้องค่ะ รอสักครู่ได้ไหมคะ","note":"Use when you will go and check with a colleague or another source, then return. Do not invent an answer.","noteTh":"ใช้เมื่อจะไปตรวจสอบกับเพื่อนร่วมงานหรือแหล่งข้อมูล แล้วกลับมาแจ้งลูกค้าค่ะ","essential":true,"learning":{"mode":"active","audience":"customer","function":"Explain a check and wait"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"General workplace-Japanese teaching; no employer-specific claim."},"facts":[]},"role":"staff","sharedId":"r06"},{"id":"checked-method-result-03","cat":"contract","jp":"{確認|かくにん}したところ、この{方法|ほうほう}ではお{手続|てつづ}きできません。","en":"After checking, we cannot proceed using this method.","th":"ตรวจสอบแล้ว ไม่สามารถดำเนินการด้วยวิธีนี้ได้ค่ะ","note":"A confirmed negative result, not an unknown answer. Follow with the verified reason or an available alternative.","noteTh":"ใช้เมื่อยืนยันแล้วว่าทำด้วยวิธีนี้ไม่ได้ ไม่ใช่เมื่อยังไม่รู้คำตอบ บอกเหตุผลที่ตรวจแล้วหรือทางเลือกต่อ","essential":false,"learning":{"mode":"active","audience":"customer","function":"Method not available"},"provenance":{"language":"C","explanations":"C","basis":{"category":"C","sourceIds":[],"scope":"Original general counter-language pattern. A checked result or requirement is a hypothetical training premise, not a docomo rule or account fact."},"facts":[]},"introduced":"1.1","role":"staff","sharedId"
